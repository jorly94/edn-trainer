<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDN Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TOKENS
   Palette clinique : bleu-nuit profond + vert sauge (validation) +
   rouge brique sourd (erreur). Fond quasi-blanc légèrement bleuté.
   Typo : IBM Plex Sans (lisibilité clinique) + IBM Plex Mono pour les
   identifiants/numéros de question (registre "dossier médical").
===================================================================== */
:root {
  --ink: #16232B;
  --ink-soft: #4A5A63;
  --line: #DCE3E6;
  --bg: #F6F8F9;
  --surface: #FFFFFF;
  --brand: #0B4F6C;
  --brand-soft: #E3EEF2;
  --good: #1B7A5A;
  --good-bg: #E7F5EF;
  --bad: #B23A3A;
  --bad-bg: #FBEAEA;
  --warn: #B8792B;
  --warn-bg: #FBF1E3;
  --radius: 10px;
  --font: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Layout */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 240px; background: var(--surface); border-right: 1px solid var(--line);
  padding: 24px 16px; flex-shrink: 0;
}
.sidebar .brand { font-weight: 600; font-size: 1.05rem; padding: 0 8px 20px; letter-spacing: -0.01em; }
.sidebar .brand .dot { color: var(--good); }
.nav-link {
  display: block; padding: 10px 12px; border-radius: 8px; color: var(--ink-soft);
  text-decoration: none; font-size: 0.92rem; margin-bottom: 2px;
}
.nav-link:hover { background: var(--bg); color: var(--ink); }
.nav-link.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.main { flex: 1; padding: 32px 40px; max-width: 1100px; }

@media (max-width: 780px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; display: flex; overflow-x: auto; gap: 4px; padding: 12px; border-right: none; border-bottom: 1px solid var(--line); }
  .sidebar .brand { display: none; }
  .nav-link { white-space: nowrap; }
  .main { padding: 20px 16px; }
}

h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; margin: 0 0 12px; }
.subtitle { color: var(--ink-soft); margin: 0 0 28px; font-size: 0.95rem; }

/* Cards */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px;
}
.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 780px) { .grid-4, .grid-2 { grid-template-columns: 1fr 1fr; } }

.stat-card .value { font-size: 2rem; font-weight: 600; font-family: var(--mono); }
.stat-card .label { color: var(--ink-soft); font-size: 0.85rem; margin-top: 4px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font-size: 0.92rem; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--brand); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: #093f57; }
.btn-good { background: var(--good); border-color: var(--good); color: #fff; }
.btn-block { width: 100%; justify-content: center; }
.btn-lg { padding: 14px 20px; font-size: 1rem; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* Exam cards */
.exam-card { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.exam-card .meta { color: var(--ink-soft); font-size: 0.85rem; }
.progress-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0; width: 220px; }
.progress-bar > div { height: 100%; background: var(--good); }

/* Question player */
.question-shell { max-width: 720px; }
.question-meta { display: flex; justify-content: space-between; color: var(--ink-soft); font-family: var(--mono); font-size: 0.85rem; margin-bottom: 14px; }
.question-text { font-size: 1.15rem; margin-bottom: 24px; white-space: pre-wrap; }
.option {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line);
  border-radius: var(--radius); margin-bottom: 10px; cursor: pointer; background: var(--surface);
}
.option:hover { border-color: var(--brand); }
.option input { margin-top: 3px; }
.option.correct { border-color: var(--good); background: var(--good-bg); }
.option.incorrect { border-color: var(--bad); background: var(--bad-bg); }
.option.disabled { cursor: default; }

.feedback-banner {
  padding: 14px 18px; border-radius: var(--radius); margin: 20px 0; font-weight: 600;
}
.feedback-banner.good { background: var(--good-bg); color: var(--good); }
.feedback-banner.bad { background: var(--bad-bg); color: var(--bad); }
.explain-block { background: var(--bg); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; }
.explain-block h4 { margin: 0 0 6px; font-size: 0.85rem; text-transform: none; color: var(--ink-soft); }

/* Status badges */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
.badge-a_apprendre { background: var(--bad-bg); color: var(--bad); }
.badge-fragile { background: var(--warn-bg); color: var(--warn); }
.badge-en_cours { background: #FFF7DA; color: #8A6D00; }
.badge-maitrisee { background: var(--good-bg); color: var(--good); }

/* Forms */
input[type=text], input[type=email], input[type=password], input[type=number], textarea, select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  font-family: inherit; font-size: 0.92rem; background: var(--surface); color: var(--ink);
}
label { display: block; font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 4px; margin-top: 12px; }
.field { margin-bottom: 8px; }

/* Import / verify table */
.review-row { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.review-row.needs-review { border-color: var(--warn); background: var(--warn-bg); }
.review-row .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.dropzone {
  border: 2px dashed var(--line); border-radius: var(--radius); padding: 48px 24px;
  text-align: center; color: var(--ink-soft); cursor: pointer;
}
.dropzone:hover { border-color: var(--brand); color: var(--brand); }

.center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-card { width: 100%; max-width: 380px; }
.config-error { max-width: 600px; margin: 60px auto; padding: 24px; }
.mt { margin-top: 20px; }
.mb { margin-bottom: 20px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.small { font-size: 0.82rem; color: var(--ink-soft); }
.timer { font-family: var(--mono); font-size: 1.1rem; }

/* Illustrations extraites du PDF */
.q-image {
  display: block;
  max-width: 100%;
  height: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin: 12px 0;
  background: #fff;
  cursor: zoom-in;
}
.image-zoom {
  position: fixed; inset: 0; background: rgba(10,20,26,.92);
  display: flex; align-items: center; justify-content: center; z-index: 999; padding: 12px;
}
.image-zoom img { max-width: 100%; max-height: 100%; border-radius: 6px; }

</style>
</head>
<body>
<div id="app"><p style="padding:40px;font-family:sans-serif;">Chargement…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
</script>

<script>
// =====================================================================
// BOOTSTRAP — configuration Supabase saisie une fois dans l'interface,
// conservée dans le navigateur (localStorage). Aucun fichier à éditer,
// aucune clé secrète : la clé "anon" est publique par conception et
// c'est la RLS (schema.sql) qui protège les données.
// =====================================================================
window.EDN_BOOT = function () {
  const saved = JSON.parse(localStorage.getItem('edn_supabase_config') || 'null');
  if (saved && saved.url && saved.key) {
    window.sb = window.supabase.createClient(saved.url, saved.key);
    return true;
  }
  document.getElementById('app').innerHTML = `
    <div class="center-screen">
      <div class="card auth-card">
        <h1>Connexion à votre base</h1>
        <p class="subtitle">Une seule fois : collez les deux valeurs de votre projet Supabase
        (Project Settings &gt; API).</p>
        <div class="field"><label>Project URL</label>
          <input type="text" id="cfg-url" placeholder="https://xxxx.supabase.co" /></div>
        <div class="field"><label>Clé anon public</label>
          <input type="text" id="cfg-key" placeholder="eyJhbGciOi..." /></div>
        <div id="cfg-error" class="small" style="color:var(--bad);margin-top:8px;"></div>
        <button class="btn btn-primary btn-block mt" id="cfg-save">Enregistrer</button>
      </div>
    </div>`;
  document.getElementById('cfg-save').onclick = () => {
    const url = document.getElementById('cfg-url').value.trim();
    const key = document.getElementById('cfg-key').value.trim();
    if (!url.startsWith('https://') || key.length < 20) {
      document.getElementById('cfg-error').textContent = 'URL ou clé invalide. Vérifiez les deux valeurs dans Supabase.';
      return;
    }
    localStorage.setItem('edn_supabase_config', JSON.stringify({ url, key }));
    location.reload();
  };
  return false;
};

</script>

<script>
// =====================================================================
// PARSERS — extraction locale, sans aucune IA ni API payante.
// Chaque parseur retourne un tableau d'objets "ParsedQuestion" :
// {
//   question_number, question_text, question_type,
//   options: [{key:'A', text:'...', is_correct:bool}, ...],
//   official_correction, explanation, theme,
//   needs_review: bool, review_reason: string
// }
// Règle d'or : ne jamais inventer. Si une donnée est incertaine,
// needs_review = true et le champ manquant reste vide.
// =====================================================================

const EDNParsers = (() => {

  const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];

  // PostgreSQL refuse les caractères nuls et les séquences Unicode invalides.
  // Les polices CID de certains PDF en produisent lorsqu'un glyphe n'a pas
  // d'équivalent Unicode : on les retire dès l'extraction.
  function sanitize(str) {
    return String(str == null ? '' : str)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
      .replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, '')
      .replace(/(^|[^\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '$1');
  }

  function emptyQuestion(num) {
    return {
      question_number: num ?? null,
      question_text: '',
      question_type: 'qcm',
      options: [],
      student_initial_answer: '',
      official_correction: '',
      explanation: '',
      theme: '',
      needs_review: false,
      review_reason: ''
    };
  }

  function flagReview(q, reason) {
    q.needs_review = true;
    q.review_reason = q.review_reason ? q.review_reason + ' ; ' + reason : reason;
    return q;
  }

  // =============================================================
  // 1. CSV / XLSX — gabarit de colonnes
  // =============================================================
  const COLUMN_ALIASES = {
    numero: ['numero', 'numéro', 'num', 'n', 'question_number'],
    question: ['question', 'enonce', 'énoncé', 'question_text'],
    type: ['type', 'question_type'],
    theme: ['theme', 'thème', 'item'],
    reponse_correcte: ['reponse_correcte', 'réponse correcte', 'reponses_correctes',
      'bonne_reponse', 'bonnes_reponses', 'correct_answer', 'correct_answers'],
    reponse_etudiant: ['reponse_etudiant', 'réponse étudiant', 'ma_reponse', 'student_answer'],
    correction: ['correction', 'official_correction'],
    explication: ['explication', 'explanation']
  };

  function normalizeHeader(h) {
    return String(h || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function matchColumn(headers, aliases) {
    const normalized = headers.map(normalizeHeader);
    for (const alias of aliases) {
      const idx = normalized.indexOf(normalizeHeader(alias));
      if (idx !== -1) return headers[idx];
    }
    return null;
  }

  function rowsToQuestions(rows) {
    if (!rows.length) return [];
    const headers = Object.keys(rows[0]);
    const col = {};
    for (const key in COLUMN_ALIASES) col[key] = matchColumn(headers, COLUMN_ALIASES[key]);

    const optionCols = {};
    LETTERS.forEach(L => {
      optionCols[L] = matchColumn(headers, [`option_${L.toLowerCase()}`, `proposition_${L.toLowerCase()}`, `option ${L.toLowerCase()}`]);
    });

    return rows.map((row, i) => {
      const q = emptyQuestion(col.numero ? row[col.numero] : i + 1);
      q.question_text = col.question ? String(row[col.question] ?? '').trim() : '';
      if (!q.question_text) flagReview(q, 'énoncé manquant');
      if (col.type) q.question_type = String(row[col.type] || 'qcm').trim().toLowerCase();
      if (col.theme) q.theme = String(row[col.theme] || '').trim();
      if (col.reponse_etudiant) q.student_initial_answer = String(row[col.reponse_etudiant] || '').trim();
      if (col.correction) q.official_correction = String(row[col.correction] || '').trim();
      if (col.explication) q.explanation = String(row[col.explication] || '').trim();

      const correctRaw = col.reponse_correcte ? String(row[col.reponse_correcte] || '').toUpperCase() : '';
      const correctLetters = correctRaw.split(/[,;\/\s]+/).filter(Boolean);
      if (!correctLetters.length) flagReview(q, 'bonne réponse non identifiée');

      let hasAnyOption = false;
      LETTERS.forEach(L => {
        const c = optionCols[L];
        if (c && row[c] !== undefined && String(row[c]).trim() !== '') {
          hasAnyOption = true;
          q.options.push({ key: L, text: String(row[c]).trim(), is_correct: correctLetters.includes(L) });
        }
      });
      if (!hasAnyOption) flagReview(q, 'aucune proposition détectée');
      if (q.options.length > 1) q.question_type = correctLetters.length > 1 ? 'qrm' : 'qru';
      return q;
    });
  }

  async function parseCSV(file) {
    return new Promise((resolve, reject) => {
      Papa.parse(file, {
        header: true, skipEmptyLines: true,
        complete: (res) => resolve(rowsToQuestions(res.data)),
        error: reject
      });
    });
  }

  async function parseXLSX(file) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
    return rowsToQuestions(rows);
  }

  // =============================================================
  // 2. FORMAT "CORRIGÉ EDN" (export type EDNp / UNESS)
  //    Reconnu par : "Element d'épreuve:" et "Question N: (Type: XXX)"
  //    Statuts : Valide / Indispensable = bonne réponse
  //              Faux / Inacceptable    = mauvaise réponse
  // =============================================================
  const SINGLE_TYPES = ['QRU', 'QTCS'];
  const OPEN_TYPES = ['QROC'];

  function looksLikeEDNCorrige(text) {
    return /Question\s+\d+\s*:\s*\(\s*Type\s*:/i.test(text) &&
           /(Element d'épreuve|Valide|Faux)/i.test(text);
  }

  function stripFooters(raw) {
    let t = raw.replace(/\r/g, '');
    t = t.replace(/Référence\s*:\s*[^\n]*/gi, '\n');
    t = t.replace(/Date de création\s*:?/gi, '\n');
    t = t.replace(/\d{4}-\d{2}-\d{2}-\d{2}:\d{2}:\d{2}/g, '\n');
    t = t.replace(/Version\s*:\s*\d+\s*/gi, '\n');
    t = t.replace(/Page\s*:\s*\d+\s*\/\s*\d+/gi, '\n');
    return t;
  }

  const RE_SECTION = /^Element d'épreuve\s*:\s*(\S+)/i;
  const RE_QSTART = /^Question\s+(\d+)\s*:\s*\(\s*Type\s*:\s*([A-Za-z]+)\s*\)\s*(.*)$/i;
  const RE_OPT_FULL = /^[☐◎□○●■\s]*(Valide|Faux|Indispensable|Inacceptable)\s+([A-J])\s*[.)]\s*(.*)$/i;
  const RE_OPT_STATUS = /^[☐◎□○●■\s]*(Valide|Faux|Indispensable|Inacceptable)\s*$/i;
  const RE_OPT_LETTER = /^([A-J])\s*[.)]\s*(.*)$/;
  const RE_ANSWERS_HEADER = /^R[ée]ponses?\s+valides?\s*:/i;
  const RE_ZONE_ALL = /Zone\s*(\d+)\s*:\s*(Valide|Faux)\s*(?:\d+(?:[.,]\d+)?)?/gi;
  const RE_ZONE_HEADER = /^(Marqueurs|Statut|Pondération)(\s|$)/i;
  const RE_ANSWER_ITEM = /^[•\-\*\s]*(.+?)\s*\(\s*(\d+(?:[.,]\d+)?)\s*\)\s*$/;
  const RE_FOOTER_LINE = /^(Référence\s*:|Date de création|Version\s*:|Page\s*:|Epreuve\s*:|\d{4}-\d{2}-\d{2}-\d{2}:\d{2}:\d{2})/i;
  const RE_NOISE = /^([☐◎□○●■]|\(|\)|ème|eme|ère|ere|er|re|e|\d{1,2}|Marqueurs|Statut|Pondération|Zone \d+\s*:\s*\w+)$/i;

  function isCorrectStatus(s) {
    const v = s.toLowerCase();
    return v === 'valide' || v === 'indispensable';
  }

  function parseEDNCorrige(rawText) {
    const lines = stripFooters(rawText).split('\n').map(l => l.trim()).filter(l => l.length);

    const questions = [];
    let section = '';
    let sectionIntro = [];
    let cur = null;
    let mode = 'intro';
    let pendingStatus = null;
    let inComment = false;

    function finalizeQuestion(c) {
      const q = c.q;
      q.question_text = c.enonce.join(' ').replace(/\s+/g, ' ').trim();
      if (c.intro && c.intro.length) {
        q.question_text = '[Contexte ' + c.section + '] ' +
          c.intro.join(' ').replace(/\s+/g, ' ').trim() + '\n\n' + q.question_text;
      }
      q.explanation = c.explanation.join(' ').replace(/\s+/g, ' ').trim();
      q.options.forEach(o => { o.text = o.text.replace(/\s+/g, ' ').trim(); });
      q.options = q.options.filter(o => o.text.length);

      const type = c.rawType.toUpperCase();
      if (OPEN_TYPES.includes(type)) {
        q.question_type = 'qroc';
        q.options = c.answers.map((a, i) => ({ key: 'R' + (i + 1), text: a, is_correct: true }));
        if (!q.options.length) flagReview(q, 'aucune réponse attendue trouvée');
      } else if (SINGLE_TYPES.includes(type)) {
        q.question_type = 'qru';
      } else if (type === 'QZONE') {
        q.question_type = 'qzone';
        if (c.zones && c.zones.length) {
          q.official_correction = 'Zones attendues sur l\'image — ' +
            c.zones.map(z => 'Zone ' + z.num + (z.label ? ' : ' + z.label : '')).join(' ; ');
        }
      } else {
        q.question_type = 'qrm';
      }

      if (!q.question_text) flagReview(q, 'énoncé non identifié');
      if (q.question_type === 'qru' || q.question_type === 'qrm') {
        if (!q.options.length) flagReview(q, 'aucune proposition détectée');
        else if (!q.options.some(o => o.is_correct)) flagReview(q, 'aucune bonne réponse identifiée');
      }
      // Une question n'est signalée que si une IMAGE est réellement affichée
      // dans le document (PDF.js n'extrait que le texte).
      const IMG_WORD = '\\b(radiographies?|scanner|IRM|[ée]chographie|frottis|photographies?|clich[ée]s?|images?|iconographie|TDM)\\b';
      const IMG_CUE = '\\b(suivante?s?|ci-joint|ci-dessous|ci-contre|r[ée]alis[ée]|voici)\\b';
      const displayed =
        new RegExp(IMG_WORD + '[^.]{0,80}' + IMG_CUE, 'i').test(q.question_text) ||
        new RegExp(IMG_CUE + '[^.]{0,40}' + IMG_WORD, 'i').test(q.question_text) ||
        /\b(cette|ce)\s+(anomalie|image|l[ée]sion|clich[ée]|photographie)\b/i.test(q.question_text) ||
        q.options.some(o => /proposition illustrée par une image/i.test(o.text));
      if (q.question_type !== 'qzone' && displayed) {
        flagReview(q, 'une image accompagne cette question : vérifiez qu\'elle reste compréhensible sans');
      }
      q.theme = c.section || '';
    }

    function pushCurrent() {
      if (!cur) return;
      finalizeQuestion(cur);
      questions.push(cur.q);
      cur = null;
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      if (line === '(') { inComment = true; continue; }
      if (line === ')') { inComment = false; continue; }
      if (inComment) { if (cur) cur.explanation.push(line); continue; }

      const mSec = line.match(RE_SECTION);
      if (mSec) {
        pushCurrent();
        section = mSec[1];
        sectionIntro = [];
        mode = 'intro';
        continue;
      }

      const mQ = line.match(RE_QSTART);
      if (mQ) {
        pushCurrent();
        const q = emptyQuestion(questions.length + 1);
        cur = {
          q, rawType: mQ[2], section,
          // le contexte de section (vignette de dossier, article de LCA,
          // situation de TCS) est rappelé au-dessus de chaque question
          intro: sectionIntro.slice(),
          enonce: [], explanation: [], answers: [], zones: [],
          inZoneTable: false, pendingZoneLabel: ''
        };
        const tail = (mQ[3] || '').trim();
        if (tail && !/^(0\/1|Non corrigé|\d+([.,]\d+)?\/\d+)$/i.test(tail)) cur.enonce.push(tail);
        mode = 'enonce';
        pendingStatus = null;
        continue;
      }

      if (RE_ANSWERS_HEADER.test(line)) { mode = 'answers'; continue; }

      if (!cur) {
        if (mode === 'intro' && !RE_NOISE.test(line)) sectionIntro.push(line);
        continue;
      }

      const mOpt = line.match(RE_OPT_FULL);
      if (mOpt) {
        cur.q.options.push({ key: mOpt[2].toUpperCase(), text: mOpt[3] || '', is_correct: isCorrectStatus(mOpt[1]) });
        mode = 'options';
        pendingStatus = null;
        continue;
      }

      const mStatus = line.match(RE_OPT_STATUS);
      if (mStatus) { pendingStatus = mStatus[1]; continue; }
      if (pendingStatus) {
        const mLetter = line.match(RE_OPT_LETTER);
        if (mLetter) {
          cur.q.options.push({
            key: mLetter[1].toUpperCase(),
            text: (mLetter[2] || '(proposition illustrée par une image)').trim(),
            is_correct: isCorrectStatus(pendingStatus)
          });
          mode = 'options';
          pendingStatus = null;
          continue;
        }
        pendingStatus = null;
      }

      if (mode === 'answers') {
        const mAns = line.match(RE_ANSWER_ITEM);
        if (mAns) {
          if (parseFloat(mAns[2].replace(',', '.')) > 0) cur.answers.push(mAns[1].trim());
          continue;
        }
        mode = 'explanation';
        cur.explanation.push(line);
        continue;
      }

      // question à zones : le tableau de marqueurs décrit les bonnes réponses.
      // Le libellé de la zone est imprimé juste avant (ou après) sa ligne "Zone N".
      if (RE_ZONE_HEADER.test(line)) { cur.inZoneTable = true; continue; }
      // une même ligne peut contenir plusieurs zones, chacune suivie de son
      // libellé : "Zone 2: Valide 1 lésion osteo chondrale ◎ Zone 1: Valide 1 …"
      RE_ZONE_ALL.lastIndex = 0;
      const zoneMatches = [];
      let mz;
      while ((mz = RE_ZONE_ALL.exec(line)) !== null) {
        zoneMatches.push({ num: mz[1], status: mz[2], start: mz.index, end: mz.index + mz[0].length });
      }
      if (zoneMatches.length) {
        cur.inZoneTable = true;
        zoneMatches.forEach((z, zi) => {
          if (!/valide/i.test(z.status)) return;
          const stop = zi + 1 < zoneMatches.length ? zoneMatches[zi + 1].start : line.length;
          const inline = line.slice(z.end, stop).replace(/[☐◎□○●■]/g, '').trim();
          cur.zones.push({ num: z.num, label: inline || cur.pendingZoneLabel || '' });
        });
        cur.pendingZoneLabel = '';
        continue;
      }
      // dans le tableau de zones, une ligne sans "Zone N" est le libellé
      // de la zone précédente (ou de la suivante si celle-ci n'existe pas encore)
      if (cur.inZoneTable) {
        const last = cur.zones[cur.zones.length - 1];
        if (last && !last.label) last.label = line;
        else cur.pendingZoneLabel = line;
        continue;
      }

      if (RE_NOISE.test(line)) continue;

      if (mode === 'enonce') {
        cur.enonce.push(line);
      } else if (mode === 'options') {
        const startsLower = /^[a-zà-ÿ(«"'\d+\-]/.test(line);
        if (startsLower && cur.q.options.length) {
          cur.q.options[cur.q.options.length - 1].text += ' ' + line;
        } else {
          mode = 'explanation';
          cur.explanation.push(line);
        }
      } else {
        cur.explanation.push(line);
      }
    }
    pushCurrent();
    return questions;
  }

  // =============================================================
  // 3. Extraction générique (documents hors format EDN)
  // =============================================================
  function heuristicParseText(rawText) {
    const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const blocks = [];
    let current = null;
    const qStart = /^(?:Question\s*)?(\d{1,4})[.)]\s*(.*)$/i;

    for (const line of lines) {
      const m = line.match(qStart);
      if (m && (!current || Number(m[1]) !== current.question_number)) {
        if (current) blocks.push(current);
        current = { question_number: Number(m[1]), lines: [m[2]] };
      } else if (current) current.lines.push(line);
    }
    if (current) blocks.push(current);

    const optionLine = /^([A-F])[.)]\s*(.*)$/;
    const correctionLine = /^(réponses?\s*correctes?|corrig[ée]|correction|bonnes?\(?s?\)?\s*réponses?)\s*[:\-]?\s*(.*)$/i;
    const explanationLine = /^(explication|commentaire|rappel)\s*[:\-]?\s*(.*)$/i;

    return blocks.map(b => {
      const q = emptyQuestion(b.question_number);
      const bodyLines = [];
      let mode = 'body';
      let correctLetters = [];
      for (const line of b.lines) {
        const optM = line.match(optionLine), corrM = line.match(correctionLine), explM = line.match(explanationLine);
        if (optM) { q.options.push({ key: optM[1].toUpperCase(), text: optM[2].trim(), is_correct: false }); mode = 'options'; }
        else if (corrM) {
          q.official_correction = (q.official_correction + ' ' + corrM[2]).trim();
          const l = corrM[2].toUpperCase().match(/[A-F]/g); if (l) correctLetters.push(...l);
          mode = 'correction';
        } else if (explM) { q.explanation = (q.explanation + ' ' + explM[2]).trim(); mode = 'explanation'; }
        else if (mode === 'body') bodyLines.push(line);
        else if (mode === 'options' && q.options.length) q.options[q.options.length - 1].text += ' ' + line;
        else if (mode === 'correction') {
          q.official_correction += ' ' + line;
          const l = line.toUpperCase().match(/[A-F]/g); if (l) correctLetters.push(...l);
        } else q.explanation += ' ' + line;
      }
      q.question_text = bodyLines.join(' ').trim();
      correctLetters = [...new Set(correctLetters)];
      q.options.forEach(o => { if (correctLetters.includes(o.key)) o.is_correct = true; });
      q.question_type = correctLetters.length > 1 ? 'qrm' : 'qru';
      if (!q.question_text) flagReview(q, 'énoncé non identifié avec certitude');
      if (!q.options.length) flagReview(q, 'aucune proposition détectée');
      if (!correctLetters.length) flagReview(q, 'bonne réponse non identifiée');
      return q;
    });
  }

  function parseText(text) {
    if (looksLikeEDNCorrige(text)) {
      const qs = parseEDNCorrige(text)
        // on écarte les blocs totalement vides (artefacts de mise en page)
        .filter(q => (q.question_text && q.question_text.trim().length > 3) ||
                     q.options.length || (q.explanation && q.explanation.length > 3));
      if (qs.length) return qs;
    }
    return heuristicParseText(text);
  }

  // =============================================================
  // 4. DOCX / PDF
  // =============================================================
  async function parseDOCX(file) {
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    const questions = parseText(result.value);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }
    return questions;
  }

  // PDF.js ne fournit pas les sauts de ligne : on reconstruit les lignes
  // à partir de la position verticale de chaque fragment de texte.
  function itemsToLines(items) {
    // 1. on ne garde que les fragments porteurs de texte
    const frags = [];
    for (const it of items) {
      if (!it.str || !it.str.length) continue;
      const x = it.transform[4];
      const y = it.transform[5];
      const h = Math.abs(it.height || it.transform[3] || 10) || 10;
      const w = it.width != null ? it.width : (it.str.length * h * 0.5);
      if (!it.str.trim()) continue;
      frags.push({ x, y, h, w, s: it.str });
    }
    if (!frags.length) return [];

    // 2. regroupement en lignes par proximité verticale (tolérance liée à la taille de police)
    frags.sort((a, b) => (b.y - a.y) || (a.x - b.x));
    const lines = [];
    let current = null;
    for (const f of frags) {
      const tol = Math.max(2, f.h * 0.5);
      if (current && Math.abs(current.y - f.y) <= tol) {
        current.items.push(f);
        current.y = (current.y * (current.items.length - 1) + f.y) / current.items.length;
      } else {
        if (current) lines.push(current);
        current = { y: f.y, items: [f] };
      }
    }
    if (current) lines.push(current);

    // 3. assemblage : PDF.js ne fournit pas toujours les espaces, on les
    //    restitue à partir de l'écart horizontal entre deux fragments.
    return lines.map(line => {
      line.items.sort((a, b) => a.x - b.x);
      let text = '';
      let prevEnd = null;
      for (const f of line.items) {
        if (prevEnd !== null) {
          const gap = f.x - prevEnd;
          const needsSpace = gap > f.h * 0.18;
          const alreadySpaced = /\s$/.test(text) || /^\s/.test(f.s);
          if (needsSpace && !alreadySpaced) text += ' ';
        }
        text += f.s;
        prevEnd = f.x + f.w;
      }
      return { y: line.y, text: sanitize(text).replace(/\s+/g, ' ').trim() };
    }).filter(l => l.text.length);
  }

  // --- Extraction des images réellement intégrées dans le PDF -------------
  // On suit la matrice de transformation courante (CTM) dans la liste
  // d'opérateurs pour connaître la position exacte de chaque image.
  function multiply(m, ctm) {
    return [
      m[0] * ctm[0] + m[1] * ctm[2],
      m[0] * ctm[1] + m[1] * ctm[3],
      m[2] * ctm[0] + m[3] * ctm[2],
      m[2] * ctm[1] + m[3] * ctm[3],
      m[4] * ctm[0] + m[5] * ctm[2] + ctm[4],
      m[4] * ctm[1] + m[5] * ctm[3] + ctm[5]
    ];
  }

  function applyMatrix(m, x, y) {
    return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
  }

  async function findPageImages(page) {
    const OPS = pdfjsLib.OPS;
    const IMAGE_OPS = new Set([
      OPS.paintImageXObject, OPS.paintJpegXObject,
      OPS.paintImageMaskXObject, OPS.paintInlineImageXObject
    ].filter(v => v !== undefined));

    let opList;
    try { opList = await page.getOperatorList(); } catch (e) { return []; }

    let ctm = [1, 0, 0, 1, 0, 0];
    const stack = [];
    const found = [];

    for (let i = 0; i < opList.fnArray.length; i++) {
      const fn = opList.fnArray[i];
      const args = opList.argsArray[i];
      if (fn === OPS.save) stack.push(ctm.slice());
      else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
      else if (fn === OPS.transform) ctm = multiply(args, ctm);
      else if (IMAGE_OPS.has(fn)) {
        // l'image occupe le carré unité transformé par la CTM
        const corners = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([x, y]) => applyMatrix(ctm, x, y));
        const xs = corners.map(c => c[0]), ys = corners.map(c => c[1]);
        const box = {
          x0: Math.min(...xs), x1: Math.max(...xs),
          y0: Math.min(...ys), y1: Math.max(...ys)
        };
        // on ignore les décorations minuscules (puces, filets…)
        if (box.x1 - box.x0 > 60 && box.y1 - box.y0 > 60) found.push(box);
      }
    }
    return found;
  }

  // Rend la page puis découpe chaque image, en JPEG compressé.
  async function cropImages(page, boxes) {
    const RENDER_SCALE = 2;
    const MAX_WIDTH = 900;
    const viewport = page.getViewport({ scale: RENDER_SCALE });
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;

    const out = [];
    for (const box of boxes) {
      const p1 = viewport.convertToViewportPoint(box.x0, box.y1);
      const p2 = viewport.convertToViewportPoint(box.x1, box.y0);
      const pad = 4;
      const sx = Math.max(0, Math.min(p1[0], p2[0]) - pad);
      const sy = Math.max(0, Math.min(p1[1], p2[1]) - pad);
      const sw = Math.min(canvas.width - sx, Math.abs(p2[0] - p1[0]) + pad * 2);
      const sh = Math.min(canvas.height - sy, Math.abs(p2[1] - p1[1]) + pad * 2);
      if (sw < 40 || sh < 40) continue;

      const ratio = Math.min(1, MAX_WIDTH / sw);
      const crop = document.createElement('canvas');
      crop.width = Math.round(sw * ratio);
      crop.height = Math.round(sh * ratio);
      const cctx = crop.getContext('2d');
      cctx.fillStyle = '#ffffff';
      cctx.fillRect(0, 0, crop.width, crop.height);
      cctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
      out.push({ box, src: crop.toDataURL('image/jpeg', 0.72) });
    }
    canvas.width = canvas.height = 0; // libère la mémoire
    return out;
  }

  async function parseDOCX(file) {
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    const questions = parseText(result.value);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }
    return questions;
  }

  async function parsePDF(file, onProgress) {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

    const allLines = [];
    const pageData = [];   // { pageNum, lines, imageBoxes }

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const lines = itemsToLines(content.items);
      const imageBoxes = await findPageImages(page);
      pageData.push({ pageNum: i, lines, imageBoxes });
      allLines.push(...lines.map(l => l.text));
      if (onProgress) onProgress(i, pdf.numPages, 'Lecture du texte');
    }

    const fullText = allLines.join('\n');
    if (!fullText.replace(/\s/g, '').length) {
      return [flagReview(emptyQuestion(1),
        'PDF scanné ou sans texte extractible : aucune extraction automatique fiable possible. ' +
        'Saisie manuelle requise, ou convertissez le fichier en PDF texte / DOCX / CSV avant import.')];
    }

    const questions = parseText(fullText);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }

    // --- rattachement des images à leur question ---------------------------
    // Une image peut être placée APRÈS la question à laquelle elle se rapporte
    // (illustration d'énoncé ou de proposition) ou AVANT (vignette d'un nouveau
    // dossier imprimée en haut de page). On lève l'ambiguïté en regardant ce
    // qui suit immédiatement l'image dans le flux du document.
    const totalImages = pageData.reduce((n, p) => n + p.imageBoxes.length, 0);
    if (totalImages) {
      const RE_TABLE_MARK = /^(Marqueurs|Statut|Pondération|Zone\s*\d+\s*:)/i;

      // 1. flux linéaire complet du document
      const stream = [];
      pageData.forEach((pd, pi) => {
        const els = [
          ...pd.lines.map(l => ({ kind: 'line', y: l.y, text: l.text, page: pi })),
          ...pd.imageBoxes.map(b => ({ kind: 'image', y: b.y1, box: b, page: pi }))
        ].sort((a, b) => b.y - a.y);
        stream.push(...els);
      });

      // 2. attribution
      const assignments = [];   // { page, box, qIndex, label }
      let qIndex = -1, lastOptionKey = null, pendingStatus = false;

      for (let i = 0; i < stream.length; i++) {
        const el = stream[i];
        if (el.kind === 'line') {
          if (RE_QSTART.test(el.text)) { qIndex++; lastOptionKey = null; pendingStatus = false; continue; }
          const mo = el.text.match(RE_OPT_FULL);
          if (mo) { lastOptionKey = mo[2].toUpperCase(); pendingStatus = false; continue; }
          if (RE_OPT_STATUS.test(el.text)) { pendingStatus = true; continue; }
          if (pendingStatus) {
            const ml = el.text.match(RE_OPT_LETTER);
            if (ml) lastOptionKey = ml[1].toUpperCase();
            pendingStatus = false;
          }
          continue;
        }

        // lecture anticipée : à quoi se rattache cette image ?
        // Elle introduit la question SUIVANTE seulement si un énoncé
        // s'intercale entre elle et l'en-tête de cette question (vignette de
        // dossier imprimée en haut de page). Si l'en-tête suit immédiatement,
        // l'image illustre encore la question courante (dernière proposition).
        let target = qIndex, label = lastOptionKey;
        let bodyBetween = 0;
        for (let j = i + 1; j < stream.length; j++) {
          const nx = stream[j];
          if (nx.kind !== 'line') continue;
          if (RE_QSTART.test(nx.text)) {
            if (bodyBetween > 0) { target = qIndex + 1; label = null; }
            break;
          }
          if (RE_OPT_FULL.test(nx.text) || RE_OPT_STATUS.test(nx.text) ||
              RE_ANSWERS_HEADER.test(nx.text) || RE_TABLE_MARK.test(nx.text)) {
            break; // l'image appartient bien à la question en cours
          }
          // texte d'énoncé intercalé (on ignore pieds de page et intitulés de section)
          if (!RE_FOOTER_LINE.test(nx.text) && !RE_SECTION.test(nx.text) &&
              !RE_NOISE.test(nx.text) && nx.text.length >= 20) bodyBetween++;
        }
        if (target >= 0 && questions[target]) {
          assignments.push({ page: el.page, box: el.box, qIndex: target, label });
        }
      }

      // 3. rendu et découpe, page par page
      let done = 0;
      const byPage = new Map();
      assignments.forEach(a => {
        if (!byPage.has(a.page)) byPage.set(a.page, []);
        byPage.get(a.page).push(a);
      });

      for (const [pageIdx, list] of byPage) {
        const page = await pdf.getPage(pageData[pageIdx].pageNum);
        const crops = await cropImages(page, list.map(a => a.box));
        crops.forEach((c, k) => {
          const target = questions[list[k].qIndex];
          if (!target) return;
          target.images = target.images || [];
          target.images.push({ src: c.src, label: list[k].label });
        });
        done += list.length;
        if (onProgress) onProgress(done, totalImages, 'Extraction des images');
      }

      // une question dont l'image a été récupérée n'est plus signalée pour ce motif
      questions.forEach(q => {
        if (q.images && q.images.length && q.review_reason) {
          q.review_reason = q.review_reason.split(' ; ')
            .filter(r => !/une image accompagne/i.test(r)).join(' ; ');
          if (!q.review_reason) q.needs_review = false;
        }
      });
    }

    return questions;
  }

  async function parseFile(file, onProgress) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'csv') return parseCSV(file);
    if (ext === 'xlsx' || ext === 'xls') return parseXLSX(file);
    if (ext === 'docx') return parseDOCX(file);
    if (ext === 'pdf') return parsePDF(file, onProgress);
    throw new Error('Format non supporté : .' + ext);
  }

  return { parseFile, parseText, parseEDNCorrige, heuristicParseText, looksLikeEDNCorrige, sanitize };
})();



</script>

<script>
// =====================================================================
// ENGINE — moteur de révision par erreurs, cycles, et statut de maîtrise.
// Algorithme (voir README section "Moteur de révision") :
//
//  Nouveau cycle N          -> toutes les questions sont éligibles
//  Réponse correcte         -> retirée de la liste d'erreurs du cycle N
//  Réponse incorrecte       -> ajoutée à la liste d'erreurs du cycle N
//  Fin de session, erreurs>0 -> prochaine session = uniquement ces erreurs
//  Fin de session, erreurs=0 -> cycle N terminé, cycle N+1 disponible
//
// Une question redevenue incorrecte après avoir été correcte réintègre
// IMMÉDIATEMENT la liste d'erreurs du cycle en cours.
// =====================================================================

const EDNEngine = (() => {

  // Récupère, pour un examen et un cycle donnés, la dernière tentative
  // de chaque question au sein de CE cycle.
  async function getLatestAttemptsForCycle(userId, examId, cycleNumber) {
    const { data, error } = await sb
      .from('attempts')
      .select('question_id, is_correct, answered_at')
      .eq('user_id', userId)
      .eq('exam_id', examId)
      .eq('cycle_number', cycleNumber)
      .order('answered_at', { ascending: true });
    if (error) throw error;

    const latest = new Map();
    for (const row of data) latest.set(row.question_id, row.is_correct); // le dernier écrase les précédents (ordre asc)
    return latest;
  }

  // Liste des questions éligibles à la PROCHAINE session pour un cycle :
  // jamais répondues dans ce cycle, ou dont la dernière réponse est fausse.
  async function getEligibleQuestions(userId, examId, cycleNumber) {
    const { data: allQuestions, error } = await sb
      .from('questions')
      .select('id')
      .eq('exam_id', examId)
      .eq('user_id', userId);
    if (error) throw error;

    const latest = await getLatestAttemptsForCycle(userId, examId, cycleNumber);
    return allQuestions
      .filter(q => !latest.has(q.id) || latest.get(q.id) === false)
      .map(q => q.id);
  }

  // Nombre d'erreurs actuelles du cycle en cours (pour affichage dashboard / "Mes erreurs")
  async function countCurrentErrors(userId, examId, cycleNumber) {
    const ids = await getEligibleQuestions(userId, examId, cycleNumber);
    // "Mes erreurs" doit refléter les questions déjà tentées au moins une fois
    // et actuellement fausses (pas les questions jamais vues du tout).
    const latest = await getLatestAttemptsForCycle(userId, examId, cycleNumber);
    return ids.filter(id => latest.has(id)).length;
  }

  function buildQuestionSet(allIds, scope, latestMap, masteryMap, count) {
    let pool = allIds;
    if (scope === 'errors') {
      pool = allIds.filter(id => latestMap.has(id) && latestMap.get(id) === false);
    } else if (scope === 'fragile') {
      pool = allIds.filter(id => (masteryMap.get(id) || {}).status === 'fragile');
    } else if (scope === 'nonmastered') {
      pool = allIds.filter(id => (masteryMap.get(id) || {}).status !== 'maitrisee');
    }
    if (count && count !== 'all' && Number(count) < pool.length) {
      pool = pool.slice(0, Number(count));
    }
    return pool;
  }

  // Calcule le statut de maîtrise à partir des compteurs mastery.
  // Règle (documentée en README) :
  //   a_apprendre : jamais réussie
  //   fragile     : déjà réussie au moins une fois, mais la dernière tentative est un échec
  //   en_cours    : 1 ou 2 bonnes réponses consécutives
  //   maitrisee   : 3 bonnes réponses consécutives ou plus
  function computeStatus(m) {
    if (!m || m.total_attempts === 0) return 'a_apprendre';
    if (m.consecutive_correct >= 3) return 'maitrisee';
    if (m.consecutive_correct === 0) return m.total_correct > 0 ? 'fragile' : 'a_apprendre';
    return 'en_cours';
  }

  // Enregistre une tentative + met à jour mastery. Retourne le nouveau statut.
  async function recordAttempt({ userId, examId, questionId, sessionId, cycleNumber, selectedAnswers, isCorrect, responseTime }) {
    const { error: attErr } = await sb.from('attempts').insert({
      user_id: userId, exam_id: examId, question_id: questionId, session_id: sessionId,
      cycle_number: cycleNumber, selected_answers: selectedAnswers, is_correct: isCorrect,
      response_time: responseTime || null
    });
    if (attErr) throw attErr;

    const { data: existing } = await sb.from('mastery')
      .select('*').eq('user_id', userId).eq('question_id', questionId).maybeSingle();

    const base = existing || {
      user_id: userId, question_id: questionId, exam_id: examId,
      consecutive_correct: 0, total_attempts: 0, total_correct: 0, total_incorrect: 0,
      cycles_correct_count: 0
    };
    base.total_attempts += 1;
    if (isCorrect) { base.total_correct += 1; base.consecutive_correct += 1; }
    else { base.total_incorrect += 1; base.consecutive_correct = 0; }
    base.last_attempt_at = new Date().toISOString();
    base.status = computeStatus(base);
    if (base.status === 'maitrisee' && !base.mastered_at) base.mastered_at = new Date().toISOString();
    if (base.status !== 'maitrisee') base.mastered_at = null;

    const { error: mErr } = await sb.from('mastery').upsert(base, { onConflict: 'user_id,question_id' });
    if (mErr) throw mErr;
    return base.status;
  }

  async function getMasteryMap(userId, examId) {
    const { data, error } = await sb.from('mastery').select('*').eq('user_id', userId).eq('exam_id', examId);
    if (error) throw error;
    const map = new Map();
    data.forEach(m => map.set(m.question_id, m));
    return map;
  }

  return {
    getLatestAttemptsForCycle, getEligibleQuestions, countCurrentErrors,
    buildQuestionSet, computeStatus, recordAttempt, getMasteryMap
  };
})();

</script>

<script>
// =====================================================================
// APP — routeur hash + vues. Aucun framework, aucun build.
// =====================================================================
const App = (() => {
  let CURRENT_USER = null;
  const $app = () => document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function nav(links) {
    return `<div class="sidebar">
      <div class="brand">EDN<span class="dot">•</span>Trainer</div>
      ${links.map(l => `<a class="nav-link ${location.hash.startsWith(l.href) ? 'active' : ''}" href="${l.href}">${l.label}</a>`).join('')}
      <a class="nav-link" href="#" id="logout-link" style="margin-top:16px;color:var(--bad)">Se déconnecter</a>
    </div>`;
  }

  // Zoom plein écran au clic sur une illustration
  document.addEventListener('click', (e) => {
    if (e.target && e.target.classList && e.target.classList.contains('q-image')) {
      const overlay = document.createElement('div');
      overlay.className = 'image-zoom';
      overlay.innerHTML = `<img src="${e.target.src}" />`;
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    }
  });

  function shell(innerHtml) {
    const links = [
      { href: '#/dashboard', label: 'Dashboard' },
      { href: '#/exams', label: 'Mes EDN' },
      { href: '#/import', label: '+ Importer un EDN' },
    ];
    $app().innerHTML = `<div class="shell">${nav(links)}<div class="main">${innerHtml}</div></div>`;
    const lo = document.getElementById('logout-link');
    if (lo) lo.onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); route(); };
  }

  // ---------------------------------------------------------------
  // AUTH
  // ---------------------------------------------------------------
  function renderLogin() {
    $app().innerHTML = `
      <div class="center-screen">
        <div class="card auth-card">
          <h1>EDN Trainer</h1>
          <p class="subtitle">Entraînement personnel aux EDN — révision par erreurs</p>
          <div class="field"><label>Email</label><input type="email" id="email" /></div>
          <div class="field"><label>Mot de passe</label><input type="password" id="password" /></div>
          <div id="auth-error" class="small" style="color:var(--bad);margin-top:8px;"></div>
          <button class="btn btn-primary btn-block mt" id="btn-login">Se connecter</button>
          <button class="btn btn-block" id="btn-signup" style="margin-top:8px;">Créer un compte</button>
        </div>
      </div>`;
    const errEl = document.getElementById('auth-error');
    document.getElementById('btn-login').onclick = async () => {
      const email = document.getElementById('email').value, password = document.getElementById('password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) errEl.textContent = error.message; else route();
    };
    document.getElementById('btn-signup').onclick = async () => {
      const email = document.getElementById('email').value, password = document.getElementById('password').value;
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) { errEl.textContent = error.message; return; }
      if (data.user) {
        await sb.from('profiles').upsert({ id: data.user.id, user_id: data.user.id });
      }
      errEl.style.color = 'var(--good)';
      errEl.textContent = 'Compte créé. Vérifiez vos emails si la confirmation est activée, puis connectez-vous.';
    };
  }

  // ---------------------------------------------------------------
  // DASHBOARD
  // ---------------------------------------------------------------
  async function renderDashboard() {
    shell('<p>Chargement…</p>');
    const { data: exams } = await sb.from('exams').select('*').eq('user_id', CURRENT_USER.id).order('created_at');
    let totalQ = 0, totalMastered = 0, totalErrors = 0, todayCount = 0;
    const today = new Date(); today.setHours(0, 0, 0, 0);

    for (const ex of (exams || [])) {
      const masteryMap = await EDNEngine.getMasteryMap(CURRENT_USER.id, ex.id);
      totalQ += ex.total_questions;
      masteryMap.forEach(m => { if (m.status === 'maitrisee') totalMastered++; });
      totalErrors += await EDNEngine.countCurrentErrors(CURRENT_USER.id, ex.id, ex.current_cycle);
    }
    const { data: todayAttempts } = await sb.from('attempts').select('id').eq('user_id', CURRENT_USER.id).gte('answered_at', today.toISOString());
    todayCount = (todayAttempts || []).length;
    const rate = totalQ ? Math.round((totalMastered / totalQ) * 100) : 0;

    shell(`
      <h1>Dashboard</h1>
      <p class="subtitle">Vue d'ensemble de votre préparation</p>
      <div class="grid grid-4 mb">
        <div class="card stat-card"><div class="value">${rate}%</div><div class="label">Progression globale</div></div>
        <div class="card stat-card"><div class="value">${totalMastered} / ${totalQ}</div><div class="label">Questions maîtrisées</div></div>
        <div class="card stat-card"><div class="value">${totalErrors}</div><div class="label">Questions à revoir</div></div>
        <div class="card stat-card"><div class="value">${todayCount}</div><div class="label">Travaillées aujourd'hui</div></div>
      </div>
      <h2>Vos examens</h2>
      ${(exams || []).length === 0 ? `<p class="small">Aucun examen importé pour l'instant. <a href="#/import">Importer un EDN</a></p>` :
        (exams || []).map(ex => `
          <div class="card exam-card">
            <div>
              <strong>${esc(ex.name)}</strong>
              <div class="meta">${ex.total_questions} questions · Cycle ${ex.current_cycle}</div>
            </div>
            <div><a class="btn btn-primary" href="#/exam/${ex.id}/train">Continuer</a></div>
          </div>`).join('')}
    `);
  }

  // ---------------------------------------------------------------
  // MES EDN
  // ---------------------------------------------------------------
  async function renderExams() {
    shell('<p>Chargement…</p>');
    const { data: exams } = await sb.from('exams').select('*').eq('user_id', CURRENT_USER.id).order('created_at', { ascending: false });
    const cards = [];
    for (const ex of (exams || [])) {
      const masteryMap = await EDNEngine.getMasteryMap(CURRENT_USER.id, ex.id);
      let mastered = 0; masteryMap.forEach(m => { if (m.status === 'maitrisee') mastered++; });
      const errors = await EDNEngine.countCurrentErrors(CURRENT_USER.id, ex.id, ex.current_cycle);
      const pct = ex.total_questions ? Math.round((mastered / ex.total_questions) * 100) : 0;
      cards.push(`
        <div class="card">
          <div class="flex-between">
            <strong>${esc(ex.name)}</strong>
            <button class="btn small" data-del="${ex.id}" style="color:var(--bad)">Supprimer</button>
          </div>
          <div class="meta small">${ex.total_questions} questions · Cycle ${ex.current_cycle} · Dernière activité : ${ex.updated_at ? new Date(ex.updated_at).toLocaleDateString('fr-FR') : '—'}</div>
          <div class="progress-bar"><div style="width:${pct}%"></div></div>
          <div class="small mb">${pct}% maîtrisé · ${errors} question(s) à revoir</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <a class="btn btn-primary" href="#/exam/${ex.id}/train">Continuer</a>
            <a class="btn" href="#/exam/${ex.id}/mistakes">Mes erreurs</a>
            <a class="btn" href="#/exam/${ex.id}/exam-mode">Mode examen</a>
            <a class="btn" href="#/exam/${ex.id}/stats">Statistiques</a>
          </div>
        </div>`);
    }
    shell(`<h1>Mes EDN</h1><p class="subtitle">Tous vos examens importés</p>
      <a class="btn btn-primary mb" href="#/import">+ Importer un EDN</a>
      ${cards.join('') || '<p class="small">Aucun examen pour l\'instant.</p>'}`);
    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Supprimer définitivement cet examen et toutes ses données ?')) return;
        await sb.from('exams').delete().eq('id', btn.dataset.del).eq('user_id', CURRENT_USER.id);
        renderExams();
      };
    });
  }

  // ---------------------------------------------------------------
  // IMPORT
  // ---------------------------------------------------------------
  let PENDING_IMPORT = null; // { examName, questions: [...] }

  let IMPORT_FILES = [];      // fichiers sélectionnés, en attente d'analyse
  let IMPORT_TARGET = 'new';  // 'new' ou l'id d'un examen existant

  async function renderImport() {
    const { data: exams } = await sb.from('exams')
      .select('id, name, total_questions').eq('user_id', CURRENT_USER.id).order('created_at', { ascending: false });

    shell(`
      <h1>Importer un EDN</h1>
      <p class="subtitle">Un EDN peut être composé de plusieurs fichiers : ajoutez-les tous, ils formeront un seul examen.</p>

      <div class="card">
        <label>Cet import alimente</label>
        <select id="target-exam">
          <option value="new">Un nouvel examen</option>
          ${(exams || []).map(e => `<option value="${e.id}" ${IMPORT_TARGET === e.id ? 'selected' : ''}>${esc(e.name)} (${e.total_questions} questions)</option>`).join('')}
        </select>

        <div id="new-exam-field" class="field">
          <label>Nom de l'examen</label>
          <input type="text" id="exam-name" placeholder="Ex : EDN Blanc 1 — Juillet 2026" />
        </div>

        <div class="dropzone mt" id="dropzone">
          <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.docx,.pdf" multiple style="display:none" />
          <p><strong>Choisir un ou plusieurs fichiers</strong><br/>PDF, DOCX, XLSX ou CSV</p>
        </div>

        <div id="file-list" class="mt">${renderFileList()}</div>
        <div id="import-status" class="small mt"></div>

        <button class="btn btn-primary btn-lg mt btn-block" id="analyze-btn" ${IMPORT_FILES.length ? '' : 'disabled'}>
          Analyser ${IMPORT_FILES.length || ''} fichier${IMPORT_FILES.length > 1 ? 's' : ''}
        </button>
      </div>

      <div class="card small">
        Les fichiers sont analysés dans l'ordre où vous les ajoutez, et leurs questions se suivent dans l'examen.
        Vous pourrez tout vérifier avant l'enregistrement définitif.
      </div>
    `);

    const targetSel = document.getElementById('target-exam');
    const newField = document.getElementById('new-exam-field');
    const syncTarget = () => {
      IMPORT_TARGET = targetSel.value;
      newField.style.display = IMPORT_TARGET === 'new' ? 'block' : 'none';
    };
    targetSel.onchange = syncTarget;
    syncTarget();

    const dz = document.getElementById('dropzone'), input = document.getElementById('file-input');
    dz.onclick = () => input.click();
    dz.ondragover = (e) => e.preventDefault();
    dz.ondrop = (e) => { e.preventDefault(); addFiles(e.dataTransfer.files); };
    input.onchange = () => addFiles(input.files);
    document.getElementById('analyze-btn').onclick = analyzeFiles;
    attachFileListHandlers();
  }

  function renderFileList() {
    if (!IMPORT_FILES.length) return '<p class="small">Aucun fichier sélectionné pour l\'instant.</p>';
    return IMPORT_FILES.map((f, i) => `
      <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--line);">
        <span>${i + 1}. ${esc(f.name)} <span class="small">(${Math.round(f.size / 1024)} Ko)</span></span>
        <button class="btn small" data-rm="${i}" style="color:var(--bad)">Retirer</button>
      </div>`).join('');
  }

  function attachFileListHandlers() {
    document.querySelectorAll('[data-rm]').forEach(b => {
      b.onclick = () => {
        IMPORT_FILES.splice(Number(b.dataset.rm), 1);
        refreshFileList();
      };
    });
  }

  function refreshFileList() {
    const list = document.getElementById('file-list');
    if (list) { list.innerHTML = renderFileList(); attachFileListHandlers(); }
    const btn = document.getElementById('analyze-btn');
    if (btn) {
      btn.disabled = !IMPORT_FILES.length;
      btn.textContent = `Analyser ${IMPORT_FILES.length || ''} fichier${IMPORT_FILES.length > 1 ? 's' : ''}`;
    }
  }

  function addFiles(fileList) {
    for (const f of fileList) {
      if (!IMPORT_FILES.some(x => x.name === f.name && x.size === f.size)) IMPORT_FILES.push(f);
    }
    refreshFileList();
  }

  // Étiquette courte dérivée du nom de fichier, pour préfixer les thèmes
  // quand plusieurs fichiers composent un même examen.
  function fileTag(name) {
    return name.replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ').trim().slice(0, 28);
  }

  async function analyzeFiles() {
    const statusEl = document.getElementById('import-status');
    const btn = document.getElementById('analyze-btn');
    let examName = '';

    if (IMPORT_TARGET === 'new') {
      examName = document.getElementById('exam-name').value.trim();
      if (!examName) {
        statusEl.style.color = 'var(--bad)';
        statusEl.textContent = 'Donnez un nom à l\'examen avant d\'analyser.';
        return;
      }
    }
    if (!IMPORT_FILES.length) return;

    btn.disabled = true;
    statusEl.style.color = 'var(--ink-soft)';

    const multi = IMPORT_FILES.length > 1;
    const allQuestions = [];
    const fileInfos = [];
    const failed = [];

    for (let fi = 0; fi < IMPORT_FILES.length; fi++) {
      const file = IMPORT_FILES[fi];
      const tag = fileTag(file.name);
      statusEl.textContent = `Fichier ${fi + 1}/${IMPORT_FILES.length} — ${file.name} : analyse en cours…`;
      try {
        const questions = await EDNParsers.parseFile(file, (done, total, phase) => {
          statusEl.textContent = `Fichier ${fi + 1}/${IMPORT_FILES.length} — ${file.name} : ${phase || 'lecture'} ${done}/${total}`;
        });
        questions.forEach(q => {
          q.source_file = file.name;
          // les thèmes sont préfixés pour ne pas confondre le DP01 de deux fichiers
          if (multi) q.theme = q.theme ? `${tag} · ${q.theme}` : tag;
        });
        allQuestions.push(...questions);
        fileInfos.push({ name: file.name, type: file.name.split('.').pop().toLowerCase(), count: questions.length });
      } catch (e) {
        console.error(e);
        failed.push(`${file.name} : ${e.message || e}`);
      }
    }

    if (!allQuestions.length) {
      statusEl.style.color = 'var(--bad)';
      statusEl.textContent = 'Aucune question n\'a pu être extraite. ' + failed.join(' | ');
      btn.disabled = false;
      return;
    }

    allQuestions.forEach((q, i) => { q.question_number = i + 1; });

    PENDING_IMPORT = {
      examName,
      targetExamId: IMPORT_TARGET === 'new' ? null : IMPORT_TARGET,
      files: fileInfos,
      failed,
      questions: allQuestions
    };
    IMPORT_FILES = [];
    location.hash = '#/import/verify';
  }

  let VERIFY_FILTER = 'review'; // review | all

  function renderImportVerify() {
    if (!PENDING_IMPORT) { location.hash = '#/import'; return; }
    const { questions, examName } = PENDING_IMPORT;
    const okCount = questions.filter(q => !q.needs_review).length;
    const reviewCount = questions.length - okCount;
    const shown = questions
      .map((q, i) => ({ q, i }))
      .filter(({ q }) => VERIFY_FILTER === 'all' || q.needs_review);

    const files = PENDING_IMPORT.files || [];
    const failed = PENDING_IMPORT.failed || [];
    const title = PENDING_IMPORT.targetExamId ? 'Ajout à un examen existant' : esc(examName);

    shell(`
      <h1>Vérification de l'import</h1>
      <p class="subtitle">${title} — <strong>${questions.length}</strong> question(s) détectée(s) :
        <span style="color:var(--good)">${okCount} correctement structurées</span> ·
        <span style="color:var(--warn)">${reviewCount} à vérifier</span></p>
      ${files.length > 1 ? `<div class="card small"><strong>Fichiers analysés</strong>${files.map(f => `
        <div class="flex-between" style="padding:4px 0;"><span>${esc(f.name)}</span><span>${f.count} questions</span></div>`).join('')}</div>` : ''}
      ${failed.length ? `<div class="card small" style="border-color:var(--bad);color:var(--bad)">
        <strong>Fichiers non exploitables</strong><br/>${failed.map(esc).join('<br/>')}</div>` : ''}
      <div class="card small">
        Rien n'a été deviné : les questions ci-dessous sont celles dont l'extraction est incertaine.
        Corrigez-les si besoin, puis validez.
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="btn" id="f-review" ${VERIFY_FILTER === 'review' ? 'style="border-color:var(--brand);color:var(--brand)"' : ''}>À vérifier (${reviewCount})</button>
        <button class="btn" id="f-all" ${VERIFY_FILTER === 'all' ? 'style="border-color:var(--brand);color:var(--brand)"' : ''}>Toutes (${questions.length})</button>
      </div>
      <div id="review-list">${shown.length
        ? shown.map(({ q, i }) => renderReviewRow(q, i)).join('')
        : '<p class="small">Aucune question à vérifier : tout est correctement structuré.</p>'}</div>
      <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;">
        <button class="btn" id="cancel-import">Annuler</button>
        <button class="btn btn-good btn-lg" id="validate-import">Valider l'import (${questions.length} questions)</button>
      </div>
      <div id="import-progress" class="small mt"></div>
    `);
    document.getElementById('f-review').onclick = () => { VERIFY_FILTER = 'review'; renderImportVerify(); };
    document.getElementById('f-all').onclick = () => { VERIFY_FILTER = 'all'; renderImportVerify(); };
    document.getElementById('cancel-import').onclick = () => { PENDING_IMPORT = null; location.hash = '#/import'; };
    document.getElementById('validate-import').onclick = commitImport;
    shown.forEach(({ i }) => attachReviewRowHandlers(i));
  }

  function renderReviewRow(q, i) {
    return `
      <div class="review-row ${q.needs_review ? 'needs-review' : ''}" data-idx="${i}">
        <div class="row-head">
          <strong>Question ${q.question_number ?? i + 1}</strong>
          ${q.needs_review ? `<span class="badge badge-fragile">À vérifier — ${esc(q.review_reason)}</span>` : `<span class="badge badge-maitrisee">OK</span>`}
        </div>
        ${(q.images || []).length ? `<div class="small" style="margin-bottom:6px;">${q.images.length} image(s) récupérée(s) depuis le PDF</div>
          ${q.images.map(im => `<img src="${im.src}" class="q-image" style="max-height:160px;" />`).join('')}` : ''}
        <label>Énoncé</label>
        <textarea rows="2" data-field="question_text" data-i="${i}">${esc(q.question_text)}</textarea>
        <label>Thème / item</label>
        <input type="text" data-field="theme" data-i="${i}" value="${esc(q.theme)}" />
        <label>${q.question_type === 'qroc' ? 'Réponses acceptées (réponse libre)' : 'Propositions (cochez la ou les bonnes réponses)'}</label>
        ${(q.options.length ? q.options : [{ key: 'A', text: '', is_correct: false }]).map((o, oi) => `
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
            <input type="checkbox" data-opt-correct="${i}:${oi}" ${o.is_correct ? 'checked' : ''} />
            <span class="small" style="width:16px;">${o.key}</span>
            <input type="text" data-opt-text="${i}:${oi}" value="${esc(o.text)}" />
          </div>`).join('')}
        <label>Correction officielle</label>
        <textarea rows="2" data-field="official_correction" data-i="${i}">${esc(q.official_correction)}</textarea>
        <label>Explication</label>
        <textarea rows="2" data-field="explanation" data-i="${i}">${esc(q.explanation)}</textarea>
      </div>`;
  }

  function attachReviewRowHandlers(i) {
    const row = document.querySelector(`.review-row[data-idx="${i}"]`);
    row.querySelectorAll('[data-field]').forEach(el => {
      el.onchange = () => { PENDING_IMPORT.questions[i][el.dataset.field] = el.value; };
    });
    row.querySelectorAll('[data-opt-text]').forEach(el => {
      el.onchange = () => {
        const [qi, oi] = el.dataset.optText.split(':').map(Number);
        if (!PENDING_IMPORT.questions[qi].options[oi]) PENDING_IMPORT.questions[qi].options[oi] = { key: String.fromCharCode(65 + oi), is_correct: false };
        PENDING_IMPORT.questions[qi].options[oi].text = el.value;
      };
    });
    row.querySelectorAll('[data-opt-correct]').forEach(el => {
      el.onchange = () => {
        const [qi, oi] = el.dataset.optCorrect.split(':').map(Number);
        PENDING_IMPORT.questions[qi].options[oi].is_correct = el.checked;
      };
    });
  }

  async function commitImport() {
    const btn = document.getElementById('validate-import');
    const progress = document.getElementById('import-progress');
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    const say = (t) => { if (progress) progress.textContent = t; };
    const { examName, targetExamId, files, questions } = PENDING_IMPORT;

    let createdExamId = null;
    try {
      let exam, positionOffset = 0;

      if (targetExamId) {
        const { data: existing, error: getErr } = await sb.from('exams')
          .select('*').eq('id', targetExamId).single();
        if (getErr) throw getErr;
        exam = existing;
        const { data: last } = await sb.from('questions')
          .select('position').eq('exam_id', exam.id).order('position', { ascending: false }).limit(1);
        positionOffset = last && last.length ? last[0].position + 1 : 0;
        const { error: upErr } = await sb.from('exams').update({
          total_questions: exam.total_questions + questions.length,
          updated_at: new Date().toISOString()
        }).eq('id', exam.id);
        if (upErr) throw upErr;
      } else {
        const { data: created, error: exErr } = await sb.from('exams').insert({
          user_id: CURRENT_USER.id,
          name: examName,
          source_file: (files || []).map(f => f.name).join(', ').slice(0, 500),
          total_questions: questions.length
        }).select().single();
        if (exErr) throw exErr;
        exam = created;
        createdExamId = created.id;
      }

      if (files && files.length) {
        await sb.from('imported_files').insert(files.map(f => ({
          user_id: CURRENT_USER.id, exam_id: exam.id,
          file_name: f.name, file_type: f.type, import_status: 'verified'
        })));
      }

      // 1. thèmes (une insertion pour tous)
      say('Enregistrement des thèmes…');
      const themeNames = [...new Set(questions.map(q => (q.theme || '').trim()).filter(Boolean))];
      const topicIds = new Map();
      const { data: existingTopics } = await sb.from('topics').select('id, name').eq('exam_id', exam.id);
      (existingTopics || []).forEach(t => topicIds.set(t.name, t.id));
      const missing = themeNames.filter(n => !topicIds.has(n));
      if (missing.length) {
        const { data: topics, error: tErr } = await sb.from('topics')
          .insert(missing.map(name => ({ user_id: CURRENT_USER.id, exam_id: exam.id, name: EDNParsers.sanitize(name) })))
          .select();
        if (tErr) throw tErr;
        topics.forEach(t => topicIds.set(t.name, t.id));
      }

      // 2. questions par lots de 100
      say('Enregistrement des questions…');
      const createdQuestions = [];
      // lots plus petits si des images sont embarquées (payload plus lourd)
      const hasImages = questions.some(q => q.images && q.images.length);
      const CHUNK = hasImages ? 20 : 100;
      for (let i = 0; i < questions.length; i += CHUNK) {
        const clean = (v) => (EDNParsers.sanitize ? EDNParsers.sanitize(v) : v) || null;
        const slice = questions.slice(i, i + CHUNK).map((q, k) => ({
          user_id: CURRENT_USER.id, exam_id: exam.id,
          topic_id: topicIds.get((q.theme || '').trim()) || null,
          question_number: (positionOffset + i + k + 1),
          question_text: clean(q.question_text) || '(énoncé à compléter)',
          question_type: q.question_type || 'qrm',
          position: positionOffset + i + k,
          student_initial_answer: clean(q.student_initial_answer),
          official_correction: clean(q.official_correction),
          explanation: clean(q.explanation),
          images: q.images || [],
          needs_review: !!q.needs_review
        }));
        const { data, error } = await sb.from('questions').insert(slice).select('id, position');
        if (error) throw error;
        createdQuestions.push(...data);
        say(`Enregistrement des questions… ${Math.min(i + CHUNK, questions.length)}/${questions.length}`);
      }

      // 3. propositions par lots de 500
      say('Enregistrement des propositions…');
      const byPosition = new Map(createdQuestions.map(r => [r.position - positionOffset, r.id]));
      const allOptions = [];
      questions.forEach((q, idx) => {
        const questionId = byPosition.get(idx);
        if (!questionId) return;
        (q.options || []).filter(o => o.text && o.text.trim()).forEach((o, oi) => {
          allOptions.push({
            user_id: CURRENT_USER.id, question_id: questionId,
            option_key: o.key || String.fromCharCode(65 + oi),
            option_text: EDNParsers.sanitize(o.text).trim(), is_correct: !!o.is_correct, position: oi
          });
        });
      });
      for (let i = 0; i < allOptions.length; i += 500) {
        const { error } = await sb.from('question_options').insert(allOptions.slice(i, i + 500));
        if (error) throw error;
        say(`Enregistrement des propositions… ${Math.min(i + 500, allOptions.length)}/${allOptions.length}`);
      }

      PENDING_IMPORT = null;
      location.hash = `#/exam/${exam.id}/train`;
    } catch (e) {
      console.error(e);
      say('');
      // un examen partiellement enregistré est supprimé pour éviter les doublons
      if (createdExamId) {
        try { await sb.from('exams').delete().eq('id', createdExamId).eq('user_id', CURRENT_USER.id); } catch (_) {}
      }
      alert('Erreur pendant l\'enregistrement : ' + (e.message || e) +
        '\n\nL\'examen incomplet a été supprimé, vous pouvez relancer l\'import.');
      btn.disabled = false;
      btn.textContent = 'Valider l\'import';
    }
  }

  const RESUME_KEY = (examId) => `edn_resume_${examId}`;
