        const parSignal = { theme: 0, contexte: 0, consigne: 0, autre: 0 };
        enBase.forEach(q => {
          const th = topicName.get(q.topic_id) || '';
          const head = String(q.question_text || '').slice(0, 400);
          if (/LCA/i.test(th)) parSignal.theme++;
          else if (/^\s*\[Contexte[^\]]*LCA/i.test(head)) parSignal.contexte++;
          else if (/(prendre|prenez)\s+connaissance\s+de\s+l['’\s]*article/i.test(head)) parSignal.consigne++;
          else parSignal.autre++;
        });
        push('Reconnues par : thème=' + parSignal.theme + ' contexte=' + parSignal.contexte +
             ' consigne=' + parSignal.consigne + ' autre=' + parSignal.autre);

        const dossiers = {};
        enBase.forEach(q => { const t = topicName.get(q.topic_id) || 'sans thème'; dossiers[t] = (dossiers[t] || 0) + 1; });
        push('Dossiers LCA : ' + (Object.keys(dossiers).length ? JSON.stringify(dossiers) : 'aucun'));
        push('Thèmes de l\'examen : ' + [...new Set((qs || []).map(q => topicName.get(q.topic_id) || 'sans thème'))].join(' | '));
        push('Types enregistrés (LCA) : ' + JSON.stringify(enBase.reduce((a, q) => {
          a[q.question_type || 'null'] = (a[q.question_type || 'null'] || 0) + 1; return a; }, {})));

        // --- B. ce que renvoie le FILTRE ---
        const only = await getOrderedQuestionIds(ex.id, 'only');
        const last = await getOrderedQuestionIds(ex.id, 'last');
        const excl = await getOrderedQuestionIds(ex.id, 'exclude');
        push('Filtre « uniquement LCA » : ' + only.ids.length + ' questions');
        push('Filtre « à la fin » : ' + last.ids.length + ' · « exclure » : ' + excl.ids.length);

        // --- C. ce que contiennent les SESSIONS enregistrées dans ce navigateur ---
        const sessions = {};
        ['exam', 'lca', 'errors'].forEach(m => {
          const sv = readResume(ex.id, m);
          if (sv) sessions[m] = { taille: sv.queue.length, position: sv.index, filtre: sv.lcaMode || '—', cycle: sv.cycleNumber };
        });
        push('Sessions enregistrées : ' + (Object.keys(sessions).length ? JSON.stringify(sessions) : 'aucune'));

        // --- TESTS ---
        const idsBase = enBase.map(q => q.id);
        const setFiltre = new Set(only.ids);
        const manquantes = idsBase.filter(id => !setFiltre.has(id));
        const intruses = only.ids.filter(id => !idsBase.includes(id));
        const themesOrdre = only.ids.map(id => {
          const q = (qs || []).find(x => x.id === id); return topicName.get(q.topic_id) || 'sans thème'; });
        const groupes = themesOrdre.every((t, i, a) => i === 0 || t === a[i - 1] || !a.slice(0, i).includes(t));
        const ordreOK = JSON.stringify(only.ids) === JSON.stringify(idsBase);
        const premiere = only.ids.length ? (qs || []).find(x => x.id === only.ids[0]) : null;
        const sessionLca = readResume(ex.id, 'lca');
        const sessionCoherente = !sessionLca || sessionLca.queue.every(id => setFiltre.has(id));

        const tests = [
          ['B. le filtre ne renvoie que des LCA', intruses.length === 0,
            intruses.length ? intruses.length + ' question(s) classique(s) : ' + intruses.slice(0, 5).join(', ') : ''],
          ['C. exhaustivité : aucune LCA oubliée', manquantes.length === 0,
            manquantes.length ? manquantes.length + ' manquante(s) : ' + manquantes.slice(0, 5).join(', ') : ''],
          ['D. ordre d\'origine respecté', ordreOK, ordreOK ? '' : 'l\'ordre diffère de celui de la base'],
          ['E. commence au début du 1er dossier', !!premiere,
            premiere ? 'question n°' + premiere.question_number + ' · ' + (topicName.get(premiere.topic_id) || 'sans thème') : 'aucune question'],
          ['F. articles regroupés, non mélangés', groupes, ''],
          ['G. compteur = questions chargées', only.ids.length === idsBase.length,
            only.ids.length + ' vs ' + idsBase.length + ' en base'],
          ['H. session LCA cohérente avec le filtre', sessionCoherente,
            sessionCoherente ? '' : 'une session LCA enregistrée contient des questions hors filtre'],
          ['I. aucune perte : exclure + uniquement = total',
            excl.ids.length + only.ids.length === (qs || []).length,
            excl.ids.length + ' + ' + only.ids.length + ' = ' + (excl.ids.length + only.ids.length) + ' / ' + (qs || []).length]
        ];
        const reussi = tests.every(t => t[1]);
        tests.forEach(t => push((t[1] ? 'OK   ' : 'ÉCHEC') + ' ' + t[0] + (t[2] ? ' — ' + t[2] : '')));

        // liste détaillée des LCA
        const detail = enBase.slice(0, 40).map(q => {
          const rang = only.ids.indexOf(q.id);
          return `<tr><td>${q.question_number ?? '?'}</td><td>${esc((topicName.get(q.topic_id) || '—').split('· ').pop())}</td>
            <td>${esc(q.question_type || '—')}</td><td>${q.position}</td><td>${rang >= 0 ? rang + 1 : '<b style="color:var(--bad)">absente</b>'}</td></tr>`;
        }).join('');

        html += `
          <article class="card">
            <div class="flex-between"><h2>${esc(ex.name)}</h2>
              <span class="badge ${reussi ? 'badge-maitrisee' : 'badge-a_apprendre'}">${reussi ? 'TEST RÉUSSI' : 'TEST ÉCHOUÉ'}</span></div>
            <div class="small" style="margin:8px 0 14px;">
              ${(qs || []).length} questions en base · ${classiques} classiques · <strong>${enBase.length} LCA</strong><br/>
              Filtre « uniquement LCA » : <strong>${only.ids.length}</strong> question(s) retournée(s)<br/>
              Dossiers : ${esc(Object.entries(dossiers).map(([k, v]) => k.split('· ').pop() + ' (' + v + ')').join(', ') || 'aucun')}
            </div>
            ${tests.map(t => `<div class="small" style="padding:4px 0;color:${t[1] ? 'var(--good)' : 'var(--bad)'};">
              ${t[1] ? '✓' : '✕'} ${t[0]}${t[2] ? ' — ' + esc(t[2]) : ''}</div>`).join('')}
            ${enBase.length ? `<div style="overflow-x:auto;margin-top:14px;">
              <table class="small" style="width:100%;border-collapse:collapse;">
                <tr style="text-align:left;color:var(--ink-3);"><th>N°</th><th>Dossier</th><th>Type</th><th>Position</th><th>Rang filtre</th></tr>
                ${detail}</table>
              ${enBase.length > 40 ? `<p class="small">… ${enBase.length - 40} autres</p>` : ''}</div>` : ''}
            <div class="small mt">Sessions enregistrées : ${esc(JSON.stringify(sessions))}</div>
          </article>`;
      }
      // ---- Diagnostic Collèges ----
      const { data: cols, error: cErr } = await sb.from('colleges').select('*').eq('user_id', CURRENT_USER.id);
      if (!cErr) {
        const { count: nRef } = await sb.from('question_references').select('id', { count: 'exact', head: true })
          .eq('user_id', CURRENT_USER.id).eq('reference_type', 'primary');
        const { count: nVer } = await sb.from('question_references').select('id', { count: 'exact', head: true })
          .eq('user_id', CURRENT_USER.id).eq('reference_type', 'primary').in('status', ['verified', 'high_confidence']);
        const tiers = {};
        for (const t of ['verified', 'high_confidence', 'needs_review', 'not_found']) {
          const { count } = await sb.from('question_reference_status').select('question_id', { count: 'exact', head: true })
            .eq('user_id', CURRENT_USER.id).eq('best_status', t);
          tiers[t] = count || 0;
        }
        const { count: withItem } = await sb.from('question_reference_status').select('question_id', { count: 'exact', head: true })
          .eq('user_id', CURRENT_USER.id).not('item_number', 'is', null);
        push('Questions — VERIFIED ' + tiers.verified + ' · HIGH_CONFIDENCE ' + tiers.high_confidence +
             ' · NEEDS_REVIEW ' + tiers.needs_review + ' · NOT_FOUND ' + tiers.not_found + ' · avec item établi ' + (withItem || 0));
        html += `<div class="card card-tight small"><strong>Question ↔ Collège</strong><br/>
          VERIFIED ${tiers.verified} · HIGH_CONFIDENCE ${tiers.high_confidence} · NEEDS_REVIEW ${tiers.needs_review} · NOT_FOUND ${tiers.not_found}<br/>
          Questions avec item établi : ${withItem || 0}</div>`;
        const { count: nSans } = await sb.from('question_reference_status').select('question_id', { count: 'exact', head: true })
          .eq('user_id', CURRENT_USER.id).eq('best_status', 'not_found');
        const tot = (k) => (cols || []).reduce((a, c) => a + (c[k] || 0), 0);
        push(''); push('════ COLLÈGES ════');
        push('Collèges : ' + (cols || []).length + ' · pages : ' + tot('page_count') + ' · analysées : ' + tot('pages_done'));
        push('Texte natif : ' + tot('pages_text') + ' · OCR : ' + tot('pages_ocr') + ' · vides : ' + tot('pages_empty') + ' · erreurs : ' + tot('pages_error'));
        push('Correspondances : ' + (nRef || 0) + ' · vérifiées : ' + (nVer || 0) + ' · QCM sans référence : ' + (nSans || 0));
        (cols || []).forEach(c => push('  - ' + c.name + ' : ' + c.status + ', ' + c.pages_done + '/' + c.page_count +
          ' pages' + (c.last_error ? ' — ' + c.last_error : '')));
        html += `<article class="card"><h2>Collèges</h2><div class="small" style="line-height:1.8;">
          ${(cols || []).length} Collège(s) · ${tot('page_count')} pages · ${tot('pages_done')} analysées<br/>
          Texte natif ${tot('pages_text')} · OCR ${tot('pages_ocr')} · vides ${tot('pages_empty')} · erreurs ${tot('pages_error')}<br/>
          Correspondances ${nRef || 0} · vérifiées ${nVer || 0} · QCM sans référence ${nSans || 0}</div></article>`;
      } else {
        push(''); push('Collèges : tables absentes (migration_002_colleges.sql non exécutée)');
      }
    } catch (e) {
      push('ERREUR : ' + (e.message || String(e)));
      html += `<div class="card" style="border-color:var(--bad);color:var(--bad);">Diagnostic interrompu : ${esc(e.message || String(e))}</div>`;
    }

    shell(`
      <h1>Diagnostic</h1>
      <p class="subtitle">Lecture seule des données réelles de votre base. Version ${APP_VERSION}</p>
      <div id="xray-host"></div>
      ${html || '<p class="small">Aucun examen.</p>'}
      <div class="card">
        <h2>Rapport technique</h2>
        <p class="small">À copier et à transmettre en cas d'anomalie. Ne contient ni clé ni identifiant de connexion.</p>
        <textarea id="diag-log" rows="12" readonly style="font-family:var(--font-mono);font-size:.78rem;">${esc(log.join('\n'))}</textarea>
        <button class="btn btn-block mt" id="copy-log">Copier le rapport</button>
      </div>
      <div class="card">
        <h2>Importer l'index relu</h2>
        <p class="small">Charge un index de références relues une à une (fichier <code>edn-index-relu</code>).
          Les pages validées passent en tête et sont marquées « Relue » ; les pages jugées fausses sont bloquées.
          Ces verdicts sont conservés lors des réévaluations.</p>
        <input type="file" id="ir-file" accept=".json,application/json" style="display:none" />
        <button class="btn btn-primary btn-block mt" id="ir-pick">Choisir le fichier d'index</button>
        <div id="ir-out" class="small mt"></div>
      </div>
      <div class="card">
        <h2>Exporter pour analyse</h2>
        <p class="small">Crée un fichier contenant le texte de vos Collèges page par page, leur structure, vos questions et les
          références actuelles, pour une analyse externe. Aucun identifiant de compte ni e-mail n'y figure.
          Lecture seule : rien n'est modifié.</p>
        <div id="ex-list" class="small" style="margin:10px 0;">Chargement des Collèges…</div>
        <label style="display:flex;align-items:center;gap:8px;margin:6px 0;"><input type="checkbox" id="ex-questions" checked style="width:auto;min-height:0;"/> Inclure les questions et les références</label>
        <button class="btn btn-primary btn-block mt" id="ex-go">Créer le fichier</button>
        <div id="ex-out" class="small mt"></div>
      </div>
      <div class="card">
        <h2>Réparer un examen depuis ses PDF sources</h2>
        <p class="small">Compare vos questions en base au PDF d'origine ré-analysé, et corrige les propositions tronquées.
          Identifiants conservés : réponses, historique et statistiques intacts. Seules les corrections vérifiables
          (fin de phrase retrouvée, espace parasite) sont appliquées ; tout autre écart est seulement signalé.</p>
        <label for="rp-exam">Examen</label>
        <select id="rp-exam"></select>
        <input type="file" id="rp-files" accept=".pdf" multiple style="display:none" />
        <button class="btn btn-block mt" id="rp-pick">Choisir les PDF, dans l'ordre de l'import</button>
        <div id="rp-out" class="small mt"></div>
      </div>
      <a class="btn btn-block mt" href="#/exams">Retour</a>
    `, 'Diagnostic');
    wireRepairTool();
    wireExportTool();
    wireReviewedImport();

    mountXray(document.getElementById('xray-host'));
    const copy = document.getElementById('copy-log');
    if (copy) copy.onclick = async () => {
      const ta = document.getElementById('diag-log');
      try { await navigator.clipboard.writeText(ta.value); copy.textContent = 'Rapport copié'; }
      catch (e) { ta.select(); copy.textContent = 'Sélectionné — faites Copier'; }
    };
  }

  // ---------------------------------------------------------------
  // IMPORT
  // ---------------------------------------------------------------
  let PENDING_IMPORT = null; // { examName, questions: [...] }

  let IMPORT_FILES = [];      // fichiers sélectionnés, en attente d'analyse
  let IMPORT_TARGET = 'new';  // 'new' ou l'id d'un examen existant

  async function renderImport() {
    const { data: exams } = await sb.from('exams')
      .select('id, name, total_questions').eq('user_id', CURRENT_USER.id).order('created_at', { ascending: false });

    shell(`
      <h1>Importer</h1>
      <p class="subtitle">Ajoutez un examen EDN à réviser, ou un Collège pour relier vos questions à leurs sources.</p>

      <div class="section-title">Examen EDN</div>
      <p class="small" style="margin-top:-4px;">Un EDN peut être composé de plusieurs fichiers : ajoutez-les tous, ils formeront un seul examen.</p>
      <div class="stepper" aria-label="Étapes de l'import">
        <div class="step current"><i></i>Fichiers</div>
        <div class="step"><i></i>Analyse</div>
        <div class="step"><i></i>Vérification</div>
        <div class="step"><i></i>Import</div>
      </div>

      <div class="card">
        <label>Cet import alimente</label>
        <select id="target-exam">
          <option value="new">Un nouvel examen</option>
          ${(exams || []).map(e => `<option value="${e.id}" ${IMPORT_TARGET === e.id ? 'selected' : ''}>${esc(e.name)} (${e.total_questions} questions)</option>`).join('')}
        </select>

        <div id="new-exam-field" class="field">
          <label>Nom de l'examen</label>
          <input type="text" id="exam-name" placeholder="Ex : EDN Blanc 1 — Juillet 2026" />
        </div>

        <div class="dropzone mt" id="dropzone" role="button" tabindex="0">
          <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.docx,.pdf" multiple style="display:none" />
          <strong>Choisir un ou plusieurs fichiers</strong>
          <span class="small">PDF, DOCX, XLSX ou CSV — glisser-déposer accepté</span>
        </div>

        <div id="file-list" class="filelist mt">${renderFileList()}</div>
        <div id="import-status" class="small mt"></div>

        <button class="btn btn-accent btn-lg mt btn-block" id="analyze-btn" ${IMPORT_FILES.length ? '' : 'disabled'}>
          Analyser ${IMPORT_FILES.length || ''} fichier${IMPORT_FILES.length > 1 ? 's' : ''}
        </button>
      </div>

      <div class="card small">
        Les fichiers sont analysés dans l'ordre où vous les ajoutez, et leurs questions se suivent dans l'examen.
        Vous pourrez tout vérifier avant l'enregistrement définitif.
      </div>

      <div class="section-title">Collège</div>
      <a class="card tile" href="#/colleges/import">
        <span class="tile-icon">${icon('books')}</span>
        <span class="tile-body"><h3>Importer un Collège</h3>
          <span class="small">PDF d'un référentiel : analyse automatique, puis liens vers les pages sources sous vos corrections.</span></span>
        <span class="tile-chev">→</span>
      </a>

      <div class="section-title">Outils avancés</div>
      <a class="card card-tight tile" href="#/diagnostic">
        <span class="tile-icon" style="background:var(--color-surface-sunken);color:var(--color-muted);">${icon('chart')}</span>
        <span class="tile-body"><h3 style="font-size:.9375rem;">Diagnostic</h3>
          <span class="small">Contrôles, export pour analyse, réparation, index relu.</span></span>
        <span class="tile-chev">→</span>
      </a>
    `, 'Importer');

    const targetSel = document.getElementById('target-exam');
    const newField = document.getElementById('new-exam-field');
    const syncTarget = () => {
      IMPORT_TARGET = targetSel.value;
      newField.style.display = IMPORT_TARGET === 'new' ? 'block' : 'none';
    };
    targetSel.onchange = syncTarget;
    syncTarget();

    const dz = document.getElementById('dropzone'), input = document.getElementById('file-input');
    dz.onclick = () => input.click();
    dz.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
    dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');
    dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove('over'); addFiles(e.dataTransfer.files); };
    input.onchange = () => addFiles(input.files);
    document.getElementById('analyze-btn').onclick = analyzeFiles;
    attachFileListHandlers();
  }

  function renderFileList() {
    if (!IMPORT_FILES.length) return '<p class="small">Aucun fichier sélectionné pour l\'instant.</p>';
    return IMPORT_FILES.map((f, i) => `
      <div class="row">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;">${esc(f.name)}
          <span class="small">· ${Math.round(f.size / 1024)} Ko</span></span>
        <button class="btn btn-sm btn-danger" data-rm="${i}" aria-label="Retirer ${esc(f.name)}">Retirer</button>
      </div>`).join('');
  }

  function attachFileListHandlers() {
    document.querySelectorAll('[data-rm]').forEach(b => {
      b.onclick = () => {
        IMPORT_FILES.splice(Number(b.dataset.rm), 1);
        refreshFileList();
      };
    });
  }

  function refreshFileList() {
    const list = document.getElementById('file-list');
    if (list) { list.innerHTML = renderFileList(); attachFileListHandlers(); }
    const btn = document.getElementById('analyze-btn');
    if (btn) {
      btn.disabled = !IMPORT_FILES.length;
      btn.textContent = `Analyser ${IMPORT_FILES.length || ''} fichier${IMPORT_FILES.length > 1 ? 's' : ''}`;
    }
  }

  function addFiles(fileList) {
    for (const f of fileList) {
      if (!IMPORT_FILES.some(x => x.name === f.name && x.size === f.size)) IMPORT_FILES.push(f);
    }
    refreshFileList();
  }

  // Étiquette courte dérivée du nom de fichier, pour préfixer les thèmes
  // quand plusieurs fichiers composent un même examen.
  function fileTag(name) {
    return name.replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ').trim().slice(0, 28);
  }

  async function analyzeFiles() {
    const statusEl = document.getElementById('import-status');
    const btn = document.getElementById('analyze-btn');
    let examName = '';

    if (IMPORT_TARGET === 'new') {
      examName = document.getElementById('exam-name').value.trim();
      if (!examName) {
        statusEl.style.color = 'var(--bad)';
        statusEl.textContent = 'Donnez un nom à l\'examen avant d\'analyser.';
        return;
      }
    }
    if (!IMPORT_FILES.length) return;

    btn.disabled = true;
    statusEl.style.color = 'var(--ink-soft)';

    const multi = IMPORT_FILES.length > 1;
    const allQuestions = [];
    const fileInfos = [];
    const failed = [];

    for (let fi = 0; fi < IMPORT_FILES.length; fi++) {
      const file = IMPORT_FILES[fi];
      const tag = fileTag(file.name);
      statusEl.textContent = `Fichier ${fi + 1}/${IMPORT_FILES.length} — ${file.name} : analyse en cours…`;
      try {
        const questions = await EDNParsers.parseFile(file, (done, total, phase) => {
          statusEl.textContent = `Fichier ${fi + 1}/${IMPORT_FILES.length} — ${file.name} : ${phase || 'lecture'} ${done}/${total}`;
        });
        questions.forEach(q => {
          q.source_file = file.name;
          // les thèmes sont préfixés pour ne pas confondre le DP01 de deux fichiers
          if (multi) q.theme = q.theme ? `${tag} · ${q.theme}` : tag;
        });
        allQuestions.push(...questions);
        fileInfos.push({ name: file.name, type: file.name.split('.').pop().toLowerCase(), count: questions.length });
      } catch (e) {
        console.error(e);
        failed.push(`${file.name} : ${e.message || e}`);
      }
    }

    if (!allQuestions.length) {
      statusEl.style.color = 'var(--bad)';
      statusEl.textContent = 'Aucune question n\'a pu être extraite. ' + failed.join(' | ');
      btn.disabled = false;
      return;
    }

    allQuestions.forEach((q, i) => { q.question_number = i + 1; });

    PENDING_IMPORT = {
      examName,
      targetExamId: IMPORT_TARGET === 'new' ? null : IMPORT_TARGET,
      files: fileInfos,
      failed,
      questions: allQuestions
    };
    IMPORT_FILES = [];
    location.hash = '#/import/verify';
  }

  let VERIFY_FILTER = 'review'; // review | all

  function renderImportVerify() {
    if (!PENDING_IMPORT) { location.hash = '#/import'; return; }
    const { questions, examName } = PENDING_IMPORT;
    const okCount = questions.filter(q => !q.needs_review).length;
    const reviewCount = questions.length - okCount;
    const shown = questions
      .map((q, i) => ({ q, i }))
      .filter(({ q }) => VERIFY_FILTER === 'all' || q.needs_review);

    const files = PENDING_IMPORT.files || [];
    const failed = PENDING_IMPORT.failed || [];
    const title = PENDING_IMPORT.targetExamId ? 'Ajout à un examen existant' : esc(examName);

    shell(`
      <div class="stepper" aria-label="Étapes de l'import">
        <div class="step done"><i></i>Fichiers</div>
        <div class="step done"><i></i>Analyse</div>
        <div class="step current"><i></i>Vérification</div>
        <div class="step"><i></i>Import</div>
      </div>
      <h1>Vérification de l'import</h1>
      <p class="subtitle">${title} — <strong>${questions.length}</strong> question(s) détectée(s) :
        <span style="color:var(--good)">${okCount} correctement structurées</span> ·
        <span style="color:var(--warn)">${reviewCount} à vérifier</span></p>
      ${files.length > 1 ? `<div class="card small"><strong>Fichiers analysés</strong>${files.map(f => `
        <div class="flex-between" style="padding:4px 0;"><span>${esc(f.name)}</span><span>${f.count} questions</span></div>`).join('')}</div>` : ''}
      ${failed.length ? `<div class="card small" style="border-color:var(--bad);color:var(--bad)">
        <strong>Fichiers non exploitables</strong><br/>${failed.map(esc).join('<br/>')}</div>` : ''}
      <div class="card small">
        Rien n'a été deviné : les questions ci-dessous sont celles dont l'extraction est incertaine.
        Corrigez-les si besoin, puis validez.
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="btn" id="f-review" ${VERIFY_FILTER === 'review' ? 'style="border-color:var(--brand);color:var(--brand)"' : ''}>À vérifier (${reviewCount})</button>
        <button class="btn" id="f-all" ${VERIFY_FILTER === 'all' ? 'style="border-color:var(--brand);color:var(--brand)"' : ''}>Toutes (${questions.length})</button>
      </div>
      <div id="review-list">${shown.length
        ? shown.map(({ q, i }) => renderReviewRow(q, i)).join('')
        : '<p class="small">Aucune question à vérifier : tout est correctement structuré.</p>'}</div>
      <div class="btn-row mt">
        <button class="btn" id="cancel-import">Annuler</button>
        <button class="btn btn-good btn-lg" id="validate-import">Valider l'import (${questions.length} questions)</button>
      </div>
      <div id="import-progress" class="small mt" role="status"></div>
    `, 'Vérification');
    document.getElementById('f-review').onclick = () => { VERIFY_FILTER = 'review'; renderImportVerify(); };
    document.getElementById('f-all').onclick = () => { VERIFY_FILTER = 'all'; renderImportVerify(); };
    document.getElementById('cancel-import').onclick = () => { PENDING_IMPORT = null; location.hash = '#/import'; };
    document.getElementById('validate-import').onclick = commitImport;
    shown.forEach(({ i }) => attachReviewRowHandlers(i));
  }

  function renderReviewRow(q, i) {
    return `
      <div class="review-row ${q.needs_review ? 'needs-review' : ''}" data-idx="${i}">
        <div class="row-head">
          <strong>Question ${q.question_number ?? i + 1}</strong>
          ${q.needs_review ? `<span class="badge badge-fragile">À vérifier — ${esc(q.review_reason)}</span>` : `<span class="badge badge-maitrisee">OK</span>`}
        </div>
        ${(q.images || []).length ? `<div class="small" style="margin-bottom:6px;">${q.images.length} image(s) récupérée(s) depuis le PDF</div>
          ${q.images.map(im => `<img src="${im.src}" class="q-image" style="max-height:160px;" />`).join('')}` : ''}
        <label>Énoncé</label>
        <textarea rows="2" data-field="question_text" data-i="${i}">${esc(q.question_text)}</textarea>
        <label>Thème / item</label>
        <input type="text" data-field="theme" data-i="${i}" value="${esc(q.theme)}" />
        <label>${q.question_type === 'qroc' ? 'Réponses acceptées (réponse libre)' : 'Propositions (cochez la ou les bonnes réponses)'}</label>
        ${(q.options.length ? q.options : [{ key: 'A', text: '', is_correct: false }]).map((o, oi) => `
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
            <input type="checkbox" data-opt-correct="${i}:${oi}" ${o.is_correct ? 'checked' : ''} />
            <span class="small" style="width:16px;">${o.key}</span>
            <input type="text" data-opt-text="${i}:${oi}" value="${esc(o.text)}" />
          </div>`).join('')}
        <label>Correction officielle</label>
        <textarea rows="2" data-field="official_correction" data-i="${i}">${esc(q.official_correction)}</textarea>
        <label>Explication</label>
        <textarea rows="2" data-field="explanation" data-i="${i}">${esc(q.explanation)}</textarea>
      </div>`;
  }

  function attachReviewRowHandlers(i) {
    const row = document.querySelector(`.review-row[data-idx="${i}"]`);
    row.querySelectorAll('[data-field]').forEach(el => {
      el.onchange = () => { PENDING_IMPORT.questions[i][el.dataset.field] = el.value; };
    });
    row.querySelectorAll('[data-opt-text]').forEach(el => {
      el.onchange = () => {
        const [qi, oi] = el.dataset.optText.split(':').map(Number);
        if (!PENDING_IMPORT.questions[qi].options[oi]) PENDING_IMPORT.questions[qi].options[oi] = { key: String.fromCharCode(65 + oi), is_correct: false };
        PENDING_IMPORT.questions[qi].options[oi].text = el.value;
      };
    });
    row.querySelectorAll('[data-opt-correct]').forEach(el => {
      el.onchange = () => {
        const [qi, oi] = el.dataset.optCorrect.split(':').map(Number);
        PENDING_IMPORT.questions[qi].options[oi].is_correct = el.checked;
      };
    });
  }

  async function commitImport() {
    const btn = document.getElementById('validate-import');
    const progress = document.getElementById('import-progress');
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    const say = (t) => { if (progress) progress.textContent = t; };
    const { examName, targetExamId, files, questions } = PENDING_IMPORT;

    let createdExamId = null;
    try {
      let exam, positionOffset = 0;

      if (targetExamId) {
        const { data: existing, error: getErr } = await sb.from('exams')
          .select('*').eq('id', targetExamId).single();
        if (getErr) throw getErr;
        exam = existing;
        const { data: last } = await sb.from('questions')
          .select('position').eq('exam_id', exam.id).order('position', { ascending: false }).limit(1);
        positionOffset = last && last.length ? last[0].position + 1 : 0;
        const { error: upErr } = await sb.from('exams').update({
          total_questions: exam.total_questions + questions.length,
          updated_at: new Date().toISOString()
        }).eq('id', exam.id);
        if (upErr) throw upErr;
      } else {
        const { data: created, error: exErr } = await sb.from('exams').insert({
          user_id: CURRENT_USER.id,
          name: examName,
          source_file: (files || []).map(f => f.name).join(', ').slice(0, 500),
          total_questions: questions.length
        }).select().single();
        if (exErr) throw exErr;
        exam = created;
        createdExamId = created.id;
      }

      if (files && files.length) {
        await sb.from('imported_files').insert(files.map(f => ({
          user_id: CURRENT_USER.id, exam_id: exam.id,
          file_name: f.name, file_type: f.type, import_status: 'verified'
        })));
      }

      // 1. thèmes (une insertion pour tous)
      say('Enregistrement des thèmes…');
      const themeNames = [...new Set(questions.map(q => (q.theme || '').trim()).filter(Boolean))];
      const topicIds = new Map();
      const { data: existingTopics } = await sb.from('topics').select('id, name').eq('exam_id', exam.id);
      (existingTopics || []).forEach(t => topicIds.set(t.name, t.id));
      const missing = themeNames.filter(n => !topicIds.has(n));
      if (missing.length) {
        const { data: topics, error: tErr } = await sb.from('topics')
          .insert(missing.map(name => ({ user_id: CURRENT_USER.id, exam_id: exam.id, name: EDNParsers.sanitize(name) })))
          .select();
        if (tErr) throw tErr;
        topics.forEach(t => topicIds.set(t.name, t.id));
      }

      // 2. questions par lots de 100
      say('Enregistrement des questions…');
      const createdQuestions = [];
      // lots plus petits si des images sont embarquées (payload plus lourd)
      const hasImages = questions.some(q => q.images && q.images.length);
      const CHUNK = hasImages ? 20 : 100;
      for (let i = 0; i < questions.length; i += CHUNK) {
        const clean = (v) => (EDNParsers.sanitize ? EDNParsers.sanitize(v) : v) || null;
        const slice = questions.slice(i, i + CHUNK).map((q, k) => ({
          user_id: CURRENT_USER.id, exam_id: exam.id,
          topic_id: topicIds.get((q.theme || '').trim()) || null,
          question_number: (positionOffset + i + k + 1),
          question_text: clean(q.question_text) || '(énoncé à compléter)',
          question_type: q.question_type || 'qrm',
          position: positionOffset + i + k,
          student_initial_answer: clean(q.student_initial_answer),
          official_correction: clean(q.official_correction),
          explanation: clean(q.explanation),
          images: q.images || [],
          needs_review: !!q.needs_review
        }));
        const { data, error } = await sb.from('questions').insert(slice).select('id, position');
        if (error) throw error;
        createdQuestions.push(...data);
        say(`Enregistrement des questions… ${Math.min(i + CHUNK, questions.length)}/${questions.length}`);
      }

      // 3. propositions par lots de 500
      say('Enregistrement des propositions…');
      const byPosition = new Map(createdQuestions.map(r => [r.position - positionOffset, r.id]));
      const allOptions = [];
      questions.forEach((q, idx) => {
        const questionId = byPosition.get(idx);
        if (!questionId) return;
        (q.options || []).filter(o => o.text && o.text.trim()).forEach((o, oi) => {
          allOptions.push({
            user_id: CURRENT_USER.id, question_id: questionId,
            option_key: o.key || String.fromCharCode(65 + oi),
            option_text: EDNParsers.sanitize(o.text).trim(), is_correct: !!o.is_correct, position: oi
          });
        });
      });
      for (let i = 0; i < allOptions.length; i += 500) {
        const { error } = await sb.from('question_options').insert(allOptions.slice(i, i + 500));
        if (error) throw error;
        say(`Enregistrement des propositions… ${Math.min(i + 500, allOptions.length)}/${allOptions.length}`);
      }

      PENDING_IMPORT = null;
      // les nouveaux QCM sont rapprochés des Collèges déjà analysés (texte en base, sans PDF)
      if (window.EDNCollegePipeline) {
        EDNCollegePipeline.rematchAll({ sb, userId: CURRENT_USER.id })
          .catch(e => console.warn('Rapprochement Collèges différé :', e && e.message));
      }
      location.hash = `#/exam/${exam.id}/train`;
    } catch (e) {
      console.error(e);
      say('');
      // un examen partiellement enregistré est supprimé pour éviter les doublons
      if (createdExamId) {
        try { await sb.from('exams').delete().eq('id', createdExamId).eq('user_id', CURRENT_USER.id); } catch (_) {}
      }
      alert('Erreur pendant l\'enregistrement : ' + (e.message || e) +
        '\n\nL\'examen incomplet a été supprimé, vous pouvez relancer l\'import.');
      btn.disabled = false;
      btn.textContent = 'Valider l\'import';
    }
  }

  // ---------------------------------------------------------------
  // ENTRAÎNEMENT (moteur principal)
  // ---------------------------------------------------------------
  // Deux sessions indépendantes par examen : l'examen principal et la révision
  // des erreurs. Réviser ses erreurs ne touche donc jamais à la position
  // atteinte dans l'examen.
  // Une session enregistrée par FILTRE : l'examen classique, la séance LCA et
  // la révision des erreurs ne se marchent plus dessus.
  const SESSION_MODES = ['exam', 'lca', 'errors'];
  const RESUME_KEY = (examId, mode) =>
    `edn_resume_${examId}_${SESSION_MODES.includes(mode) ? mode : 'exam'}`;
  const readResume = (examId, mode) => {
    try { return JSON.parse(localStorage.getItem(RESUME_KEY(examId, mode)) || 'null'); }
    catch (e) { return null; }
  };

  // ÉTAT DE SESSION RATTACHÉ AU COMPTE (migration 005 : study_sessions.resume_state)
  // Source de vérité : Supabase. Le stockage local n'est qu'un cache pour l'affichage
  // immédiat et le hors-ligne. Écritures en file (jamais deux à la fois) et fusionnées :
  // seule la dernière position part, aucune écriture ancienne n'écrase une récente.
  // Sans la migration, l'application garde son fonctionnement local, sans erreur.
  let SERVER_STATE_OK = true;
  let stateQueue = Promise.resolve(), pendingState = null;
  const missingColumn = (err) => /resume_state|resume_updated_at|column|schema cache/i.test((err && err.message) || '');
  function pushSessionState(state) {
    if (!SERVER_STATE_OK || !state || !state.sessionId || !CURRENT_USER) return stateQueue;
    pendingState = state;
    stateQueue = stateQueue.then(async () => {
      const st = pendingState; if (!st) return; pendingState = null;
      const { error } = await sb.from('study_sessions')
        .update({ resume_state: st, resume_updated_at: new Date(st.savedAt || Date.now()).toISOString() })
        .eq('id', st.sessionId).eq('user_id', CURRENT_USER.id);
      if (error) { if (missingColumn(error)) SERVER_STATE_OK = false; console.warn('État de session non envoyé :', error.message); }
    }).catch(e => console.warn('État de session non envoyé :', e));
    return stateQueue;
  }
  function saveResume(examId, mode, state) {
    state.savedAt = Date.now();
    try { localStorage.setItem(RESUME_KEY(examId, mode), JSON.stringify(state)); } catch (e) { /* stockage local indisponible */ }
    return pushSessionState(state);
  }
  // Au démarrage d'un écran de session : l'état le plus récent du COMPTE remplace le
  // cache local (changement d'appareil, autre navigateur). Une session terminée
  // ailleurs n'est plus proposée à la reprise. Lecture seule côté serveur.
  async function syncResumeFromServer(exam) {
    if (!SERVER_STATE_OK || !exam || !CURRENT_USER) return;
    try {
      await stateQueue;   // nos propres écritures d'abord
      const { data, error } = await sb.from('study_sessions')
        .select('id, completed_at, resume_state, resume_updated_at')
        .eq('user_id', CURRENT_USER.id).eq('exam_id', exam.id).eq('cycle_number', exam.current_cycle);
      if (error) { if (missingColumn(error)) SERVER_STATE_OK = false; return; }
      const rows = data || [], best = {};
      rows.forEach(r => {
        const st = r.resume_state;
        if (r.completed_at || !st || !Array.isArray(st.queue) || !SESSION_MODES.includes(st.mode)) return;
        if (!best[st.mode] || (st.savedAt || 0) > (best[st.mode].savedAt || 0)) best[st.mode] = Object.assign({}, st, { sessionId: r.id });
      });
      SESSION_MODES.forEach(m => {
        const local = readResume(exam.id, m);
        const doneElsewhere = local && rows.some(r => r.id === local.sessionId && r.completed_at);
        if (doneElsewhere) { try { localStorage.removeItem(RESUME_KEY(exam.id, m)); } catch (e) {} }
        const srv = best[m];
        if (srv && (!local || doneElsewhere || local.cycleNumber !== exam.current_cycle || (srv.savedAt || 0) > (local.savedAt || 0))) {
          try { localStorage.setItem(RESUME_KEY(exam.id, m), JSON.stringify(srv)); } catch (e) {}
        }
      });
    } catch (e) { console.warn('Synchronisation de session impossible :', e); }
  }

  // Position réelle dans le cycle : questions déjà répondues dans le cycle en
  // cours (table attempts, Supabase). Source de vérité quand le marque-page local
  // est absent ou a été remplacé. Lecture seule : aucune donnée n'est modifiée.
  async function cyclePosition(exam) {
    const latest = await EDNEngine.getLatestAttemptsForCycle(CURRENT_USER.id, exam.id, exam.current_cycle);
    const { ids } = await getOrderedQuestionIds(exam.id, 'last');
    const done = ids.filter(id => latest.has(id));
    const rest = ids.filter(id => !latest.has(id));
    return { latest, ids, done, rest };
  }

  // « Continuer » : reprend la session d'examen, ne crée jamais de nouvelle série
  // tant qu'il reste des questions non répondues dans le cycle.
  // 1) marque-page local (même file, même ordre, même session) — en sautant les
  //    questions déjà répondues dans ce cycle ;
  // 2) sinon, reconstitution à partir des réponses enregistrées.
  async function continueExam(examId) {
    shell(skeleton(2), 'Reprise');
    try {
      const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
      if (!exam) { shell(emptyState('Examen introuvable', '', '#/exams', 'Mes EDN'), 'Reprise'); return; }
      await syncResumeFromServer(exam);
      const pos = await cyclePosition(exam);

      let saved = readResume(exam.id, 'exam');
      const valid = saved && saved.cycleNumber === exam.current_cycle && Array.isArray(saved.queue) && saved.index < saved.queue.length;
      if (valid) {
        saved = await reorderPendingLCA(exam.id, saved);
        let queue = saved.queue, idx = saved.index || 0;
        if ((saved.scope || 'all') === 'all') {
          // toutes les questions déjà répondues dans ce cycle passent en tête, où
          // qu'elles soient dans la file ; les questions restantes gardent leur ordre.
          // Aucune question répondue n'est reposée, la position affichée est exacte.
          const answered = queue.filter(id => pos.latest.has(id));
          const pending = queue.filter(id => !pos.latest.has(id));
          queue = answered.concat(pending); idx = answered.length;
        }
        if (idx < queue.length) {
          await startSession(exam, saved.scope, saved.count, queue, idx, saved.sessionId,
            saved.correct || 0, saved.incorrect || 0, 'exam', saved.lcaMode);
          return;
        }
      }
      if (!pos.rest.length) { renderTrainSetup(exam); return; }   // cycle terminé : écran du cycle

      // reconstitution : questions répondues d'abord (dans l'ordre de l'examen), puis le reste
      const queue = pos.done.concat(pos.rest);
      const correct = pos.done.filter(id => pos.latest.get(id) === true).length;
      const incorrect = pos.done.length - correct;
      // session : la dernière session d'entraînement non terminée de ce cycle, sinon une nouvelle
      const { data: sess } = await sb.from('study_sessions').select('id, mode, completed_at, started_at')
        .eq('user_id', CURRENT_USER.id).eq('exam_id', exam.id).eq('cycle_number', exam.current_cycle)
        .order('started_at', { ascending: false });
      let sessionId = ((sess || []).find(x => !x.completed_at && x.mode === 'entrainement') || {}).id;
      if (!sessionId) {
        const { data: created, error } = await sb.from('study_sessions').insert({
          user_id: CURRENT_USER.id, exam_id: exam.id, cycle_number: exam.current_cycle,
          mode: 'entrainement', total_questions: queue.length
        }).select().single();
        if (error) throw error;
        sessionId = created.id;
      }
      await startSession(exam, 'all', 'all', queue, pos.done.length, sessionId, correct, incorrect, 'exam', 'last');
    } catch (e) {
      console.error(e);
      shell(emptyState('Reprise impossible', 'Cause : ' + esc(e.message || String(e)) + '. Vos réponses ne sont pas modifiées.',
        `#/exam/${examId}/train`, 'Ouvrir l\'entraînement'), 'Reprise');
    }
  }

  // Réaffiche la question N d'une session à partir du marque-page (même file, même session).
  // La progression (question en cours) n'est jamais modifiée par cette navigation.
  async function renderSessionAt(examId, mode, index) {
    shell(skeleton(2), 'Entraînement');
    const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
    if (exam) await syncResumeFromServer(exam);
    const saved = exam && readResume(exam.id, mode);
    if (!exam || !saved || !Array.isArray(saved.queue) || saved.cycleNumber !== exam.current_cycle || index >= saved.queue.length) {
      location.replace(`#/exam/${examId}/${mode === 'exam' ? 'continue' : 'train'}`); return;
    }
    const live = Math.min(saved.index || 0, saved.queue.length - 1);
    await startSession(exam, saved.scope, saved.count, saved.queue, Math.min(index, live), saved.sessionId,
      saved.correct || 0, saved.incorrect || 0, mode, saved.lcaMode, { liveIndex: live, readOnly: index < live });
  }

  async function renderTrain(examId) {
    shell(skeleton(2), 'Entraînement');
    const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
    if (!exam) { shell(emptyState('Examen introuvable', '', '#/exams', 'Mes EDN'), 'Entraînement'); return; }
    await syncResumeFromServer(exam);
    renderTrainSetup(exam);
  }

  // Ordre des questions d'un examen.
  // Les questions de LCA demandent d'avoir l'article sous les yeux : elles sont
  // regroupées et renvoyées à la fin, après toutes les autres questions.
  // lcaMode : 'last' (défaut) | 'exclude' | 'only'
  // Type de question d'après le code de section de la source
  // ("Element d'épreuve: DP01 / SQI1 / KFP1 / TCS1 / LCA1"). Si la source ne
  // le donne pas, on renvoie null : le type n'est jamais deviné.
  const FORMAT_LABEL = { DP: 'Dossier progressif', QI: 'Question isolée', KFP: 'KFP',
                         TCS: 'Test de concordance de script', LCA: 'Lecture critique d\'article' };
  function questionFormat(themeName, questionText) {
    const code = String(themeName || '').split('·').pop().trim().toUpperCase();
    if (/^DP\s*\d/.test(code)) return 'DP';
    if (/^S?QI\s*\d/.test(code)) return 'QI';
    if (/^KFP\s*\d/.test(code)) return 'KFP';
    if (/^TCS\s*\d/.test(code)) return 'TCS';
    if (/^LCA\s*\d/.test(code)) return 'LCA';
    if (isLcaQuestion(questionText, themeName)) return 'LCA';
    return null;
  }

  // Détection d'une question de LCA — trois sources indépendantes, pour ne
  // dépendre ni du nom du thème ni d'un filtre SQL :
  //   1. le nom du thème/topic contient "LCA"
  //   2. le contexte inscrit dans l'énoncé à l'import : "[Contexte LCA1] …"
  //   3. l'énoncé mentionne explicitement une lecture critique d'article
  function isLcaQuestion(questionText, themeName) {
    // 1. le thème contient "LCA"
    if (themeName && /LCA/i.test(themeName)) return true;
    const head = String(questionText || '').slice(0, 400);
    // 2. le contexte inscrit à l'import : "[Contexte LCA1] …"
    if (/^\s*\[Contexte[^\]]*LCA/i.test(head)) return true;
    // 3. la consigne qui ouvre toute LCA dans les corrigés EDN :
    //    "Veuillez prendre connaissance de l'article intitulé …"
    //    "Prenez connaissance de l'article intitulé …"
    if (/(prendre|prenez)\s+connaissance\s+de\s+l['’\s]*article/i.test(head)) return true;
    // 4. mention explicite d'une lecture critique d'article
    if (/lecture critique d['’]article/i.test(head)) return true;
    return false;
  }

  // Ordre des questions d'un examen : questions classiques d'abord (ordre
  // d'origine), puis toutes les LCA (ordre d'origine, dossiers groupés).
  // lcaMode : 'last' (défaut) | 'exclude' | 'only'
  async function getOrderedQuestionIds(examId, lcaMode) {
    // on charge l'énoncé : la détection ne dépend plus d'une requête filtrée
    const { data: qs, error } = await sb.from('questions')
      .select('id, topic_id, question_text').eq('exam_id', examId).order('position');
    if (error) throw error;

    const { data: topics } = await sb.from('topics').select('id, name').eq('exam_id', examId);
    const topicName = new Map((topics || []).map(t => [t.id, t.name || '']));

    const normal = [], lca = [];
    const lcaThemes = new Set();
    (qs || []).forEach(q => {
      const theme = topicName.get(q.topic_id) || '';
      if (isLcaQuestion(q.question_text, theme)) {
        lca.push(q.id);
        lcaThemes.add(theme || 'sans thème');
      } else normal.push(q.id);
    });

    const diag = {
      total: (qs || []).length,
      lcaCount: lca.length,
      normalCount: normal.length,
      lcaThemes: [...lcaThemes],
      allThemes: [...new Set((qs || []).map(q => topicName.get(q.topic_id) || 'sans thème'))]
    };

    if (lcaMode === 'exclude') return { ids: normal, diag };
    if (lcaMode === 'only') return { ids: lca, diag };
    return { ids: normal.concat(lca), diag };
  }

  // Encart "Continuer l'examen" affiché quand une session est en cours
  function resumeCardHtml(exam, mode) {
    const saved = readResume(exam.id, mode);
    if (!saved || saved.cycleNumber !== exam.current_cycle || !saved.queue || saved.index >= saved.queue.length) return '';
    const when = saved.savedAt ? new Date(saved.savedAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';
    const pct = Math.round((saved.index / saved.queue.length) * 100);
    const title = mode === 'errors' ? 'Reprendre la révision des erreurs'
      : mode === 'lca' ? 'Reprendre la séance LCA' : "Continuer l'examen";
    const SCOPE_LABEL = { all: 'toutes les questions', errors: 'mes erreurs',
      fragile: 'questions fragiles', nonmastered: 'questions non maîtrisées' };
    const filtre = mode === 'lca' ? 'LCA uniquement'
      : (SCOPE_LABEL[saved.scope] || saved.scope) + (saved.lcaMode === 'exclude' ? ', sans les LCA' : '');
    return `<section class="card mb" style="border-color:var(--accent);">
      <div class="flex-between">
        <div style="min-width:0;">
          <h2>${title}</h2>
          <div class="small">Reprendre à la question ${saved.index + 1} / ${saved.queue.length}${when ? ' · interrompue le ' + when : ''}</div>
          <div class="small">Filtre : ${esc(filtre)}</div>
          ${saved.lcaOrdered ? '' : '<div class="small" style="color:var(--accent-600);margin-top:4px;">Les LCA restantes seront replacées en fin de session</div>'}
        </div>
        <span class="badge badge-accent">${pct}%</span>
      </div>
      <div class="bar accent" style="margin:14px 0;"><i style="width:${pct}%"></i></div>
      <div class="btn-row">
        <button class="btn btn-primary btn-lg" data-resume="${mode}">Reprendre</button>
        <button class="btn btn-danger btn-sm" data-drop="${mode}">Abandonner la session</button>
      </div>
    </section>`;
  }

  // Une session enregistrée garde sa liste de questions figée. Si elle a été
  // créée avant la règle "LCA en fin de session", on réordonne la PARTIE
  // RESTANTE : les questions déjà répondues ne bougent pas, la progression et
  // les réponses enregistrées sont intactes.
  async function reorderPendingLCA(examId, saved) {
    if (!saved || !Array.isArray(saved.queue)) return saved;
    if (saved.lcaOrdered || saved.scope === 'errors' || saved.mode === 'lca') return saved;

    const { ids: lcaIds } = await getOrderedQuestionIds(examId, 'only');
    const lcaSet = new Set(lcaIds);
    const index = saved.index || 0;
    const done = saved.queue.slice(0, index);
    const tail = saved.queue.slice(index);
    const tailNormal = tail.filter(id => !lcaSet.has(id));
    const tailLca = tail.filter(id => lcaSet.has(id));
    const queue = done.concat(tailNormal, tailLca);

    const updated = Object.assign({}, saved, { queue, lcaOrdered: true });
    try { localStorage.setItem(RESUME_KEY(examId, saved.mode || 'exam'), JSON.stringify(updated)); } catch (e) {}
    return updated;
  }

  // Abandon d'une session : ses réponses sont supprimées, puis la maîtrise des
  // questions concernées est recalculée à partir des tentatives restantes.
  // Les autres sessions et tout l'historique antérieur sont conservés.
  async function abandonSession(exam, saved) {
    if (!saved || !saved.sessionId) return { attempts: 0, questions: 0 };
    const sid = saved.sessionId;

    const { data: rows, error: e1 } = await sb.from('attempts')
      .select('id, question_id').eq('user_id', CURRENT_USER.id).eq('session_id', sid);
    if (e1) throw e1;
    const questionIds = [...new Set((rows || []).map(r => r.question_id))];

    if ((rows || []).length) {
      const { error: e2 } = await sb.from('attempts').delete()
        .eq('user_id', CURRENT_USER.id).eq('session_id', sid);
      if (e2) throw e2;
    }
    const { error: e3 } = await sb.from('study_sessions').delete()
      .eq('user_id', CURRENT_USER.id).eq('id', sid);
    if (e3) throw e3;

    await EDNEngine.rebuildMastery(CURRENT_USER.id, exam.id, questionIds);
    return { attempts: (rows || []).length, questions: questionIds.length };
  }

  function wireResume(exam) {
    document.querySelectorAll('[data-resume]').forEach(btn => {
      btn.onclick = async () => {
        const mode = btn.dataset.resume;
        // examen : même reprise sûre que « Continuer » (questions déjà répondues jamais reposées)
        if (mode === 'exam') { location.hash = `#/exam/${exam.id}/continue`; return; }
        let saved = readResume(exam.id, mode);
        if (!saved) { renderTrainSetup(exam); return; }
        btn.disabled = true; btn.textContent = 'Préparation…';
        if (mode !== 'errors') saved = await reorderPendingLCA(exam.id, saved);
        startSession(exam, saved.scope, saved.count, saved.queue, saved.index,
          saved.sessionId, saved.correct || 0, saved.incorrect || 0, mode, saved.lcaMode);
      };
    });
    document.querySelectorAll('[data-drop]').forEach(btn => {
      btn.onclick = async () => {
        const mode = btn.dataset.drop;
        const saved = readResume(exam.id, mode);
        const n = saved ? (saved.index || 0) : 0;
        const ok = confirm(
          'Abandonner cette session ?\n\n' +
          (n ? `Les ${n} réponse${n > 1 ? 's' : ''} données pendant cette session seront supprimées, ` +
               'ainsi que leur effet sur vos statistiques, erreurs et réussites.\n\n'
             : 'Aucune réponse n\'a encore été donnée dans cette session.\n\n') +
          'Vos autres sessions et votre historique antérieur sont conservés. Action définitive.');
        if (!ok) return;

        btn.disabled = true; btn.textContent = 'Suppression…';
        try {
          await abandonSession(exam, saved);
        } catch (e) {
          console.error(e);
          btn.disabled = false; btn.textContent = 'Abandonner';
          alert('La suppression a échoué, rien n\'a été modifié dans la session : ' + (e.message || e));
          return;
        }
        try { localStorage.removeItem(RESUME_KEY(exam.id, mode)); } catch (e) {}
        location.hash.startsWith('#/exam/' + exam.id + '/mistakes') ? renderMistakes(exam.id) : renderTrainSetup(exam);
      };
    });
  }

  async function renderTrainSetup(exam) {
    shell(`
      <h1>${esc(exam.name)}</h1>
      <p class="subtitle">Cycle ${exam.current_cycle} · ${exam.total_questions} questions</p>
      ${resumeCardHtml(exam, 'exam')}
      ${resumeCardHtml(exam, 'lca')}
      <div class="card">
        <h2>Nouvelle session</h2>
        <label for="scope">Sur quoi travailler</label>
        <select id="scope">
          <option value="all">Toutes les questions</option>
          <option value="errors">Uniquement mes erreurs du cycle</option>
          <option value="fragile">Questions fragiles</option>
          <option value="nonmastered">Questions non maîtrisées</option>
        </select>
        <label for="lca">Questions de LCA</label>
        <select id="lca">
          <option value="last" selected>À la fin de la session</option>
          <option value="exclude">Les exclure</option>
          <option value="only">Uniquement les LCA</option>
        </select>

        <label for="count">Nombre de questions</label>
        <select id="count">
          <option value="10">10 questions</option><option value="20">20 questions</option>
          <option value="50">50 questions</option><option value="100">100 questions</option>
          <option value="200">200 questions</option><option value="all" selected>Toutes</option>
        </select>
        <button class="btn btn-primary btn-lg btn-block mt" id="start-btn">Commencer l'entraînement</button>
      </div>
      <div class="btn-row mt">
        <a class="btn" href="#/exam/${exam.id}/mistakes">Mes erreurs</a>
        <a class="btn" href="#/exam/${exam.id}/exam-mode">Mode examen</a>
        <a class="btn" href="#/exam/${exam.id}/stats">Statistiques</a>
      </div>
    `, 'Entraînement');
    wireResume(exam);
    // une session est en cours : « Reprendre » est l'action principale, « Commencer » devient secondaire
    if (document.querySelector('[data-resume]')) {
      const sb_ = document.getElementById('start-btn');
      sb_.classList.remove('btn-primary'); sb_.textContent = 'Commencer une nouvelle session';
    }
    document.getElementById('start-btn').onclick = async () => {
      const btn = document.getElementById('start-btn');
      const reset = () => { btn.disabled = false; btn.textContent = "Commencer l'entraînement"; };
      const step = (t) => { btn.textContent = t; };
      // une session d'examen est en cours : la remplacer doit être un choix explicite
      const current = readResume(exam.id, document.getElementById('lca').value === 'only' ? 'lca' : 'exam');
      if (current && current.cycleNumber === exam.current_cycle && Array.isArray(current.queue) && current.index < current.queue.length) {
        const ok = confirm(`Une session est en cours (question ${current.index + 1} / ${current.queue.length}).\n\n` +
          'Commencer une nouvelle session remplacera ce point de reprise. Vos réponses déjà données restent enregistrées.\n\n' +
          'Pour reprendre là où vous en étiez, choisissez plutôt « Reprendre ».\n\nCommencer quand même ?');
        if (!ok) return;
      }
      btn.disabled = true;
      // chaque étape est annoncée : en cas de blocage, on sait laquelle
      let etape = 'lecture des filtres';
      try {
        step('Préparation… (1/5)');
        const scope = document.getElementById('scope').value;
        const lcaMode = document.getElementById('lca').value;
        const count = document.getElementById('count').value;

        etape = 'récupération des questions';
        step('Préparation… (2/5)');
        const { ids: allIds } = await withTimeout(getOrderedQuestionIds(exam.id, lcaMode), 25000, etape);

        etape = 'lecture de vos réponses';
        step('Préparation… (3/5)');
        const latest = await withTimeout(
          EDNEngine.getLatestAttemptsForCycle(CURRENT_USER.id, exam.id, exam.current_cycle), 25000, etape);
        const masteryMap = await withTimeout(
          EDNEngine.getMasteryMap(CURRENT_USER.id, exam.id), 25000, etape);

        etape = 'constitution de la liste';
        step('Préparation… (4/5)');
        const queue = EDNEngine.buildQuestionSet(allIds, scope, latest, masteryMap, count);
        const sessionMode = lcaMode === 'only' ? 'lca' : 'exam';
        if (!queue.length) { reset(); alert('Aucune question ne correspond à cette sélection.'); return; }

        etape = 'création de la session';
        step('Préparation… (5/5)');
        const { data: session, error } = await withTimeout(
          sb.from('study_sessions').insert({
            user_id: CURRENT_USER.id, exam_id: exam.id, cycle_number: exam.current_cycle,
            mode: sessionMode === 'lca' ? 'lca' : 'entrainement', total_questions: queue.length
          }).select().single(), 25000, etape);
        if (error) throw error;
        if (!session || !session.id) throw new Error('la session n\'a pas pu être créée');

        etape = 'affichage de la première question';
        await startSession(exam, scope, count, queue, 0, session.id, 0, 0, sessionMode, lcaMode);
      } catch (e) {
        console.error(e);
        reset();
        alert('Impossible de démarrer la session.\n\nÉtape : ' + etape +
              '\nCause : ' + (e && (e.message || e.details || e.hint) ? (e.message || e.details || e.hint) : String(e)));
      }
    };
  }

  // Empêche un appel réseau bloqué de figer le bouton indéfiniment
  function withTimeout(promise, ms, label) {
    return Promise.race([
      Promise.resolve(promise),
      new Promise((_, rej) => setTimeout(
        () => rej(new Error('délai dépassé (' + Math.round(ms / 1000) + 's) pendant : ' + label)), ms))
    ]);
  }

  // Normalisation pour comparer une réponse libre (QROC) aux réponses acceptées
  function normAnswer(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').trim();
  }
  const SINGLE_TYPES = ['qru', 'qcm', 'qtcs'];

  // view (optionnel) : { liveIndex, readOnly } — navigation dans la session SANS toucher à la progression.
  //   liveIndex = question en cours de la session (progression réelle, marque-page) ;
  //   readOnly  = question précédente, affichée avec la réponse déjà enregistrée, rien n'est écrit.
  async function startSession(exam, scope, count, queue, index, sessionId, correct, incorrect, mode, lcaMode, view) {
    mode = mode || (scope === 'errors' ? 'errors' : 'exam');
    if (index >= queue.length) { await finishSession(exam, sessionId, correct, incorrect, mode); return; }
    const liveIndex = view && Number.isInteger(view.liveIndex) ? view.liveIndex : index;
    const readOnly = !!(view && view.readOnly && index < liveIndex);
    // position sauvegardée à chaque question EN COURS : relire une question précédente ne la change pas
    const prevState = readResume(exam.id, mode);
    const sessionState = {
      cycleNumber: exam.current_cycle, mode, scope, count, lcaMode: lcaMode || (mode === 'lca' ? 'only' : 'last'),
      queue, index, sessionId, correct, incorrect, lcaOrdered: true,
      // sélection non encore corrigée de la question en cours (retrouvée sur un autre appareil)
      draft: prevState && prevState.sessionId === sessionId && prevState.draft && prevState.draft.qId === queue[index] ? prevState.draft : null
    };
    if (!readOnly) saveResume(exam.id, mode, sessionState);

    const qId = queue[index];
    const { data: q } = await sb.from('questions').select('*, question_options(*), topics(name)').eq('id', qId).single();
    // le thème (DP03, SQI1, LCA1…) vient de la table topics
    q.theme = (q.topics && q.topics.name) || '';
    const format = questionFormat(q.theme, q.question_text);
    const type = (q.question_type || 'qrm').toLowerCase();
    const isOpen = type === 'qroc';
    const isZone = type === 'qzone';
    const isSingle = SINGLE_TYPES.includes(type);
    const opts = (q.question_options || []).sort((a, b) => a.position - b.position);
    const correctKeys = opts.filter(o => o.is_correct).map(o => o.option_key).sort();
    const startTime = Date.now();
    let revealed = false, busy = false, advance = null, draftTimer = null;

    const typeLabel = isOpen ? 'Réponse libre' : isZone ? 'Question sur image'
      : isSingle ? 'Une seule réponse' : 'Plusieurs réponses possibles';

    // Question de LCA : rappel qu'il faut l'article sous les yeux
    const lcaBanner = isLcaQuestion(q.question_text, q.theme)
      ? `<div class="q-context lca">
          <strong>Lecture critique d'article${q.theme ? ' · ' + esc(q.theme.split('·').pop().trim()) : ''}</strong><br/>
          Gardez l'article sous les yeux pour répondre.</div>` : '';

    // Dossier progressif : position de la question dans son dossier.
    // Les questions d'un même dossier partagent le même topic_id et se suivent
    // par leur position d'origine dans le document.
    let dpBanner = '';
    if (q.topic_id && /DP\s*\d/i.test(q.theme || '')) {
      const { data: sibs } = await sb.from('questions')
        .select('id, position').eq('topic_id', q.topic_id).order('position');
      if (sibs && sibs.length > 1) {
        const rank = sibs.findIndex(x => x.id === q.id) + 1;
        if (rank > 0) {
          dpBanner = `<span class="q-type dp" title="Dossier progressif">${esc(q.theme.split('·').pop().trim())} · question ${rank}/${sibs.length}</span>`;
        }
      }
    }

    const images = Array.isArray(q.images) ? q.images : [];
    const imgTag = (im) => `<img src="${im.src}" alt="Illustration de la question" class="q-image" loading="lazy" />`;
    const mainImages = images.filter(im => !im.label).map(imgTag).join('');
    const imagesByOption = {};
    images.filter(im => im.label).forEach(im => {
      imagesByOption[im.label] = (imagesByOption[im.label] || '') + imgTag(im);
    });

    // L'énoncé peut contenir un contexte de dossier : on le met en retrait
    const parts = String(q.question_text || '').split('\n\n');
    const hasContext = parts.length > 1 && /^\[Contexte/.test(parts[0]);
    const contextHtml = hasContext
      ? `<div class="q-context">${esc(readable(parts[0].replace(/^\[Contexte\s*[^\]]*\]\s*/, '')))}</div>` : '';
    const statementHtml = esc(readable(hasContext ? parts.slice(1).join('\n\n') : q.question_text));

    let answerZone;
    if (isOpen) {
      answerZone = `<input type="text" id="open-answer" placeholder="Votre réponse"
        autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Votre réponse" />`;
    } else if (isZone || !opts.length) {
      answerZone = `<p class="small">Répondez mentalement sur l'image, puis indiquez si vous maîtrisiez la question.</p>`;
    } else {
      answerZone = opts.map(o => `
        <label class="option" data-key="${o.option_key}">
          <input type="${isSingle ? 'radio' : 'checkbox'}" name="opt" value="${o.option_key}" />
          <span class="key" aria-hidden="true">${o.option_key}</span>
          <span class="body">${esc(o.option_text)}${imagesByOption[o.option_key] || ''}</span>
        </label>`).join('');
    }

    // question sans proposition (zone, image) : l'auto-évaluation EST la réponse
    const selfEval = isZone || (!isOpen && !opts.length);
    const actionButtons = selfEval
      ? `<div class="self-row"><button class="btn btn-good" id="self-ok">Je la maîtrisais</button>
         <button class="btn" id="self-ko">Je ne la savais pas</button></div>` : '';

    const pct = Math.round((index / queue.length) * 100);

    shell(`
      <div class="question-shell" data-session="1" data-return-hash="#/exam/${exam.id}/session/${mode}/${index}" data-return-label="Question ${index + 1}">
        ${readOnly ? `<nav class="q-nav" aria-label="Retour à la progression"><span></span>
          <button class="btn btn-sm" id="back-live-btn">Question en cours (${liveIndex + 1}) ›</button></nav>` : ''}
        ${readOnly ? `<div class="q-readonly" role="status">Relecture · votre réponse est déjà enregistrée, rien n'est modifié.</div>` : ''}
        <div class="q-progress">
          <div class="row">
            <span>Question <b>${index + 1}</b> / ${queue.length}</span>
            <span>Cycle ${exam.current_cycle}</span>
          </div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>

        <div class="q-meta">
          ${format && !dpBanner ? `<span class="q-type" title="${esc(FORMAT_LABEL[format] || format)}"><strong>${format}</strong></span>` : ''}
          ${dpBanner}
          <span class="q-type" style="background:transparent;padding-left:4px;color:var(--color-muted);">${typeLabel}${!dpBanner && q.theme && !/LCA/i.test(q.theme) ? ' · ' + esc(q.theme.split('·').pop().trim()) : ''}</span>
        </div>
        ${lcaBanner}
        ${contextHtml}
        <div class="q-text">${statementHtml}</div>
        ${mainImages}
        <div id="options">${answerZone}</div>
        <div id="feedback-zone"></div>

        <div class="actionbar session-bar">
          ${actionButtons}
          <div class="nav-row">
            <button class="btn btn-lg" id="prev-q-btn" ${index > 0 ? '' : 'disabled'} aria-label="Question précédente">←&nbsp;Question précédente</button>
            <button class="btn btn-primary btn-lg" id="next-question-btn" disabled aria-label="Question suivante">Question suivante&nbsp;→</button>
          </div>
          <button class="btn btn-ghost quit" id="quit-btn">Quitter</button>
        </div>
      </div>
    `, 'Entraînement');

    // contexte long : déplié pour la 1re question d'un dossier, replié ensuite
    wireCollapsibleContexts(document, !/question 1\//.test(dpBanner));

    // sélection visuelle des propositions
    document.querySelectorAll('.option').forEach(el => {
      const input = el.querySelector('input');
      if (!input) return;
      input.addEventListener('change', () => {
        if (isSingle) document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        el.classList.toggle('selected', input.checked);
      });
    });

    document.getElementById('quit-btn').onclick = () => { location.hash = `#/exam/${exam.id}/train`; renderTrainSetup(exam); };

    // chaque question a son adresse (sans nouvelle entrée d'historique) : le retour du
    // navigateur, le glissement retour d'iOS et l'actualisation ramènent à CETTE question
    const nextQ = document.getElementById('next-question-btn');
    const selfHash = `#/exam/${exam.id}/session/${mode}/${index}`;
    if (location.hash !== selfHash) history.replaceState(null, '', selfHash);
    const goTo = (i) => startSession(exam, scope, count, queue, i, sessionId, correct, incorrect, mode, lcaMode,
      { liveIndex, readOnly: i < liveIndex });
    const prevBtn = document.getElementById('prev-q-btn');
    if (prevBtn) prevBtn.onclick = () => goTo(index - 1);
    const liveBtn = document.getElementById('back-live-btn');
    if (liveBtn) liveBtn.onclick = () => goTo(liveIndex);

    // retour sur une question déjà répondue dans CETTE session (question précédente, retour
    // depuis un Collège ou un item, actualisation) : la réponse enregistrée est relue et la
    // correction réaffichée, sans nouvelle tentative
    // Source : table attempts de Supabase, jamais le stockage local.
    //  - question précédente (examen, LCA) : dernière réponse du CYCLE en cours, quelle que
    //    soit la session ou l'appareil où elle a été donnée ;
    //  - question en cours, ou mode « erreurs » : réponse de CETTE session uniquement
    //    (sinon l'ancienne erreur serait réaffichée à la place de la nouvelle réponse).
    (async () => {
      let rq = sb.from('attempts').select('selected_answers, is_correct, answered_at')
        .eq('user_id', CURRENT_USER.id).eq('question_id', q.id);
      rq = (readOnly && mode !== 'errors')
        ? rq.eq('exam_id', exam.id).eq('cycle_number', exam.current_cycle)
        : rq.eq('session_id', sessionId);
      const { data: prev } = await rq.order('answered_at', { ascending: false }).limit(1);
      const att = (prev || [])[0];
      if (!att || revealed || busy || !document.body.contains(nextQ)) return;
      const sel = Array.isArray(att.selected_answers) ? att.selected_answers : [];
      const openInput = document.getElementById('open-answer');
      if (openInput) openInput.value = sel.join(', ');
      document.querySelectorAll('.option').forEach(el => {
        const inp = el.querySelector('input');
        if (inp && sel.includes(el.dataset.key)) { inp.checked = true; el.classList.add('selected'); }
      });
      await reveal(!!att.is_correct, sel, true);
    })();

    async function reveal(isCorrect, selected, replay) {
      const responseTime = Math.round((Date.now() - startTime) / 1000);
      document.querySelectorAll('.option').forEach(el => {
        el.classList.add('disabled');
        const input = el.querySelector('input'); if (input) input.disabled = true;
        const key = el.dataset.key;
        if (correctKeys.includes(key)) el.classList.add('correct', selected.includes(key) ? 'picked' : 'missed');
        else if (selected.includes(key)) el.classList.add('incorrect');
      });
      const openInput = document.getElementById('open-answer');
      if (openInput) openInput.disabled = true;

      // relecture d'une réponse déjà enregistrée : rien n'est écrit.
      // Sinon la correction n'apparaît QUE si l'enregistrement dans Supabase a réussi.
      if (!replay) {
        try {
          await EDNEngine.recordAttempt({
            userId: CURRENT_USER.id, examId: exam.id, questionId: q.id, sessionId, cycleNumber: exam.current_cycle,
            selectedAnswers: selected, isCorrect, responseTime
          });
        } catch (err) {
          document.querySelectorAll('.option').forEach(el => {
            el.classList.remove('disabled', 'correct', 'picked', 'missed', 'incorrect');
            const input = el.querySelector('input'); if (input) input.disabled = false;
          });
          const oi = document.getElementById('open-answer'); if (oi) oi.disabled = false;
          document.getElementById('feedback-zone').innerHTML = `<div class="alert alert-error" role="alert">
            Réponse non enregistrée (${esc((err && err.message) || 'connexion')}). Votre sélection est conservée : réessayez.</div>`;
          throw err;
        }
      }
      revealed = true;
      document.querySelectorAll('.actionbar .self-row').forEach(b => b.remove());
      if (draftTimer) { clearTimeout(draftTimer); draftTimer = null; }
      if (!readOnly && sessionState.draft) { sessionState.draft = null; saveResume(exam.id, mode, sessionState); }

      const goodAnswers = opts.filter(o => o.is_correct)
        .map(o => isOpen ? esc(o.option_text) : '<strong>' + o.option_key + '.</strong> ' + esc(o.option_text));

      document.getElementById('feedback-zone').innerHTML = `
        <div class="verdict ${isCorrect ? 'good' : 'bad'}" role="status">
          <span class="mark"><span>${isCorrect ? '✓' : '✕'}</span></span>
          ${isCorrect ? 'Bonne réponse' : 'Mauvaise réponse'}
        </div>
        ${isOpen && selected.length ? `<div class="explain answer-mine ${isCorrect ? 'ok' : ''}">
          <h4>Ta réponse</h4>
          <p>${isOpen ? esc(selected.join(', ')) : selected.slice().sort().map(k => {
            const o = opts.find(x => x.option_key === k);
            return '<strong>' + esc(k) + '.</strong> ' + (o ? esc(o.option_text) : '');
          }).join('<br/>')}</p></div>` : ''}
        ${goodAnswers.length ? `<div class="explain answer-expected">
          <h4>${isOpen ? 'Réponses acceptées' : 'Réponse attendue'}</h4>
          <p>${goodAnswers.join(isOpen ? ' · ' : '<br/>')}</p></div>` : ''}
        ${q.official_correction ? `<div class="explain"><h4>Correction officielle</h4><p>${esc(q.official_correction)}</p></div>` : ''}
        ${q.explanation ? `<div class="explain"><h4>Explication</h4><p>${esc(q.explanation)}</p></div>` : ''}
      `;
      ['validate-btn', 'self-ok', 'self-ko'].forEach(id => {
        const b = document.getElementById(id); if (b) b.style.display = 'none';
      });
      {
        const evBox = document.createElement('div');
        evBox.className = 'ev-host';
        const anchor = document.querySelector('#feedback-zone .answer-expected');
        if (anchor) anchor.after(evBox); else document.getElementById('feedback-zone').appendChild(evBox);
        fillEvidence(q, opts, evBox);
      }
      // Référence Collège : sous l'explication, uniquement si la réponse est fausse.
      // Chargée après coup : la correction s'affiche sans attendre.
      {
        const refBox = document.createElement('div');
        document.getElementById('feedback-zone').appendChild(refBox);
        // réponse fausse : item + références Collège ; réponse juste : l'item seulement
        fillCollegeReference(q.id, refBox, { itemsOnly: isCorrect });
      }
      const nextBtn = document.getElementById('next-question-btn');
      nextBtn.textContent = index + 1 < queue.length ? 'Question suivante\u00A0→' : 'Terminer la session';
      if (readOnly && index + 1 === liveIndex) nextBtn.textContent = `Question en cours (${liveIndex + 1})\u00A0→`;
      advance = () => readOnly
        // relecture : on avance dans les questions déjà vues, sans compter deux fois
        ? goTo(index + 1)
        : startSession(exam, scope, count, queue, index + 1, sessionId,
            correct + (isCorrect ? 1 : 0), incorrect + (isCorrect ? 0 : 1), mode, lcaMode);
      nextBtn.disabled = false;
    }

    // « Question suivante » : désactivée (attribut disabled, donc ni clic, ni tactile, ni
    // clavier) tant qu'aucune réponse n'est choisie. 1er appui : la réponse est enregistrée
    // dans Supabase et corrigée ; appui suivant : question suivante. Un appui pendant
    // l'enregistrement est ignoré : jamais deux tentatives pour une même réponse.
    const openAns = document.getElementById('open-answer');
    const currentSelection = () => isOpen
      ? (openAns && openAns.value.trim() ? [openAns.value.trim()] : [])
      : Array.from(document.querySelectorAll('input[name="opt"]:checked')).map(i => i.value);
    const refreshNext = () => { if (!revealed && !busy) nextQ.disabled = selfEval || !currentSelection().length; };
    // sélection en cours enregistrée dans le compte (sans créer de tentative)
    const saveDraft = () => {
      if (readOnly || revealed) return;
      clearTimeout(draftTimer);
      draftTimer = setTimeout(() => {
        const sel = currentSelection();
        sessionState.draft = sel.length ? { qId: q.id, selected: sel } : null;
        saveResume(exam.id, mode, sessionState);
      }, 500);
    };
    document.querySelectorAll('input[name="opt"]').forEach(i => i.addEventListener('change', () => { refreshNext(); saveDraft(); }));
    if (openAns) openAns.addEventListener('input', () => { refreshNext(); saveDraft(); });

    const answerNow = async (isCorrect, selected) => {
      if (revealed || busy) return;
      busy = true; nextQ.disabled = true;
      try { await reveal(isCorrect, selected); }
      catch (e) { console.warn(e); }
      finally { busy = false; if (!revealed) refreshNext(); }
    };
    nextQ.onclick = () => {
      if (nextQ.disabled || busy) return;
      if (revealed) { if (advance) advance(); return; }
      const selected = currentSelection();
      if (!selected.length) return;
      if (isOpen) { answerNow(opts.some(o => normAnswer(o.option_text) === normAnswer(selected[0])), selected); return; }
      // QRU / TCS : une seule réponse, correcte si elle fait partie des réponses valides.
      // QRM / QRP : la sélection doit correspondre exactement aux réponses valides.
      const isCorrect = isSingle
        ? correctKeys.includes(selected[0])
        : JSON.stringify(selected.slice().sort()) === JSON.stringify(correctKeys);
      answerNow(isCorrect, selected);
    };
    const selfOk = document.getElementById('self-ok');
    if (selfOk) {
      selfOk.onclick = () => answerNow(true, []);
      document.getElementById('self-ko').onclick = () => answerNow(false, []);
    }
    if (openAns) openAns.addEventListener('keydown', e => { if (e.key === 'Enter') nextQ.click(); });

    // sélection non corrigée retrouvée (autre appareil, retour depuis un Collège)
    if (!readOnly && sessionState.draft && Array.isArray(sessionState.draft.selected)) {
      const sel = sessionState.draft.selected;
      if (openAns) openAns.value = sel.join(', ');
      document.querySelectorAll('.option').forEach(el => {
        const inp = el.querySelector('input');
        if (inp && sel.includes(el.dataset.key)) { inp.checked = true; el.classList.add('selected'); }
      });
    }
    refreshNext();
    if (openAns && !sessionState.draft) openAns.focus();
  }

  async function finishSession(exam, sessionId, correct, incorrect, mode) {
    try { localStorage.removeItem(RESUME_KEY(exam.id, mode || 'exam')); } catch (e) {}
    await sb.from('study_sessions').update({
      correct_answers: correct, incorrect_answers: incorrect, completed_at: new Date().toISOString()
    }).eq('id', sessionId);

    const remainingErrors = await EDNEngine.countCurrentErrors(CURRENT_USER.id, exam.id, exam.current_cycle);

    if (remainingErrors === 0) {
      await sb.from('exams').update({ current_cycle: exam.current_cycle + 1, updated_at: new Date().toISOString() }).eq('id', exam.id);
      shell(`
        <div class="card center" style="padding:40px 24px;">

          ${ring(score, 104, 10, 'var(--brand)', 'var(--brand-100)')}
          <h1 style="margin-top:20px;">Session terminée</h1>
