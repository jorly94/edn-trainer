<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6F4EF" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="EDN" />
<title>EDN Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   EDN TRAINER — DESIGN SYSTEM
   Mobile-first (base : iPhone 12, 390×844). Tout est piloté par les
   tokens ci-dessous : aucune couleur en dur dans les composants.
===================================================================== */

:root {
  /* — Couleurs — sauge/teal doux, crème, touche pêche — */
  --bg:            #F6F4EF;
  --bg-tint:       #EFF3F0;
  --surface:       #FFFFFF;
  --surface-alt:   #FBFAF7;

  --ink:           #1E2A2B;
  --ink-2:         #46585A;
  --ink-3:         #7C8C8C;

  --line:          #E5E2D9;
  --line-strong:   #D3CFC3;

  --brand:         #3E7E74;
  --brand-600:     #336A61;
  --brand-100:     #E2EFEB;
  --brand-50:      #F0F7F4;

  --accent:        #D97A4E;
  --accent-600:    #C06A42;
  --accent-100:    #FBEADF;

  --good:          #3C8A6B;
  --good-100:      #E4F1EA;
  --warn:          #C08A3E;
  --warn-100:      #F9EEDC;
  --bad:           #C0605A;
  --bad-100:       #F9E9E7;
  --idle:          #9AA5A4;
  --idle-100:      #EDEFEE;

  /* — Typographie — */
  --font:   "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-display: "Fraunces", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

  /* — Espacements — */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s7: 32px; --s8: 44px;

  /* — Rayons & ombres — */
  --r-sm: 10px; --r: 16px; --r-lg: 22px; --r-full: 999px;
  --shadow-1: 0 1px 2px rgba(30,42,43,.04), 0 1px 3px rgba(30,42,43,.05);
  --shadow-2: 0 2px 6px rgba(30,42,43,.05), 0 8px 24px rgba(30,42,43,.06);

  /* — Zones sûres iOS — */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);

  --nav-h: 64px;
}

/* ------------------------------ Base ------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }

body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

img { max-width: 100%; height: auto; }
a { color: var(--brand-600); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

h1, h2, h3 { margin: 0; line-height: 1.25; letter-spacing: -0.015em; }
h1 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; }
h2 { font-size: 1.05rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 700; }
p  { margin: 0 0 var(--s3); }

.subtitle { color: var(--ink-3); font-size: .92rem; margin: var(--s1) 0 var(--s5); }
.small    { font-size: .84rem; color: var(--ink-3); line-height: 1.5; }
.mt { margin-top: var(--s5); }
.mb { margin-bottom: var(--s5); }
.center { text-align: center; }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.stack { display: grid; gap: var(--s3); }

/* ----------------------------- Layout ----------------------------- */
.shell { min-height: 100dvh; padding-bottom: calc(var(--nav-h) + var(--safe-b) + var(--s5)); }

.topbar {
  position: sticky; top: 0; z-index: 20;
  padding: calc(var(--safe-t) + var(--s4)) var(--s4) var(--s3);
  padding-left: calc(var(--s4) + var(--safe-l));
  padding-right: calc(var(--s4) + var(--safe-r));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid transparent;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar .brand { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.topbar .brand span { color: var(--brand); }

.main {
  padding: var(--s4);
  padding-left: calc(var(--s4) + var(--safe-l));
  padding-right: calc(var(--s4) + var(--safe-r));
  max-width: 900px;
  margin: 0 auto;
}

/* Barre de navigation basse (mobile) */
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex;
  padding: var(--s2) calc(var(--s2) + var(--safe-r)) calc(var(--s2) + var(--safe-b)) calc(var(--s2) + var(--safe-l));
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--line);
}
.bottomnav a {
  flex: 1 1 0; min-width: 0; min-height: 48px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font-size: .68rem; font-weight: 600; letter-spacing: .01em;
  border-radius: var(--r-sm); padding: var(--s1) 2px;
  transition: color .15s ease, background .15s ease;
}
.bottomnav a svg { width: 21px; height: 21px; stroke-width: 1.7; }
.bottomnav a.active { color: var(--brand); background: var(--brand-50); }
.bottomnav a:active { transform: scale(.96); }
.bottomnav a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sidebar { display: none; }

/* ------------------------------ Cards ----------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: var(--s5);
  box-shadow: var(--shadow-1);
}
.card + .card { margin-top: var(--s3); }
.card-tight { padding: var(--s4); }

.grid { display: grid; gap: var(--s3); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* Statistique */
.stat { padding: var(--s4); }
.stat .label {
  font-size: .74rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--ink-3);
}
.stat .value {
  font-family: var(--font-display); font-size: 1.75rem; font-weight: 600;
  line-height: 1.1; margin-top: var(--s2); letter-spacing: -0.02em;
}
.stat .value small { font-size: .9rem; color: var(--ink-3); font-family: var(--font); font-weight: 600; }
.stat.accent { background: var(--accent-100); border-color: transparent; }
.stat.accent .value { color: var(--accent-600); }
.stat.brand { background: var(--brand-100); border-color: transparent; }
.stat.brand .value { color: var(--brand-600); }

/* Bandeau d'accueil */
.hero {
  background: linear-gradient(160deg, var(--brand) 0%, var(--brand-600) 100%);
  color: #fff; border-radius: var(--r-lg); padding: var(--s6) var(--s5);
  display: flex; align-items: center; gap: var(--s5);
}
.hero h1 { color: #fff; font-size: 1.3rem; }
.hero .hello { font-size: .85rem; opacity: .8; }
.hero .meta { font-size: .85rem; opacity: .85; margin-top: var(--s2); }

/* Anneau de progression */
.ring { flex-shrink: 0; position: relative; width: 92px; height: 92px; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .ring-label {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 1.25rem; font-weight: 600;
}

/* Barre de progression */
.bar { height: 8px; background: var(--idle-100); border-radius: var(--r-full); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: var(--r-full); transition: width .4s ease; }
.bar.accent > i { background: var(--accent); }
.bar.good > i { background: var(--good); }

/* ----------------------------- Boutons ---------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 48px; padding: 0 var(--s5);
  border: 1px solid var(--line-strong); border-radius: var(--r-full);
  background: var(--surface); color: var(--ink);
  font-size: .95rem; font-weight: 600; cursor: pointer;
  transition: transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { border-color: var(--brand); color: var(--brand-600); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: var(--shadow-1); }
.btn-primary:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-accent:hover { background: var(--accent-600); border-color: var(--accent-600); color: #fff; }
.btn-good { background: var(--good); border-color: var(--good); color: #fff; }
.btn-good:hover { background: var(--good); border-color: var(--good); color: #fff; filter: brightness(.95); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-3); }
.btn-danger { color: var(--bad); border-color: transparent; background: transparent; }

.btn-block { width: 100%; }
.btn-lg { min-height: 54px; font-size: 1rem; }
.btn-sm { min-height: 38px; padding: 0 var(--s4); font-size: .84rem; }

.btn-row { display: flex; flex-wrap: wrap; gap: var(--s2); }
.btn-row .btn { flex: 1 1 auto; }

/* ----------------------------- Badges ----------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: var(--r-full);
  font-size: .75rem; font-weight: 700; letter-spacing: .01em;
}
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge-maitrisee   { background: var(--good-100); color: var(--good); }
.badge-en_cours    { background: var(--brand-100); color: var(--brand-600); }
.badge-fragile     { background: var(--warn-100); color: var(--warn); }
.badge-a_apprendre { background: var(--bad-100); color: var(--bad); }
.badge-idle        { background: var(--idle-100); color: var(--ink-3); }
.badge-accent      { background: var(--accent-100); color: var(--accent-600); }

/* --------------------------- Formulaires -------------------------- */
label { display: block; font-size: .82rem; font-weight: 600; color: var(--ink-2); margin: var(--s4) 0 var(--s2); }
input[type=text], input[type=email], input[type=password], input[type=number], textarea, select {
  width: 100%; min-height: 48px; padding: var(--s3) var(--s4);
  background: var(--surface-alt); border: 1px solid var(--line-strong);
  border-radius: var(--r-sm); font-size: 16px; /* 16px : évite le zoom auto iOS */
  transition: border-color .15s ease, background .15s ease;
}
textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
input:focus, textarea:focus, select:focus { background: var(--surface); border-color: var(--brand); outline: none; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; }
.field { margin-bottom: var(--s2); }

/* ------------------------ Écran de question ----------------------- */
.question-shell { max-width: 720px; margin: 0 auto; }

.q-progress { margin-bottom: var(--s5); }
.q-progress .row {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: .8rem; font-weight: 700; color: var(--ink-3);
  letter-spacing: .04em; text-transform: uppercase; margin-bottom: var(--s2);
}
.q-progress .row b { font-family: var(--font-mono); color: var(--ink); font-size: .9rem; }

.q-type {
  display: inline-block; margin-bottom: var(--s4);
  padding: 4px 10px; border-radius: var(--r-full);
  background: var(--bg-tint); color: var(--brand-600);
  font-size: .75rem; font-weight: 700;
}
.q-context {
  background: var(--surface-alt); border-left: 3px solid var(--brand-100);
  border-radius: var(--r-sm); padding: var(--s4);
  font-size: .92rem; color: var(--ink-2); margin-bottom: var(--s4); white-space: pre-wrap;
}
.q-text { font-size: 1.12rem; line-height: 1.55; margin-bottom: var(--s5); white-space: pre-wrap; }

/* Propositions */
.option {
  display: flex; align-items: flex-start; gap: var(--s3);
  min-height: 56px; padding: var(--s4);
  background: var(--surface); border: 1.5px solid var(--line);
  border-radius: var(--r); margin-bottom: var(--s2);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.option:active { transform: scale(.995); }
.option input { position: absolute; opacity: 0; pointer-events: none; }
.option .key {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-tint); color: var(--ink-2);
  font-size: .82rem; font-weight: 700;
  transition: background .15s ease, color .15s ease;
}
.option .body { flex: 1; min-width: 0; font-size: .97rem; line-height: 1.5; }
.option.selected { border-color: var(--brand); background: var(--brand-50); }
.option.selected .key { background: var(--brand); color: #fff; }
.option.correct { border-color: var(--good); background: var(--good-100); }
.option.correct .key { background: var(--good); color: #fff; }
.option.incorrect { border-color: var(--bad); background: var(--bad-100); }
.option.incorrect .key { background: var(--bad); color: #fff; }
.option.disabled { cursor: default; }
.option.disabled:active { transform: none; }

/* Correction */
.verdict {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s4) var(--s5); border-radius: var(--r);
  font-weight: 700; font-size: 1rem; margin: var(--s5) 0 var(--s3);
  animation: rise .25s ease both;
}
.verdict .mark {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: currentColor; font-size: .9rem;
}
.verdict .mark span { color: #fff; }
.verdict.good { background: var(--good-100); color: var(--good); }
.verdict.bad  { background: var(--bad-100);  color: var(--bad); }

.explain {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: var(--s4) var(--s5); margin-bottom: var(--s3);
  animation: rise .3s ease both;
}
.explain h4 {
  margin: 0 0 var(--s2); font-size: .74rem; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
}
.explain p { margin: 0; font-size: .94rem; line-height: 1.6; color: var(--ink-2); }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Barre d'action collante en bas d'écran */
.actionbar {
  position: sticky; bottom: 0; z-index: 10;
  margin: var(--s5) calc(var(--s4) * -1) 0;
  padding: var(--s3) var(--s4) calc(var(--s3) + var(--safe-b));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  display: flex; gap: var(--s2);
}
.actionbar .btn { flex: 1 1 auto; }

/* Illustrations extraites des PDF */
.q-image {
  display: block; width: 100%; height: auto;
  border: 1px solid var(--line); border-radius: var(--r);
  margin: var(--s3) 0; background: #fff; cursor: zoom-in;
}
.image-zoom {
  position: fixed; inset: 0; z-index: 100; padding: var(--s4);
  background: rgba(20, 30, 31, .94);
  display: flex; align-items: center; justify-content: center;
}
.image-zoom img { max-width: 100%; max-height: 100%; border-radius: var(--r-sm); }

/* ----------------------- Import & vérification -------------------- */
.dropzone {
  border: 1.5px dashed var(--line-strong); border-radius: var(--r);
  background: var(--surface-alt); padding: var(--s7) var(--s4);
  text-align: center; color: var(--ink-3); cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.dropzone:hover, .dropzone.over { border-color: var(--brand); background: var(--brand-50); color: var(--brand-600); }
.dropzone strong { display: block; color: var(--ink); font-size: 1rem; margin-bottom: var(--s1); }

.stepper { display: flex; gap: var(--s2); margin-bottom: var(--s5); }
.stepper .step { flex: 1; text-align: center; font-size: .7rem; font-weight: 700; color: var(--ink-3); }
.stepper .step i {
  display: block; height: 4px; border-radius: var(--r-full);
  background: var(--idle-100); margin-bottom: var(--s2);
}
.stepper .step.done i { background: var(--brand); }
.stepper .step.done { color: var(--brand-600); }
.stepper .step.current i { background: var(--accent); }
.stepper .step.current { color: var(--accent-600); }

.filelist .row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  padding: var(--s3) 0; border-bottom: 1px solid var(--line); font-size: .9rem;
}
.filelist .row:last-child { border-bottom: none; }

.review-row { border: 1px solid var(--line); border-radius: var(--r); padding: var(--s4); margin-bottom: var(--s3); background: var(--surface); }
.review-row.needs-review { border-color: var(--warn); background: var(--warn-100); }
.review-row .row-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }

/* --------------------- États vides & chargement ------------------- */
.empty { text-align: center; padding: var(--s7) var(--s4); }
.empty .icon {
  width: 56px; height: 56px; margin: 0 auto var(--s4);
  border-radius: var(--r); background: var(--brand-50);
  display: flex; align-items: center; justify-content: center; color: var(--brand);
}
.empty h2 { margin-bottom: var(--s2); }
.empty p { color: var(--ink-3); font-size: .92rem; max-width: 34ch; margin: 0 auto var(--s5); }

.skeleton { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s5); margin-bottom: var(--s3); }
.sk-line { height: 12px; border-radius: var(--r-full); margin-bottom: var(--s3);
  background: linear-gradient(90deg, var(--idle-100) 25%, #F5F7F6 37%, var(--idle-100) 63%);
  background-size: 400% 100%; animation: shimmer 1.3s ease infinite; }
.sk-line:last-child { margin-bottom: 0; }
.sk-line.w40 { width: 40%; } .sk-line.w60 { width: 60%; } .sk-line.w80 { width: 80%; }
@keyframes shimmer { from { background-position: 100% 50%; } to { background-position: 0 50%; } }

/* --------------------------- Auth / config ------------------------ */
.center-screen {
  min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: calc(var(--s5) + var(--safe-t)) var(--s4) calc(var(--s5) + var(--safe-b));
}
.auth-card { width: 100%; max-width: 400px; padding: var(--s6); }
.auth-card h1 { margin-bottom: var(--s1); }

/* Graphique en barres (statistiques par thème) */
.hbar { margin-bottom: var(--s4); }
.hbar:last-child { margin-bottom: 0; }
.hbar .top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); margin-bottom: var(--s2); font-size: .9rem; }
.hbar .top b { font-family: var(--font-mono); font-size: .85rem; }
.hbar .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s4); font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ============================ RESPONSIVE ========================== */

/* Petits écrans (iPhone SE, 375px) */
@media (max-width: 380px) {
  .stat .value { font-size: 1.5rem; }
  .hero { flex-direction: column; align-items: flex-start; gap: var(--s4); }
  .btn { padding: 0 var(--s4); }
}

/* Tablette */
@media (min-width: 640px) {
  .grid-2 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .main { padding: var(--s6); }
  h1 { font-size: 1.75rem; }
}

/* Desktop : barre latérale, plus de navigation basse */
@media (min-width: 900px) {
  .shell { display: flex; padding-bottom: 0; }
  .bottomnav { display: none; }
  .sidebar {
    display: flex; flex-direction: column; gap: 2px;
    width: 232px; flex-shrink: 0; min-height: 100dvh;
    padding: var(--s6) var(--s4);

<script>
// =====================================================================
// PARSERS — extraction locale, sans aucune IA ni API payante.
// Chaque parseur retourne un tableau d'objets "ParsedQuestion" :
// {
//   question_number, question_text, question_type,
//   options: [{key:'A', text:'...', is_correct:bool}, ...],
//   official_correction, explanation, theme,
//   needs_review: bool, review_reason: string
// }
// Règle d'or : ne jamais inventer. Si une donnée est incertaine,
// needs_review = true et le champ manquant reste vide.
// =====================================================================

const EDNParsers = (() => {

  const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];

  // PostgreSQL refuse les caractères nuls et les séquences Unicode invalides.
  // Les polices CID de certains PDF en produisent lorsqu'un glyphe n'a pas
  // d'équivalent Unicode : on les retire dès l'extraction.
  function sanitize(str) {
    return String(str == null ? '' : str)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
      .replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, '')
      .replace(/(^|[^\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '$1');
  }

  function emptyQuestion(num) {
    return {
      question_number: num ?? null,
      question_text: '',
      question_type: 'qcm',
      options: [],
      student_initial_answer: '',
      official_correction: '',
      explanation: '',
      theme: '',
      needs_review: false,
      review_reason: ''
    };
  }

  function flagReview(q, reason) {
    q.needs_review = true;
    q.review_reason = q.review_reason ? q.review_reason + ' ; ' + reason : reason;
    return q;
  }

  // =============================================================
  // 1. CSV / XLSX — gabarit de colonnes
  // =============================================================
  const COLUMN_ALIASES = {
    numero: ['numero', 'numéro', 'num', 'n', 'question_number'],
    question: ['question', 'enonce', 'énoncé', 'question_text'],
    type: ['type', 'question_type'],
    theme: ['theme', 'thème', 'item'],
    reponse_correcte: ['reponse_correcte', 'réponse correcte', 'reponses_correctes',
      'bonne_reponse', 'bonnes_reponses', 'correct_answer', 'correct_answers'],
    reponse_etudiant: ['reponse_etudiant', 'réponse étudiant', 'ma_reponse', 'student_answer'],
    correction: ['correction', 'official_correction'],
    explication: ['explication', 'explanation']
  };

  function normalizeHeader(h) {
    return String(h || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function matchColumn(headers, aliases) {
    const normalized = headers.map(normalizeHeader);
    for (const alias of aliases) {
      const idx = normalized.indexOf(normalizeHeader(alias));
      if (idx !== -1) return headers[idx];
    }
    return null;
  }

  function rowsToQuestions(rows) {
    if (!rows.length) return [];
    const headers = Object.keys(rows[0]);
    const col = {};
    for (const key in COLUMN_ALIASES) col[key] = matchColumn(headers, COLUMN_ALIASES[key]);

    const optionCols = {};
    LETTERS.forEach(L => {
      optionCols[L] = matchColumn(headers, [`option_${L.toLowerCase()}`, `proposition_${L.toLowerCase()}`, `option ${L.toLowerCase()}`]);
    });

    return rows.map((row, i) => {
      const q = emptyQuestion(col.numero ? row[col.numero] : i + 1);
      q.question_text = col.question ? String(row[col.question] ?? '').trim() : '';
      if (!q.question_text) flagReview(q, 'énoncé manquant');
      if (col.type) q.question_type = String(row[col.type] || 'qcm').trim().toLowerCase();
      if (col.theme) q.theme = String(row[col.theme] || '').trim();
      if (col.reponse_etudiant) q.student_initial_answer = String(row[col.reponse_etudiant] || '').trim();
      if (col.correction) q.official_correction = String(row[col.correction] || '').trim();
      if (col.explication) q.explanation = String(row[col.explication] || '').trim();

      const correctRaw = col.reponse_correcte ? String(row[col.reponse_correcte] || '').toUpperCase() : '';
      const correctLetters = correctRaw.split(/[,;\/\s]+/).filter(Boolean);
      if (!correctLetters.length) flagReview(q, 'bonne réponse non identifiée');

      let hasAnyOption = false;
      LETTERS.forEach(L => {
        const c = optionCols[L];
        if (c && row[c] !== undefined && String(row[c]).trim() !== '') {
          hasAnyOption = true;
          q.options.push({ key: L, text: String(row[c]).trim(), is_correct: correctLetters.includes(L) });
        }
      });
      if (!hasAnyOption) flagReview(q, 'aucune proposition détectée');
      if (q.options.length > 1) q.question_type = correctLetters.length > 1 ? 'qrm' : 'qru';
      return q;
    });
  }

  async function parseCSV(file) {
    return new Promise((resolve, reject) => {
      Papa.parse(file, {
        header: true, skipEmptyLines: true,
        complete: (res) => resolve(rowsToQuestions(res.data)),
        error: reject
      });
    });
  }

  async function parseXLSX(file) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
    return rowsToQuestions(rows);
  }

  // =============================================================
  // 2. FORMAT "CORRIGÉ EDN" (export type EDNp / UNESS)
  //    Reconnu par : "Element d'épreuve:" et "Question N: (Type: XXX)"
  //    Statuts : Valide / Indispensable = bonne réponse
  //              Faux / Inacceptable    = mauvaise réponse
  // =============================================================
  const SINGLE_TYPES = ['QRU', 'QTCS'];
  const OPEN_TYPES = ['QROC'];

  function looksLikeEDNCorrige(text) {
    return /Question\s+\d+\s*:\s*\(\s*Type\s*:/i.test(text) &&
           /(Element d'épreuve|Valide|Faux)/i.test(text);
  }

  function stripFooters(raw) {
    let t = raw.replace(/\r/g, '');
    t = t.replace(/Référence\s*:\s*[^\n]*/gi, '\n');
    t = t.replace(/Date de création\s*:?/gi, '\n');
    t = t.replace(/\d{4}-\d{2}-\d{2}-\d{2}:\d{2}:\d{2}/g, '\n');
    t = t.replace(/Version\s*:\s*\d+\s*/gi, '\n');
    t = t.replace(/Page\s*:\s*\d+\s*\/\s*\d+/gi, '\n');
    return t;
  }

  const RE_SECTION = /^Element d'épreuve\s*:\s*(\S+)/i;
  const RE_QSTART = /^Question\s+(\d+)\s*:\s*\(\s*Type\s*:\s*([A-Za-z]+)\s*\)\s*(.*)$/i;
  const RE_OPT_FULL = /^[☐◎□○●■\s]*(Valide|Faux|Indispensable|Inacceptable)\s+([A-J])\s*[.)]\s*(.*)$/i;
  const RE_OPT_STATUS = /^[☐◎□○●■\s]*(Valide|Faux|Indispensable|Inacceptable)\s*$/i;
  const RE_OPT_LETTER = /^([A-J])\s*[.)]\s*(.*)$/;
  const RE_ANSWERS_HEADER = /^R[ée]ponses?\s+valides?\s*:/i;
  const RE_ZONE_ALL = /Zone\s*(\d+)\s*:\s*(Valide|Faux)\s*(?:\d+(?:[.,]\d+)?)?/gi;
  const RE_ZONE_HEADER = /^(Marqueurs|Statut|Pondération)(\s|$)/i;
  const RE_ANSWER_ITEM = /^[•\-\*\s]*(.+?)\s*\(\s*(\d+(?:[.,]\d+)?)\s*\)\s*$/;
  const RE_FOOTER_LINE = /^(Référence\s*:|Date de création|Version\s*:|Page\s*:|Epreuve\s*:|\d{4}-\d{2}-\d{2}-\d{2}:\d{2}:\d{2})/i;
  const RE_NOISE = /^([☐◎□○●■]|\(|\)|ème|eme|ère|ere|er|re|e|\d{1,2}|Marqueurs|Statut|Pondération|Zone \d+\s*:\s*\w+)$/i;

  function isCorrectStatus(s) {
    const v = s.toLowerCase();
    return v === 'valide' || v === 'indispensable';
  }

  function parseEDNCorrige(rawText) {
    const lines = stripFooters(rawText).split('\n').map(l => l.trim()).filter(l => l.length);

    const questions = [];
    let section = '';
    let sectionIntro = [];
    let cur = null;
    let mode = 'intro';
    let pendingStatus = null;
    let inComment = false;

    function finalizeQuestion(c) {
      const q = c.q;
      q.question_text = c.enonce.join(' ').replace(/\s+/g, ' ').trim();
      if (c.intro && c.intro.length) {
        q.question_text = '[Contexte ' + c.section + '] ' +
          c.intro.join(' ').replace(/\s+/g, ' ').trim() + '\n\n' + q.question_text;
      }
      q.explanation = c.explanation.join(' ').replace(/\s+/g, ' ').trim();
      q.options.forEach(o => { o.text = o.text.replace(/\s+/g, ' ').trim(); });
      q.options = q.options.filter(o => o.text.length);

      const type = c.rawType.toUpperCase();
      if (OPEN_TYPES.includes(type)) {
        q.question_type = 'qroc';
        q.options = c.answers.map((a, i) => ({ key: 'R' + (i + 1), text: a, is_correct: true }));
        if (!q.options.length) flagReview(q, 'aucune réponse attendue trouvée');
      } else if (SINGLE_TYPES.includes(type)) {
        q.question_type = 'qru';
      } else if (type === 'QZONE') {
        q.question_type = 'qzone';
        if (c.zones && c.zones.length) {
          q.official_correction = 'Zones attendues sur l\'image — ' +
            c.zones.map(z => 'Zone ' + z.num + (z.label ? ' : ' + z.label : '')).join(' ; ');
        }
      } else {
        q.question_type = 'qrm';
      }

      if (!q.question_text) flagReview(q, 'énoncé non identifié');
      if (q.question_type === 'qru' || q.question_type === 'qrm') {
        if (!q.options.length) flagReview(q, 'aucune proposition détectée');
        else if (!q.options.some(o => o.is_correct)) flagReview(q, 'aucune bonne réponse identifiée');
      }
      // Une question n'est signalée que si une IMAGE est réellement affichée
      // dans le document (PDF.js n'extrait que le texte).
      const IMG_WORD = '\\b(radiographies?|scanner|IRM|[ée]chographie|frottis|photographies?|clich[ée]s?|images?|iconographie|TDM)\\b';
      const IMG_CUE = '\\b(suivante?s?|ci-joint|ci-dessous|ci-contre|r[ée]alis[ée]|voici)\\b';
      const displayed =
        new RegExp(IMG_WORD + '[^.]{0,80}' + IMG_CUE, 'i').test(q.question_text) ||
        new RegExp(IMG_CUE + '[^.]{0,40}' + IMG_WORD, 'i').test(q.question_text) ||
        /\b(cette|ce)\s+(anomalie|image|l[ée]sion|clich[ée]|photographie)\b/i.test(q.question_text) ||
        q.options.some(o => /proposition illustrée par une image/i.test(o.text));
      if (q.question_type !== 'qzone' && displayed) {
        flagReview(q, 'une image accompagne cette question : vérifiez qu\'elle reste compréhensible sans');
      }
      q.theme = c.section || '';
    }

    function pushCurrent() {
      if (!cur) return;
      finalizeQuestion(cur);
      questions.push(cur.q);
      cur = null;
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      if (line === '(') { inComment = true; continue; }
      if (line === ')') { inComment = false; continue; }
      if (inComment) { if (cur) cur.explanation.push(line); continue; }

      const mSec = line.match(RE_SECTION);
      if (mSec) {
        pushCurrent();
        section = mSec[1];
        sectionIntro = [];
        mode = 'intro';
        continue;
      }

      const mQ = line.match(RE_QSTART);
      if (mQ) {
        pushCurrent();
        const q = emptyQuestion(questions.length + 1);
        cur = {
          q, rawType: mQ[2], section,
          // le contexte de section (vignette de dossier, article de LCA,
          // situation de TCS) est rappelé au-dessus de chaque question
          intro: sectionIntro.slice(),
          enonce: [], explanation: [], answers: [], zones: [],
          inZoneTable: false, pendingZoneLabel: ''
        };
        const tail = (mQ[3] || '').trim();
        if (tail && !/^(0\/1|Non corrigé|\d+([.,]\d+)?\/\d+)$/i.test(tail)) cur.enonce.push(tail);
        mode = 'enonce';
        pendingStatus = null;
        continue;
      }

      if (RE_ANSWERS_HEADER.test(line)) { mode = 'answers'; continue; }

      if (!cur) {
        if (mode === 'intro' && !RE_NOISE.test(line)) sectionIntro.push(line);
        continue;
      }

      const mOpt = line.match(RE_OPT_FULL);
      if (mOpt) {
        cur.q.options.push({ key: mOpt[2].toUpperCase(), text: mOpt[3] || '', is_correct: isCorrectStatus(mOpt[1]) });
        mode = 'options';
        pendingStatus = null;
        continue;
      }

      const mStatus = line.match(RE_OPT_STATUS);
      if (mStatus) { pendingStatus = mStatus[1]; continue; }
      if (pendingStatus) {
        const mLetter = line.match(RE_OPT_LETTER);
        if (mLetter) {
          cur.q.options.push({
            key: mLetter[1].toUpperCase(),
            text: (mLetter[2] || '(proposition illustrée par une image)').trim(),
            is_correct: isCorrectStatus(pendingStatus)
          });
          mode = 'options';
          pendingStatus = null;
          continue;
        }
        pendingStatus = null;
      }

      if (mode === 'answers') {
        const mAns = line.match(RE_ANSWER_ITEM);
        if (mAns) {
          if (parseFloat(mAns[2].replace(',', '.')) > 0) cur.answers.push(mAns[1].trim());
          continue;
        }
        mode = 'explanation';
        cur.explanation.push(line);
        continue;
      }

      // question à zones : le tableau de marqueurs décrit les bonnes réponses.
      // Le libellé de la zone est imprimé juste avant (ou après) sa ligne "Zone N".
      if (RE_ZONE_HEADER.test(line)) { cur.inZoneTable = true; continue; }
      // une même ligne peut contenir plusieurs zones, chacune suivie de son
      // libellé : "Zone 2: Valide 1 lésion osteo chondrale ◎ Zone 1: Valide 1 …"
      RE_ZONE_ALL.lastIndex = 0;
      const zoneMatches = [];
      let mz;
      while ((mz = RE_ZONE_ALL.exec(line)) !== null) {
        zoneMatches.push({ num: mz[1], status: mz[2], start: mz.index, end: mz.index + mz[0].length });
      }
      if (zoneMatches.length) {
        cur.inZoneTable = true;
        zoneMatches.forEach((z, zi) => {
          if (!/valide/i.test(z.status)) return;
          const stop = zi + 1 < zoneMatches.length ? zoneMatches[zi + 1].start : line.length;
          const inline = line.slice(z.end, stop).replace(/[☐◎□○●■]/g, '').trim();
          cur.zones.push({ num: z.num, label: inline || cur.pendingZoneLabel || '' });
        });
        cur.pendingZoneLabel = '';
        continue;
      }
      // dans le tableau de zones, une ligne sans "Zone N" est le libellé
      // de la zone précédente (ou de la suivante si celle-ci n'existe pas encore)
      if (cur.inZoneTable) {
        const last = cur.zones[cur.zones.length - 1];
        if (last && !last.label) last.label = line;
        else cur.pendingZoneLabel = line;
        continue;
      }

      if (RE_NOISE.test(line)) continue;

      if (mode === 'enonce') {
        cur.enonce.push(line);
      } else if (mode === 'options') {
        const startsLower = /^[a-zà-ÿ(«"'\d+\-]/.test(line);
        if (startsLower && cur.q.options.length) {
          cur.q.options[cur.q.options.length - 1].text += ' ' + line;
        } else {
          mode = 'explanation';
          cur.explanation.push(line);
        }
      } else {
        cur.explanation.push(line);
      }
    }
    pushCurrent();
    return questions;
  }

  // =============================================================
  // 3. Extraction générique (documents hors format EDN)
  // =============================================================
  function heuristicParseText(rawText) {
    const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const blocks = [];
    let current = null;
    const qStart = /^(?:Question\s*)?(\d{1,4})[.)]\s*(.*)$/i;

    for (const line of lines) {
      const m = line.match(qStart);
      if (m && (!current || Number(m[1]) !== current.question_number)) {
        if (current) blocks.push(current);
        current = { question_number: Number(m[1]), lines: [m[2]] };
      } else if (current) current.lines.push(line);
    }
    if (current) blocks.push(current);

    const optionLine = /^([A-F])[.)]\s*(.*)$/;
    const correctionLine = /^(réponses?\s*correctes?|corrig[ée]|correction|bonnes?\(?s?\)?\s*réponses?)\s*[:\-]?\s*(.*)$/i;
    const explanationLine = /^(explication|commentaire|rappel)\s*[:\-]?\s*(.*)$/i;

    return blocks.map(b => {
      const q = emptyQuestion(b.question_number);
      const bodyLines = [];
      let mode = 'body';
      let correctLetters = [];
      for (const line of b.lines) {
        const optM = line.match(optionLine), corrM = line.match(correctionLine), explM = line.match(explanationLine);
        if (optM) { q.options.push({ key: optM[1].toUpperCase(), text: optM[2].trim(), is_correct: false }); mode = 'options'; }
        else if (corrM) {
          q.official_correction = (q.official_correction + ' ' + corrM[2]).trim();
          const l = corrM[2].toUpperCase().match(/[A-F]/g); if (l) correctLetters.push(...l);
          mode = 'correction';
        } else if (explM) { q.explanation = (q.explanation + ' ' + explM[2]).trim(); mode = 'explanation'; }
        else if (mode === 'body') bodyLines.push(line);
        else if (mode === 'options' && q.options.length) q.options[q.options.length - 1].text += ' ' + line;
        else if (mode === 'correction') {
          q.official_correction += ' ' + line;
          const l = line.toUpperCase().match(/[A-F]/g); if (l) correctLetters.push(...l);
        } else q.explanation += ' ' + line;
      }
      q.question_text = bodyLines.join(' ').trim();
      correctLetters = [...new Set(correctLetters)];
      q.options.forEach(o => { if (correctLetters.includes(o.key)) o.is_correct = true; });
      q.question_type = correctLetters.length > 1 ? 'qrm' : 'qru';
      if (!q.question_text) flagReview(q, 'énoncé non identifié avec certitude');
      if (!q.options.length) flagReview(q, 'aucune proposition détectée');
      if (!correctLetters.length) flagReview(q, 'bonne réponse non identifiée');
      return q;
    });
  }

  function parseText(text) {
    if (looksLikeEDNCorrige(text)) {
      const qs = parseEDNCorrige(text)
        // on écarte les blocs totalement vides (artefacts de mise en page)
        .filter(q => (q.question_text && q.question_text.trim().length > 3) ||
                     q.options.length || (q.explanation && q.explanation.length > 3));
      if (qs.length) return qs;
    }
    return heuristicParseText(text);
  }

  // =============================================================
  // 4. DOCX / PDF
  // =============================================================
  async function parseDOCX(file) {
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    const questions = parseText(result.value);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }
    return questions;
  }

  // PDF.js ne fournit pas les sauts de ligne : on reconstruit les lignes
  // à partir de la position verticale de chaque fragment de texte.
  function itemsToLines(items) {
    // 1. on ne garde que les fragments porteurs de texte
    const frags = [];
    for (const it of items) {
      if (!it.str || !it.str.length) continue;
      const x = it.transform[4];
      const y = it.transform[5];
      const h = Math.abs(it.height || it.transform[3] || 10) || 10;
      const w = it.width != null ? it.width : (it.str.length * h * 0.5);
      if (!it.str.trim()) continue;
      frags.push({ x, y, h, w, s: it.str });
    }
    if (!frags.length) return [];

    // 2. regroupement en lignes par proximité verticale (tolérance liée à la taille de police)
    frags.sort((a, b) => (b.y - a.y) || (a.x - b.x));
    const lines = [];
    let current = null;
    for (const f of frags) {
      const tol = Math.max(2, f.h * 0.5);
      if (current && Math.abs(current.y - f.y) <= tol) {
        current.items.push(f);
        current.y = (current.y * (current.items.length - 1) + f.y) / current.items.length;
      } else {
        if (current) lines.push(current);
        current = { y: f.y, items: [f] };
      }
    }
    if (current) lines.push(current);

    // 3. assemblage : PDF.js ne fournit pas toujours les espaces, on les
    //    restitue à partir de l'écart horizontal entre deux fragments.
    return lines.map(line => {
      line.items.sort((a, b) => a.x - b.x);
      let text = '';
      let prevEnd = null;
      for (const f of line.items) {
        if (prevEnd !== null) {
          const gap = f.x - prevEnd;
          const needsSpace = gap > f.h * 0.18;
          const alreadySpaced = /\s$/.test(text) || /^\s/.test(f.s);
          if (needsSpace && !alreadySpaced) text += ' ';
        }
        text += f.s;
        prevEnd = f.x + f.w;
      }
      return { y: line.y, text: sanitize(text).replace(/\s+/g, ' ').trim() };
    }).filter(l => l.text.length);
  }

  // --- Extraction des images réellement intégrées dans le PDF -------------
  // On suit la matrice de transformation courante (CTM) dans la liste
  // d'opérateurs pour connaître la position exacte de chaque image.
  function multiply(m, ctm) {
    return [
      m[0] * ctm[0] + m[1] * ctm[2],
      m[0] * ctm[1] + m[1] * ctm[3],
      m[2] * ctm[0] + m[3] * ctm[2],
      m[2] * ctm[1] + m[3] * ctm[3],
      m[4] * ctm[0] + m[5] * ctm[2] + ctm[4],
      m[4] * ctm[1] + m[5] * ctm[3] + ctm[5]
    ];
  }

  function applyMatrix(m, x, y) {
    return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
  }

  async function findPageImages(page) {
    const OPS = pdfjsLib.OPS;
    const IMAGE_OPS = new Set([
      OPS.paintImageXObject, OPS.paintJpegXObject,
      OPS.paintImageMaskXObject, OPS.paintInlineImageXObject
    ].filter(v => v !== undefined));

    let opList;
    try { opList = await page.getOperatorList(); } catch (e) { return []; }

    let ctm = [1, 0, 0, 1, 0, 0];
    const stack = [];
    const found = [];

    for (let i = 0; i < opList.fnArray.length; i++) {
      const fn = opList.fnArray[i];
      const args = opList.argsArray[i];
      if (fn === OPS.save) stack.push(ctm.slice());
      else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
      else if (fn === OPS.transform) ctm = multiply(args, ctm);
      else if (IMAGE_OPS.has(fn)) {
        // l'image occupe le carré unité transformé par la CTM
        const corners = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([x, y]) => applyMatrix(ctm, x, y));
        const xs = corners.map(c => c[0]), ys = corners.map(c => c[1]);
        const box = {
          x0: Math.min(...xs), x1: Math.max(...xs),
          y0: Math.min(...ys), y1: Math.max(...ys)
        };
        // on ignore les décorations minuscules (puces, filets…)
        if (box.x1 - box.x0 > 60 && box.y1 - box.y0 > 60) found.push(box);
      }
    }
    return found;
  }

  // Rend la page puis découpe chaque image, en JPEG compressé.
  async function cropImages(page, boxes) {
    const RENDER_SCALE = 2;
    const MAX_WIDTH = 900;
    const viewport = page.getViewport({ scale: RENDER_SCALE });
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;

    const out = [];
    for (const box of boxes) {
      const p1 = viewport.convertToViewportPoint(box.x0, box.y1);
      const p2 = viewport.convertToViewportPoint(box.x1, box.y0);
      const pad = 4;
      const sx = Math.max(0, Math.min(p1[0], p2[0]) - pad);
      const sy = Math.max(0, Math.min(p1[1], p2[1]) - pad);
      const sw = Math.min(canvas.width - sx, Math.abs(p2[0] - p1[0]) + pad * 2);
      const sh = Math.min(canvas.height - sy, Math.abs(p2[1] - p1[1]) + pad * 2);
      if (sw < 40 || sh < 40) continue;

      const ratio = Math.min(1, MAX_WIDTH / sw);
      const crop = document.createElement('canvas');
      crop.width = Math.round(sw * ratio);
      crop.height = Math.round(sh * ratio);
      const cctx = crop.getContext('2d');
      cctx.fillStyle = '#ffffff';
      cctx.fillRect(0, 0, crop.width, crop.height);
      cctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
      out.push({ box, src: crop.toDataURL('image/jpeg', 0.72) });
    }
    canvas.width = canvas.height = 0; // libère la mémoire
    return out;
  }

  async function parseDOCX(file) {
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    const questions = parseText(result.value);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }
    return questions;
  }

  async function parsePDF(file, onProgress) {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

    const allLines = [];
    const pageData = [];   // { pageNum, lines, imageBoxes }

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const lines = itemsToLines(content.items);
      const imageBoxes = await findPageImages(page);
      pageData.push({ pageNum: i, lines, imageBoxes });
      allLines.push(...lines.map(l => l.text));
      if (onProgress) onProgress(i, pdf.numPages, 'Lecture du texte');
    }

    const fullText = allLines.join('\n');
    if (!fullText.replace(/\s/g, '').length) {
      return [flagReview(emptyQuestion(1),
        'PDF scanné ou sans texte extractible : aucune extraction automatique fiable possible. ' +
        'Saisie manuelle requise, ou convertissez le fichier en PDF texte / DOCX / CSV avant import.')];
    }

    const questions = parseText(fullText);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }

    // --- rattachement des images à leur question ---------------------------
    // Une image peut être placée APRÈS la question à laquelle elle se rapporte
    // (illustration d'énoncé ou de proposition) ou AVANT (vignette d'un nouveau
    // dossier imprimée en haut de page). On lève l'ambiguïté en regardant ce
    // qui suit immédiatement l'image dans le flux du document.
    const totalImages = pageData.reduce((n, p) => n + p.imageBoxes.length, 0);
    if (totalImages) {
      const RE_TABLE_MARK = /^(Marqueurs|Statut|Pondération|Zone\s*\d+\s*:)/i;

      // 1. flux linéaire complet du document
      const stream = [];
      pageData.forEach((pd, pi) => {
        const els = [
          ...pd.lines.map(l => ({ kind: 'line', y: l.y, text: l.text, page: pi })),
          ...pd.imageBoxes.map(b => ({ kind: 'image', y: b.y1, box: b, page: pi }))
        ].sort((a, b) => b.y - a.y);
        stream.push(...els);
      });

      // 2. attribution
      const assignments = [];   // { page, box, qIndex, label }
      let qIndex = -1, lastOptionKey = null, pendingStatus = false;

      for (let i = 0; i < stream.length; i++) {
        const el = stream[i];
        if (el.kind === 'line') {
          if (RE_QSTART.test(el.text)) { qIndex++; lastOptionKey = null; pendingStatus = false; continue; }
          const mo = el.text.match(RE_OPT_FULL);
          if (mo) { lastOptionKey = mo[2].toUpperCase(); pendingStatus = false; continue; }
          if (RE_OPT_STATUS.test(el.text)) { pendingStatus = true; continue; }
          if (pendingStatus) {
            const ml = el.text.match(RE_OPT_LETTER);
            if (ml) lastOptionKey = ml[1].toUpperCase();
            pendingStatus = false;
          }
          continue;
        }

        // lecture anticipée : à quoi se rattache cette image ?
        // Elle introduit la question SUIVANTE seulement si un énoncé
        // s'intercale entre elle et l'en-tête de cette question (vignette de
        // dossier imprimée en haut de page). Si l'en-tête suit immédiatement,
        // l'image illustre encore la question courante (dernière proposition).
        let target = qIndex, label = lastOptionKey;
        let bodyBetween = 0;
        for (let j = i + 1; j < stream.length; j++) {
          const nx = stream[j];
          if (nx.kind !== 'line') continue;
          if (RE_QSTART.test(nx.text)) {
            if (bodyBetween > 0) { target = qIndex + 1; label = null; }
            break;
          }
          if (RE_OPT_FULL.test(nx.text) || RE_OPT_STATUS.test(nx.text) ||
              RE_ANSWERS_HEADER.test(nx.text) || RE_TABLE_MARK.test(nx.text)) {
            break; // l'image appartient bien à la question en cours
          }
          // texte d'énoncé intercalé (on ignore pieds de page et intitulés de section)
          if (!RE_FOOTER_LINE.test(nx.text) && !RE_SECTION.test(nx.text) &&
              !RE_NOISE.test(nx.text) && nx.text.length >= 20) bodyBetween++;
        }
        if (target >= 0 && questions[target]) {
          assignments.push({ page: el.page, box: el.box, qIndex: target, label });
        }
      }

      // 3. rendu et découpe, page par page
      let done = 0;
      const byPage = new Map();
      assignments.forEach(a => {
        if (!byPage.has(a.page)) byPage.set(a.page, []);
        byPage.get(a.page).push(a);
      });

      for (const [pageIdx, list] of byPage) {
        const page = await pdf.getPage(pageData[pageIdx].pageNum);
        const crops = await cropImages(page, list.map(a => a.box));
        crops.forEach((c, k) => {
          const target = questions[list[k].qIndex];
          if (!target) return;
          target.images = target.images || [];
          target.images.push({ src: c.src, label: list[k].label });
        });
        done += list.length;
        if (onProgress) onProgress(done, totalImages, 'Extraction des images');
      }

      // une question dont l'image a été récupérée n'est plus signalée pour ce motif
      questions.forEach(q => {
        if (q.images && q.images.length && q.review_reason) {
          q.review_reason = q.review_reason.split(' ; ')
            .filter(r => !/une image accompagne/i.test(r)).join(' ; ');
          if (!q.review_reason) q.needs_review = false;
        }
      });
    }

    return questions;
  }

  async function parseFile(file, onProgress) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'csv') return parseCSV(file);
    if (ext === 'xlsx' || ext === 'xls') return parseXLSX(file);
    if (ext === 'docx') return parseDOCX(file);
    if (ext === 'pdf') return parsePDF(file, onProgress);
    throw new Error('Format non supporté : .' + ext);
  }

  return { parseFile, parseText, parseEDNCorrige, heuristicParseText, looksLikeEDNCorrige, sanitize };
})();



</script>

<script>
// =====================================================================
// ENGINE — moteur de révision par erreurs, cycles, et statut de maîtrise.
// Algorithme (voir README section "Moteur de révision") :
//
//  Nouveau cycle N          -> toutes les questions sont éligibles
//  Réponse correcte         -> retirée de la liste d'erreurs du cycle N
//  Réponse incorrecte       -> ajoutée à la liste d'erreurs du cycle N
//  Fin de session, erreurs>0 -> prochaine session = uniquement ces erreurs
//  Fin de session, erreurs=0 -> cycle N terminé, cycle N+1 disponible
//
// Une question redevenue incorrecte après avoir été correcte réintègre
// IMMÉDIATEMENT la liste d'erreurs du cycle en cours.
// =====================================================================

const EDNEngine = (() => {

  // Récupère, pour un examen et un cycle donnés, la dernière tentative
  // de chaque question au sein de CE cycle.
  async function getLatestAttemptsForCycle(userId, examId, cycleNumber) {
    const { data, error } = await sb
      .from('attempts')
      .select('question_id, is_correct, answered_at')
      .eq('user_id', userId)
      .eq('exam_id', examId)
      .eq('cycle_number', cycleNumber)
      .order('answered_at', { ascending: true });
    if (error) throw error;

    const latest = new Map();
    for (const row of data) latest.set(row.question_id, row.is_correct); // le dernier écrase les précédents (ordre asc)
    return latest;
  }

  // Liste des questions éligibles à la PROCHAINE session pour un cycle :
  // jamais répondues dans ce cycle, ou dont la dernière réponse est fausse.
  async function getEligibleQuestions(userId, examId, cycleNumber) {
    const { data: allQuestions, error } = await sb
      .from('questions')
      .select('id')
      .eq('exam_id', examId)
      .eq('user_id', userId);
    if (error) throw error;

    const latest = await getLatestAttemptsForCycle(userId, examId, cycleNumber);
    return allQuestions
      .filter(q => !latest.has(q.id) || latest.get(q.id) === false)
      .map(q => q.id);
  }

  // Nombre d'erreurs actuelles du cycle en cours (pour affichage dashboard / "Mes erreurs")
  async function countCurrentErrors(userId, examId, cycleNumber) {
    const ids = await getEligibleQuestions(userId, examId, cycleNumber);
    // "Mes erreurs" doit refléter les questions déjà tentées au moins une fois
    // et actuellement fausses (pas les questions jamais vues du tout).
    const latest = await getLatestAttemptsForCycle(userId, examId, cycleNumber);
    return ids.filter(id => latest.has(id)).length;
  }

  function buildQuestionSet(allIds, scope, latestMap, masteryMap, count) {
    let pool = allIds;
    if (scope === 'errors') {
      pool = allIds.filter(id => latestMap.has(id) && latestMap.get(id) === false);
    } else if (scope === 'fragile') {
      pool = allIds.filter(id => (masteryMap.get(id) || {}).status === 'fragile');
    } else if (scope === 'nonmastered') {
      pool = allIds.filter(id => (masteryMap.get(id) || {}).status !== 'maitrisee');
    }
    if (count && count !== 'all' && Number(count) < pool.length) {
      pool = pool.slice(0, Number(count));
    }
    return pool;
  }

  // Statut de maîtrise — règle stricte.
  // Une question est MAÎTRISÉE uniquement si la dernière réponse donnée était
  // exacte à 100 % : toutes les bonnes propositions cochées ET aucune mauvaise.
  // (C'est déjà ce que vérifie la correction avant d'enregistrer la tentative :
  //  `is_correct` n'est vrai que sur une correspondance exacte.)
  // consecutive_correct repasse à 0 dès qu'une réponse est fausse : il vaut donc
  // > 0 si et seulement si la dernière tentative était intégralement juste.
  //   maitrisee   : dernière réponse 100 % correcte
  //   fragile     : déjà réussie par le passé, mais dernière réponse fausse
  //   a_apprendre : jamais réussie
  function computeStatus(m) {
    if (!m || m.total_attempts === 0) return 'a_apprendre';
    if (m.consecutive_correct > 0) return 'maitrisee';
    return m.total_correct > 0 ? 'fragile' : 'a_apprendre';
  }

  // Deux seules catégories pour les compteurs de l'accueil :
  // maîtrisée (dernière réponse exacte) ou à revoir (tout le reste, une fois tentée).
  const isMastered = (m) => !!m && m.total_attempts > 0 && m.consecutive_correct > 0;
  const isToReview = (m) => !!m && m.total_attempts > 0 && m.consecutive_correct === 0;

  // Enregistre une tentative + met à jour mastery. Retourne le nouveau statut.
  async function recordAttempt({ userId, examId, questionId, sessionId, cycleNumber, selectedAnswers, isCorrect, responseTime }) {
    const { error: attErr } = await sb.from('attempts').insert({
      user_id: userId, exam_id: examId, question_id: questionId, session_id: sessionId,
      cycle_number: cycleNumber, selected_answers: selectedAnswers, is_correct: isCorrect,
      response_time: responseTime || null
    });
    if (attErr) throw attErr;

    const { data: existing } = await sb.from('mastery')
      .select('*').eq('user_id', userId).eq('question_id', questionId).maybeSingle();

    const base = existing || {
      user_id: userId, question_id: questionId, exam_id: examId,
      consecutive_correct: 0, total_attempts: 0, total_correct: 0, total_incorrect: 0,
      cycles_correct_count: 0
    };
    base.total_attempts += 1;
    if (isCorrect) { base.total_correct += 1; base.consecutive_correct += 1; }
    else { base.total_incorrect += 1; base.consecutive_correct = 0; }
    base.last_attempt_at = new Date().toISOString();
    base.status = computeStatus(base);
    if (base.status === 'maitrisee' && !base.mastered_at) base.mastered_at = new Date().toISOString();
    if (base.status !== 'maitrisee') base.mastered_at = null;

    const { error: mErr } = await sb.from('mastery').upsert(base, { onConflict: 'user_id,question_id' });
    if (mErr) throw mErr;
    return base.status;
  }

  async function getMasteryMap(userId, examId) {
    const { data, error } = await sb.from('mastery').select('*').eq('user_id', userId).eq('exam_id', examId);
    if (error) throw error;
    const map = new Map();
    data.forEach(m => map.set(m.question_id, m));
    return map;
  }

  return {
    getLatestAttemptsForCycle, getEligibleQuestions, countCurrentErrors,
    buildQuestionSet, computeStatus, recordAttempt, getMasteryMap,
    isMastered, isToReview
  };
})();

</script>

<script>

// =====================================================================
const App = (() => {
  const APP_VERSION = '2026.09.22-lca2';
  let CURRENT_USER = null;
  const $app = () => document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // --- Icônes (SVG inline, aucune dépendance) ---------------------------
  const ICONS = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
    books: '<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="M17.5 5.3 21 18.2"/>',
    target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/>',
    chart: '<path d="M4 19V10"/><path d="M10 19V5"/><path d="M16 19v-6"/><path d="M21 19H3"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    logout: '<path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h9"/>',
    inbox: '<path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l2 8v6H3v-6z"/>'
  };
  const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;

  const NAV_LINKS = [
    { href: '#/dashboard', label: 'Accueil',  icon: 'home' },
    { href: '#/exams',     label: 'Mes EDN',  icon: 'books' },
    { href: '#/revise',    label: 'Réviser',  icon: 'target' },
    { href: '#/stats',     label: 'Stats',    icon: 'chart' },
    { href: '#/import',    label: 'Importer', icon: 'plus' }
  ];

  const isActive = (href) => {
    const h = location.hash || '#/dashboard';
    if (href === '#/dashboard') return h.startsWith('#/dashboard');
    if (href === '#/exams') return h.startsWith('#/exams') || /^#\/exam\/[^/]+\/(train|exam-mode)/.test(h);
    if (href === '#/revise') return h.startsWith('#/revise') || /mistakes/.test(h);
    if (href === '#/stats') return h.startsWith('#/stats') || /\/stats/.test(h);
    return h.startsWith(href);
  };

  function sidebarHtml() {
    return `<nav class="sidebar" aria-label="Navigation principale">
      <div class="brand">EDN<span>·</span>Trainer</div>
      ${NAV_LINKS.map(l => `<a href="${l.href}" class="${isActive(l.href) ? 'active' : ''}">
        ${icon(l.icon)}<span>${l.label}</span></a>`).join('')}
      <a href="#" id="logout-link" style="margin-top:auto;color:var(--ink-3)">${icon('logout')}<span>Se déconnecter</span></a>
      <div class="small" style="padding:8px 12px;">Version ${APP_VERSION}</div>
    </nav>`;
  }

  function bottomNavHtml() {
    return `<nav class="bottomnav" aria-label="Navigation principale">
      ${NAV_LINKS.map(l => `<a href="${l.href}" class="${isActive(l.href) ? 'active' : ''}"
        aria-current="${isActive(l.href) ? 'page' : 'false'}">
        ${icon(l.icon)}<span>${l.label}</span></a>`).join('')}
    </nav>`;
  }

  // Zoom plein écran au clic sur une illustration
  document.addEventListener('click', (e) => {
    if (e.target && e.target.classList && e.target.classList.contains('q-image')) {
      const overlay = document.createElement('div');
      overlay.className = 'image-zoom';
      overlay.innerHTML = `<img src="${e.target.src}" alt="Illustration agrandie" />`;
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    }
  });

  // innerHtml = contenu de la page. topTitle = titre affiché dans la barre
  // supérieure sur mobile (la barre latérale prend le relais sur desktop).
  function shell(innerHtml, topTitle) {
    $app().innerHTML = `
      <div class="shell">
        ${sidebarHtml()}
        <div style="flex:1;min-width:0;">
          <header class="topbar">
            <div class="brand">${topTitle ? esc(topTitle) : 'EDN<span>·</span>Trainer'}</div>
            <button class="btn btn-ghost btn-sm" id="logout-link-m" aria-label="Se déconnecter">${icon('logout')}</button>
          </header>
          <main class="main">${innerHtml}</main>
        </div>
      </div>
      ${bottomNavHtml()}`;

    const logout = async (e) => { e.preventDefault(); await sb.auth.signOut(); route(); };
    const lo = document.getElementById('logout-link');
    if (lo) lo.onclick = logout;
    const lom = document.getElementById('logout-link-m');
    if (lom) lom.onclick = logout;

    // ombre de la barre supérieure au défilement
    const bar = document.querySelector('.topbar');
    if (bar) {
      const onScroll = () => bar.classList.toggle('scrolled', window.scrollY > 4);
      window.removeEventListener('scroll', window.__ednScroll || (() => {}));
      window.__ednScroll = onScroll;
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    }
  }

  // Squelette de chargement (jamais d'écran vide)
  function skeleton(rows = 3) {
    return Array.from({ length: rows }, () => `
      <div class="skeleton"><div class="sk-line w40"></div><div class="sk-line w80"></div><div class="sk-line w60"></div></div>`).join('');
  }

  // Anneau de progression en SVG
  function ring(percent, size = 92, stroke = 9, color = '#fff', track = 'rgba(255,255,255,.28)') {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const off = c * (1 - Math.max(0, Math.min(100, percent)) / 100);
    return `<div class="ring" style="width:${size}px;height:${size}px;">
      <svg width="${size}" height="${size}" aria-hidden="true">
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
          style="transition:stroke-dashoffset .6s ease"/>
      </svg>
      <div class="ring-label">${Math.round(percent)}%</div>
    </div>`;
  }

  function emptyState(title, text, ctaHref, ctaLabel, iconName = 'inbox') {
    return `<div class="empty">
      <div class="icon">${icon(iconName)}</div>
      <h2>${esc(title)}</h2>
      <p>${esc(text)}</p>
      ${ctaHref ? `<a class="btn btn-primary btn-lg" href="${ctaHref}">${esc(ctaLabel)}</a>` : ''}
    </div>`;
  }

  async function renderDashboard() {
    shell(skeleton(3), 'Accueil');
    const { data: exams } = await sb.from('exams').select('*').eq('user_id', CURRENT_USER.id).order('created_at');
    let totalQ = 0, totalMastered = 0, totalErrors = 0;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const examCards = [];

    let totalReview = 0;
    for (const ex of (exams || [])) {
      const masteryMap = await EDNEngine.getMasteryMap(CURRENT_USER.id, ex.id);
      // maîtrisée = dernière réponse exacte à 100 % ; à revoir = déjà tentée et
      // dernière réponse imparfaite. Mêmes chiffres que les listes cliquables.
      let mastered = 0, review = 0;
      masteryMap.forEach(m => {
        if (EDNEngine.isMastered(m)) mastered++;
        else if (EDNEngine.isToReview(m)) review++;
      });
      const errors = await EDNEngine.countCurrentErrors(CURRENT_USER.id, ex.id, ex.current_cycle);
      totalQ += ex.total_questions; totalMastered += mastered;
      totalReview += review; totalErrors += errors;
      const pct = ex.total_questions ? Math.round((mastered / ex.total_questions) * 100) : 0;
      examCards.push({ ex, pct, errors });

    const { data: todayAttempts } = await sb.from('attempts').select('id')
      .eq('user_id', CURRENT_USER.id).gte('answered_at', today.toISOString());
    const todayCount = (todayAttempts || []).length;

    const { data: allAttempts } = await sb.from('attempts').select('is_correct').eq('user_id', CURRENT_USER.id);
    const successRate = (allAttempts || []).length
      ? Math.round(allAttempts.filter(a => a.is_correct).length / allAttempts.length * 100) : 0;

    const globalPct = totalQ ? Math.round((totalMastered / totalQ) * 100) : 0;

      ? emptyState('Votre bibliothèque est vide',

      : `

        ${ring(globalPct)}
        <div style="min-width:0;">
          <div class="hello">${hello}${name ? ', ' + esc(name) : ''}</div>
          <h1>Progression globale</h1>
          <div class="meta">${totalMastered} question${totalMastered > 1 ? 's' : ''} maîtrisée${totalMastered > 1 ? 's' : ''} sur ${totalQ}</div>
        </div>
      </section>

      <div class="grid grid-2 mb">
        <a class="card stat" href="#/list/mastered" style="display:block;"><div class="label">Maîtrisées</div>
          <div class="value">${totalMastered}<small> / ${totalQ}</small></div></a>
        <a class="card stat accent" href="#/list/review" style="display:block;"><div class="label">À revoir</div>
          <div class="value">${totalReview}</div></a>
        <div class="card stat"><div class="label">Réussite</div>
          <div class="value">${successRate}<small>%</small></div></div>
        <div class="card stat brand"><div class="label">Aujourd'hui</div>
          <div class="value">${todayCount}</div></div>
      </div>

      <div class="flex-between mb"><h2>Mes examens</h2>

          <div class="flex-between" style="align-items:flex-start;">
            <div style="min-width:0;">
              <h3>${esc(ex.name)}</h3>
              <div class="small">${ex.total_questions} questions · Cycle ${ex.current_cycle}</div>
            </div>
            <span class="badge ${errors ? 'badge-accent' : 'badge-maitrisee'}">${errors ? errors + ' à revoir' : 'à jour'}</span>

  // ---------------------------------------------------------------
  // LISTES DE QUESTIONS (maîtrisées / à revoir) ET DÉTAIL
