    const formulation = EDNColleges.buildFormulationSet(questions);
    // boucle qui rend la main toutes les 25 questions : l'écran affiche la progression
    // (même ordre, même calcul, mêmes résultats qu'auparavant)
    for (let i = 0; i < questions.length; i++) {
      const q = questions[i];
      const r = EDNColleges.matchQuestion(index, q, { formulation });
      if (r.status === 'verified' || r.status === 'high_confidence') affirmed++;
      else if (r.status === 'needs_review') review++;
      if (r.status !== 'not_found') {
        const m = r.meta || {};
        const base = { user_id: userId, question_id: q.id, college_id: college.id,
          printed_page: m.printed_page || null, item_number: m.item_number || null,
          item_title: m.item_title || null, chapter: m.chapter || null, heading: m.heading || null,
          subheading: r.subheading || null, passage: r.passage || null,
          status: r.status, score: r.score, coverage: r.answerCoverage, match_reason: r.reason };
        refs.push({ ...base, pdf_page: r.pdf_page, reference_type: 'primary' });
        (r.secondary || []).forEach(pg => {
          const sm = (index.pages.find(x => x.pdf_page === pg)) || {};
          refs.push({ ...base, pdf_page: pg, reference_type: 'secondary', passage: null, subheading: null,
            printed_page: sm.printed_page || null, heading: sm.heading || null });
        });
      }
      if (i % 25 === 0) {
        progress({ stage: 'matching', done: i + 1, total: questions.length });
        await new Promise(res => setTimeout(res, 0));
      }
    }

    // remplacement des références AUTOMATIQUES de ce Collège (idempotent).
    // Les références relues à la main (reference_type 'reviewed') sont conservées,
    // et aucune référence automatique n'est créée sur une page déjà relue.
    must(await sb.from('question_references').delete().eq('user_id', userId).eq('college_id', college.id)
      .neq('reference_type', 'reviewed'));
    const reviewedKeys = new Set();
    for (let from = 0; ; from += 1000) {
      const data = must(await sb.from('question_references').select('question_id, pdf_page')
        .eq('user_id', userId).eq('college_id', college.id).eq('reference_type', 'reviewed').range(from, from + 999));
      data.forEach(r => reviewedKeys.add(r.question_id + '|' + r.pdf_page));
      if (data.length < 1000) break;
    }
    for (let i = refs.length - 1; i >= 0; i--) if (reviewedKeys.has(refs[i].question_id + '|' + refs[i].pdf_page)) refs.splice(i, 1);
    for (let i = 0; i < refs.length; i += 200) {
      if (ctx.stopped()) return false;
      must(await sb.from('question_references').insert(refs.slice(i, i + 200)));
      progress({ stage: 'verifying', done: Math.min(i + 200, refs.length), total: refs.length });
    }
    college.refs_verified = affirmed; college.refs_candidate = review;
    must(await sb.from('colleges').update({
      refs_verified: affirmed, refs_candidate: review, status: 'verifying', updated_at: new Date().toISOString()
    }).eq('id', college.id));
    return true;
  }

  // ---------- ÉTAPE 4 : aperçus des pages référencées (pas des 800 pages) ----------
  async function renderPreview(pdf, pdfPage) {
    const page = await pdf.getPage(pdfPage);
    const base = page.getViewport({ scale: 1 });
    const canvas = await renderToCanvas(page, Math.min(2, 900 / base.width));
    const url = canvas.toDataURL('image/jpeg', 0.72);
    canvas.width = canvas.height = 0;
    page.cleanup && page.cleanup();
    return url;
  }

  async function stagePreviews(ctx) {
    const { sb, userId, college, pdf, progress } = ctx;
    const refs = must(await sb.from('question_references').select('pdf_page')
      .eq('college_id', college.id).eq('reference_type', 'primary').in('status', ['verified', 'high_confidence', 'needs_review', 'candidate']));
    const wanted = [...new Set(refs.map(r => r.pdf_page))];
    const have = new Set((must(await sb.from('college_page_images').select('pdf_page')
      .eq('college_id', college.id)) || []).map(r => r.pdf_page));
    const todo = wanted.filter(p => !have.has(p));
    for (let i = 0; i < todo.length; i++) {
      if (ctx.stopped()) return false;
      try {
        const image = await renderPreview(pdf, todo[i]);
        must(await sb.from('college_page_images').upsert(
          { user_id: userId, college_id: college.id, pdf_page: todo[i], image },
          { onConflict: 'college_id,pdf_page' }));
      } catch (e) { /* aperçu manquant : il sera généré à l'affichage si le PDF est disponible */ }
      progress({ stage: 'previews', done: i + 1, total: todo.length });
    }
    return true;
  }

  // ---------- consolidation multi-Collèges ----------
  // Pour chaque question : meilleur niveau atteint tous Collèges confondus, et
  // item EDN avec sa SOURCE. L'item n'est jamais déduit d'une page seule :
  //   1. "Item N" écrit dans la question ou le corrigé          -> source "corrige"
  //   2. item de la page d'une référence VERIFIED/HIGH, et seulement si le
  //      référentiel de ce Collège traite bien cet item d'après la liste
  //      officielle                                              -> source "reference"
  //   3. sinon                                                   -> item non établi
  function decideItem(q, refs, colleges) {
    const txt = [q.question_text, q.explanation, q.official_correction].join(' ');
    const explicit = [...txt.matchAll(/\bitem\s*(\d{1,3})\b/gi)].map(m => +m[1]).filter(n => n >= 1 && n <= 367);
    if (explicit.length) return { item_number: explicit[0], item_source: 'corrige', item_confidence: 'verified' };
    const R = EDNColleges.STATUS_RANK;
    const strong = refs.filter(r => (r.reference_type === 'primary' || r.reference_type === 'reviewed') && R[r.status] >= 3 && r.item_number)
      .filter(r => {
        const c = colleges.get(r.college_id);
        const it = typeof EDN_ITEMS !== 'undefined' ? EDN_ITEMS.items[r.item_number - 1] : null;
        return c && c.referentiel && it && it.r.includes(c.referentiel);
      })
      .sort((a, b) => (R[b.status] - R[a.status]) || (Number(b.coverage) - Number(a.coverage)));
    if (!strong.length) return { item_number: null, item_source: null, item_confidence: null };
    const agree = strong.every(r => r.item_number === strong[0].item_number);
    return { item_number: strong[0].item_number, item_source: 'reference',
             item_confidence: agree ? 'high_confidence' : 'needs_review' };
  }

  // Références utilisables : une page relue et jugée fausse ('invalid') annule
  // la référence automatique identique ; une page relue passe devant.
  function usableRefs(refs) {
    const invalid = new Set(refs.filter(r => r.reference_type === 'reviewed' && r.status === 'invalid')
      .map(r => r.college_id + '|' + r.pdf_page));
    return refs.filter(r => r.status !== 'invalid' && !(r.reference_type !== 'reviewed' && invalid.has(r.college_id + '|' + r.pdf_page)));
  }

  async function consolidate({ sb, userId, onProgress }) {
    const progress = onProgress || (() => {});
    const colleges = new Map((must(await sb.from('colleges').select('id, referentiel').eq('user_id', userId)) || []).map(c => [c.id, c]));
    const questions = [];
    for (let from = 0; ; from += 500) {
      const data = must(await sb.from('questions').select('id, question_text, explanation, official_correction')
        .eq('user_id', userId).order('id').range(from, from + 499));
      questions.push(...data); if (data.length < 500) break;
    }
    const refsByQ = new Map();
    for (let from = 0; ; from += 1000) {
      const data = must(await sb.from('question_references')
        .select('question_id, college_id, status, coverage, item_number, reference_type')
        .eq('user_id', userId).range(from, from + 999));
      data.forEach(r => { if (!refsByQ.has(r.question_id)) refsByQ.set(r.question_id, []); refsByQ.get(r.question_id).push(r); });
      if (data.length < 1000) break;
    }
    const R = EDNColleges.STATUS_RANK;
    const rows = questions.map(q => {
      const refs = usableRefs(refsByQ.get(q.id) || []);
      const best = refs.filter(r => r.reference_type === 'primary' || r.reference_type === 'reviewed')
        .sort((a, b) => (R[b.status] - R[a.status]) || (Number(b.coverage) - Number(a.coverage)))[0];
      return { user_id: userId, question_id: q.id,
        best_status: best ? (best.status === 'candidate' ? 'needs_review' : best.status) : 'not_found',
        best_coverage: best ? Number(best.coverage) || 0 : 0,
        checked_at: new Date().toISOString(), ...decideItem(q, refs, colleges) };
    });
    for (let i = 0; i < rows.length; i += 500) {
      must(await sb.from('question_reference_status').upsert(rows.slice(i, i + 500), { onConflict: 'user_id,question_id' }));
      progress({ stage: 'consolidation', done: Math.min(i + 500, rows.length), total: rows.length });
    }
    return rows;
  }

  // ---------- orchestration ----------
  // Règle de reprise : l'extraction reprend à la première page non enregistrée ;
  // les étapes suivantes, idempotentes et rapides, sont rejouées intégralement.
  async function run({ sb, userId, college, file, onProgress, shouldStop }) {
    const ctx = { sb, userId, college, progress: onProgress || (() => {}), stopped: shouldStop || (() => false) };
    try {
      const needPdfForText = (college.pages_done || 0) < college.page_count;
      try { ctx.pdf = await openPdf(sb, college, file); }
      catch (e) { if (needPdfForText) throw e; ctx.pdf = null; }
      if (ctx.pdf && ctx.pdf.numPages !== college.page_count) {
        throw new Error('ce n\'est pas le même PDF (nombre de pages différent)');
      }
      if (needPdfForText && !(await stageExtract(ctx))) return 'paused';
      if (!(await stageStructure(ctx))) return 'paused';
      if (!(await stageMatch(ctx))) return 'paused';
      if (ctx.pdf && !(await stagePreviews(ctx))) return 'paused';
      // comparaison avec TOUS les autres Collèges + item de chaque question
      await consolidate({ sb, userId, onProgress: ctx.progress });
      must(await sb.from('colleges').update({ status: 'done', last_error: null, updated_at: new Date().toISOString() })
        .eq('id', college.id));
      college.status = 'done';
      return 'done';
    } catch (e) {
      await releaseOcr();
      const msg = e.code === 'PDF_INDISPONIBLE'
        ? 'PDF introuvable sur cet appareil : resélectionnez le fichier pour reprendre'
        : (e.message || String(e));
      try { await sb.from('colleges').update({ status: 'incomplete', last_error: msg.slice(0, 500) }).eq('id', college.id); } catch (_) {}
      college.status = 'incomplete'; college.last_error = msg;
      throw Object.assign(new Error(msg), { code: e.code });
    }
  }

  // Réévaluation complète (nouveaux QCM, nouveau Collège, nouveau moteur) :
  // chaque Collège est ré-analysé depuis son texte en base, puis consolidé.
  async function rematchAll({ sb, userId, onProgress }) {
    const colleges = must(await sb.from('colleges').select('*').eq('user_id', userId).eq('status', 'done'));
    for (let i = 0; i < colleges.length; i++) {
      const c = colleges[i];
      if (!c.referentiel) {
        let ref = detectReferentiel(c.name) || detectReferentiel(c.file_name || '');
        if (!ref) {
          const pages = await loadPages(sb, c.id, 'item_number');
          ref = detectReferentielFromItems(pages.map(p => p.item_number).filter(Boolean));
        }
        if (ref) { await sb.from('colleges').update({ referentiel: ref }).eq('id', c.id); c.referentiel = ref; }
      }
      const ctx = { sb, userId, college: c, stopped: () => false,
        progress: (p) => onProgress && onProgress({ ...p, college: c.name, index: i + 1, count: colleges.length }) };
      await stageMatch(ctx);
      must(await sb.from('colleges').update({ status: 'done' }).eq('id', c.id));
    }
    await consolidate({ sb, userId, onProgress });
    return colleges.length;
  }

  // Correspondance d'UN Collège, réutilisable comme étape indépendante et reprenable.
  // Idempotente : elle remplace les références automatiques de ce Collège (les relues restent).
  async function matchCollege({ sb, userId, college, onProgress, onPages }) {
    // même détection du référentiel que rematchAll, avant la correspondance
    if (!college.referentiel) {
      let ref = detectReferentiel(college.name) || detectReferentiel(college.file_name || '');
      if (!ref) {
        const pages = await loadPages(sb, college.id, 'item_number');
        ref = detectReferentielFromItems(pages.map(p => p.item_number).filter(Boolean));
      }
      if (ref) { must(await sb.from('colleges').update({ referentiel: ref }).eq('id', college.id)); college.referentiel = ref; }
    }
    const ctx = { sb, userId, college, onPages, stopped: () => false, progress: (p) => onProgress && onProgress(p) };
    await stageMatch(ctx);
    must(await sb.from('colleges').update({ status: 'done', updated_at: new Date().toISOString() }).eq('id', college.id));
  }

  return { createCollege, run, openPdf, renderPreview, rematchAll, consolidate, matchCollege, decideItem, detectReferentiel, detectReferentielFromItems, usableRefs,
           localGet, localDel, loadPages, STORAGE_LIMIT };
})();


// =====================================================================
// RÉPARATION DES QUESTIONS DÉJÀ IMPORTÉES, À PARTIR DES PDF SOURCES
// Compare la base au PDF ré-analysé avec le parseur corrigé. Les
// identifiants sont conservés (réponses, historique, statistiques intacts).
// Ne s'applique automatiquement QUE si la correction est une complétion
// sûre ; tout autre écart est signalé "à vérifier", jamais écrasé.
// =====================================================================
const EDNRepair = (() => {
  const norm = (s) => EDNColleges.normalize(s);
  const similarity = (a, b) => {
    const A = new Set(EDNColleges.tokens(a)), B = new Set(EDNColleges.tokens(b));
    if (!A.size && !B.size) return 1;
    let inter = 0; A.forEach(t => { if (B.has(t)) inter++; });
    return inter / (A.size + B.size - inter);
  };

  // dbQuestions : [{ id, position, question_text, explanation, question_options:[{id, option_key, option_text, is_correct}] }]
  // parsed      : questions extraites des PDF sources, dans le même ordre d'import
  function plan(dbQuestions, parsed) {
    const db = dbQuestions.slice().sort((a, b) => a.position - b.position);
    const report = { aligned: 0, misaligned: [], optionFixes: [], explanationFixes: [], toReview: [],
                     countDb: db.length, countSource: parsed.length };
    if (db.length !== parsed.length) {
      report.blocking = `nombre de questions différent : ${db.length} en base, ${parsed.length} dans les PDF`;
      return report;
    }
    db.forEach((q, i) => {
      const p = parsed[i];
      const sim = similarity(q.question_text, p.question_text);
      if (sim < 0.8) { report.misaligned.push({ id: q.id, position: q.position, sim: Math.round(sim * 100) / 100 }); return; }
      report.aligned++;
      const byKey = new Map((q.question_options || []).map(o => [o.option_key, o]));
      const fragments = [];   // fins de propositions retrouvées, à retirer de l'explication
      (p.options || []).forEach(po => {
        const o = byKey.get(po.key);
        if (!o) { report.toReview.push({ id: q.id, n: q.question_number, why: `proposition ${po.key} absente en base` }); return; }
        if (!!o.is_correct !== !!po.is_correct) {
          report.toReview.push({ id: q.id, n: q.question_number, why: `bonne réponse ${po.key} différente de la source` });
          return;
        }
        const a = String(o.option_text || '').trim(), b = String(po.text || '').trim();
        if (a === b) return;
        const noSpace = (x) => x.replace(/\s+/g, '');
        // correction sûre n°1 : la source PROLONGE exactement le texte en base
        if (b.startsWith(a) && b.length > a.length) {
          report.optionFixes.push({ optionId: o.id, questionId: q.id, n: q.question_number, key: po.key, before: a, after: b });
          fragments.push(b.slice(a.length).trim());
        // correction sûre n°2 : seul un espace parasite diffère ("intra-buccale s")
        } else if (noSpace(a) === noSpace(b)) {
          report.optionFixes.push({ optionId: o.id, questionId: q.id, n: q.question_number, key: po.key, before: a, after: b });
        } else report.toReview.push({ id: q.id, n: q.question_number, why: `proposition ${po.key} différente de la source` });
      });
      const sp = (x) => String(x || '').replace(/\s+/g, ' ').trim();
      const ea = sp(q.explanation), eb = sp(p.explanation);
      if (ea !== eb) {
        // correction sûre : l'explication en base = explication source + fragments
        // de propositions égarés. On vérifie qu'en retirant EXACTEMENT ces
        // fragments, on retombe mot pour mot sur la source.
        let rest = ea;
        fragments.forEach(f => { const i = rest.indexOf(sp(f)); if (i >= 0) rest = rest.slice(0, i) + rest.slice(i + sp(f).length); });
        if (fragments.length && sp(rest) === eb) {
          report.explanationFixes.push({ questionId: q.id, n: q.question_number, removed: fragments.join(' | '), after: p.explanation || '' });
        } else {
          report.toReview.push({ id: q.id, n: q.question_number, why: 'explication différente de la source' });
        }
      }
    });
    return report;
  }

  async function apply(sb, userId, report) {
    let opt = 0, expl = 0;
    for (const f of report.optionFixes) {
      const { error } = await sb.from('question_options').update({ option_text: f.after })
        .eq('id', f.optionId).eq('user_id', userId);
      if (error) throw error; opt++;
    }
    for (const f of report.explanationFixes) {
      const { error } = await sb.from('questions').update({ explanation: f.after || null })
        .eq('id', f.questionId).eq('user_id', userId);
      if (error) throw error; expl++;
    }
    return { opt, expl };
  }

  return { plan, apply, similarity };
})();



// =====================================================================
// JUSTIFICATIONS — pour chaque bonne réponse, le passage de Collège qui la justifie.
// EXTRACTIF : le texte affiché est une citation exacte du Collège, jamais une rédaction.
// Rien n'est « vérifié » automatiquement : le moteur PROPOSE (3 passages au plus par
// réponse), l'utilisatrice CONFIRME ou REJETTE. Mesuré sur 765 bonnes réponses réelles :
// sans validation humaine, la justesse plafonne autour de 80 % (d'où ce principe).
// Règles (toutes issues des erreurs relevées à la relecture) :
//  - pages de départ : références de la question (± 1 page) et pages de SON item établi ;
//  - jamais une page d'exercices, une légende d'image, une question ou une ligne de QCM ;
//  - les mots-clés de la proposition ET le sujet de la question dans la même citation ;
//  - chiffres identiques, pas de négation, mots-clés proches les uns des autres.
// =====================================================================
const EDNEvidence = (() => {
  const VERSION = 1;
  const C = EDNColleges;
  const QUIZ = /Question\s*\d+\s*[–-]\s*(QRM|QRU|QROC|QRP|QI|KFP|TCS)|(^|\s)\d{1,2}\.\s*(QRM|QRU|QROC|QRP|KFP)\b/i;
  const isExercisePage = (t) => QUIZ.test(t || '') || /Vignette clinique|Cas clinique|\bEntra[iî]nement\b/i.test(t || '');
  const notStatement = (t) => /\?/.test(t) || /(^|\s)[A-E][.)]\s*$/.test(t) || /^[A-E][.)]\s/.test(t);
  const CAPTION = /\b(fleche|fleches|figure|fig|cliche|coupe (?:axiale|sagittale|coronale|transversale)|aspect (?:radiologique|endoscopique)|photo|photographie)\b/;
  const numbersOf = (s) => (C.normalize(s).match(/\b\d+(?: \d+)?\b/g) || []).map(x => x.split(' ')).flat();

  function sentences(content) {
    const flat = String(content || '').replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ');
    return flat.split(/(?<=[.;!?])\s+(?=[A-ZÉÈÀÂÎÔÛ•■▪\-–])|\s+(?=[•■▪]\s)/).map(s => s.trim()).filter(Boolean);
    // aucun fragment n'est écarté : une citation de 2 phrases est toujours un extrait CONTINU de la page
  }
  function positions(text) {
    const out = []; C.normalize(text).split(' ').forEach((w, i) => C.tokens(w).forEach(t => out.push([t, i])));
    return out;
  }
  function span(pos, wanted, nums, text) {
    const idx = [];
    wanted.forEach(t => { const f = pos.find(([x]) => x === t); if (f) idx.push(f[1]); });
    const words = C.normalize(text).split(' ');
    nums.forEach(n => { const i = words.indexOf(n); if (i >= 0) idx.push(i); });
    return idx.length ? Math.max(...idx) - Math.min(...idx) + 1 : Infinity;
  }
  // rareté des racines dans tout le corpus (alimentée page par page, sans garder les textes)
  function newCorpus() { return { df: new Map(), n: 0 }; }
  function addToCorpus(corpus, content) {
    corpus.n++; new Set(C.tokens(content)).forEach(t => corpus.df.set(t, (corpus.df.get(t) || 0) + 1));
  }
  // question : { text, item } ; option : { key, text } ; pages : { college_id, pdf_page, item_number, content, isRef }
  function propose(corpus, question, option, pages, formulation) {
    const P = [...new Set(C.tokens(option.text))].filter(t => !formulation.has(t));
    const asked = C.splitStem(question.text).proper;
    let subjAsked = [...new Set(C.tokens(asked))].filter(t => !formulation.has(t) && !P.includes(t));
    if (!subjAsked.length) subjAsked = [...new Set(C.tokens(question.text))].filter(t => !formulation.has(t) && !P.includes(t));
    const nums = numbersOf(option.text);
    const known = subjAsked.filter(t => (corpus.df.get(t) || 0) > 0);
    const key = known.sort((a, b) => (corpus.df.get(a) || 0) - (corpus.df.get(b) || 0))[0];
    const pool = [];
    if (!P.length) return [];
    for (const pg of pages) {
      const anchored = pg.isRef || (question.item && pg.item_number === question.item);
      if (!anchored || isExercisePage(pg.content)) continue;
      const S = sentences(pg.content);
      for (let i = 0; i < S.length; i++) for (const w of [1, 2]) {
        if (i + w > S.length) continue;
        const text = S.slice(i, i + w).join(' ');
        if (text.length > 480 || text.length < 60 || CAPTION.test(C.normalize(text)) || notStatement(text)) continue;
        const wt = new Set(C.tokens(text));
        const hit = P.filter(t => wt.has(t));
        const cov = hit.length / P.length;
        if (cov < 0.6) continue;
        if (!nums.every(n => new RegExp('\\b' + n + '\\b').test(C.normalize(text)))) continue;
        if (!hit.every(t => C.presentNotNegated(text, t))) continue;
        const subjHit = subjAsked.filter(t => wt.has(t)).length;
        if (subjHit < 1) continue;
        if (span(positions(text), hit, nums, text) > Math.max(10, 4 * (hit.length + nums.length))) continue;
        const keyOk = !key || wt.has(key);
        const score = cov + Math.min(subjHit, 3) * 0.05 - (w - 1) * 0.05 + (pg.isRef ? 0.02 : 0) + (keyOk ? 0.1 : 0);
        pool.push({ score, passage: text, page: pg });
      }
    }
    const seen = new Set(), out = [];
    pool.sort((a, b) => b.score - a.score).forEach(c => {
      const k = c.page.college_id + '|' + c.page.pdf_page;
      if (!seen.has(k) && out.length < 3) { seen.add(k); out.push(c); }
    });
    return out;
  }
  // empreinte courte et stable (détection des changements)
  function hash(str) {
    let h = 5381; const s = String(str);
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  return { VERSION, propose, newCorpus, addToCorpus, sentences, isExercisePage, hash };
})();

// =====================================================================
// MISE À JOUR COMPLÈTE + RAYON X — un JOB reprenable
// Pas de serveur de calcul à 0 € : le calcul tourne dans le navigateur, mais TOUT
// l'état vit dans Supabase (analysis_runs) : étape, compteurs, points de reprise,
// erreurs, signal de vie. Principes :
//  - aucune requête ne peut attendre indéfiniment (délai max + nouvel essai des lectures) ;
//  - chaque étape est idempotente : refaite sans effet de bord après une interruption ;
//  - points de reprise par Collège (références) et par question (justifications) ;
//  - une erreur sur un Collège ou une question est notée, le reste continue ;
//  - un seul job à la fois (signal de vie < 90 s = job vivant ailleurs) ;
//  - les pages ne sont téléchargées qu'une fois : rareté des mots gardée en cache local.
// Les données d'apprentissage (réponses, sessions, statistiques) ne sont jamais touchées.
// =====================================================================
const EDNAnalysis = (() => {
  const E = EDNEvidence, C = EDNColleges;
  const ANCHOR = ['verified', 'high_confidence', 'needs_review', 'candidate'];
  const STEPS = ['Inventaire', 'Références', 'Lecture des Collèges', 'Justifications', 'Rapport'];
  const nowIso = () => new Date().toISOString();
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const breathe = () => sleep(0);
  const msgOf = (e) => (e && (e.message || e.error_description)) || String(e);
  const must = ({ data, error }) => { if (error) throw error; return data; };
  const timeoutMs = () => (typeof window !== 'undefined' && window.__EDN_TIMEOUT__) || 45000;
  // Un Collège est exploitable si toutes ses pages sont enregistrées ; « verifying » =
  // correspondance interrompue : il est repris, jamais ignoré.
  const usable = (c) => ['done', 'verifying'].includes(c.status) && (c.page_count || 0) > 0 && (c.pages_done || 0) >= (c.page_count || 0);
  const colSig = (c) => E.hash(c.id + ':' + c.file_hash + ':' + c.pages_done + ':' + c.page_count);
  const qHash = (q) => E.hash(q.question_text + '|' + (q.question_options || [])
    .map(o => o.option_key + ':' + o.option_text + ':' + !!o.is_correct).sort().join('|'));

  // ---------- client protégé : délai maximal, nouvel essai des LECTURES seulement ----------
  // Une écriture n'est jamais rejouée à l'aveugle (elle a peut-être abouti) : c'est l'étape
  // entière, idempotente, qui est retentée.
  function guard(sb, onWait) {
    async function exec(table, calls) {
      const write = calls.some(([n]) => ['insert', 'update', 'upsert', 'delete'].includes(n));
      for (let attempt = 1; ; attempt++) {
        const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
        let b = sb.from(table);
        for (const [n, a] of calls) b = b[n](...a);
        if (ctl && typeof b.abortSignal === 'function') b = b.abortSignal(ctl.signal);
        let timer;
        const limit = new Promise(r => { timer = setTimeout(() => { try { ctl && ctl.abort(); } catch (e) {}
          r({ data: null, error: { message: `pas de réponse du serveur en ${Math.round(timeoutMs() / 1000)} s (réseau lent ou appareil en veille)`, transient: true } }); }, timeoutMs()); });
        let out;
        try { out = await Promise.race([b, limit]); }
        catch (e) { out = { data: null, error: { message: msgOf(e), transient: true } }; }
        finally { clearTimeout(timer); }
        const err = out && out.error;
        const transient = err && (err.transient || /fetch|network|timeout|aborted|Load failed|50[234]|429/i.test(err.message || ''));
        if (!transient || write || attempt >= 3) return out;
        onWait && onWait(`Lecture « ${table} » : ${err.message} — nouvel essai ${attempt + 1} / 3`);
        await sleep(1500 * attempt * attempt);
      }
    }
    return { from(table) {
      const calls = [];
      const proxy = new Proxy({}, { get(_, name) {
        if (name === 'then') return (res, rej) => exec(table, calls).then(res, rej);
        return (...args) => { calls.push([name, args]); return proxy; };
      } });
      return proxy;
    } };
  }
  async function all(build) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const data = must(await build().range(from, from + 999));
      out.push(...data);
      if (data.length < 1000) break;
    }
    return out;
  }

  // ---------- cache local de la rareté des mots (par Collège, par version) ----------
  const DFCache = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res) => {
      try {
        const r = indexedDB.open('edn-analysis', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('df');
        r.onsuccess = () => res(r.result); r.onerror = () => res(null);
      } catch (e) { res(null); }
    }));
    const tx = async (mode, fn) => { const db = await open(); if (!db) return null;
      return new Promise((res) => { try { const t = db.transaction('df', mode); const r = fn(t.objectStore('df'));
        t.oncomplete = () => res(r && r.result); t.onerror = () => res(null); } catch (e) { res(null); } }); };
    return { get: (k) => tx('readonly', st => st.get(k)), set: (k, v) => tx('readwrite', st => st.put(v, k)) };
  })();
  const dfKey = (c) => 'df:' + E.VERSION + ':' + c.id + ':' + colSig(c);
  function dfOfPages(pages) {
    const one = E.newCorpus();
    pages.forEach(p => E.addToCorpus(one, p.content || ''));
    return { n: one.n, terms: [...one.df.entries()] };
  }

  let ACTIVE = null;               // job en cours dans CET onglet (l'écran peut s'y rattacher)
  const current = () => ACTIVE;

  async function runFull({ sb: rawSb, userId, onProgress }) {
    if (ACTIVE) throw new Error('une mise à jour est déjà en cours dans cet onglet');
    const job = ACTIVE = { state: { step: 0, steps: STEPS.length }, log: [], listeners: new Set(), stopAsked: false,
      startedAt: Date.now(), lastActivity: Date.now(), errors: [] };
    if (onProgress) job.listeners.add(onProgress);
    const emit = (p) => { Object.assign(job.state, p); job.lastActivity = Date.now(); job.listeners.forEach(f => { try { f(job.state, p); } catch (e) {} }); };
    const note = (m) => { const line = nowIso().slice(11, 19) + ' ' + m; job.log.push(line); if (job.log.length > 400) job.log.splice(0, job.log.length - 400); emit({ note: m }); };
    const sb = guard(rawSb, note);
    const stopped = () => job.stopAsked;
    let run = null, hb = null, hbBusy = false;
    const checkpoint = { refsDone: [], plan: null };
    const persist = (patch) => sb.from('analysis_runs').update(Object.assign({
      stage: STEPS[job.state.step - 1] || null, done: job.state.done || 0, total: job.state.total || 0,
      log: job.log, updated_at: nowIso(), report: { checkpoint, errors: job.errors, detail: job.state.label || null } }, patch || {})).eq('id', run.id);
    const finish = async (status, extra) => {
      if (hb) clearInterval(hb);
      await persist(Object.assign({ status, finished_at: nowIso() }, extra || {}));
      return Object.assign({ status, log: job.log, errors: job.errors }, extra || {});
    };
    // une étape idempotente, retentée 3 fois au plus, puis notée en erreur (le reste continue)
    async function attempt(label, fn) {
      for (let a = 1; ; a++) {
        try { return { ok: true, value: await fn() }; }
        catch (e) {
          if (a >= 3) { job.errors.push({ at: nowIso(), step: label, message: msgOf(e), attempts: a }); note(`ERREUR · ${label} · ${msgOf(e)} (après ${a} essais)`); return { ok: false }; }
          note(`${label} : ${msgOf(e)} — nouvel essai ${a + 1} / 3`); await sleep(2000 * a);
        }
      }
    }
    try {
      // ---------- 1. inventaire + verrou ----------
      emit({ step: 1, label: 'Inventaire', done: 0, total: 0 });
      const chk = await sb.from('analysis_runs').select('id').eq('user_id', userId).limit(1);
      if (chk.error) throw new Error('la migration 006 n\'est pas encore exécutée dans Supabase (' + chk.error.message + ')');
      const prev = must(await sb.from('analysis_runs').select('*').eq('user_id', userId).order('started_at', { ascending: false }).limit(10));
      const alive = prev.find(r => r.status === 'running' && Date.now() - new Date(r.updated_at).getTime() < 90000);
      if (alive) throw new Error(`une mise à jour est déjà en cours (dernière activité il y a ${Math.round((Date.now() - new Date(alive.updated_at).getTime()) / 1000)} s), sur un autre onglet ou appareil`);
      for (const r of prev.filter(r => r.status === 'running'))
        await sb.from('analysis_runs').update({ status: 'interrupted', updated_at: nowIso() }).eq('id', r.id);
      const lastDone = prev.find(r => r.status === 'done' && r.report && r.report.plan);
      const resumeFrom = prev.find(r => r.status !== 'done' && r.report && r.report.checkpoint && r.report.checkpoint.plan);
      run = must(await sb.from('analysis_runs').insert({ user_id: userId, engine_version: E.VERSION, status: 'running', stage: STEPS[0] }).select().single());
      // signal de vie : toutes les 10 s, même pendant une étape longue
      hb = setInterval(() => { if (hbBusy) return; hbBusy = true; persist().then(() => { hbBusy = false; }, () => { hbBusy = false; }); }, 10000);
      note('Mise à jour démarrée');

      const colleges = must(await sb.from('colleges').select('id, name, file_name, file_hash, page_count, pages_done, status, referentiel').eq('user_id', userId).order('name'));
      const ready = colleges.filter(usable);
      const questions = await all(() => sb.from('questions')
        .select('id, question_number, question_type, question_text, question_options(option_key, option_text, is_correct)').eq('user_id', userId).order('id'));
      const qSetSig = E.hash(questions.map(q => q.id + ':' + qHash(q)).sort().join(','));
      note(`Inventaire : ${colleges.length} Collège(s), ${ready.length} exploitable(s) ; ${questions.length} question(s)`);
      colleges.filter(c => !usable(c)).forEach(c => note(`Collège non exploitable (import incomplet) : ${c.name} — ${c.pages_done || 0} / ${c.page_count || 0} pages`));
      if (stopped()) return finish('interrupted');

      // ---------- 2. références : seulement les Collèges qui le nécessitent ----------
      emit({ step: 2, label: 'Références', done: 0, total: 0 });
      const prevCols = (lastDone && lastDone.report.plan.colleges) || {};
      const allNeeded = !lastDone || lastDone.report.plan.qset !== qSetSig;
      const toMatch = ready.filter(c => allNeeded || c.status === 'verifying' || prevCols[c.id] !== colSig(c));
      const planSig = E.hash(qSetSig + '|' + toMatch.map(colSig).sort().join(','));
      checkpoint.plan = { qset: qSetSig, colleges: Object.fromEntries(ready.map(c => [c.id, colSig(c)])), sig: planSig };
      // reprise : Collèges déjà traités par une mise à jour interrompue au même plan
      const already = new Set(resumeFrom && resumeFrom.report.checkpoint.plan.sig === planSig ? resumeFrom.report.checkpoint.refsDone || [] : []);
      checkpoint.refsDone = [...already];
      const pending = toMatch.filter(c => !already.has(c.id));
      note(`Références : ${toMatch.length} Collège(s) à traiter` + (already.size ? `, dont ${already.size} déjà faits (reprise)` : '') + (toMatch.length ? '' : ' — déjà à jour'));
      const dfFresh = new Map();      // rareté calculée pendant cette étape (pages déjà chargées)
      const failedCols = new Set();   // Collèges en échec : jamais considérés « à jour »
      let matched = 0;
      for (let i = 0; i < pending.length; i++) {
        if (stopped()) return finish('interrupted');
        const c = pending[i], pos = already.size + i + 1;
        emit({ step: 2, label: `Références · ${c.name}`, sub: `Collège ${pos} / ${toMatch.length}`, done: pos - 1, total: toMatch.length });
        const r = await attempt(`Références · ${c.name}`, () => EDNCollegePipeline.matchCollege({ sb, userId, college: c,
          onPages: (pages) => { const d = dfOfPages(pages); dfFresh.set(c.id, d); DFCache.set(dfKey(c), d); },
          onProgress: (p) => { if (p.stage === 'matching') emit({ sub: `Collège ${pos} / ${toMatch.length} · question ${p.done} / ${p.total}` }); } }));
        if (r.ok) { matched++; checkpoint.refsDone.push(c.id); note(`Références · ${c.name} : terminé (${pos} / ${toMatch.length})`); await persist(); }
        else { failedCols.add(c.id); delete checkpoint.plan.colleges[c.id]; await persist(); }
        await breathe();
      }
      if (matched || already.size) {
        emit({ step: 2, label: 'Références · consolidation', sub: 'statut et item de chaque question', done: toMatch.length, total: toMatch.length });
        await attempt('Consolidation des références', () => EDNCollegePipeline.consolidate({ sb, userId }));
        note('Références : consolidation terminée');
      }
      if (stopped()) return finish('interrupted');

      // ---------- 3. questions à (ré)analyser + lecture ciblée des Collèges ----------
      const statuses = await all(() => sb.from('question_reference_status').select('question_id, item_number, best_status').eq('user_id', userId));
      const statusBy = new Map(statuses.map(x => [x.question_id, x]));
      const allRefs = await all(() => sb.from('question_references').select('question_id, college_id, pdf_page, status, reference_type').eq('user_id', userId));
      const refsBy = new Map();
      allRefs.forEach(r => { if (!refsBy.has(r.question_id)) refsBy.set(r.question_id, []); refsBy.get(r.question_id).push(r); });
      refsBy.forEach((list, qid) => refsBy.set(qid, EDNCollegePipeline.usableRefs(list).filter(r => ANCHOR.includes(r.status))));
      const analyses = await all(() => sb.from('question_analysis').select('question_id, engine_version, corpus_sig, q_hash').eq('user_id', userId));
      const anBy = new Map(analyses.map(x => [x.question_id, x]));
      const lectureFailed = new Set();
      let corpusSig = E.hash(ready.map(colSig).sort().join('|'));
      const itemOf = (q) => (statusBy.get(q.id) || {}).item_number || null;
      const qSig = (q) => E.hash(corpusSig + '|' + (itemOf(q) || '') + '|' + (refsBy.get(q.id) || []).map(r => r.college_id + ':' + r.pdf_page).sort().join(','));
      const todo = questions.filter(q => { const x = anBy.get(q.id);
        return !x || x.engine_version !== E.VERSION || x.q_hash !== qHash(q) || x.corpus_sig !== qSig(q); });
      note(`Justifications : ${todo.length} question(s) à analyser, ${questions.length - todo.length} déjà à jour`);

      const corpus = E.newCorpus(), keep = new Map(), byItem = new Map();
      if (todo.length && ready.length) {
        const needItems = new Set(todo.map(itemOf).filter(Boolean));
        const needRef = new Set();
        todo.forEach(q => (refsBy.get(q.id) || []).forEach(r => [-1, 0, 1].forEach(d => needRef.add(r.college_id + '|' + (r.pdf_page + d)))));
        for (let i = 0; i < ready.length; i++) {
          if (stopped()) return finish('interrupted');
          const c = ready[i];
          emit({ step: 3, label: `Lecture des Collèges · ${c.name}`, sub: `Collège ${i + 1} / ${ready.length}`, done: i, total: ready.length });
          const r = await attempt(`Lecture · ${c.name}`, async () => {
            // rareté des mots : calculée à l'étape 2, ou en cache, ou (dernier recours) téléchargement complet
            let d = dfFresh.get(c.id) || await DFCache.get(dfKey(c));
            if (!d) {
              note(`Lecture complète (rareté des mots) : ${c.name}`);
              d = dfOfPages(await EDNCollegePipeline.loadPages(sb, c.id, 'content'));
              await DFCache.set(dfKey(c), d);
            }
            // puis UNIQUEMENT les pages utiles aux questions à analyser
            const meta = await EDNCollegePipeline.loadPages(sb, c.id, 'pdf_page, item_number');
            const want = meta.filter(p => needRef.has(c.id + '|' + p.pdf_page) || (p.item_number && needItems.has(p.item_number))).map(p => p.pdf_page);
            const got = [];
            for (let k = 0; k < want.length; k += 100) {
              got.push(...must(await sb.from('college_pages').select('pdf_page, printed_page, item_number, content')
                .eq('college_id', c.id).in('pdf_page', want.slice(k, k + 100))));
            }
            return { d, got };
          });
          if (!r.ok) { lectureFailed.add(c.id); continue; }
          corpus.n += r.value.d.n;
          r.value.d.terms.forEach(([t, n]) => corpus.df.set(t, (corpus.df.get(t) || 0) + n));
          r.value.got.forEach(p => {
            const pg = { college_id: c.id, pdf_page: p.pdf_page, printed_page: p.printed_page, item_number: p.item_number, content: p.content || '' };
            keep.set(c.id + '|' + p.pdf_page, pg);
            if (p.item_number && needItems.has(p.item_number)) { if (!byItem.has(p.item_number)) byItem.set(p.item_number, []); byItem.get(p.item_number).push(pg); }
          });
          await breathe();
        }
      }

      if (lectureFailed.size) {
        corpusSig = E.hash(corpusSig + '|partiel:' + [...lectureFailed].sort().join(','));
        note(`${lectureFailed.size} Collège(s) illisible(s) : les justifications seront refaites au prochain passage`);
      }
      // ---------- 4. justifications, question par question (point de reprise : question_analysis) ----------
      let n = 0;
      if (todo.length && ready.length) {
        const formulation = C.buildFormulationSet(questions.map(q => ({ question_text: q.question_text, question_options: q.question_options || [] })));
        for (const q of todo) {
          if (stopped()) return finish('interrupted', { done: n, total: todo.length });
          emit({ step: 4, label: 'Justifications des bonnes réponses', sub: `question ${n + 1} / ${todo.length}`, done: n, total: todo.length });
          const item = itemOf(q);
          const cand = new Map();
          (refsBy.get(q.id) || []).forEach(r => [-1, 0, 1].forEach(d => {
            const k = r.college_id + '|' + (r.pdf_page + d), pg = keep.get(k);
            if (pg) cand.set(k, Object.assign({}, pg, { isRef: true }));
          }));
          (byItem.get(item) || []).forEach(pg => { const k = pg.college_id + '|' + pg.pdf_page; if (!cand.has(k)) cand.set(k, pg); });
          let good = (q.question_options || []).filter(o => o.is_correct);
          if (q.question_type === 'qroc') good = good.slice(0, 1);
          const r = await attempt(`Justifications · Q${q.question_number}`, async () => {
            const existing = must(await sb.from('answer_evidence').select('option_key, college_id, pdf_page, status').eq('user_id', userId).eq('question_id', q.id));
            const locked = new Set(existing.filter(e => e.status !== 'proposed').map(e => e.option_key + '|' + e.college_id + '|' + e.pdf_page));
            const rows = []; let withP = 0;
            for (const o of good) {
              const props = E.propose(corpus, { text: q.question_text, item }, { key: o.option_key, text: o.option_text }, [...cand.values()], formulation);
              if (props.length) withP++;
              props.forEach((pr, i) => {
                if (locked.has(o.option_key + '|' + pr.page.college_id + '|' + pr.page.pdf_page)) return;
                rows.push({ user_id: userId, question_id: q.id, option_key: o.option_key, college_id: pr.page.college_id,
                  pdf_page: pr.page.pdf_page, printed_page: pr.page.printed_page || null, item_number: pr.page.item_number || null,
                  passage: pr.passage, rank: i + 1, score: pr.score, status: 'proposed', engine_version: E.VERSION });
              });
            }
            // idempotent : seules les propositions du moteur sont remplacées ; confirmations et rejets restent
            must(await sb.from('answer_evidence').delete().eq('user_id', userId).eq('question_id', q.id).eq('status', 'proposed'));
            if (rows.length) must(await sb.from('answer_evidence').insert(rows));
            must(await sb.from('question_analysis').upsert({ user_id: userId, question_id: q.id, engine_version: E.VERSION,
              corpus_sig: qSig(q), q_hash: qHash(q), answers: good.length, answers_with_passage: withP, analyzed_at: nowIso() },
              { onConflict: 'user_id,question_id' }));
          });
          n++;
          emit({ done: n });
          if (n % 25 === 0) { note(`Justifications : ${n} / ${todo.length}`); await persist(); }
          await breathe();
        }
        note(`Justifications : ${n} / ${todo.length} terminées`);
      }

      // ---------- 5. rapport : calculé à partir des données déjà enregistrées ----------
      emit({ step: 5, label: 'Rapport', sub: 'comptage des données enregistrées', done: 0, total: 0 });
      let xray = null;
      const rx = await attempt('Rapport', async () => { xray = await computeXray({ sb: rawSb, userId }); });
      if (!rx.ok) note('Rapport non calculé : il le sera à la prochaine ouverture des outils de diagnostic');
      note(job.errors.length ? `Terminée avec ${job.errors.length} erreur(s) isolée(s)` : 'Terminée sans erreur');
      return finish('done', { report: { plan: checkpoint.plan, checkpoint, errors: job.errors, analysed: n, xray } });
    } catch (e) {
      note('ERREUR · ' + msgOf(e));
      if (run) { try { await finish('error'); } catch (_) {} }
      throw e;
    } finally {
      if (hb) clearInterval(hb);
      ACTIVE = null;
      job.listeners.forEach(f => { try { f(job.state, { ended: true }); } catch (e) {} });
    }
  }

  // Rayon X : uniquement des comptages de ce qui est réellement en base
  async function computeXray({ sb: rawSb, userId }) {
    const sb = guard(rawSb);
    const colleges = must(await sb.from('colleges').select('id, name, status, page_count, pages_done, pages_text, pages_ocr, pages_empty, pages_error, items_detected, chapters_detected, referentiel').eq('user_id', userId));
    const sum = (k) => colleges.reduce((s, c) => s + (c[k] || 0), 0);
    const questions = await all(() => sb.from('questions').select('id, exam_id, question_number, question_text, explanation, question_options(option_text)').eq('user_id', userId).order('id'));
    const statuses = await all(() => sb.from('question_reference_status').select('question_id, item_number, best_status').eq('user_id', userId));
    const imgs = await sb.from('college_pages').select('id', { count: 'exact', head: true }).eq('user_id', userId).eq('has_images', true);
    let evidence = [], analyses = [], runs = [], migration = true;
    try {
      evidence = await all(() => sb.from('answer_evidence').select('question_id, option_key, status').eq('user_id', userId));
      analyses = await all(() => sb.from('question_analysis').select('question_id, answers, answers_with_passage, analyzed_at').eq('user_id', userId));
      runs = must(await sb.from('analysis_runs').select('id, status, stage, started_at, finished_at, updated_at, done, total, report').eq('user_id', userId).order('started_at', { ascending: false }).limit(5));
    } catch (e) { migration = false; }
    const stBy = new Map(statuses.map(x => [x.question_id, x]));
    const qLabel = (q) => ({ id: q.id, n: q.question_number });
    const noItem = questions.filter(q => !(stBy.get(q.id) || {}).item_number).map(qLabel);
    const noCollege = questions.filter(q => !ANCHOR.includes((stBy.get(q.id) || {}).best_status)).map(qLabel);
    const refVerified = statuses.filter(x => x.best_status === 'verified').length;
    const refHigh = statuses.filter(x => x.best_status === 'high_confidence').length;
    const refCandidate = statuses.filter(x => ['needs_review', 'candidate'].includes(x.best_status)).length;
    // doublons : énoncé ENTIER et propositions identiques dans le même examen
    const seen = new Map(), dups = [];
    questions.forEach(q => { const k = q.exam_id + '|' + C.normalize(q.question_text) + '|' +
      (q.question_options || []).map(o => C.normalize(o.option_text)).sort().join('|');
      if (seen.has(k)) dups.push(qLabel(q)); else seen.set(k, q); });
    const answersTotal = analyses.reduce((s2, x) => s2 + (x.answers || 0), 0);
    const answersWith = analyses.reduce((s2, x) => s2 + (x.answers_with_passage || 0), 0);
    const anBy = new Map(analyses.map(x => [x.question_id, x]));
    const confirmedKeys = new Set(evidence.filter(e => e.status === 'confirmed').map(e => e.question_id + '|' + e.option_key));
    const noPassage = questions.filter(q => { const x = anBy.get(q.id); return x && x.answers > 0 && x.answers_with_passage === 0; }).map(qLabel);
    const stale = (r) => r.status === 'running' && Date.now() - new Date(r.updated_at).getTime() > 90000;
    const interrupted = runs.filter(r => r.status === 'interrupted' || r.status === 'error' || stale(r));
    const lastErrors = ((runs[0] && runs[0].report && runs[0].report.errors) || []);
    return {
      at: nowIso(), migration,
      documents: { total: colleges.length, ready: colleges.filter(c => c.status === 'done').length,
        incomplete: colleges.filter(c => c.status !== 'done' || (c.pages_done || 0) < (c.page_count || 0)).map(c => ({ id: c.id, name: c.name, done: c.pages_done || 0, total: c.page_count || 0,
          why: c.status === 'verifying' && usable(c) ? 'références interrompues — la prochaine mise à jour les termine' : 'import incomplet — à reprendre dans Collèges' })),
        withoutReferentiel: colleges.filter(c => !c.referentiel).map(c => ({ id: c.id, name: c.name })) },
      pages: { total: sum('page_count'), saved: sum('pages_done'), native: sum('pages_text'), ocr: sum('pages_ocr'), empty: sum('pages_empty'), error: sum('pages_error'),
        withImages: imgs.count || 0,
        problems: colleges.filter(c => (c.pages_empty || 0) + (c.pages_error || 0) > 0).map(c => ({ id: c.id, name: c.name, empty: c.pages_empty || 0, error: c.pages_error || 0 })) },
      structure: { items: sum('items_detected'), chapters: sum('chapters_detected') },
      questions: { total: questions.length, withExplanation: questions.filter(q => (q.explanation || '').trim()).length,
        analysed: analyses.length, noItem, noCollege, duplicates: dups },
      references: { verified: refVerified, high: refHigh, candidate: refCandidate, none: questions.length - refVerified - refHigh - refCandidate },
      answers: { total: answersTotal, withPassage: answersWith, confirmed: confirmedKeys.size,
        proposedRows: evidence.filter(e => e.status === 'proposed').length, rejectedRows: evidence.filter(e => e.status === 'rejected').length, noPassage },
      runs: runs.map(r => ({ id: r.id, status: stale(r) ? 'stalled' : r.status, stage: r.stage, started_at: r.started_at, finished_at: r.finished_at, updated_at: r.updated_at, done: r.done, total: r.total })),
      interrupted: interrupted.map(r => ({ id: r.id, status: stale(r) ? 'stalled' : r.status, stage: r.stage, started_at: r.started_at, done: r.done, total: r.total })),
      lastErrors
    };
  }
  return { runFull, computeXray, current, stop: () => { if (ACTIVE) ACTIVE.stopAsked = true; }, STEPS };
})();
</script>

<script>
// =====================================================================
// ENGINE — moteur de révision par erreurs, cycles, et statut de maîtrise.
// Algorithme (voir README section "Moteur de révision") :
//
//  Nouveau cycle N          -> toutes les questions sont éligibles
//  Réponse correcte         -> retirée de la liste d'erreurs du cycle N
//  Réponse incorrecte       -> ajoutée à la liste d'erreurs du cycle N
//  Fin de session, erreurs>0 -> prochaine session = uniquement ces erreurs
//  Fin de session, erreurs=0 -> cycle N terminé, cycle N+1 disponible
//
// Une question redevenue incorrecte après avoir été correcte réintègre
// IMMÉDIATEMENT la liste d'erreurs du cycle en cours.
// =====================================================================

const EDNEngine = (() => {

  // Récupère, pour un examen et un cycle donnés, la dernière tentative
  // de chaque question au sein de CE cycle.
  async function getLatestAttemptsForCycle(userId, examId, cycleNumber) {
    const { data, error } = await sb
      .from('attempts')
      .select('question_id, is_correct, answered_at')
      .eq('user_id', userId)
      .eq('exam_id', examId)
      .eq('cycle_number', cycleNumber)
      .order('answered_at', { ascending: true });
    if (error) throw error;

    const latest = new Map();
    for (const row of data) latest.set(row.question_id, row.is_correct); // le dernier écrase les précédents (ordre asc)
    return latest;
  }

  // Liste des questions éligibles à la PROCHAINE session pour un cycle :
  // jamais répondues dans ce cycle, ou dont la dernière réponse est fausse.
  async function getEligibleQuestions(userId, examId, cycleNumber) {
    const { data: allQuestions, error } = await sb
      .from('questions')
      .select('id')
      .eq('exam_id', examId)
      .eq('user_id', userId);
    if (error) throw error;

    const latest = await getLatestAttemptsForCycle(userId, examId, cycleNumber);
    return allQuestions
      .filter(q => !latest.has(q.id) || latest.get(q.id) === false)
      .map(q => q.id);
  }

  // Nombre d'erreurs actuelles du cycle en cours (pour affichage dashboard / "Mes erreurs")
  async function countCurrentErrors(userId, examId, cycleNumber) {
    const ids = await getEligibleQuestions(userId, examId, cycleNumber);
    // "Mes erreurs" doit refléter les questions déjà tentées au moins une fois
    // et actuellement fausses (pas les questions jamais vues du tout).
    const latest = await getLatestAttemptsForCycle(userId, examId, cycleNumber);
    return ids.filter(id => latest.has(id)).length;
  }

  function buildQuestionSet(allIds, scope, latestMap, masteryMap, count) {
    let pool = allIds;
    if (scope === 'errors') {
      pool = allIds.filter(id => latestMap.has(id) && latestMap.get(id) === false);
    } else if (scope === 'fragile') {
      pool = allIds.filter(id => (masteryMap.get(id) || {}).status === 'fragile');
    } else if (scope === 'nonmastered') {
      pool = allIds.filter(id => (masteryMap.get(id) || {}).status !== 'maitrisee');
    }
    if (count && count !== 'all' && Number(count) < pool.length) {
      pool = pool.slice(0, Number(count));
    }
    return pool;
  }

  // Statut de maîtrise — règle stricte.
  // Une question est MAÎTRISÉE uniquement si la dernière réponse donnée était
  // exacte à 100 % : toutes les bonnes propositions cochées ET aucune mauvaise.
  // (C'est déjà ce que vérifie la correction avant d'enregistrer la tentative :
  //  `is_correct` n'est vrai que sur une correspondance exacte.)
  // consecutive_correct repasse à 0 dès qu'une réponse est fausse : il vaut donc
  // > 0 si et seulement si la dernière tentative était intégralement juste.
  //   maitrisee   : dernière réponse 100 % correcte
  //   fragile     : déjà réussie par le passé, mais dernière réponse fausse
  //   a_apprendre : jamais réussie
  function computeStatus(m) {
    if (!m || m.total_attempts === 0) return 'a_apprendre';
    if (m.consecutive_correct > 0) return 'maitrisee';
    return m.total_correct > 0 ? 'fragile' : 'a_apprendre';
  }

  // Deux seules catégories pour les compteurs de l'accueil :
  // maîtrisée (dernière réponse exacte) ou à revoir (tout le reste, une fois tentée).
  const isMastered = (m) => !!m && m.total_attempts > 0 && m.consecutive_correct > 0;
  const isToReview = (m) => !!m && m.total_attempts > 0 && m.consecutive_correct === 0;

  // Enregistre une tentative + met à jour mastery. Retourne le nouveau statut.
  async function recordAttempt({ userId, examId, questionId, sessionId, cycleNumber, selectedAnswers, isCorrect, responseTime }) {
    const { error: attErr } = await sb.from('attempts').insert({
      user_id: userId, exam_id: examId, question_id: questionId, session_id: sessionId,
      cycle_number: cycleNumber, selected_answers: selectedAnswers, is_correct: isCorrect,
      response_time: responseTime || null
    });
    if (attErr) throw attErr;

    const { data: existing } = await sb.from('mastery')
      .select('*').eq('user_id', userId).eq('question_id', questionId).maybeSingle();

    const base = existing || {
      user_id: userId, question_id: questionId, exam_id: examId,
      consecutive_correct: 0, total_attempts: 0, total_correct: 0, total_incorrect: 0,
      cycles_correct_count: 0
    };
    base.total_attempts += 1;
    if (isCorrect) { base.total_correct += 1; base.consecutive_correct += 1; }
    else { base.total_incorrect += 1; base.consecutive_correct = 0; }
    base.last_attempt_at = new Date().toISOString();
    base.status = computeStatus(base);
    if (base.status === 'maitrisee' && !base.mastered_at) base.mastered_at = new Date().toISOString();
    if (base.status !== 'maitrisee') base.mastered_at = null;

    const { error: mErr } = await sb.from('mastery').upsert(base, { onConflict: 'user_id,question_id' });
    if (mErr) throw mErr;
    return base.status;
  }

  // Recalcule la maîtrise des questions indiquées à partir des tentatives
  // qui RESTENT en base. Utilisé après l'abandon d'une session : les compteurs
  // (réussites, erreurs, série de bonnes réponses, statut) redeviennent
  // exactement ce qu'ils auraient été sans cette session.
  async function rebuildMastery(userId, examId, questionIds) {
    const ids = [...new Set(questionIds)].filter(Boolean);
    if (!ids.length) return { updated: 0, removed: 0 };

    const byQ = new Map(ids.map(id => [id, []]));
    for (let i = 0; i < ids.length; i += 200) {
      const { data, error } = await sb.from('attempts')
        .select('question_id, is_correct, answered_at')
        .eq('user_id', userId).in('question_id', ids.slice(i, i + 200))
        .order('answered_at', { ascending: true });
      if (error) throw error;
      (data || []).forEach(a => { if (byQ.has(a.question_id)) byQ.get(a.question_id).push(a); });
    }

    const upserts = [], toRemove = [];
    byQ.forEach((list, qid) => {
      if (!list.length) { toRemove.push(qid); return; }
      list.sort((a, b) => new Date(a.answered_at) - new Date(b.answered_at));
      let ok = 0, ko = 0, streak = 0;
      list.forEach(a => { if (a.is_correct) { ok++; streak++; } else { ko++; streak = 0; } });
      const m = {
        user_id: userId, question_id: qid, exam_id: examId,
        total_attempts: list.length, total_correct: ok, total_incorrect: ko,
        consecutive_correct: streak, last_attempt_at: list[list.length - 1].answered_at
      };
      m.status = computeStatus(m);
      m.mastered_at = m.status === 'maitrisee' ? m.last_attempt_at : null;
      upserts.push(m);
    });

    for (let i = 0; i < upserts.length; i += 200) {
      const { error } = await sb.from('mastery')
        .upsert(upserts.slice(i, i + 200), { onConflict: 'user_id,question_id' });
      if (error) throw error;
    }
    for (let i = 0; i < toRemove.length; i += 200) {
      const { error } = await sb.from('mastery').delete()
        .eq('user_id', userId).in('question_id', toRemove.slice(i, i + 200));
      if (error) throw error;
    }
    return { updated: upserts.length, removed: toRemove.length };
  }

  async function getMasteryMap(userId, examId) {
    const { data, error } = await sb.from('mastery').select('*').eq('user_id', userId).eq('exam_id', examId);
    if (error) throw error;
    const map = new Map();
    data.forEach(m => map.set(m.question_id, m));
    return map;
  }

  return {
    getLatestAttemptsForCycle, getEligibleQuestions, countCurrentErrors,
    buildQuestionSet, computeStatus, recordAttempt, getMasteryMap,
    isMastered, isToReview, rebuildMastery
  };
})();

</script>

  // Menu ☰ : navigation complète, pensée pour le pouce
  const DRAWER_LINKS = [
    { href: '#/dashboard', label: 'Accueil', icon: 'home' },
    { href: '#/revise', label: 'À réviser', icon: 'target' },
    { href: '#/exams', label: 'Mes EDN', icon: 'books' },
    { href: '#/stats', label: 'Stats', icon: 'chart' },
    { href: '#/import', label: 'Importer', icon: 'plus' },
    { href: '#/items', label: 'Liste des items', icon: 'list' },
    { href: '#/colleges', label: 'Collèges', icon: 'bookopen' }

  function drawerHtml() {

    const on = (href) => href === '#/items' ? /^#\/items?\b/.test(h) : href === '#/colleges' ? /^#\/college/.test(h) : isActive(href);
    return `<div class="drawer" id="drawer" aria-hidden="true">

          <div class="brand" style="font-family:var(--font-display);font-size:1.15rem;font-weight:600;">EDN<span style="color:var(--brand)">·</span>Trainer</div>
          <button class="btn btn-ghost btn-sm" data-close aria-label="Fermer le menu">✕</button>
        </div>
        ${DRAWER_LINKS.map(l => (l.href === '#/items' ? '<div class="drawer-sep">Référentiels</div>' : '') +
          `<a href="${l.href}" class="drawer-link ${on(l.href) ? 'active' : ''}" ${on(l.href) ? 'aria-current="page"' : ''}>${icon(l.icon)}<span>${l.label}</span></a>`).join('')}
        <div style="flex:1;"></div>
        <a href="#" id="drawer-logout" class="drawer-link" style="color:var(--ink-3);">${icon('logout')}<span>Déconnexion</span></a>

        <div class="small" style="padding:6px 12px;">Version ${APP_VERSION}</div>
      </nav>
    </div>`;
  }

  function bottomNavHtml() {
    return `<nav class="bottomnav" aria-label="Navigation principale">
      ${NAV_LINKS.map(l => `<a href="${l.href}" class="${isActive(l.href) ? 'active' : ''}"
        aria-current="${isActive(l.href) ? 'page' : 'false'}">
        ${icon(l.icon)}<span>${l.label}</span></a>`).join('')}
    </nav>`;
  }

  // Une erreur asynchrone non gérée ne doit plus rester silencieuse
  window.addEventListener('unhandledrejection', (e) => {
    const r = e.reason;
    const msg = r && (r.message || r.details || r.hint) ? (r.message || r.details || r.hint) : String(r);
    console.error('Erreur non gérée :', r);
    const btn = document.getElementById('start-btn');
    if (btn && btn.disabled) { btn.disabled = false; btn.textContent = "Commencer l'entraînement"; }
    alert('Une erreur est survenue : ' + msg);
  });

  // Affichage seulement : espace manquant entre deux phrases collées par
  // l'extraction PDF ("patiente.Elle" -> "patiente. Elle"). Données inchangées.
  const readable = (t) => String(t == null ? '' : t).replace(/([a-zà-ÿ)%])\.([A-ZÀ-Ý])/g, '$1. $2');

  // Contexte clinique long : replié au-delà de ~8 lignes, dépliable
  function wireCollapsibleContexts(root, startOpen) {
    (root || document).querySelectorAll('.q-context:not(.lca)').forEach(el => {
      if (el.dataset.wired) return; el.dataset.wired = '1';
      if (el.scrollHeight < 260) return;
      el.classList.add('collapsible');
      if (!startOpen) el.classList.add('collapsed');
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'ctx-toggle';
      const label = () => { btn.textContent = el.classList.contains('collapsed') ? 'Afficher tout le contexte' : 'Réduire le contexte'; };
      btn.onclick = () => { el.classList.toggle('collapsed'); label(); };
      label();
      el.insertAdjacentElement('afterend', btn);
    });
  }

  // Zoom plein écran au clic sur une illustration
  document.addEventListener('click', (e) => {
    if (e.target && e.target.classList && e.target.classList.contains('q-image')) {
      const overlay = document.createElement('div');
      overlay.className = 'image-zoom';
      overlay.innerHTML = `<img src="${e.target.src}" alt="Illustration agrandie" />`;
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    }
  });

  // innerHtml = contenu de la page. topTitle = titre affiché dans la barre
  // supérieure sur mobile (la barre latérale prend le relais sur desktop).
  function shell(innerHtml, topTitle) {
    $app().innerHTML = `
      <div class="shell">
        ${sidebarHtml()}
        <div style="flex:1;min-width:0;">
          <header class="topbar">
            <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="drawer">
              <span></span><span></span><span></span></button>
            <div class="brand" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${topTitle ? esc(topTitle) : 'EDN<span>·</span>Trainer'}</div>
            <button class="avatar" id="avatar-btn" aria-label="Ouvrir le menu du compte">${esc(((CURRENT_USER && CURRENT_USER.email) || 'E')[0].toUpperCase())}</button>
          </header>
          <main class="main">${innerHtml}</main>
        </div>
      </div>
      ${bottomNavHtml()}
      ${drawerHtml()}`;

    // CONTEXTE DE RETOUR — tout lien ouvert depuis une question mémorise la question
    // d'origine (adresse + libellé). Le lecteur, la fiche item, les autres Collèges
    // affichent alors « ← Retour à la question N ». Les rubriques principales l'effacent.
    const RET_KEY = 'edn_nav_return';
    const readRet = () => { try { return JSON.parse(sessionStorage.getItem(RET_KEY) || 'null'); } catch (e) { return null; } };
    if (!document.body.dataset.retWired) {
      document.body.dataset.retWired = '1';
      document.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a[href^="#/"]');
        const origin = a && a.closest('[data-return-hash]');
        if (!origin || a.getAttribute('href') === origin.dataset.returnHash) return;
        try { sessionStorage.setItem(RET_KEY, JSON.stringify({ hash: origin.dataset.returnHash, label: origin.dataset.returnLabel || 'Question' })); } catch (_) {}
      }, true);
    }
    const hereHash = location.hash || '';
    if (/^#\/(dashboard|exams|revise|stats|import)(\/|$)/.test(hereHash) || /^#\/exam\/[^/]+\/(train|continue|mistakes|exam-mode|stats)/.test(hereHash)) {
      try { sessionStorage.removeItem(RET_KEY); } catch (_) {}
    }
    const ret = readRet();
    const mainEl = document.querySelector('.main');
    if (ret && mainEl && ret.hash !== hereHash && !document.querySelector('.question-shell[data-return-hash]')) {
      const bar = document.createElement('a');
      bar.className = 'return-bar'; bar.href = ret.hash;
      bar.innerHTML = `<span class="arr" aria-hidden="true">←</span><span>Retour à la <b>${esc(ret.label.replace(/^Question/, 'question'))}</b></span>`;
      bar.onclick = () => { try { sessionStorage.removeItem(RET_KEY); } catch (_) {} };
      mainEl.prepend(bar);
    }

    // mode concentration : l'écran de question et le lecteur occupent tout l'écran
    // session d'entraînement ou d'examen : le menu global disparaît complètement ;
    // il reste sur toutes les autres pages (fiche question comprise)
    document.body.classList.toggle('focus', !!document.querySelector('.question-shell[data-session], #rd-view'));
    document.body.classList.toggle('in-session', !!document.querySelector('.question-shell[data-session]'));
    const logout = async (e) => { e.preventDefault(); await sb.auth.signOut(); route(); };
    // menu ☰
    const burger = document.getElementById('burger'), drawer = document.getElementById('drawer');
    const setDrawer = (open) => {
      if (!drawer) return;
      drawer.classList.toggle('open', open);
      if (burger) burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      document.body.style.overflow = open ? 'hidden' : '';
    };
    if (burger) burger.onclick = () => setDrawer(true);
    if (drawer) {
      drawer.querySelectorAll('[data-close]').forEach(el => el.onclick = () => setDrawer(false));
      drawer.querySelectorAll('a[href^="#/"]').forEach(a => a.addEventListener('click', () => setDrawer(false)));
      const dl = document.getElementById('drawer-logout');
      if (dl) dl.onclick = (e) => { setDrawer(false); logout(e); };
    }
    document.body.style.overflow = '';
    const lo = document.getElementById('logout-link');
    if (lo) lo.onclick = logout;
    const lom = document.getElementById('logout-link-m');
    if (lom) lom.onclick = logout;
    const av = document.getElementById('avatar-btn');
    if (av && typeof setDrawer === 'function') av.onclick = () => setDrawer(true);

    // ombre de la barre supérieure au défilement
    const bar = document.querySelector('.topbar');
    if (bar) {
      const onScroll = () => bar.classList.toggle('scrolled', window.scrollY > 4);
      window.removeEventListener('scroll', window.__ednScroll || (() => {}));
      window.__ednScroll = onScroll;
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    }
  }

  // Squelette de chargement (jamais d'écran vide)
  function skeleton(rows = 3) {
    return Array.from({ length: rows }, () => `
      <div class="skeleton"><div class="sk-line w40"></div><div class="sk-line w80"></div><div class="sk-line w60"></div></div>`).join('');
  }

  // Anneau de progression en SVG
  function ring(percent, size = 92, stroke = 9, color = '#fff', track = 'rgba(255,255,255,.28)') {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const off = c * (1 - Math.max(0, Math.min(100, percent)) / 100);
    return `<div class="ring" style="width:${size}px;height:${size}px;">
      <svg width="${size}" height="${size}" aria-hidden="true">
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
          style="transition:stroke-dashoffset .6s ease"/>
      </svg>
      <div class="ring-label">${Math.round(percent)}%</div>
    </div>`;
  }

  function emptyState(title, text, ctaHref, ctaLabel, iconName = 'inbox') {
    return `<div class="empty">
      <div class="icon">${icon(iconName)}</div>
      <h2>${esc(title)}</h2>
      <p>${esc(text)}</p>
      ${ctaHref ? `<a class="btn btn-primary btn-lg" href="${ctaHref}">${esc(ctaLabel)}</a>` : ''}
    </div>`;
  }

  function renderLogin() {
    $app().innerHTML = `
      <div class="center-screen">
        <div class="card auth-card">
          <div class="brand-mark" aria-hidden="true">ET</div>
          <h1>EDN Trainer</h1>
          <p class="subtitle">Votre entraînement personnel, jusqu'à zéro erreur.</p>
          <div class="field"><label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" inputmode="email" /></div>
          <div class="field"><label for="password">Mot de passe</label>
            <input type="password" id="password" autocomplete="current-password" /></div>
          <div id="auth-error" class="small" style="color:var(--bad);margin-top:12px;" role="alert"></div>
          <button class="btn btn-primary btn-lg btn-block mt" id="btn-login">Se connecter</button>
          <button class="btn btn-block" id="btn-signup" style="margin-top:10px;">Créer un compte</button>
        </div>
      </div>`;
    const errEl = document.getElementById('auth-error');
    // Références capturées UNE fois. Après une connexion réussie, l'écouteur
    // onAuthStateChange redessine l'accueil avant la fin de l'await : l'écran
    // de connexion n'existe plus. On ne touche alors plus aux boutons.
    const loginBtn = document.getElementById('btn-login');
    const signupBtn = document.getElementById('btn-signup');
    const onScreen = () => !!(loginBtn && loginBtn.isConnected);
    const setBusy = (b) => {
      if (!onScreen()) return;
      loginBtn.disabled = b;
      if (signupBtn) signupBtn.disabled = b;
    };
    const showError = (msg, good) => {
      if (!errEl || !errEl.isConnected) return;
      errEl.style.color = good ? 'var(--good)' : 'var(--bad)';
      errEl.textContent = msg;
    };

    loginBtn.onclick = async () => {
      const email = document.getElementById('email').value, password = document.getElementById('password').value;
      setBusy(true); showError('');
      try {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { setBusy(false); showError(error.message); return; }
        // succès : si l'écran est encore affiché, on laisse le routeur basculer
        if (onScreen()) route();
      } catch (e) {
        setBusy(false);
        showError('Connexion impossible : ' + (e.message || e));
      }
    };
    signupBtn.onclick = async () => {
      const email = document.getElementById('email').value, password = document.getElementById('password').value;
      setBusy(true); showError('');
      try {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) { setBusy(false); showError(error.message); return; }
        if (data.user) await sb.from('profiles').upsert({ id: data.user.id, user_id: data.user.id });
        setBusy(false);
        showError('Compte créé. Vérifiez vos emails si la confirmation est activée, puis connectez-vous.', true);
      } catch (e) {
        setBusy(false);
        showError('Création du compte impossible : ' + (e.message || e));
      }
    };
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter' && onScreen()) loginBtn.click();
    });
  }

  async function renderDashboard() {
    shell(skeleton(3), 'Accueil');
    const { data: exams } = await sb.from('exams').select('*').eq('user_id', CURRENT_USER.id).order('created_at');
    let totalQ = 0, totalMastered = 0, totalErrors = 0;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const examCards = [];

    let totalReview = 0, totalSeen = 0;
    for (const ex of (exams || [])) {
      const masteryMap = await EDNEngine.getMasteryMap(CURRENT_USER.id, ex.id);
      // maîtrisée = dernière réponse exacte à 100 % ; à revoir = déjà tentée et
      // dernière réponse imparfaite. Mêmes chiffres que les listes cliquables.
      let mastered = 0, review = 0;
      masteryMap.forEach(m => {
        if (EDNEngine.isMastered(m)) mastered++;
        else if (EDNEngine.isToReview(m)) review++;
      });
      const errors = await EDNEngine.countCurrentErrors(CURRENT_USER.id, ex.id, ex.current_cycle);
      // position réelle dans le cycle : questions déjà répondues (table attempts)
      const cycleLatest = await EDNEngine.getLatestAttemptsForCycle(CURRENT_USER.id, ex.id, ex.current_cycle);
      totalQ += ex.total_questions; totalMastered += mastered;
      totalReview += review; totalErrors += errors;
      totalSeen += masteryMap.size;
      const pct = ex.total_questions ? Math.round((mastered / ex.total_questions) * 100) : 0;
      examCards.push({ ex, pct, errors, mastered, review, answered: cycleLatest.size, seen: masteryMap.size });
    }

    const { data: todayAttempts } = await sb.from('attempts').select('id')
      .eq('user_id', CURRENT_USER.id).gte('answered_at', today.toISOString());
    const todayCount = (todayAttempts || []).length;

    const { data: allAttempts } = await sb.from('attempts').select('is_correct').eq('user_id', CURRENT_USER.id);
    const successRate = (allAttempts || []).length
      ? Math.round(allAttempts.filter(a => a.is_correct).length / allAttempts.length * 100) : 0;

    const globalPct = totalQ ? Math.round((totalMastered / totalQ) * 100) : 0;
    const hour = new Date().getHours();
    const hello = hour < 5 ? 'Bonne nuit' : hour < 18 ? 'Bonjour' : 'Bonsoir';
    const name = (CURRENT_USER.email || '').split('@')[0];

    const body = (exams || []).length === 0
      ? emptyState('Votre bibliothèque est vide',

          '#/import', 'Importer mon premier EDN')
      : `
      ${(() => {
        // examen mis en avant : le premier qui a encore des questions à faire dans son cycle
        const cur = examCards.find(c => c.answered < c.ex.total_questions) || examCards[0];
        const ex = cur.ex, next = Math.min(cur.answered + 1, ex.total_questions);
        const done = cur.answered >= ex.total_questions;
        const unseen = Math.max(0, totalQ - totalSeen);
        const reviewExam = examCards.find(c => c.review > 0) || cur;
        const f = (n) => Math.max(n, 0);
        return `
      <div class="page-head">
        <span class="label-mono">${hello}${name ? ', ' + esc(name) : ''}</span>

      <div class="home-grid">
        <section class="command" aria-label="Session en cours">

          <h2>${esc(ex.name)}</h2>
          <div class="figure"><span class="num">${cur.answered}</span><span class="of">/ ${ex.total_questions} questions répondues</span></div>
          <div class="track"><i style="width:${ex.total_questions ? Math.round(cur.answered / ex.total_questions * 100) : 0}%"></i></div>
          <div class="meta-row">
            <span><b>${cur.pct} %</b> maîtrisé</span>
            ${cur.errors ? `<span class="warn"><b>${cur.errors}</b> erreur${cur.errors > 1 ? 's' : ''} du cycle</span>` : ''}
          </div>
          ${done
            ? `<a class="btn btn-mint" href="#/exam/${ex.id}/train">Voir le cycle <span class="arrow">→</span></a>`
            : `<a class="btn btn-mint" href="#/exam/${ex.id}/continue">Continuer · question ${next} <span class="arrow">→</span></a>`}
        </section>

        <div class="side">
          ${totalReview ? `<section class="priority">
            <span class="num">${totalReview}</span>
            <span class="t">question${totalReview > 1 ? 's' : ''} à revoir</span>
            <span class="s">Votre dernière réponse était fausse ou incomplète.</span>
            <a class="btn" href="#/exam/${reviewExam.ex.id}/mistakes">Réviser mes erreurs →</a>

          <section class="panel">

              <span class="label-mono">Progression</span>
              <a class="btn-text" href="#/stats" style="min-height:0;">Statistiques →</a>
            </div>
            <div class="dist" role="img" aria-label="${totalMastered} maîtrisées, ${totalReview} à revoir, ${unseen} non vues">
              <i class="m" style="flex-grow:${f(totalMastered)}"></i><i class="r" style="flex-grow:${f(totalReview)}"></i><i class="u" style="flex-grow:${f(unseen)}"></i>

          <a class="list-row" href="#/items"><span class="ico">${icon('list')}</span><span class="txt"><b>Liste des items</b><span>367 items · recherche et référentiels</span></span><span class="end">${icon('chevron').replace('<svg', '<svg class="chev"')}</span></a>

          <a class="list-row" href="#/import"><span class="ico">${icon('plus')}</span><span class="txt"><b>Importer</b><span>Un EDN ou un Collège</span></span><span class="end">${icon('chevron').replace('<svg', '<svg class="chev"')}</span></a>

      </section>`;
      })()}
      <p class="small center" style="margin-top:var(--space-7);font-size:.75rem;opacity:.7;">Version ${APP_VERSION}</p>
