  const STATUS_LABEL = { maitrisee: 'Maîtrisée', en_cours: 'En cours', fragile: 'Fragile', a_apprendre: 'À apprendre' };

  // filter = 'mastered' | 'review'
  async function renderQuestionList(filter) {
    const mastered = filter === 'mastered';
    const title = mastered ? 'Questions maîtrisées' : 'Questions à revoir';
    shell(skeleton(3), title);

    const { data: rows } = await sb.from('mastery').select('*').eq('user_id', CURRENT_USER.id);
    const kept = (rows || []).filter(m => mastered ? EDNEngine.isMastered(m) : EDNEngine.isToReview(m));

    if (!kept.length) {
      shell(`<h1>${title}</h1>${emptyState(
        mastered ? 'Aucune question maîtrisée pour l\'instant' : 'Aucune question à revoir',
        mastered ? 'Une question devient maîtrisée quand votre dernière réponse est exacte à 100 %.'
                 : 'Toutes les questions déjà répondues sont justes. Continuez l\'entraînement.',
        '#/exams', 'Mes EDN', mastered ? 'target' : 'inbox')}`, title);
      return;
    }

    // chargement des énoncés par paquets (liste potentiellement longue)
    const ids = kept.map(m => m.question_id);
    const byId = new Map();
    for (let i = 0; i < ids.length; i += 200) {
      const { data } = await sb.from('questions')
        .select('id, question_number, question_text, exam_id, topic_id').in('id', ids.slice(i, i + 200));
      (data || []).forEach(q => byId.set(q.id, q));
    }
    const { data: topics } = await sb.from('topics').select('id, name').eq('user_id', CURRENT_USER.id);
    const topicName = new Map((topics || []).map(t => [t.id, t.name]));

    const items = kept
      .map(m => ({ m, q: byId.get(m.question_id) }))
      .filter(x => x.q)
      .sort((a, b) => (a.q.question_number || 0) - (b.q.question_number || 0));

    const MAX = 150;
    const shown = items.slice(0, MAX);

    shell(`
      <h1>${title}</h1>
      <p class="subtitle">${items.length} question${items.length > 1 ? 's' : ''}</p>
      ${shown.map(({ m, q }) => {
        const st = EDNEngine.computeStatus(m);
        const txt = String(q.question_text || '').split('\n\n').pop().trim();
        return `<a class="card card-tight" href="#/question/${q.id}" style="display:block;">
          <div class="flex-between" style="align-items:flex-start;">
            <span class="small" style="font-family:var(--font-mono);">Q${q.question_number ?? '?'}${
              q.topic_id && topicName.get(q.topic_id) ? ' · ' + esc(topicName.get(q.topic_id)) : ''}</span>
            <span class="badge badge-${st}">${STATUS_LABEL[st]}</span>
          </div>
          <p style="margin:8px 0 6px;font-size:.94rem;color:var(--ink);">${esc(txt.slice(0, 140))}${txt.length > 140 ? '…' : ''}</p>
          <div class="small">${m.total_correct || 0} juste(s) · ${m.total_incorrect || 0} erreur(s)</div>
        </a>`;
      }).join('')}
      ${items.length > MAX ? `<p class="small center mt">${items.length - MAX} questions supplémentaires non affichées</p>` : ''}
    `, title);
  }

  // Détail d'une question : ma réponse, les bonnes réponses, l'explication
  async function renderQuestionDetail(questionId) {
    shell(skeleton(2), 'Question');
    const { data: q } = await sb.from('questions')
      .select('*, question_options(*)').eq('id', questionId).single();
    if (!q) { shell(emptyState('Question introuvable', '', '#/dashboard', 'Accueil'), 'Question'); return; }

    const { data: attempts } = await sb.from('attempts')
      .select('selected_answers, is_correct, answered_at, cycle_number')
      .eq('question_id', questionId).eq('user_id', CURRENT_USER.id)
      .order('answered_at', { ascending: true });

    const { data: mastery } = await sb.from('mastery')
      .select('*').eq('user_id', CURRENT_USER.id).eq('question_id', questionId).maybeSingle();

    const last = (attempts || []).length ? attempts[attempts.length - 1] : null;
    const mine = last ? (last.selected_answers || []) : [];
    const opts = (q.question_options || []).sort((a, b) => a.position - b.position);
    const correctKeys = opts.filter(o => o.is_correct).map(o => o.option_key);
    const isOpen = (q.question_type || '') === 'qroc';
    const st = EDNEngine.computeStatus(mastery);

    const images = Array.isArray(q.images) ? q.images : [];
    const mainImages = images.filter(im => !im.label)
      .map(im => `<img src="${im.src}" class="q-image" alt="Illustration" loading="lazy"/>`).join('');

    const parts = String(q.question_text || '').split('\n\n');
    const hasContext = parts.length > 1 && /^\[Contexte/.test(parts[0]);
    const contextHtml = hasContext
      ? `<div class="q-context">${esc(parts[0].replace(/^\[Contexte\s*[^\]]*\]\s*/, ''))}</div>` : '';
    const statement = esc(hasContext ? parts.slice(1).join('\n\n') : q.question_text);

    // propositions : vert = bonne réponse officielle, rouge = cochée à tort
    const optionsHtml = isOpen
      ? `<div class="explain"><h4>Réponses acceptées</h4><p>${opts.map(o => esc(o.option_text)).join(' · ')}</p></div>`
      : opts.map(o => {
          const good = o.is_correct, picked = mine.includes(o.option_key);
          const cls = good ? 'correct' : (picked ? 'incorrect' : '');
          const tag = good && picked ? ' · cochée, juste' : good ? ' · attendue' : picked ? ' · cochée à tort' : '';
          return `<div class="option disabled ${cls}">
            <span class="key" aria-hidden="true">${o.option_key}</span>
            <span class="body">${esc(o.option_text)}
              ${tag ? `<span class="small" style="display:block;margin-top:4px;">${tag}</span>` : ''}
              ${images.filter(im => im.label === o.option_key).map(im => `<img src="${im.src}" class="q-image" alt="Illustration" loading="lazy"/>`).join('')}
            </span></div>`;
        }).join('');

    const mineLabel = isOpen
      ? (mine.length ? esc(mine.join(', ')) : '—')
      : (mine.length ? mine.join(', ') : '—');

    const historyHtml = (attempts || []).length ? `
      <div class="card">
        <h2>Historique</h2>
        <p class="small">${attempts.length} tentative${attempts.length > 1 ? 's' : ''} · conservées intégralement</p>
        <div style="margin-top:12px;">
          ${attempts.map((a, i) => `<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--line);">
            <span class="small">Tentative ${i + 1} · cycle ${a.cycle_number} · ${new Date(a.answered_at).toLocaleDateString('fr-FR')}</span>
            <span class="badge ${a.is_correct ? 'badge-maitrisee' : 'badge-a_apprendre'}">${a.is_correct ? 'Juste' : 'Faux'}</span>
          </div>`).join('')}
        </div>
      </div>` : '';

    shell(`
      <div class="question-shell">
        <div class="flex-between mb">
          <h1>Question ${q.question_number ?? ''}</h1>
          <span class="badge badge-${st}">${STATUS_LABEL[st]}</span>
        </div>
        ${contextHtml}
        <div class="q-text">${statement}</div>
        ${mainImages}
        <div style="margin-bottom:20px;">${optionsHtml}</div>

        <div class="explain">
          <h4>Ma réponse</h4>
          <p style="color:${last && last.is_correct ? 'var(--good)' : 'var(--bad)'};font-weight:700;">
            ${mineLabel}${last ? (last.is_correct ? ' — juste' : ' — fausse') : ' — jamais répondue'}</p>
        </div>
        ${!isOpen && correctKeys.length ? `<div class="explain">
          <h4>Bonne(s) réponse(s)</h4>
          <p style="color:var(--good);font-weight:700;">${correctKeys.join(', ')}</p></div>` : ''}
        ${q.official_correction ? `<div class="explain"><h4>Correction officielle</h4><p>${esc(q.official_correction)}</p></div>` : ''}
        ${q.explanation ? `<div class="explain"><h4>Explication</h4><p>${esc(q.explanation)}</p></div>` : ''}

        ${historyHtml}

        <div class="btn-row mt">
          <button class="btn btn-block" id="back-btn">Retour</button>
        </div>
      </div>
    `, 'Question');
    document.getElementById('back-btn').onclick = () => history.back();
  }

  // ---------------------------------------------------------------
  // IMPORT
  // ---------------------------------------------------------------
  let PENDING_IMPORT = null; // { examName, questions: [...] }

  let IMPORT_FILES = [];      // fichiers sélectionnés, en attente d'analyse
  let IMPORT_TARGET = 'new';  // 'new' ou l'id d'un examen existant

  async function renderImport() {
    const { data: exams } = await sb.from('exams')
      .select('id, name, total_questions').eq('user_id', CURRENT_USER.id).order('created_at', { ascending: false });

    shell(`
      <h1>Importer un EDN</h1>
      <p class="subtitle">Un EDN peut être composé de plusieurs fichiers : ajoutez-les tous, ils formeront un seul examen.</p>

      <div class="stepper" aria-label="Étapes de l'import">
        <div class="step current"><i></i>Fichiers</div>
        <div class="step"><i></i>Analyse</div>
        <div class="step"><i></i>Vérification</div>
        <div class="step"><i></i>Import</div>
      </div>

      <div class="card">
        <label>Cet import alimente</label>
        <select id="target-exam">
          <option value="new">Un nouvel examen</option>
          ${(exams || []).map(e => `<option value="${e.id}" ${IMPORT_TARGET === e.id ? 'selected' : ''}>${esc(e.name)} (${e.total_questions} questions)</option>`).join('')}
        </select>

        <div id="new-exam-field" class="field">
          <label>Nom de l'examen</label>
          <input type="text" id="exam-name" placeholder="Ex : EDN Blanc 1 — Juillet 2026" />
        </div>

        <div class="dropzone mt" id="dropzone" role="button" tabindex="0">
          <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.docx,.pdf" multiple style="display:none" />
          <strong>Choisir un ou plusieurs fichiers</strong>
          <span class="small">PDF, DOCX, XLSX ou CSV — glisser-déposer accepté</span>
        </div>

        <div id="file-list" class="filelist mt">${renderFileList()}</div>
        <div id="import-status" class="small mt"></div>

        <button class="btn btn-accent btn-lg mt btn-block" id="analyze-btn" ${IMPORT_FILES.length ? '' : 'disabled'}>
          Analyser ${IMPORT_FILES.length || ''} fichier${IMPORT_FILES.length > 1 ? 's' : ''}
        </button>
      </div>

      <div class="card small">
        Les fichiers sont analysés dans l'ordre où vous les ajoutez, et leurs questions se suivent dans l'examen.
        Vous pourrez tout vérifier avant l'enregistrement définitif.
      </div>
    `, 'Importer');

    const targetSel = document.getElementById('target-exam');
    const newField = document.getElementById('new-exam-field');
    const syncTarget = () => {
      IMPORT_TARGET = targetSel.value;
      newField.style.display = IMPORT_TARGET === 'new' ? 'block' : 'none';
    };
    targetSel.onchange = syncTarget;
    syncTarget();

    const dz = document.getElementById('dropzone'), input = document.getElementById('file-input');
    dz.onclick = () => input.click();
    dz.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
    dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');
    dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove('over'); addFiles(e.dataTransfer.files); };
    input.onchange = () => addFiles(input.files);
    document.getElementById('analyze-btn').onclick = analyzeFiles;
    attachFileListHandlers();
  }

  function renderFileList() {
    if (!IMPORT_FILES.length) return '<p class="small">Aucun fichier sélectionné pour l\'instant.</p>';
    return IMPORT_FILES.map((f, i) => `
      <div class="row">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;">${esc(f.name)}
          <span class="small">· ${Math.round(f.size / 1024)} Ko</span></span>
        <button class="btn btn-sm btn-danger" data-rm="${i}" aria-label="Retirer ${esc(f.name)}">Retirer</button>
      </div>`).join('');
  }

  function attachFileListHandlers() {
    document.querySelectorAll('[data-rm]').forEach(b => {
      b.onclick = () => {
        IMPORT_FILES.splice(Number(b.dataset.rm), 1);
        refreshFileList();
      };
    });
  }

  function refreshFileList() {
    const list = document.getElementById('file-list');
    if (list) { list.innerHTML = renderFileList(); attachFileListHandlers(); }
    const btn = document.getElementById('analyze-btn');
    if (btn) {
      btn.disabled = !IMPORT_FILES.length;
      btn.textContent = `Analyser ${IMPORT_FILES.length || ''} fichier${IMPORT_FILES.length > 1 ? 's' : ''}`;
    }
  }

  function addFiles(fileList) {
    for (const f of fileList) {
      if (!IMPORT_FILES.some(x => x.name === f.name && x.size === f.size)) IMPORT_FILES.push(f);
    }
    refreshFileList();
  }

  // Étiquette courte dérivée du nom de fichier, pour préfixer les thèmes
  // quand plusieurs fichiers composent un même examen.
  function fileTag(name) {
    return name.replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ').trim().slice(0, 28);
  }

  async function analyzeFiles() {
    const statusEl = document.getElementById('import-status');
    const btn = document.getElementById('analyze-btn');
    let examName = '';

    if (IMPORT_TARGET === 'new') {
      examName = document.getElementById('exam-name').value.trim();
      if (!examName) {
        statusEl.style.color = 'var(--bad)';
        statusEl.textContent = 'Donnez un nom à l\'examen avant d\'analyser.';
        return;
      }
    }
    if (!IMPORT_FILES.length) return;

    btn.disabled = true;
    statusEl.style.color = 'var(--ink-soft)';

    const multi = IMPORT_FILES.length > 1;
    const allQuestions = [];
    const fileInfos = [];
    const failed = [];

    for (let fi = 0; fi < IMPORT_FILES.length; fi++) {
      const file = IMPORT_FILES[fi];
      const tag = fileTag(file.name);
      statusEl.textContent = `Fichier ${fi + 1}/${IMPORT_FILES.length} — ${file.name} : analyse en cours…`;
      try {
        const questions = await EDNParsers.parseFile(file, (done, total, phase) => {
          statusEl.textContent = `Fichier ${fi + 1}/${IMPORT_FILES.length} — ${file.name} : ${phase || 'lecture'} ${done}/${total}`;
        });
        questions.forEach(q => {
          q.source_file = file.name;
          // les thèmes sont préfixés pour ne pas confondre le DP01 de deux fichiers
          if (multi) q.theme = q.theme ? `${tag} · ${q.theme}` : tag;
        });
        allQuestions.push(...questions);
        fileInfos.push({ name: file.name, type: file.name.split('.').pop().toLowerCase(), count: questions.length });
      } catch (e) {
        console.error(e);
        failed.push(`${file.name} : ${e.message || e}`);
      }
    }

    if (!allQuestions.length) {
      statusEl.style.color = 'var(--bad)';
      statusEl.textContent = 'Aucune question n\'a pu être extraite. ' + failed.join(' | ');
      btn.disabled = false;
      return;
    }

    allQuestions.forEach((q, i) => { q.question_number = i + 1; });

    PENDING_IMPORT = {
      examName,
      targetExamId: IMPORT_TARGET === 'new' ? null : IMPORT_TARGET,
      files: fileInfos,
      failed,
      questions: allQuestions
    };
    IMPORT_FILES = [];
    location.hash = '#/import/verify';
  }

  let VERIFY_FILTER = 'review'; // review | all

  function renderImportVerify() {
    if (!PENDING_IMPORT) { location.hash = '#/import'; return; }
    const { questions, examName } = PENDING_IMPORT;
    const okCount = questions.filter(q => !q.needs_review).length;
    const reviewCount = questions.length - okCount;
    const shown = questions
      .map((q, i) => ({ q, i }))
      .filter(({ q }) => VERIFY_FILTER === 'all' || q.needs_review);

    const files = PENDING_IMPORT.files || [];
    const failed = PENDING_IMPORT.failed || [];
    const title = PENDING_IMPORT.targetExamId ? 'Ajout à un examen existant' : esc(examName);

    shell(`
      <div class="stepper" aria-label="Étapes de l'import">
        <div class="step done"><i></i>Fichiers</div>
        <div class="step done"><i></i>Analyse</div>
        <div class="step current"><i></i>Vérification</div>
        <div class="step"><i></i>Import</div>
      </div>
      <h1>Vérification de l'import</h1>
      <p class="subtitle">${title} — <strong>${questions.length}</strong> question(s) détectée(s) :
        <span style="color:var(--good)">${okCount} correctement structurées</span> ·
        <span style="color:var(--warn)">${reviewCount} à vérifier</span></p>
      ${files.length > 1 ? `<div class="card small"><strong>Fichiers analysés</strong>${files.map(f => `
        <div class="flex-between" style="padding:4px 0;"><span>${esc(f.name)}</span><span>${f.count} questions</span></div>`).join('')}</div>` : ''}
      ${failed.length ? `<div class="card small" style="border-color:var(--bad);color:var(--bad)">
        <strong>Fichiers non exploitables</strong><br/>${failed.map(esc).join('<br/>')}</div>` : ''}
      <div class="card small">
        Rien n'a été deviné : les questions ci-dessous sont celles dont l'extraction est incertaine.
        Corrigez-les si besoin, puis validez.
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="btn" id="f-review" ${VERIFY_FILTER === 'review' ? 'style="border-color:var(--brand);color:var(--brand)"' : ''}>À vérifier (${reviewCount})</button>
        <button class="btn" id="f-all" ${VERIFY_FILTER === 'all' ? 'style="border-color:var(--brand);color:var(--brand)"' : ''}>Toutes (${questions.length})</button>
      </div>
      <div id="review-list">${shown.length
        ? shown.map(({ q, i }) => renderReviewRow(q, i)).join('')
        : '<p class="small">Aucune question à vérifier : tout est correctement structuré.</p>'}</div>
      <div class="btn-row mt">
        <button class="btn" id="cancel-import">Annuler</button>
        <button class="btn btn-good btn-lg" id="validate-import">Valider l'import (${questions.length} questions)</button>
      </div>
      <div id="import-progress" class="small mt" role="status"></div>
    `, 'Vérification');
    document.getElementById('f-review').onclick = () => { VERIFY_FILTER = 'review'; renderImportVerify(); };
    document.getElementById('f-all').onclick = () => { VERIFY_FILTER = 'all'; renderImportVerify(); };
    document.getElementById('cancel-import').onclick = () => { PENDING_IMPORT = null; location.hash = '#/import'; };
    document.getElementById('validate-import').onclick = commitImport;
    shown.forEach(({ i }) => attachReviewRowHandlers(i));
  }

  function renderReviewRow(q, i) {
    return `
      <div class="review-row ${q.needs_review ? 'needs-review' : ''}" data-idx="${i}">
        <div class="row-head">
          <strong>Question ${q.question_number ?? i + 1}</strong>
          ${q.needs_review ? `<span class="badge badge-fragile">À vérifier — ${esc(q.review_reason)}</span>` : `<span class="badge badge-maitrisee">OK</span>`}
        </div>
        ${(q.images || []).length ? `<div class="small" style="margin-bottom:6px;">${q.images.length} image(s) récupérée(s) depuis le PDF</div>
          ${q.images.map(im => `<img src="${im.src}" class="q-image" style="max-height:160px;" />`).join('')}` : ''}
        <label>Énoncé</label>
        <textarea rows="2" data-field="question_text" data-i="${i}">${esc(q.question_text)}</textarea>
        <label>Thème / item</label>
        <input type="text" data-field="theme" data-i="${i}" value="${esc(q.theme)}" />
        <label>${q.question_type === 'qroc' ? 'Réponses acceptées (réponse libre)' : 'Propositions (cochez la ou les bonnes réponses)'}</label>
        ${(q.options.length ? q.options : [{ key: 'A', text: '', is_correct: false }]).map((o, oi) => `
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
            <input type="checkbox" data-opt-correct="${i}:${oi}" ${o.is_correct ? 'checked' : ''} />
            <span class="small" style="width:16px;">${o.key}</span>
            <input type="text" data-opt-text="${i}:${oi}" value="${esc(o.text)}" />
          </div>`).join('')}
        <label>Correction officielle</label>
        <textarea rows="2" data-field="official_correction" data-i="${i}">${esc(q.official_correction)}</textarea>
        <label>Explication</label>
        <textarea rows="2" data-field="explanation" data-i="${i}">${esc(q.explanation)}</textarea>
      </div>`;
  }

  function attachReviewRowHandlers(i) {
    const row = document.querySelector(`.review-row[data-idx="${i}"]`);
    row.querySelectorAll('[data-field]').forEach(el => {
      el.onchange = () => { PENDING_IMPORT.questions[i][el.dataset.field] = el.value; };
    });
    row.querySelectorAll('[data-opt-text]').forEach(el => {
      el.onchange = () => {
        const [qi, oi] = el.dataset.optText.split(':').map(Number);
        if (!PENDING_IMPORT.questions[qi].options[oi]) PENDING_IMPORT.questions[qi].options[oi] = { key: String.fromCharCode(65 + oi), is_correct: false };
        PENDING_IMPORT.questions[qi].options[oi].text = el.value;
      };
    });
    row.querySelectorAll('[data-opt-correct]').forEach(el => {
      el.onchange = () => {
        const [qi, oi] = el.dataset.optCorrect.split(':').map(Number);
        PENDING_IMPORT.questions[qi].options[oi].is_correct = el.checked;
      };
    });
  }

  async function commitImport() {
    const btn = document.getElementById('validate-import');
    const progress = document.getElementById('import-progress');
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    const say = (t) => { if (progress) progress.textContent = t; };
    const { examName, targetExamId, files, questions } = PENDING_IMPORT;

    let createdExamId = null;
    try {
      let exam, positionOffset = 0;

      if (targetExamId) {
        const { data: existing, error: getErr } = await sb.from('exams')
          .select('*').eq('id', targetExamId).single();
        if (getErr) throw getErr;
        exam = existing;
        const { data: last } = await sb.from('questions')
          .select('position').eq('exam_id', exam.id).order('position', { ascending: false }).limit(1);
        positionOffset = last && last.length ? last[0].position + 1 : 0;
        const { error: upErr } = await sb.from('exams').update({
          total_questions: exam.total_questions + questions.length,
          updated_at: new Date().toISOString()
        }).eq('id', exam.id);
        if (upErr) throw upErr;
      } else {
        const { data: created, error: exErr } = await sb.from('exams').insert({
          user_id: CURRENT_USER.id,
          name: examName,
          source_file: (files || []).map(f => f.name).join(', ').slice(0, 500),
          total_questions: questions.length
        }).select().single();
        if (exErr) throw exErr;
        exam = created;
        createdExamId = created.id;
      }

      if (files && files.length) {
        await sb.from('imported_files').insert(files.map(f => ({
          user_id: CURRENT_USER.id, exam_id: exam.id,
          file_name: f.name, file_type: f.type, import_status: 'verified'
        })));
      }

      // 1. thèmes (une insertion pour tous)
      say('Enregistrement des thèmes…');
      const themeNames = [...new Set(questions.map(q => (q.theme || '').trim()).filter(Boolean))];
      const topicIds = new Map();
      const { data: existingTopics } = await sb.from('topics').select('id, name').eq('exam_id', exam.id);
      (existingTopics || []).forEach(t => topicIds.set(t.name, t.id));
      const missing = themeNames.filter(n => !topicIds.has(n));
      if (missing.length) {
        const { data: topics, error: tErr } = await sb.from('topics')
          .insert(missing.map(name => ({ user_id: CURRENT_USER.id, exam_id: exam.id, name: EDNParsers.sanitize(name) })))
          .select();
        if (tErr) throw tErr;
        topics.forEach(t => topicIds.set(t.name, t.id));
      }

      // 2. questions par lots de 100
      say('Enregistrement des questions…');
      const createdQuestions = [];
      // lots plus petits si des images sont embarquées (payload plus lourd)
      const hasImages = questions.some(q => q.images && q.images.length);
      const CHUNK = hasImages ? 20 : 100;
      for (let i = 0; i < questions.length; i += CHUNK) {
        const clean = (v) => (EDNParsers.sanitize ? EDNParsers.sanitize(v) : v) || null;
        const slice = questions.slice(i, i + CHUNK).map((q, k) => ({
          user_id: CURRENT_USER.id, exam_id: exam.id,
          topic_id: topicIds.get((q.theme || '').trim()) || null,
          question_number: (positionOffset + i + k + 1),
          question_text: clean(q.question_text) || '(énoncé à compléter)',
          question_type: q.question_type || 'qrm',
          position: positionOffset + i + k,
          student_initial_answer: clean(q.student_initial_answer),
          official_correction: clean(q.official_correction),
          explanation: clean(q.explanation),
          images: q.images || [],
          needs_review: !!q.needs_review
        }));
        const { data, error } = await sb.from('questions').insert(slice).select('id, position');
        if (error) throw error;
        createdQuestions.push(...data);
        say(`Enregistrement des questions… ${Math.min(i + CHUNK, questions.length)}/${questions.length}`);
      }

      // 3. propositions par lots de 500
      say('Enregistrement des propositions…');
      const byPosition = new Map(createdQuestions.map(r => [r.position - positionOffset, r.id]));
      const allOptions = [];
      questions.forEach((q, idx) => {
        const questionId = byPosition.get(idx);
        if (!questionId) return;
        (q.options || []).filter(o => o.text && o.text.trim()).forEach((o, oi) => {
          allOptions.push({
            user_id: CURRENT_USER.id, question_id: questionId,
            option_key: o.key || String.fromCharCode(65 + oi),
            option_text: EDNParsers.sanitize(o.text).trim(), is_correct: !!o.is_correct, position: oi
          });
        });
      });
      for (let i = 0; i < allOptions.length; i += 500) {
        const { error } = await sb.from('question_options').insert(allOptions.slice(i, i + 500));
        if (error) throw error;
        say(`Enregistrement des propositions… ${Math.min(i + 500, allOptions.length)}/${allOptions.length}`);
      }

      PENDING_IMPORT = null;
      location.hash = `#/exam/${exam.id}/train`;
    } catch (e) {
      console.error(e);
      say('');
      // un examen partiellement enregistré est supprimé pour éviter les doublons
      if (createdExamId) {
        try { await sb.from('exams').delete().eq('id', createdExamId).eq('user_id', CURRENT_USER.id); } catch (_) {}
      }
      alert('Erreur pendant l\'enregistrement : ' + (e.message || e) +
        '\n\nL\'examen incomplet a été supprimé, vous pouvez relancer l\'import.');
      btn.disabled = false;
      btn.textContent = 'Valider l\'import';
    }
  }

  // ---------------------------------------------------------------
  // ENTRAÎNEMENT (moteur principal)
  // ---------------------------------------------------------------
  // Deux sessions indépendantes par examen : l'examen principal et la révision
  // des erreurs. Réviser ses erreurs ne touche donc jamais à la position
  // atteinte dans l'examen.
  const RESUME_KEY = (examId, mode) => `edn_resume_${examId}_${mode === 'errors' ? 'errors' : 'exam'}`;
  const readResume = (examId, mode) => {
    try { return JSON.parse(localStorage.getItem(RESUME_KEY(examId, mode)) || 'null'); }
    catch (e) { return null; }
  };

  async function renderTrain(examId) {
    shell(skeleton(2), 'Entraînement');
    const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
    if (!exam) { shell(emptyState('Examen introuvable', '', '#/exams', 'Mes EDN'), 'Entraînement'); return; }
    renderTrainSetup(exam);
  }

  // Ordre des questions d'un examen.
  // Les questions de LCA demandent d'avoir l'article sous les yeux : elles sont
  // regroupées et renvoyées à la fin, après toutes les autres questions.
  // lcaMode : 'last' (défaut) | 'exclude' | 'only'
  async function getOrderedQuestionIds(examId, lcaMode) {
    const { data: qs } = await sb.from('questions')
      .select('id, topic_id').eq('exam_id', examId).order('position');
    const { data: topics } = await sb.from('topics').select('id, name').eq('exam_id', examId);
    const topicName = new Map((topics || []).map(t => [t.id, t.name || '']));

    // Filet de sécurité : certaines questions peuvent avoir perdu leur thème.
    // On repère alors les LCA au contexte inscrit dans l'énoncé lors de l'import.
    const { data: byText } = await sb.from('questions')
      .select('id').eq('exam_id', examId).ilike('question_text', '[Contexte LCA%');
    const lcaByText = new Set((byText || []).map(r => r.id));

    const isLCA = (q) => /\bLCA\d*\b/i.test(topicName.get(q.topic_id) || '') || lcaByText.has(q.id);

    const normal = [], lca = [];
    (qs || []).forEach(q => (isLCA(q) ? lca : normal).push(q.id));

    if (lcaMode === 'exclude') return { ids: normal, lcaCount: lca.length };
    if (lcaMode === 'only') return { ids: lca, lcaCount: lca.length };
    return { ids: normal.concat(lca), lcaCount: lca.length };
  }

  // Encart "Continuer l'examen" affiché quand une session est en cours
  function resumeCardHtml(exam, mode) {
    const saved = readResume(exam.id, mode);
    if (!saved || saved.cycleNumber !== exam.current_cycle || !saved.queue || saved.index >= saved.queue.length) return '';
    const when = saved.savedAt ? new Date(saved.savedAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';
    const pct = Math.round((saved.index / saved.queue.length) * 100);
    const title = mode === 'errors' ? 'Reprendre la révision' : "Continuer l'examen";
    return `<section class="card mb" style="border-color:var(--accent);">
      <div class="flex-between">
        <div style="min-width:0;">
          <h2>${title}</h2>
          <div class="small">Reprendre à la question ${saved.index + 1} / ${saved.queue.length}${when ? ' · interrompue le ' + when : ''}</div>
          ${saved.lcaOrdered ? '' : '<div class="small" style="color:var(--accent-600);margin-top:4px;">Les LCA restantes seront replacées en fin de session</div>'}
        </div>
        <span class="badge badge-accent">${pct}%</span>
      </div>
      <div class="bar accent" style="margin:14px 0;"><i style="width:${pct}%"></i></div>
      <div class="btn-row">
        <button class="btn btn-accent btn-lg" data-resume="${mode}">Reprendre</button>
        <button class="btn btn-sm" data-drop="${mode}">Abandonner</button>
      </div>
    </section>`;
  }

  // Une session enregistrée garde sa liste de questions figée. Si elle a été
  // créée avant la règle "LCA en fin de session", on réordonne la PARTIE
  // RESTANTE : les questions déjà répondues ne bougent pas, la progression et
  // les réponses enregistrées sont intactes.
  async function reorderPendingLCA(examId, saved) {
    if (!saved || !Array.isArray(saved.queue)) return saved;
    if (saved.lcaOrdered || saved.scope === 'errors') return saved;

    const { ids: lcaIds } = await getOrderedQuestionIds(examId, 'only');
    const lcaSet = new Set(lcaIds);
    const index = saved.index || 0;
    const done = saved.queue.slice(0, index);
    const tail = saved.queue.slice(index);
    const tailNormal = tail.filter(id => !lcaSet.has(id));
    const tailLca = tail.filter(id => lcaSet.has(id));
    const queue = done.concat(tailNormal, tailLca);

    const updated = Object.assign({}, saved, { queue, lcaOrdered: true });
    try { localStorage.setItem(RESUME_KEY(examId, saved.mode || 'exam'), JSON.stringify(updated)); } catch (e) {}
    return updated;
  }

  function wireResume(exam) {
    document.querySelectorAll('[data-resume]').forEach(btn => {
      btn.onclick = async () => {
        const mode = btn.dataset.resume;
        let saved = readResume(exam.id, mode);
        if (!saved) { renderTrainSetup(exam); return; }
        btn.disabled = true; btn.textContent = 'Préparation…';
        if (mode !== 'errors') saved = await reorderPendingLCA(exam.id, saved);
        startSession(exam, saved.scope, saved.count, saved.queue, saved.index,
          saved.sessionId, saved.correct || 0, saved.incorrect || 0, mode);
      };
    });
    document.querySelectorAll('[data-drop]').forEach(btn => {
      btn.onclick = () => {
        if (!confirm('Abandonner cette session en cours ?')) return;
        try { localStorage.removeItem(RESUME_KEY(exam.id, btn.dataset.drop)); } catch (e) {}
        location.hash.startsWith('#/exam/' + exam.id + '/mistakes') ? renderMistakes(exam.id) : renderTrainSetup(exam);
      };
    });
  }

  function renderTrainSetup(exam) {
    shell(`
      <h1>${esc(exam.name)}</h1>
      <p class="subtitle">Cycle ${exam.current_cycle} · ${exam.total_questions} questions</p>
      ${resumeCardHtml(exam, 'exam')}
      <div class="card">
        <h2>Nouvelle session</h2>
        <label for="scope">Sur quoi travailler</label>
        <select id="scope">
          <option value="all">Toutes les questions</option>
          <option value="errors">Uniquement mes erreurs du cycle</option>
          <option value="fragile">Questions fragiles</option>
          <option value="nonmastered">Questions non maîtrisées</option>
        </select>
        <label for="lca">Questions de LCA</label>
        <select id="lca">
          <option value="last" selected>À la fin de la session</option>
          <option value="exclude">Les exclure</option>
          <option value="only">Uniquement les LCA</option>
        </select>

        <label for="count">Nombre de questions</label>
        <select id="count">
          <option value="10">10 questions</option><option value="20">20 questions</option>
          <option value="50">50 questions</option><option value="100">100 questions</option>
          <option value="200">200 questions</option><option value="all" selected>Toutes</option>
        </select>
        <button class="btn btn-primary btn-lg btn-block mt" id="start-btn">Commencer l'entraînement</button>
      </div>
      <div class="btn-row mt">
        <a class="btn" href="#/exam/${exam.id}/mistakes">Mes erreurs</a>
        <a class="btn" href="#/exam/${exam.id}/exam-mode">Mode examen</a>
        <a class="btn" href="#/exam/${exam.id}/stats">Statistiques</a>
      </div>
    `, 'Entraînement');
    wireResume(exam);
    document.getElementById('start-btn').onclick = async () => {
      const btn = document.getElementById('start-btn');
      btn.disabled = true; btn.textContent = 'Préparation…';
      const scope = document.getElementById('scope').value, count = document.getElementById('count').value;
      // tri par position : les questions d'un même dossier progressif restent
      // groupées et dans leur ordre d'origine
      const allIds = (await sb.from('questions').select('id')
        .eq('exam_id', exam.id).order('position')).data.map(q => q.id);
      const latest = await EDNEngine.getLatestAttemptsForCycle(CURRENT_USER.id, exam.id, exam.current_cycle);
      const masteryMap = await EDNEngine.getMasteryMap(CURRENT_USER.id, exam.id);
      const queue = EDNEngine.buildQuestionSet(allIds, scope, latest, masteryMap, count);
      if (!queue.length) {
        btn.disabled = false; btn.textContent = "Commencer l'entraînement";
        alert('Aucune question ne correspond à cette sélection.'); return;
      }
      const { data: session } = await sb.from('study_sessions').insert({
        user_id: CURRENT_USER.id, exam_id: exam.id, cycle_number: exam.current_cycle,
        mode: 'entrainement', total_questions: queue.length
      }).select().single();
      startSession(exam, scope, count, queue, 0, session.id, 0, 0, 'exam');
    };
  }

  // Normalisation pour comparer une réponse libre (QROC) aux réponses acceptées
  function normAnswer(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').trim();
  }
  const SINGLE_TYPES = ['qru', 'qcm', 'qtcs'];

  async function startSession(exam, scope, count, queue, index, sessionId, correct, incorrect, mode) {
    mode = mode || (scope === 'errors' ? 'errors' : 'exam');
    if (index >= queue.length) { await finishSession(exam, sessionId, correct, incorrect, mode); return; }
    // position sauvegardée à chaque question : fermer Safari ne perd rien
    try {
      localStorage.setItem(RESUME_KEY(exam.id, mode), JSON.stringify({
        cycleNumber: exam.current_cycle, mode, scope, count, queue, index, sessionId, correct, incorrect,
        lcaOrdered: true, savedAt: Date.now()
      }));
    } catch (e) { /* stockage plein ou navigation privée : la session continue */ }

    const qId = queue[index];
    const { data: q } = await sb.from('questions').select('*, question_options(*)').eq('id', qId).single();
    const type = (q.question_type || 'qrm').toLowerCase();
    const isOpen = type === 'qroc';
    const isZone = type === 'qzone';
    const isSingle = SINGLE_TYPES.includes(type);
    const opts = (q.question_options || []).sort((a, b) => a.position - b.position);
    const correctKeys = opts.filter(o => o.is_correct).map(o => o.option_key).sort();
    const startTime = Date.now();

    const typeLabel = isOpen ? 'Réponse libre' : isZone ? 'Question sur image'
      : isSingle ? 'Une seule réponse' : 'Plusieurs réponses possibles';

    // Dossier progressif : position de la question dans son dossier.
    // Les questions d'un même dossier partagent le même topic_id et se suivent
    // par leur position d'origine dans le document.
    let dpBanner = '';
    if (q.topic_id && /DP\s*\d/i.test(q.theme || '')) {
      const { data: sibs } = await sb.from('questions')
        .select('id, position').eq('topic_id', q.topic_id).order('position');
      if (sibs && sibs.length > 1) {
        const rank = sibs.findIndex(x => x.id === q.id) + 1;
        if (rank > 0) {
          dpBanner = `<div class="q-type" style="background:var(--accent-100);color:var(--accent-600);">
            Dossier progressif ${esc(q.theme)} · question ${rank} / ${sibs.length}</div>`;
        }
      }
    }

    const images = Array.isArray(q.images) ? q.images : [];
    const imgTag = (im) => `<img src="${im.src}" alt="Illustration de la question" class="q-image" loading="lazy" />`;
    const mainImages = images.filter(im => !im.label).map(imgTag).join('');
    const imagesByOption = {};
    images.filter(im => im.label).forEach(im => {
      imagesByOption[im.label] = (imagesByOption[im.label] || '') + imgTag(im);
    });

    // L'énoncé peut contenir un contexte de dossier : on le met en retrait
    const parts = String(q.question_text || '').split('\n\n');
    const hasContext = parts.length > 1 && /^\[Contexte/.test(parts[0]);
    const contextHtml = hasContext
      ? `<div class="q-context">${esc(parts[0].replace(/^\[Contexte\s*[^\]]*\]\s*/, ''))}</div>` : '';
    const statementHtml = esc(hasContext ? parts.slice(1).join('\n\n') : q.question_text);

    let answerZone;
    if (isOpen) {
      answerZone = `<input type="text" id="open-answer" placeholder="Votre réponse"
        autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Votre réponse" />`;
    } else if (isZone || !opts.length) {
      answerZone = `<p class="small">Répondez mentalement sur l'image, puis indiquez si vous maîtrisiez la question.</p>`;
    } else {
      answerZone = opts.map(o => `
        <label class="option" data-key="${o.option_key}">
          <input type="${isSingle ? 'radio' : 'checkbox'}" name="opt" value="${o.option_key}" />
          <span class="key" aria-hidden="true">${o.option_key}</span>
          <span class="body">${esc(o.option_text)}${imagesByOption[o.option_key] || ''}</span>
        </label>`).join('');
    }

    const actionButtons = (isZone || (!isOpen && !opts.length))
      ? `<button class="btn btn-good btn-lg" id="self-ok">Je la maîtrisais</button>
         <button class="btn btn-lg" id="self-ko">Je ne la savais pas</button>`
      : `<button class="btn btn-primary btn-lg" id="validate-btn">Valider</button>`;

    const pct = Math.round((index / queue.length) * 100);

    shell(`
      <div class="question-shell">
        <div class="q-progress">
          <div class="row">
            <span>Question <b>${index + 1}</b> / ${queue.length}</span>
            <span>Cycle ${exam.current_cycle}</span>
          </div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>

        ${dpBanner}
        <span class="q-type">${typeLabel}${!dpBanner && q.theme ? ' · ' + esc(q.theme) : ''}</span>
        ${contextHtml}
        <div class="q-text">${statementHtml}</div>
        ${mainImages}
        <div id="options">${answerZone}</div>
        <div id="feedback-zone"></div>

        <div class="actionbar">
          <button class="btn btn-ghost" id="quit-btn">Quitter</button>
          ${actionButtons}
        </div>
      </div>
    `, 'Entraînement');

    // sélection visuelle des propositions
    document.querySelectorAll('.option').forEach(el => {
      const input = el.querySelector('input');
      if (!input) return;
      input.addEventListener('change', () => {
        if (isSingle) document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        el.classList.toggle('selected', input.checked);
      });
    });

    document.getElementById('quit-btn').onclick = () => { location.hash = `#/exam/${exam.id}/train`; renderTrainSetup(exam); };

    async function reveal(isCorrect, selected) {
      const responseTime = Math.round((Date.now() - startTime) / 1000);
      document.querySelectorAll('.option').forEach(el => {
        el.classList.add('disabled');
        const input = el.querySelector('input'); if (input) input.disabled = true;
        const key = el.dataset.key;
        if (correctKeys.includes(key)) el.classList.add('correct');
        else if (selected.includes(key)) el.classList.add('incorrect');
      });
      const openInput = document.getElementById('open-answer');
      if (openInput) openInput.disabled = true;

      await EDNEngine.recordAttempt({
        userId: CURRENT_USER.id, examId: exam.id, questionId: q.id, sessionId, cycleNumber: exam.current_cycle,
        selectedAnswers: selected, isCorrect, responseTime
      });

      const goodAnswers = opts.filter(o => o.is_correct)
        .map(o => isOpen ? esc(o.option_text) : '<strong>' + o.option_key + '.</strong> ' + esc(o.option_text));

      document.getElementById('feedback-zone').innerHTML = `
        <div class="verdict ${isCorrect ? 'good' : 'bad'}" role="status">
          <span class="mark"><span>${isCorrect ? '✓' : '✕'}</span></span>
          ${isCorrect ? 'Bonne réponse' : 'Mauvaise réponse'}
        </div>
        ${goodAnswers.length ? `<div class="explain">
          <h4>${isOpen ? 'Réponses acceptées' : 'Bonne(s) réponse(s)'}</h4>
          <p>${goodAnswers.join(isOpen ? ' · ' : '<br/>')}</p></div>` : ''}
        ${q.official_correction ? `<div class="explain"><h4>Correction officielle</h4><p>${esc(q.official_correction)}</p></div>` : ''}
        ${q.explanation ? `<div class="explain"><h4>Explication</h4><p>${esc(q.explanation)}</p></div>` : ''}
      `;
      ['validate-btn', 'self-ok', 'self-ko'].forEach(id => {
        const b = document.getElementById(id); if (b) b.style.display = 'none';
      });
      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn btn-primary btn-lg btn-block mt';
      nextBtn.textContent = index + 1 < queue.length ? 'Question suivante' : 'Terminer la session';
      nextBtn.onclick = () => startSession(exam, scope, count, queue, index + 1, sessionId,
        correct + (isCorrect ? 1 : 0), incorrect + (isCorrect ? 0 : 1), mode);
      document.getElementById('feedback-zone').appendChild(nextBtn);
    }

    const selfOk = document.getElementById('self-ok');
    if (selfOk) {
      selfOk.onclick = () => reveal(true, []);
      document.getElementById('self-ko').onclick = () => reveal(false, []);
    }

    const validateBtn = document.getElementById('validate-btn');
    if (validateBtn) {
      validateBtn.onclick = () => {
        if (isOpen) {
          const typed = document.getElementById('open-answer').value.trim();
          if (!typed) { alert('Écrivez votre réponse.'); return; }
          const isCorrect = opts.some(o => normAnswer(o.option_text) === normAnswer(typed));
          reveal(isCorrect, [typed]);
          return;
        }
        const selected = Array.from(document.querySelectorAll('input[name="opt"]:checked')).map(i => i.value);
        if (!selected.length) { alert('Sélectionnez au moins une réponse.'); return; }
        // QRU / TCS : une seule réponse, correcte si elle fait partie des réponses valides.
        // QRM / QRP : la sélection doit correspondre exactement aux réponses valides.
        const isCorrect = isSingle
          ? correctKeys.includes(selected[0])
          : JSON.stringify(selected.slice().sort()) === JSON.stringify(correctKeys);
        reveal(isCorrect, selected);
      };
      const openInput = document.getElementById('open-answer');
      if (openInput) {
        openInput.addEventListener('keydown', e => { if (e.key === 'Enter') validateBtn.click(); });
        openInput.focus();
      }
    }
  }

  async function finishSession(exam, sessionId, correct, incorrect, mode) {
    try { localStorage.removeItem(RESUME_KEY(exam.id, mode || 'exam')); } catch (e) {}
    await sb.from('study_sessions').update({
      correct_answers: correct, incorrect_answers: incorrect, completed_at: new Date().toISOString()
    }).eq('id', sessionId);

    const remainingErrors = await EDNEngine.countCurrentErrors(CURRENT_USER.id, exam.id, exam.current_cycle);

    if (remainingErrors === 0) {
      await sb.from('exams').update({ current_cycle: exam.current_cycle + 1, updated_at: new Date().toISOString() }).eq('id', exam.id);
      shell(`
        <div class="card center" style="padding:40px 24px;">
          ${ring(100, 104, 10, 'var(--good)', 'var(--good-100)')}
          <h1 style="margin-top:20px;">Cycle ${exam.current_cycle} terminé</h1>
          <p class="subtitle">Zéro erreur restante. Vous pouvez relancer un cycle complet.</p>
          <a class="btn btn-primary btn-lg btn-block" href="#/exam/${exam.id}/train">Commencer le cycle ${exam.current_cycle + 1}</a>
          <a class="btn btn-block mt" href="#/dashboard">Retour à l'accueil</a>
        </div>`, 'Cycle terminé');
    } else {
      const total = correct + incorrect;
      const score = total ? Math.round(correct / total * 100) : 0;
      shell(`
        <div class="card center" style="padding:36px 24px;">
          ${ring(score, 104, 10, 'var(--brand)', 'var(--brand-100)')}
          <h1 style="margin-top:20px;">Session terminée</h1>
          <p class="subtitle">${correct} bonne${correct > 1 ? 's' : ''} réponse${correct > 1 ? 's' : ''}, ${incorrect} erreur${incorrect > 1 ? 's' : ''}.</p>
        </div>
        <div class="card stat accent center">
          <div class="label">Il reste à revoir</div>
          <div class="value">${remainingErrors}</div>
        </div>
        <div class="btn-row mt">
          <a class="btn btn-primary btn-lg" href="#/exam/${exam.id}/mistakes">Réviser mes erreurs</a>
          <a class="btn btn-lg" href="#/dashboard">Accueil</a>
        </div>`, 'Session terminée');
    }
  }

  // ---------------------------------------------------------------
  // MES ERREURS
  // ---------------------------------------------------------------
  async function renderMistakes(examId) {
    shell(skeleton(2), 'Mes erreurs');
    const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
    if (!exam) { shell(emptyState('Examen introuvable', 'Il a peut-être été supprimé.', '#/exams', 'Mes EDN'), 'Mes erreurs'); return; }

    const { ids: allIds } = await getOrderedQuestionIds(examId, 'last');
    const latest = await EDNEngine.getLatestAttemptsForCycle(CURRENT_USER.id, examId, exam.current_cycle);
    const errorIds = allIds.filter(id => latest.has(id) && latest.get(id) === false);
    const masteryMap = await EDNEngine.getMasteryMap(CURRENT_USER.id, examId);

    if (!errorIds.length) {
      shell(`<h1>Mes erreurs</h1><p class="subtitle">${esc(exam.name)} · cycle ${exam.current_cycle}</p>
        ${emptyState('Aucune erreur en attente',
          'Toutes les questions déjà vues dans ce cycle sont justes. Continuez l\'entraînement pour terminer le cycle.',
          `#/exam/${examId}/train`, 'Continuer l\'entraînement', 'target')}`, 'Mes erreurs');
      return;
    }

    // aperçu des questions en erreur (les 20 premières, pour rester léger sur mobile)
    const preview = errorIds.slice(0, 20);
    const { data: qs } = await sb.from('questions')
      .select('id, question_number, question_text, topic_id').in('id', preview);
    const byId = new Map((qs || []).map(q => [q.id, q]));

    shell(`
      <h1>Mes erreurs</h1>
      <p class="subtitle">${esc(exam.name)} · cycle ${exam.current_cycle}</p>

      ${resumeCardHtml(exam, 'errors')}
      <section class="card stat accent center mb" style="padding:28px;">
        <div class="label">Questions à revoir</div>
        <div class="value" style="font-size:2.6rem;">${errorIds.length}</div>
      </section>
      <button class="btn btn-primary btn-lg btn-block mb" id="review-btn">Réviser mes erreurs (nouvelle session)</button>

      <h2 class="mb">Aperçu</h2>
      ${preview.map(id => {
        const q = byId.get(id); if (!q) return '';
        const m = masteryMap.get(id) || {};
        const st = m.status || 'a_apprendre';
        const txt = String(q.question_text || '').split('\n\n').pop();
        return `<a class="card card-tight" href="#/question/${q.id}" style="display:block;">
          <div class="flex-between" style="align-items:flex-start;">
            <div class="small" style="font-family:var(--font-mono);">Q${q.question_number ?? '?'}</div>
            <span class="badge badge-${st}">${STATUS_LABEL[st] || st}</span>
          </div>
          <p style="margin:8px 0 6px;font-size:.94rem;color:var(--ink);">${esc(txt.slice(0, 150))}${txt.length > 150 ? '…' : ''}</p>
          <div class="small">${m.total_incorrect || 0} erreur(s) · ${m.total_attempts || 0} tentative(s) · voir le détail</div>
        </a>`;
      }).join('')}
      ${errorIds.length > preview.length ? `<p class="small center mt">+ ${errorIds.length - preview.length} autres questions dans la session</p>` : ''}
    `, 'Mes erreurs');

    wireResume(exam);
    document.getElementById('review-btn').onclick = async (e) => {
      e.preventDefault();
      const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Préparation…';
      const { data: session } = await sb.from('study_sessions').insert({
        user_id: CURRENT_USER.id, exam_id: examId, cycle_number: exam.current_cycle,
        mode: 'erreurs', total_questions: errorIds.length
      }).select().single();
      startSession(exam, 'errors', 'all', errorIds, 0, session.id, 0, 0, 'errors');
    };
  }

  // ---------------------------------------------------------------
  // STATISTIQUES (par thème)
  // ---------------------------------------------------------------
  async function renderStats(examId) {
    shell(skeleton(3), 'Statistiques');
    const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
    if (!exam) { shell(emptyState('Examen introuvable', '', '#/exams', 'Mes EDN'), 'Statistiques'); return; }

    const masteryMap = await EDNEngine.getMasteryMap(CURRENT_USER.id, examId);
    const counts = { maitrisee: 0, en_cours: 0, fragile: 0, a_apprendre: 0 };
    masteryMap.forEach(m => { if (counts[m.status] !== undefined) counts[m.status]++; });
    const seen = counts.maitrisee + counts.en_cours + counts.fragile + counts.a_apprendre;
    const untouched = Math.max(0, exam.total_questions - seen);

    const { data: attempts } = await sb.from('attempts')
      .select('is_correct, answered_at').eq('exam_id', examId).eq('user_id', CURRENT_USER.id)
      .order('answered_at');
    const total = (attempts || []).length;
    const rate = total ? Math.round(attempts.filter(a => a.is_correct).length / total * 100) : 0;

    // évolution : taux de réussite par jour d'activité (données réelles)
    const perDay = new Map();
    (attempts || []).forEach(a => {
      const d = new Date(a.answered_at).toISOString().slice(0, 10);
      if (!perDay.has(d)) perDay.set(d, { ok: 0, n: 0 });
      const e = perDay.get(d); e.n++; if (a.is_correct) e.ok++;
    });
    const days = [...perDay.entries()].slice(-14);

    // courbe SVG responsive (viewBox, aucune largeur fixe)
    let chart = '';
    if (days.length >= 2) {
      const W = 300, H = 90, pad = 6;
      const pts = days.map(([, v], i) => {
        const x = pad + (i * (W - pad * 2)) / (days.length - 1);
        const y = H - pad - ((v.ok / v.n) * (H - pad * 2));
        return [x, y];
      });
      const line = pts.map((pt, i) => (i ? 'L' : 'M') + pt[0].toFixed(1) + ' ' + pt[1].toFixed(1)).join(' ');
      const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
      chart = `<div class="card mb">
        <h2>Évolution du taux de réussite</h2>
        <p class="small">${days.length} derniers jours d'activité</p>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="110" role="img"
             aria-label="Évolution du taux de réussite">
          <path d="${area}" fill="var(--brand-50)"/>
          <path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="flex-between small"><span>${days[0][0].slice(8) + '/' + days[0][0].slice(5, 7)}</span>
          <span>${days[days.length - 1][0].slice(8) + '/' + days[days.length - 1][0].slice(5, 7)}</span></div>
      </div>`;
    }

    // répartition des questions (barre empilée)
    const segs = [
      { n: counts.maitrisee, c: 'var(--good)', label: 'Maîtrisées' },
      { n: counts.en_cours, c: 'var(--brand)', label: 'En cours' },
      { n: counts.fragile, c: 'var(--warn)', label: 'Fragiles' },
      { n: counts.a_apprendre, c: 'var(--bad)', label: 'À apprendre' },
      { n: untouched, c: 'var(--idle)', label: 'Non travaillées' }
    ].filter(x => x.n > 0);
    const segTotal = segs.reduce((n, x) => n + x.n, 0) || 1;

    // performances par thème
    const { data: topics } = await sb.from('topics').select('id, name').eq('exam_id', examId);
    const rows = [];
    for (const t of (topics || [])) {
      const { data: qs } = await sb.from('questions').select('id').eq('topic_id', t.id);
      const qIds = (qs || []).map(q => q.id);
      if (!qIds.length) continue;
      const { data: att } = await sb.from('attempts').select('is_correct')
        .eq('exam_id', examId).eq('user_id', CURRENT_USER.id).in('question_id', qIds);
      rows.push({
        name: t.name, n: (att || []).length,
        rate: (att || []).length ? Math.round(att.filter(a => a.is_correct).length / att.length * 100) : null
      });
    }
    rows.sort((a, b) => (a.rate === null) - (b.rate === null) || (a.rate - b.rate));

    const mastPct = exam.total_questions ? Math.round(counts.maitrisee / exam.total_questions * 100) : 0;

    shell(`
      <h1>Statistiques</h1>
      <p class="subtitle">${esc(exam.name)} · cycle ${exam.current_cycle}</p>

      <section class="card mb" style="display:flex;align-items:center;gap:20px;">
        ${ring(mastPct, 96, 10, 'var(--brand)', 'var(--brand-100)')}
        <div style="min-width:0;">
          <h2>Maîtrise</h2>
          <p class="small" style="margin:0;">${counts.maitrisee} question${counts.maitrisee > 1 ? 's' : ''} maîtrisée${counts.maitrisee > 1 ? 's' : ''} sur ${exam.total_questions}</p>
        </div>
      </section>

      <div class="grid grid-2 mb">
        <div class="card stat"><div class="label">Réponses</div><div class="value">${total}</div></div>
        <div class="card stat"><div class="label">Réussite</div><div class="value">${rate}<small>%</small></div></div>
        <div class="card stat"><div class="label">Fragiles</div><div class="value">${counts.fragile}</div></div>
        <div class="card stat"><div class="label">Non vues</div><div class="value">${untouched}</div></div>
      </div>

      ${chart}

      <div class="card mb">
        <h2>Répartition des questions</h2>
        <div style="display:flex;height:14px;border-radius:999px;overflow:hidden;margin:14px 0 4px;">
          ${segs.map(x => `<i style="width:${(x.n / segTotal * 100).toFixed(1)}%;background:${x.c};display:block;"></i>`).join('')}
        </div>
        <div class="legend">
          ${segs.map(x => `<span><i style="background:${x.c}"></i>${x.label} · ${x.n}</span>`).join('')}
        </div>
      </div>

      <div class="card">
        <h2>Par thème</h2>
        <p class="small">Calculé à partir de vos réponses, sans aucune estimation.</p>
        <div style="margin-top:16px;">
        ${rows.length ? rows.map(r => `
          <div class="hbar">
            <div class="top"><span class="name">${esc(r.name)}</span>
              <b>${r.rate === null ? '—' : r.rate + '%'}</b></div>
            <div class="bar ${r.rate === null ? '' : r.rate >= 70 ? 'good' : 'accent'}">
              <i style="width:${r.rate || 0}%"></i></div>
            <div class="small" style="margin-top:4px;">${r.n} réponse${r.n > 1 ? 's' : ''}</div>
          </div>`).join('') : '<p class="small">Aucun thème identifié dans cet import.</p>'}
        </div>
      </div>

      <a class="btn btn-block mt" href="#/exam/${examId}/train">Retour à l'entraînement</a>
    `, 'Statistiques');
  }

  // ---------------------------------------------------------------
  // MODE EXAMEN (chronométré, sans correction immédiate)
  // ---------------------------------------------------------------
  async function renderExamModeSetup(examId) {
    shell(skeleton(2));
    const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
    shell(`
      <h1>Mode examen</h1>
      <p class="subtitle">${esc(exam.name)} — sans correction immédiate</p>
      <div class="card">
        <label>Nombre de questions</label>
        <select id="ex-count"><option>10</option><option>20</option><option>50</option><option selected>100</option><option value="all">Toutes</option></select>
        <label>Durée (minutes, 0 = illimité)</label>
        <input type="number" id="ex-duration" value="0" />
        <button class="btn btn-primary btn-lg btn-block mt" id="ex-start">Démarrer le mode examen</button>
      </div>
    `, 'Mode examen');
    document.getElementById('ex-start').onclick = async () => {
      const count = document.getElementById('ex-count').value;
      const duration = Number(document.getElementById('ex-duration').value) || 0;
      // ordre d'origine : dossiers progressifs groupés, LCA en fin d'épreuve
      const { ids: all } = await getOrderedQuestionIds(examId, 'last');
      let ids = all;
      if (count !== 'all') ids = ids.slice(0, Number(count));
      const { data: session } = await sb.from('study_sessions').insert({
        user_id: CURRENT_USER.id, exam_id: examId, cycle_number: exam.current_cycle, mode: 'examen', total_questions: ids.length
      }).select().single();
      runExamMode(exam, ids, 0, {}, session.id, duration, Date.now());
    };
  }

  async function runExamMode(exam, ids, index, answers, sessionId, durationMin, startedAt) {
    if (index >= ids.length) { finishExamMode(exam, ids, answers, sessionId); return; }
    const { data: q } = await sb.from('questions').select('*, question_options(*)').eq('id', ids[index]).single();
    const isMultiple = q.question_type === 'qcm_multiple';
    const remainingMs = durationMin ? durationMin * 60000 - (Date.now() - startedAt) : null;

    const exImages = Array.isArray(q.images) ? q.images : [];
    const pctEx = Math.round((index / ids.length) * 100);
    shell(`
      <div class="question-shell">
        <div class="q-progress">
          <div class="row">
            <span>Question <b>${index + 1}</b> / ${ids.length}</span>
            ${durationMin ? `<span id="timer" style="font-family:var(--font-mono);color:var(--accent-600);">--:--</span>` : '<span>Mode examen</span>'}
          </div>
          <div class="bar accent"><i style="width:${pctEx}%"></i></div>
        </div>
        <div class="q-text">${esc(q.question_text)}</div>
        ${exImages.filter(im => !im.label).map(im => `<img src="${im.src}" class="q-image" alt="Illustration" loading="lazy"/>`).join('')}
        <div id="options">
          ${q.question_options.sort((a, b) => a.position - b.position).map(o => `
            <label class="option${(answers[q.id] || []).includes(o.option_key) ? ' selected' : ''}" data-key="${o.option_key}">
              <input type="${isMultiple ? 'checkbox' : 'radio'}" name="opt" value="${o.option_key}" ${(answers[q.id] || []).includes(o.option_key) ? 'checked' : ''} />
              <span class="key" aria-hidden="true">${o.option_key}</span>
              <span class="body">${esc(o.option_text)}${exImages.filter(im => im.label === o.option_key).map(im => `<img src="${im.src}" class="q-image" alt="Illustration" loading="lazy"/>`).join('')}</span>
            </label>`).join('')}
        </div>
        <div class="actionbar">
          <button class="btn" id="prev-btn" ${index === 0 ? 'disabled' : ''}>Précédent</button>
          <button class="btn btn-primary" id="next-btn">${index + 1 < ids.length ? 'Suivant' : 'Terminer'}</button>
        </div>
      </div>
    `, 'Mode examen');
    document.querySelectorAll('.option').forEach(el => {
      const input = el.querySelector('input');
      input.addEventListener('change', () => {
        if (!isMultiple) document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        el.classList.toggle('selected', input.checked);
      });
    });
    function collect() {
      answers[q.id] = Array.from(document.querySelectorAll('input[name="opt"]:checked')).map(i => i.value);
    }
    document.getElementById('prev-btn').onclick = () => { collect(); runExamMode(exam, ids, index - 1, answers, sessionId, durationMin, startedAt); };
    document.getElementById('next-btn').onclick = () => { collect(); runExamMode(exam, ids, index + 1, answers, sessionId, durationMin, startedAt); };

    if (durationMin) {
      const timerEl = document.getElementById('timer');
      const tick = () => {
        const left = durationMin * 60000 - (Date.now() - startedAt);
        if (left <= 0) { collect(); finishExamMode(exam, ids, answers, sessionId); return; }
        const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
        timerEl.textContent = `${m}:${String(s).padStart(2, '0')}`;
        window._examTimer = setTimeout(tick, 1000);
      };
      clearTimeout(window._examTimer);
      tick();
    }
  }

  async function finishExamMode(exam, ids, answers, sessionId) {
    clearTimeout(window._examTimer);
    let correct = 0;
    const results = [];
    for (const qId of ids) {
      const { data: q } = await sb.from('questions').select('*, question_options(*)').eq('id', qId).single();
      const correctKeys = q.question_options.filter(o => o.is_correct).map(o => o.option_key).sort();
      const selected = (answers[qId] || []).sort();
      const isCorrect = JSON.stringify(selected) === JSON.stringify(correctKeys);
      if (isCorrect) correct++;
      await EDNEngine.recordAttempt({
        userId: CURRENT_USER.id, examId: exam.id, questionId: qId, sessionId, cycleNumber: exam.current_cycle,
        selectedAnswers: selected, isCorrect
      });
      results.push({ q, isCorrect, selected, correctKeys });
    }
    await sb.from('study_sessions').update({ correct_answers: correct, incorrect_answers: ids.length - correct, completed_at: new Date().toISOString() }).eq('id', sessionId);
    const score = Math.round((correct / ids.length) * 100);
    shell(`
      <div class="card center" style="padding:36px 24px;">
        ${ring(score, 112, 11, score >= 50 ? 'var(--good)' : 'var(--accent)', 'var(--idle-100)')}
        <h1 style="margin-top:20px;">Score : ${score}%</h1>
        <p class="subtitle">${correct} bonne${correct > 1 ? 's' : ''} réponse${correct > 1 ? 's' : ''} · ${ids.length - correct} erreur${(ids.length - correct) > 1 ? 's' : ''}</p>
      </div>
      <div class="btn-row mt">
        <a class="btn btn-primary btn-lg" href="#/exam/${exam.id}/mistakes">Voir mes erreurs</a>
        <a class="btn btn-lg" href="#/dashboard">Accueil</a>
      </div>
    `, 'Résultat');
  }

  // ---------------------------------------------------------------
  // ROUTER
  // ---------------------------------------------------------------
  async function route() {
    const { data: { session } } = await sb.auth.getSession();
    CURRENT_USER = session ? session.user : null;
    const hash = location.hash || '#/dashboard';

    if (!CURRENT_USER) { renderLogin(); return; }
    if (hash === '#/' || hash === '') { location.hash = '#/dashboard'; return; }

    let m;
    if (hash.startsWith('#/dashboard')) return renderDashboard();
    if (hash.startsWith('#/exams')) return renderExams();
    if (hash.startsWith('#/revise')) return renderRevise();
    if (hash.startsWith('#/list/mastered')) return renderQuestionList('mastered');
    if (hash.startsWith('#/list/review')) return renderQuestionList('review');
    if ((m = hash.match(/^#\/question\/([^/]+)/))) return renderQuestionDetail(m[1]);
    if (hash.startsWith('#/stats')) return renderStatsHub();
    if (hash === '#/import') return renderImport();
    if (hash === '#/import/verify') return renderImportVerify();
    if ((m = hash.match(/^#\/exam\/([^/]+)\/train/))) return renderTrain(m[1]);
    if ((m = hash.match(/^#\/exam\/([^/]+)\/mistakes/))) return renderMistakes(m[1]);
    if ((m = hash.match(/^#\/exam\/([^/]+)\/stats/))) return renderStats(m[1]);
    if ((m = hash.match(/^#\/exam\/([^/]+)\/exam-mode/))) return renderExamModeSetup(m[1]);
    renderDashboard();
  }

  function init() {
    window.addEventListener('hashchange', route);
    sb.auth.onAuthStateChange(() => route());
    route();
  }

  return { init };
})();

document.addEventListener('DOMContentLoaded', function () { if (window.EDN_BOOT()) App.init(); });

</script>
</body>
</html>
