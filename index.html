<script>
// =====================================================================
// PARSERS — extraction locale, sans aucune IA ni API payante.
// Chaque parseur retourne un tableau d'objets "ParsedQuestion" :
// {
//   question_number, question_text, question_type,
//   options: [{key:'A', text:'...', is_correct:bool}, ...],
//   official_correction, explanation, theme,
//   needs_review: bool, review_reason: string
// }
// Règle d'or : ne jamais inventer. Si une donnée est incertaine,
// needs_review = true et le champ manquant reste vide.
// =====================================================================

const EDNParsers = (() => {

  const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];

  // PostgreSQL refuse les caractères nuls et les séquences Unicode invalides.
  // Les polices CID de certains PDF en produisent lorsqu'un glyphe n'a pas
  // d'équivalent Unicode : on les retire dès l'extraction.
  function sanitize(str) {
    return String(str == null ? '' : str)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
      .replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, '')
      .replace(/(^|[^\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '$1');
  }

  function emptyQuestion(num) {
    return {
      question_number: num ?? null,
      question_text: '',
      question_type: 'qcm',
      options: [],
      student_initial_answer: '',
      official_correction: '',
      explanation: '',
      theme: '',
      needs_review: false,
      review_reason: ''
    };
  }

  function flagReview(q, reason) {
    q.needs_review = true;
    q.review_reason = q.review_reason ? q.review_reason + ' ; ' + reason : reason;
    return q;
  }

  // =============================================================
  // 1. CSV / XLSX — gabarit de colonnes
  // =============================================================
  const COLUMN_ALIASES = {
    numero: ['numero', 'numéro', 'num', 'n', 'question_number'],
    question: ['question', 'enonce', 'énoncé', 'question_text'],
    type: ['type', 'question_type'],
    theme: ['theme', 'thème', 'item'],
    reponse_correcte: ['reponse_correcte', 'réponse correcte', 'reponses_correctes',
      'bonne_reponse', 'bonnes_reponses', 'correct_answer', 'correct_answers'],
    reponse_etudiant: ['reponse_etudiant', 'réponse étudiant', 'ma_reponse', 'student_answer'],
    correction: ['correction', 'official_correction'],
    explication: ['explication', 'explanation']
  };

  function normalizeHeader(h) {
    return String(h || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function matchColumn(headers, aliases) {
    const normalized = headers.map(normalizeHeader);
    for (const alias of aliases) {
      const idx = normalized.indexOf(normalizeHeader(alias));
      if (idx !== -1) return headers[idx];
    }
    return null;
  }

  function rowsToQuestions(rows) {
    if (!rows.length) return [];
    const headers = Object.keys(rows[0]);
    const col = {};
    for (const key in COLUMN_ALIASES) col[key] = matchColumn(headers, COLUMN_ALIASES[key]);

    const optionCols = {};
    LETTERS.forEach(L => {
      optionCols[L] = matchColumn(headers, [`option_${L.toLowerCase()}`, `proposition_${L.toLowerCase()}`, `option ${L.toLowerCase()}`]);
    });

    return rows.map((row, i) => {
      const q = emptyQuestion(col.numero ? row[col.numero] : i + 1);
      q.question_text = col.question ? String(row[col.question] ?? '').trim() : '';
      if (!q.question_text) flagReview(q, 'énoncé manquant');
      if (col.type) q.question_type = String(row[col.type] || 'qcm').trim().toLowerCase();
      if (col.theme) q.theme = String(row[col.theme] || '').trim();
      if (col.reponse_etudiant) q.student_initial_answer = String(row[col.reponse_etudiant] || '').trim();
      if (col.correction) q.official_correction = String(row[col.correction] || '').trim();
      if (col.explication) q.explanation = String(row[col.explication] || '').trim();

      const correctRaw = col.reponse_correcte ? String(row[col.reponse_correcte] || '').toUpperCase() : '';
      const correctLetters = correctRaw.split(/[,;\/\s]+/).filter(Boolean);
      if (!correctLetters.length) flagReview(q, 'bonne réponse non identifiée');

      let hasAnyOption = false;
      LETTERS.forEach(L => {
        const c = optionCols[L];
        if (c && row[c] !== undefined && String(row[c]).trim() !== '') {
          hasAnyOption = true;
          q.options.push({ key: L, text: String(row[c]).trim(), is_correct: correctLetters.includes(L) });
        }
      });
      if (!hasAnyOption) flagReview(q, 'aucune proposition détectée');
      if (q.options.length > 1) q.question_type = correctLetters.length > 1 ? 'qrm' : 'qru';
      return q;
    });
  }

  async function parseCSV(file) {
    return new Promise((resolve, reject) => {
      Papa.parse(file, {
        header: true, skipEmptyLines: true,
        complete: (res) => resolve(rowsToQuestions(res.data)),
        error: reject
      });
    });
  }

  async function parseXLSX(file) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
    return rowsToQuestions(rows);
  }

  // =============================================================
  // 2. FORMAT "CORRIGÉ EDN" (export type EDNp / UNESS)
  //    Reconnu par : "Element d'épreuve:" et "Question N: (Type: XXX)"
  //    Statuts : Valide / Indispensable = bonne réponse
  //              Faux / Inacceptable    = mauvaise réponse
  // =============================================================
  const SINGLE_TYPES = ['QRU', 'QTCS'];
  const OPEN_TYPES = ['QROC'];

  function looksLikeEDNCorrige(text) {
    return /Question\s+\d+\s*:\s*\(\s*Type\s*:/i.test(text) &&
           /(Element d'épreuve|Valide|Faux)/i.test(text);
  }

  function stripFooters(raw) {
    let t = raw.replace(/\r/g, '');
    t = t.replace(/Référence\s*:\s*[^\n]*/gi, '\n');
    t = t.replace(/Date de création\s*:?/gi, '\n');
    t = t.replace(/\d{4}-\d{2}-\d{2}-\d{2}:\d{2}:\d{2}/g, '\n');
    t = t.replace(/Version\s*:\s*\d+\s*/gi, '\n');
    t = t.replace(/Page\s*:\s*\d+\s*\/\s*\d+/gi, '\n');
    return t;
  }

  const RE_SECTION = /^Element d'épreuve\s*:\s*(\S+)/i;
  const RE_QSTART = /^Question\s+(\d+)\s*:\s*\(\s*Type\s*:\s*([A-Za-z]+)\s*\)\s*(.*)$/i;
  const RE_OPT_FULL = /^[☐◎□○●■\s]*(Valide|Faux|Indispensable|Inacceptable)\s+([A-J])\s*[.)]\s*(.*)$/i;
  const RE_OPT_STATUS = /^[☐◎□○●■\s]*(Valide|Faux|Indispensable|Inacceptable)\s*$/i;
  const RE_OPT_LETTER = /^([A-J])\s*[.)]\s*(.*)$/;
  const RE_ANSWERS_HEADER = /^R[ée]ponses?\s+valides?\s*:/i;
  const RE_ZONE_ALL = /Zone\s*(\d+)\s*:\s*(Valide|Faux)\s*(?:\d+(?:[.,]\d+)?)?/gi;
  const RE_ZONE_HEADER = /^(Marqueurs|Statut|Pondération)(\s|$)/i;
  const RE_ANSWER_ITEM = /^[•\-\*\s]*(.+?)\s*\(\s*(\d+(?:[.,]\d+)?)\s*\)\s*$/;
  const RE_FOOTER_LINE = /^(Référence\s*:|Date de création|Version\s*:|Page\s*:|Epreuve\s*:|\d{4}-\d{2}-\d{2}-\d{2}:\d{2}:\d{2})/i;
  const RE_NOISE = /^([☐◎□○●■]|\(|\)|ème|eme|ère|ere|er|re|e|\d{1,2}|Marqueurs|Statut|Pondération|Zone \d+\s*:\s*\w+)$/i;

  function isCorrectStatus(s) {
    const v = s.toLowerCase();
    return v === 'valide' || v === 'indispensable';
  }

  function parseEDNCorrige(rawText) {
    const lines = stripFooters(rawText).split('\n').map(l => l.trim()).filter(l => l.length);

    const questions = [];
    let section = '';
    let sectionIntro = [];
    let cur = null;
    let mode = 'intro';
    let pendingStatus = null;
    let inComment = false;

    function finalizeQuestion(c) {
      const q = c.q;
      q.question_text = c.enonce.join(' ').replace(/\s+/g, ' ').trim();
      if (c.intro && c.intro.length) {
        q.question_text = '[Contexte ' + c.section + '] ' +
          c.intro.join(' ').replace(/\s+/g, ' ').trim() + '\n\n' + q.question_text;
      }
      q.explanation = c.explanation.join(' ').replace(/\s+/g, ' ').trim();
      q.options.forEach(o => { o.text = o.text.replace(/\s+/g, ' ').trim(); });
      q.options = q.options.filter(o => o.text.length);

      const type = c.rawType.toUpperCase();
      if (OPEN_TYPES.includes(type)) {
        q.question_type = 'qroc';
        q.options = c.answers.map((a, i) => ({ key: 'R' + (i + 1), text: a, is_correct: true }));
        if (!q.options.length) flagReview(q, 'aucune réponse attendue trouvée');
      } else if (SINGLE_TYPES.includes(type)) {
        q.question_type = 'qru';
      } else if (type === 'QZONE') {
        q.question_type = 'qzone';
        if (c.zones && c.zones.length) {
          q.official_correction = 'Zones attendues sur l\'image — ' +
            c.zones.map(z => 'Zone ' + z.num + (z.label ? ' : ' + z.label : '')).join(' ; ');
        }
      } else {
        q.question_type = 'qrm';
      }

      if (!q.question_text) flagReview(q, 'énoncé non identifié');
      if (q.question_type === 'qru' || q.question_type === 'qrm') {
        if (!q.options.length) flagReview(q, 'aucune proposition détectée');
        else if (!q.options.some(o => o.is_correct)) flagReview(q, 'aucune bonne réponse identifiée');
      }
      // Une question n'est signalée que si une IMAGE est réellement affichée
      // dans le document (PDF.js n'extrait que le texte).
      const IMG_WORD = '\\b(radiographies?|scanner|IRM|[ée]chographie|frottis|photographies?|clich[ée]s?|images?|iconographie|TDM)\\b';
      const IMG_CUE = '\\b(suivante?s?|ci-joint|ci-dessous|ci-contre|r[ée]alis[ée]|voici)\\b';
      const displayed =
        new RegExp(IMG_WORD + '[^.]{0,80}' + IMG_CUE, 'i').test(q.question_text) ||
        new RegExp(IMG_CUE + '[^.]{0,40}' + IMG_WORD, 'i').test(q.question_text) ||
        /\b(cette|ce)\s+(anomalie|image|l[ée]sion|clich[ée]|photographie)\b/i.test(q.question_text) ||
        q.options.some(o => /proposition illustrée par une image/i.test(o.text));
      if (q.question_type !== 'qzone' && displayed) {
        flagReview(q, 'une image accompagne cette question : vérifiez qu\'elle reste compréhensible sans');
      }
      q.theme = c.section || '';
    }

    function pushCurrent() {
      if (!cur) return;
      finalizeQuestion(cur);
      questions.push(cur.q);
      cur = null;
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      if (line === '(') { inComment = true; continue; }
      if (line === ')') { inComment = false; continue; }
      if (inComment) { if (cur) cur.explanation.push(line); continue; }

      const mSec = line.match(RE_SECTION);
      if (mSec) {
        pushCurrent();
        section = mSec[1];
        sectionIntro = [];
        mode = 'intro';
        continue;
      }

      const mQ = line.match(RE_QSTART);
      if (mQ) {
        pushCurrent();
        const q = emptyQuestion(questions.length + 1);
        cur = {
          q, rawType: mQ[2], section,
          // le contexte de section (vignette de dossier, article de LCA,
          // situation de TCS) est rappelé au-dessus de chaque question
          intro: sectionIntro.slice(),
          enonce: [], explanation: [], answers: [], zones: [],
          inZoneTable: false, pendingZoneLabel: ''
        };
        const tail = (mQ[3] || '').trim();
        if (tail && !/^(0\/1|Non corrigé|\d+([.,]\d+)?\/\d+)$/i.test(tail)) cur.enonce.push(tail);
        mode = 'enonce';
        pendingStatus = null;
        continue;
      }

      if (RE_ANSWERS_HEADER.test(line)) { mode = 'answers'; continue; }

      if (!cur) {
        if (mode === 'intro' && !RE_NOISE.test(line)) sectionIntro.push(line);
        continue;
      }

      const mOpt = line.match(RE_OPT_FULL);
      if (mOpt) {
        cur.q.options.push({ key: mOpt[2].toUpperCase(), text: mOpt[3] || '', is_correct: isCorrectStatus(mOpt[1]) });
        mode = 'options';
        pendingStatus = null;
        continue;
      }

      const mStatus = line.match(RE_OPT_STATUS);
      if (mStatus) { pendingStatus = mStatus[1]; continue; }
      if (pendingStatus) {
        const mLetter = line.match(RE_OPT_LETTER);
        if (mLetter) {
          cur.q.options.push({
            key: mLetter[1].toUpperCase(),
            text: (mLetter[2] || '(proposition illustrée par une image)').trim(),
            is_correct: isCorrectStatus(pendingStatus)
          });
          mode = 'options';
          pendingStatus = null;
          continue;
        }
        pendingStatus = null;
      }

      if (mode === 'answers') {
        const mAns = line.match(RE_ANSWER_ITEM);
        if (mAns) {
          if (parseFloat(mAns[2].replace(',', '.')) > 0) cur.answers.push(mAns[1].trim());
          continue;
        }
        mode = 'explanation';
        cur.explanation.push(line);
        continue;
      }

      // question à zones : le tableau de marqueurs décrit les bonnes réponses.
      // Le libellé de la zone est imprimé juste avant (ou après) sa ligne "Zone N".
      if (RE_ZONE_HEADER.test(line)) { cur.inZoneTable = true; continue; }
      // une même ligne peut contenir plusieurs zones, chacune suivie de son
      // libellé : "Zone 2: Valide 1 lésion osteo chondrale ◎ Zone 1: Valide 1 …"
      RE_ZONE_ALL.lastIndex = 0;
      const zoneMatches = [];
      let mz;
      while ((mz = RE_ZONE_ALL.exec(line)) !== null) {
        zoneMatches.push({ num: mz[1], status: mz[2], start: mz.index, end: mz.index + mz[0].length });
      }
      if (zoneMatches.length) {
        cur.inZoneTable = true;
        zoneMatches.forEach((z, zi) => {
          if (!/valide/i.test(z.status)) return;
          const stop = zi + 1 < zoneMatches.length ? zoneMatches[zi + 1].start : line.length;
          const inline = line.slice(z.end, stop).replace(/[☐◎□○●■]/g, '').trim();
          cur.zones.push({ num: z.num, label: inline || cur.pendingZoneLabel || '' });
        });
        cur.pendingZoneLabel = '';
        continue;
      }
      // dans le tableau de zones, une ligne sans "Zone N" est le libellé
      // de la zone précédente (ou de la suivante si celle-ci n'existe pas encore)
      if (cur.inZoneTable) {
        const last = cur.zones[cur.zones.length - 1];
        if (last && !last.label) last.label = line;
        else cur.pendingZoneLabel = line;
        continue;
      }

      if (RE_NOISE.test(line)) continue;

      if (mode === 'enonce') {
        cur.enonce.push(line);
      } else if (mode === 'options') {
        const startsLower = /^[a-zà-ÿ(«"'\d+\-]/.test(line);
        if (startsLower && cur.q.options.length) {
          cur.q.options[cur.q.options.length - 1].text += ' ' + line;
        } else {
          mode = 'explanation';
          cur.explanation.push(line);
        }
      } else {
        cur.explanation.push(line);
      }
    }
    pushCurrent();
    return questions;
  }

  // =============================================================
  // 3. Extraction générique (documents hors format EDN)
  // =============================================================
  function heuristicParseText(rawText) {
    const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const blocks = [];
    let current = null;
    const qStart = /^(?:Question\s*)?(\d{1,4})[.)]\s*(.*)$/i;

    for (const line of lines) {
      const m = line.match(qStart);
      if (m && (!current || Number(m[1]) !== current.question_number)) {
        if (current) blocks.push(current);
        current = { question_number: Number(m[1]), lines: [m[2]] };
      } else if (current) current.lines.push(line);
    }
    if (current) blocks.push(current);

    const optionLine = /^([A-F])[.)]\s*(.*)$/;
    const correctionLine = /^(réponses?\s*correctes?|corrig[ée]|correction|bonnes?\(?s?\)?\s*réponses?)\s*[:\-]?\s*(.*)$/i;
    const explanationLine = /^(explication|commentaire|rappel)\s*[:\-]?\s*(.*)$/i;

    return blocks.map(b => {
      const q = emptyQuestion(b.question_number);
      const bodyLines = [];
      let mode = 'body';
      let correctLetters = [];
      for (const line of b.lines) {
        const optM = line.match(optionLine), corrM = line.match(correctionLine), explM = line.match(explanationLine);
        if (optM) { q.options.push({ key: optM[1].toUpperCase(), text: optM[2].trim(), is_correct: false }); mode = 'options'; }
        else if (corrM) {
          q.official_correction = (q.official_correction + ' ' + corrM[2]).trim();
          const l = corrM[2].toUpperCase().match(/[A-F]/g); if (l) correctLetters.push(...l);
          mode = 'correction';
        } else if (explM) { q.explanation = (q.explanation + ' ' + explM[2]).trim(); mode = 'explanation'; }
        else if (mode === 'body') bodyLines.push(line);
        else if (mode === 'options' && q.options.length) q.options[q.options.length - 1].text += ' ' + line;
        else if (mode === 'correction') {
          q.official_correction += ' ' + line;
          const l = line.toUpperCase().match(/[A-F]/g); if (l) correctLetters.push(...l);
        } else q.explanation += ' ' + line;
      }
      q.question_text = bodyLines.join(' ').trim();
      correctLetters = [...new Set(correctLetters)];
      q.options.forEach(o => { if (correctLetters.includes(o.key)) o.is_correct = true; });
      q.question_type = correctLetters.length > 1 ? 'qrm' : 'qru';
      if (!q.question_text) flagReview(q, 'énoncé non identifié avec certitude');
      if (!q.options.length) flagReview(q, 'aucune proposition détectée');
      if (!correctLetters.length) flagReview(q, 'bonne réponse non identifiée');
      return q;
    });
  }

  function parseText(text) {
    if (looksLikeEDNCorrige(text)) {
      const qs = parseEDNCorrige(text)
        // on écarte les blocs totalement vides (artefacts de mise en page)
        .filter(q => (q.question_text && q.question_text.trim().length > 3) ||
                     q.options.length || (q.explanation && q.explanation.length > 3));
      if (qs.length) return qs;
    }
    return heuristicParseText(text);
  }

  // =============================================================
  // 4. DOCX / PDF
  // =============================================================
  async function parseDOCX(file) {
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    const questions = parseText(result.value);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }
    return questions;
  }

  // PDF.js ne fournit pas les sauts de ligne : on reconstruit les lignes
  // à partir de la position verticale de chaque fragment de texte.
  function itemsToLines(items) {
    // 1. on ne garde que les fragments porteurs de texte
    const frags = [];
    for (const it of items) {
      if (!it.str || !it.str.length) continue;
      const x = it.transform[4];
      const y = it.transform[5];
      const h = Math.abs(it.height || it.transform[3] || 10) || 10;
      const w = it.width != null ? it.width : (it.str.length * h * 0.5);
      if (!it.str.trim()) continue;
      frags.push({ x, y, h, w, s: it.str });
    }
    if (!frags.length) return [];

    // 2. regroupement en lignes par proximité verticale (tolérance liée à la taille de police)
    frags.sort((a, b) => (b.y - a.y) || (a.x - b.x));
    const lines = [];
    let current = null;
    for (const f of frags) {
      const tol = Math.max(2, f.h * 0.5);
      if (current && Math.abs(current.y - f.y) <= tol) {
        current.items.push(f);
        current.y = (current.y * (current.items.length - 1) + f.y) / current.items.length;
      } else {
        if (current) lines.push(current);
        current = { y: f.y, items: [f] };
      }
    }
    if (current) lines.push(current);

    // 3. assemblage : PDF.js ne fournit pas toujours les espaces, on les
    //    restitue à partir de l'écart horizontal entre deux fragments.
    return lines.map(line => {
      line.items.sort((a, b) => a.x - b.x);
      let text = '';
      let prevEnd = null;
      for (const f of line.items) {
        if (prevEnd !== null) {
          const gap = f.x - prevEnd;
          const needsSpace = gap > f.h * 0.18;
          const alreadySpaced = /\s$/.test(text) || /^\s/.test(f.s);
          if (needsSpace && !alreadySpaced) text += ' ';
        }
        text += f.s;
        prevEnd = f.x + f.w;
      }
      return {
        y: line.y,
        x: line.items.length ? line.items[0].x : 0,
        // position du 2e fragment : début du texte après la case ☐ / ◎
        x2: line.items.length > 1 ? line.items[1].x : (line.items.length ? line.items[0].x : 0),
        size: line.items.reduce((m, f) => Math.max(m, f.h), 0),
        text: sanitize(text).replace(/\s+/g, ' ').trim()
      };
    }).filter(l => l.text.length);
  }

  // --- Extraction des images réellement intégrées dans le PDF -------------
  // On suit la matrice de transformation courante (CTM) dans la liste
  // d'opérateurs pour connaître la position exacte de chaque image.
  function multiply(m, ctm) {
    return [
      m[0] * ctm[0] + m[1] * ctm[2],
      m[0] * ctm[1] + m[1] * ctm[3],
      m[2] * ctm[0] + m[3] * ctm[2],
      m[2] * ctm[1] + m[3] * ctm[3],
      m[4] * ctm[0] + m[5] * ctm[2] + ctm[4],
      m[4] * ctm[1] + m[5] * ctm[3] + ctm[5]
    ];
  }

  function applyMatrix(m, x, y) {
    return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
  }

  async function findPageImages(page) {
    const OPS = pdfjsLib.OPS;
    const IMAGE_OPS = new Set([
      OPS.paintImageXObject, OPS.paintJpegXObject,
      OPS.paintImageMaskXObject, OPS.paintInlineImageXObject
    ].filter(v => v !== undefined));

    let opList;
    try { opList = await page.getOperatorList(); } catch (e) { return []; }

    let ctm = [1, 0, 0, 1, 0, 0];
    const stack = [];
    const found = [];

    for (let i = 0; i < opList.fnArray.length; i++) {
      const fn = opList.fnArray[i];
      const args = opList.argsArray[i];
      if (fn === OPS.save) stack.push(ctm.slice());
      else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
      else if (fn === OPS.transform) ctm = multiply(args, ctm);
      else if (IMAGE_OPS.has(fn)) {
        // l'image occupe le carré unité transformé par la CTM
        const corners = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([x, y]) => applyMatrix(ctm, x, y));
        const xs = corners.map(c => c[0]), ys = corners.map(c => c[1]);
        const box = {
          x0: Math.min(...xs), x1: Math.max(...xs),
          y0: Math.min(...ys), y1: Math.max(...ys)
        };
        // on ignore les décorations minuscules (puces, filets…)
        if (box.x1 - box.x0 > 60 && box.y1 - box.y0 > 60) found.push(box);
      }
    }
    return found;
  }

  // Rend la page puis découpe chaque image, en JPEG compressé.
  async function cropImages(page, boxes) {
    const RENDER_SCALE = 2;
    const MAX_WIDTH = 900;
    const viewport = page.getViewport({ scale: RENDER_SCALE });
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;

    const out = [];
    for (const box of boxes) {
      const p1 = viewport.convertToViewportPoint(box.x0, box.y1);
      const p2 = viewport.convertToViewportPoint(box.x1, box.y0);
      const pad = 4;
      const sx = Math.max(0, Math.min(p1[0], p2[0]) - pad);
      const sy = Math.max(0, Math.min(p1[1], p2[1]) - pad);
      const sw = Math.min(canvas.width - sx, Math.abs(p2[0] - p1[0]) + pad * 2);
      const sh = Math.min(canvas.height - sy, Math.abs(p2[1] - p1[1]) + pad * 2);
      if (sw < 40 || sh < 40) continue;

      const ratio = Math.min(1, MAX_WIDTH / sw);
      const crop = document.createElement('canvas');
      crop.width = Math.round(sw * ratio);
      crop.height = Math.round(sh * ratio);
      const cctx = crop.getContext('2d');
      cctx.fillStyle = '#ffffff';
      cctx.fillRect(0, 0, crop.width, crop.height);
      cctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
      out.push({ box, src: crop.toDataURL('image/jpeg', 0.72) });
    }
    canvas.width = canvas.height = 0; // libère la mémoire
    return out;
  }

  async function parseDOCX(file) {
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    const questions = parseText(result.value);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }
    return questions;
  }

  // Une proposition longue continue sur la ligne suivante, EN RETRAIT et dans
  // la même police. Une explication démarre à la marge, en plus petit.
  // On recolle donc d'après la mise en page, pas d'après la casse : la suite
  // "HELLP syndrome" commence par une majuscule mais appartient bien à la
  // proposition "…fait suspecter un".
  const RE_LAYOUT_FOOTER = /^(Référence\s*:|Date de création|Version\s*:|Page\s*:|\d{4}-\d{2}-\d{2}-\d{2}:\d{2}:\d{2})/i;
  function mergeWrappedOptions(lines) {
    const out = [];
    let anchor = null;               // dernière ligne de proposition ouverte
    for (const l of lines) {
      if (RE_LAYOUT_FOOTER.test(l.text)) { out.push(l); continue; }   // pied de page : transparent
      const isStructural = RE_OPT_FULL.test(l.text) || RE_OPT_STATUS.test(l.text) ||
        RE_QSTART.test(l.text) || RE_SECTION.test(l.text) || RE_ANSWERS_HEADER.test(l.text);
      // la suite s'aligne EXACTEMENT sur le début du texte de la proposition
      // (mot "Valide"/"Faux" après la case) ; une liste d'explication, même en
      // retrait et dans la même police, ne s'y aligne pas.
      if (!isStructural && anchor &&
          Math.abs(l.x - anchor.x2) <= 3 &&
          l.size >= anchor.size - 2 && l.size <= anchor.size + 1) {
        // un mot coupé par le PDF ("psychiatriqu" / "e") se recolle sans espace
        const glue = /^[a-zà-ÿ]{1,2}$/.test(l.text) && /[a-zà-ÿ]$/.test(anchor.text) ? '' : ' ';
        anchor.text = anchor.text + glue + l.text;       // suite de la proposition
        continue;
      }
      out.push(l);
      anchor = RE_OPT_FULL.test(l.text) ? l : null;
    }
    return out;
  }

  async function parsePDF(file, onProgress, opts) {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

    const allLines = [];
    const pageData = [];   // { pageNum, lines, imageBoxes }

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const lines = itemsToLines(content.items);
      const imageBoxes = await findPageImages(page);
      pageData.push({ pageNum: i, lines, imageBoxes });
      allLines.push(...lines.map(l => ({ ...l })));
      if (onProgress) onProgress(i, pdf.numPages, 'Lecture du texte');
    }

    const fullText = mergeWrappedOptions(allLines).map(l => l.text).join('\n');
    if (!fullText.replace(/\s/g, '').length) {
      return [flagReview(emptyQuestion(1),
        'PDF scanné ou sans texte extractible : aucune extraction automatique fiable possible. ' +
        'Saisie manuelle requise, ou convertissez le fichier en PDF texte / DOCX / CSV avant import.')];
    }

    const questions = parseText(fullText);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }

    // --- rattachement des images à leur question ---------------------------
    // Une image peut être placée APRÈS la question à laquelle elle se rapporte
    // (illustration d'énoncé ou de proposition) ou AVANT (vignette d'un nouveau
    // dossier imprimée en haut de page). On lève l'ambiguïté en regardant ce
    // qui suit immédiatement l'image dans le flux du document.
    const totalImages = pageData.reduce((n, p) => n + p.imageBoxes.length, 0);
    if (totalImages && !(opts && opts.textOnly)) {
      const RE_TABLE_MARK = /^(Marqueurs|Statut|Pondération|Zone\s*\d+\s*:)/i;

      // 1. flux linéaire complet du document
      const stream = [];
      pageData.forEach((pd, pi) => {
        const els = [
          ...pd.lines.map(l => ({ kind: 'line', y: l.y, text: l.text, page: pi })),
          ...pd.imageBoxes.map(b => ({ kind: 'image', y: b.y1, box: b, page: pi }))
        ].sort((a, b) => b.y - a.y);
        stream.push(...els);
      });

      // 2. attribution
      const assignments = [];   // { page, box, qIndex, label }
      let qIndex = -1, lastOptionKey = null, pendingStatus = false;

      for (let i = 0; i < stream.length; i++) {
        const el = stream[i];
        if (el.kind === 'line') {
          if (RE_QSTART.test(el.text)) { qIndex++; lastOptionKey = null; pendingStatus = false; continue; }
          const mo = el.text.match(RE_OPT_FULL);
          if (mo) { lastOptionKey = mo[2].toUpperCase(); pendingStatus = false; continue; }
          if (RE_OPT_STATUS.test(el.text)) { pendingStatus = true; continue; }
          if (pendingStatus) {
            const ml = el.text.match(RE_OPT_LETTER);
            if (ml) lastOptionKey = ml[1].toUpperCase();
            pendingStatus = false;
          }
          continue;
        }

        // lecture anticipée : à quoi se rattache cette image ?
        // Elle introduit la question SUIVANTE seulement si un énoncé
        // s'intercale entre elle et l'en-tête de cette question (vignette de
        // dossier imprimée en haut de page). Si l'en-tête suit immédiatement,
        // l'image illustre encore la question courante (dernière proposition).
        let target = qIndex, label = lastOptionKey;
        let bodyBetween = 0;
        for (let j = i + 1; j < stream.length; j++) {
          const nx = stream[j];
          if (nx.kind !== 'line') continue;
          if (RE_QSTART.test(nx.text)) {
            if (bodyBetween > 0) { target = qIndex + 1; label = null; }
            break;
          }
          if (RE_OPT_FULL.test(nx.text) || RE_OPT_STATUS.test(nx.text) ||
              RE_ANSWERS_HEADER.test(nx.text) || RE_TABLE_MARK.test(nx.text)) {
            break; // l'image appartient bien à la question en cours
          }
          // texte d'énoncé intercalé (on ignore pieds de page et intitulés de section)
          if (!RE_FOOTER_LINE.test(nx.text) && !RE_SECTION.test(nx.text) &&
              !RE_NOISE.test(nx.text) && nx.text.length >= 20) bodyBetween++;
        }
        if (target >= 0 && questions[target]) {
          assignments.push({ page: el.page, box: el.box, qIndex: target, label });
        }
      }

      // 3. rendu et découpe, page par page
      let done = 0;
      const byPage = new Map();
      assignments.forEach(a => {
        if (!byPage.has(a.page)) byPage.set(a.page, []);
        byPage.get(a.page).push(a);
      });

      for (const [pageIdx, list] of byPage) {
        const page = await pdf.getPage(pageData[pageIdx].pageNum);
        const crops = await cropImages(page, list.map(a => a.box));
        crops.forEach((c, k) => {
          const target = questions[list[k].qIndex];
          if (!target) return;
          target.images = target.images || [];
          target.images.push({ src: c.src, label: list[k].label });
        });
        done += list.length;
        if (onProgress) onProgress(done, totalImages, 'Extraction des images');
      }

      // une question dont l'image a été récupérée n'est plus signalée pour ce motif
      questions.forEach(q => {
        if (q.images && q.images.length && q.review_reason) {
          q.review_reason = q.review_reason.split(' ; ')
            .filter(r => !/une image accompagne/i.test(r)).join(' ; ');
          if (!q.review_reason) q.needs_review = false;
        }
      });
    }

    return questions;
  }

  async function parseFile(file, onProgress, opts) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'csv') return parseCSV(file);
    if (ext === 'xlsx' || ext === 'xls') return parseXLSX(file);
    if (ext === 'docx') return parseDOCX(file);
    if (ext === 'pdf') return parsePDF(file, onProgress, opts);
    throw new Error('Format non supporté : .' + ext);
  }

  return { parseFile, parseText, parseEDNCorrige, heuristicParseText, looksLikeEDNCorrige, sanitize, itemsToLines, mergeWrappedOptions };
})();

// COLLÈGES — logique pure (testable hors navigateur)
//
// Aucune IA, aucun service payant. La correspondance QCM -> page repose sur :
//   1. un index BM25 de toutes les pages du Collège (pondération statistique
//      des termes rares : "résistances vasculaires" pèse plus que "grossesse") ;
//   2. une requête construite à partir de la question, des bonnes réponses,
//      de l'explication et de la correction, avec des poids différents ;
//   3. le contexte des pages voisines ;
//   4. un bonus quand l'intitulé de la page correspond à la question ;
//   5. une VÉRIFICATION indépendante : les notions clés de la réponse
//      doivent réellement figurer sur la page. Sinon la page reste une
//      simple "piste" et n'est jamais présentée comme une référence.
// =====================================================================

const EDNColleges = (() => {

  // ------------------------------------------------------------------
  // 1. Texte
  // ------------------------------------------------------------------
  const STOP = new Set((
    'les des une un le la de du et en au aux ce ces cet cette dans par pour sur avec sans sous ' +
    'est sont ete etre avoir ont qui que quoi dont ou mais donc car ni ne pas plus moins tres ' +
    'son sa ses leur leurs nos vos votre notre vous nous elle elles ils il on se si tout tous toute ' +
    'toutes autre autres meme aussi ainsi comme entre lors chez vers depuis avant apres pendant ' +
    'peut peuvent doit doivent fait faire faut cas type lequel laquelle lesquels lesquelles ' +
    'parmi suivantes suivants suivante suivant proposition propositions exacte exactes inexacte ' +
    'reponse reponses attendue attendues concernant question questions quelle quelles quel quels ' +
    'plusieurs seule seul une cochez selectionnez indiquez donner donnez quoi comment pourquoi ' +
    'patient patiente patients ans age mois jour jours annee annees chez vous votre consulte ' +
    'contexte valide faux vrai vraies fausse fausses correcte correctes item page chapitre ' +
    'oui non attendu attendus attendue mot mots selon agit agissait existe suggere ensemble elements ' +
    'seul seule sujet propos quel quelle parmi sont responsable responsables frequemment frequent frequente ' +
    'frequentes frequents probable probablement plus moins souvent habituellement'
  ).split(/\s+/));

  function normalize(s) {
    return String(s || '').toLowerCase()
      .replace(/œ/g, 'oe').replace(/æ/g, 'ae')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[’'`]/g, ' ')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  // Racinisation légère du français : suffisante pour rapprocher
  // "vasculaires/vasculaire", "modifications/modification", "cardiaques/cardiaque".
  function stem(w) {
    if (w.length <= 4) return w;
    const rules = [
      ['issements', 'iss'], ['issement', 'iss'], ['ements', 'e'], ['ement', 'e'],
      ['ations', 'at'], ['ation', 'at'], ['ateurs', 'at'], ['ateur', 'at'], ['atrices', 'at'], ['atrice', 'at'],
      ['ances', 'ance'], ['ences', 'ence'], ['iques', 'iqu'], ['ique', 'iqu'],
      ['euses', 'eu'], ['euse', 'eu'], ['eux', 'eu'], ['aux', 'al'],
      ['ites', 'it'], ['ite', 'it'], ['ives', 'if'], ['ive', 'if'], ['ifs', 'if'],
      ['elles', 'el'], ['elle', 'el'], ['iers', 'ier'], ['ieres', 'ier'], ['iere', 'ier'],
      ['ees', 'e'], ['ee', 'e'], ['es', 'e'], ['s', ''], ['x', '']
    ];
    for (const [suf, rep] of rules) {
      if (w.endsWith(suf) && w.length - suf.length >= 3) return w.slice(0, -suf.length) + rep;
    }
    return w;
  }

  // Abréviations courantes -> forme développée. C'est du VOCABULAIRE : le texte
  // d'une question dit "IAS", le Collège dit "infection associée aux soins".
  const ABBR = {
    ias: 'infection associee soins', eias: 'evenement indesirable associe soins',
    iso: 'infection site operatoire', ioa: 'infection osteo articulaire', nosocomiale: 'infection associee soins',
    hta: 'hypertension arterielle', avc: 'accident vasculaire cerebral', ait: 'accident ischemique transitoire',
    tvp: 'thrombose veineuse profonde', sca: 'syndrome coronarien aigu', idm: 'infarctus myocarde',
    irc: 'insuffisance renale chronique', ira: 'insuffisance renale aigue', bpco: 'bronchopneumopathie chronique obstructive',
    mici: 'maladie inflammatoire chronique intestin', pth: 'prothese totale hanche', ptg: 'prothese totale genou',
    ecg: 'electrocardiogramme', irm: 'imagerie resonance magnetique', tdm: 'tomodensitometrie scanner',
    vih: 'virus immunodeficience humaine', ist: 'infection sexuellement transmissible', igh: 'infection genitale haute',
    ivg: 'interruption volontaire grossesse', rciu: 'retard croissance intra uterin', hpp: 'hemorragie post partum',
    sep: 'sclerose plaques', ains: 'anti inflammatoire non steroidien', aine: 'anti inflammatoire non steroidien',
    avk: 'antivitamine', aod: 'anticoagulant oral direct', hbpm: 'heparine bas poids moleculaire',
    ipp: 'inhibiteur pompe protons', isrs: 'inhibiteur recapture serotonine', crp: 'proteine reactive',
    nfs: 'numeration formule sanguine', lcr: 'liquide cephalo rachidien', ecbu: 'examen cytobacteriologique urines',
    dfg: 'debit filtration glomerulaire', sdra: 'syndrome detresse respiratoire aigue', acr: 'arret cardio respiratoire',
    hpv: 'papillomavirus', tca: 'trouble conduite alimentaire', tdah: 'trouble deficit attention hyperactivite',
    eeg: 'electroencephalogramme', emg: 'electromyogramme', ehpad: 'etablissement hebergement personnes agees'
  };
  const ABBR_TOKENS = {};

  function tokens(s) {
    const out = [];
    normalize(s).split(' ').forEach(w => {
      if (ABBR[w]) {
        if (!ABBR_TOKENS[w]) ABBR_TOKENS[w] = ABBR[w].split(' ').filter(x => x.length >= 3 && !STOP.has(x)).map(stem);
        out.push(w, ...ABBR_TOKENS[w]);
        return;
      }
      if (w.length >= 3 && !STOP.has(w) && !/^\d+$/.test(w)) out.push(stem(w));
    });
    return out;
  }

  // ------------------------------------------------------------------
  // 2. Structure : numéro imprimé, item, chapitre, intitulé
  // ------------------------------------------------------------------
  const RE_ITEM = /\bitem\s*(?:n\s*[°o]?\s*)?(\d{1,3})\b\s*[-–—:.)]?\s*([^\n]{0,90})/i;
  const RE_CHAPTER = /\bchapitre\s+(\d{1,3}|[ivxlc]{1,6})\b\s*[-–—:.)]?\s*([^\n]{0,80})/i;

  function detectPrintedPage(lines) {
    const cand = [lines[0], lines[lines.length - 1], lines[1], lines[lines.length - 2]]
      .filter(Boolean).map(l => l.trim());
    for (const l of cand) {
      const m = l.match(/^(?:page\s*)?(\d{1,4})$/i) || l.match(/^(\d{1,4})\s*[|•·-]\s/) || l.match(/\s[|•·-]\s*(\d{1,4})$/);
      if (m) return m[1];
    }
    return null;
  }

  // pages : [{ pdf_page, content, printed_page? }] triées.
  // Renvoie un tableau de { pdf_page, printed_page, item_number, item_title, chapter, heading }
  function detectStructure(pages) {
    // lignes répétées sur beaucoup de pages = en-têtes/pieds courants (titre du livre…)
    const firstLines = new Map();
    pages.forEach(p => {
      const lines = String(p.content || '').split('\n').map(l => l.trim()).filter(Boolean).slice(0, 3);
      new Set(lines.map(normalize)).forEach(k => { if (k) firstLines.set(k, (firstLines.get(k) || 0) + 1); });
    });
    const runningHeader = (l) => (firstLines.get(normalize(l)) || 0) > Math.max(3, pages.length * 0.15);

    // cohérence des numéros imprimés : décalage le plus fréquent
    const offsets = new Map();
    const printed = pages.map(p => {
      const lines = String(p.content || '').split('\n').map(l => l.trim()).filter(Boolean);
      const n = p.printed_page || detectPrintedPage(lines);
      if (n) { const off = p.pdf_page - Number(n); offsets.set(off, (offsets.get(off) || 0) + 1); }
      return n;
    });
    let bestOff = null, bestCount = 0;
    offsets.forEach((c, off) => { if (c > bestCount) { bestCount = c; bestOff = off; } });
    const reliableOffset = bestCount >= Math.max(3, pages.length * 0.3);

    let curItem = null, curItemTitle = null, curChapter = null;
    const items = new Set(), chapters = new Set();

    const out = pages.map((p, i) => {
      const text = String(p.content || '');
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

      const mi = text.match(RE_ITEM);
      if (mi) {
        curItem = Number(mi[1]);
        const t = (mi[2] || '').replace(/\s+/g, ' ').trim();
        if (t.length >= 4) curItemTitle = t.slice(0, 90);
        items.add(curItem);
      }
      const mc = text.match(RE_CHAPTER);
      if (mc) {
        const t = (mc[2] || '').replace(/\s+/g, ' ').trim();
        curChapter = ('Chapitre ' + mc[1] + (t ? ' — ' + t : '')).slice(0, 100);
        chapters.add(mc[1].toLowerCase());
      }

      const heading = lines.find(l =>
        l.length >= 4 && l.length <= 90 && /[a-zA-ZÀ-ÿ]{3}/.test(l) &&
        !/^\d+$/.test(l) && !runningHeader(l) && !/^(page\s*)?\d{1,4}$/i.test(l)) || null;

      let pp = printed[i];
      if (reliableOffset) {
        const expected = String(p.pdf_page - bestOff);
        if (!pp || pp !== expected) pp = Number(expected) > 0 ? expected : pp;
      }

      return {
        pdf_page: p.pdf_page,
        printed_page: pp || null,
        item_number: curItem,
        item_title: curItemTitle,
        chapter: curChapter,
        heading: heading ? heading.slice(0, 90) : null
      };
    });
    return { pages: out, itemsDetected: items.size, chaptersDetected: chapters.size };
  }

  // ------------------------------------------------------------------
  // 3. Index BM25 par PASSAGES
  // Chaque page est découpée en fenêtres de 6 lignes (pas de 3, donc avec
  // recouvrement). On compare des passages, pas des pages entières : une page
  // qui cite un mot en passant ne bat plus le paragraphe qui traite la notion.
  // ------------------------------------------------------------------
  const isHeadingLine = (l) => l.length >= 4 && l.length <= 80 && !/[.;,]$/.test(l) &&
    /^[A-ZÀ-ÖØ-Ý0-9IVX]/.test(l) && l.split(/\s+/).length <= 12;

  function buildIndex(pages) {
    const docs = [];
    pages.forEach((p, pi) => {
      const lines = String(p.content || '').split('\n').map(l => l.trim()).filter(Boolean);
      const win = 6, step = 3;
      let lastHeading = null;
      const heads = lines.map(l => (isHeadingLine(l) ? (lastHeading = l) : lastHeading));
      for (let i = 0; i === 0 || i < lines.length - step; i += step) {
        const slice = lines.slice(i, i + win);
        const text = slice.join(' ');
        const tf = new Map();
        const toks = tokens(text);
        toks.forEach(t => tf.set(t, (tf.get(t) || 0) + 1));
        const seq = toks;   // ordre des mots conservé : sert à reconnaître une expression exacte
        const sub = heads[Math.min(lines.length - 1, i + 1)] || (p.heading || null);
        const head = new Set(tokens([p.heading, p.item_title, p.chapter, sub].filter(Boolean).join(' ')));
        docs.push({ pdf_page: p.pdf_page, pi, text, tf, seq, len: toks.length || 1, head, sub, meta: p });
        if (!lines.length) break;
      }
    });
    const df = new Map();
    docs.forEach(d => d.tf.forEach((_, t) => df.set(t, (df.get(t) || 0) + 1)));
    const N = docs.length || 1;
    const avgLen = docs.reduce((s, d) => s + d.len, 0) / N || 1;
    const idf = (t) => { const n = df.get(t) || 0; return Math.log(1 + (N - n + 0.5) / (n + 0.5)); };
    const byPage = new Map();
    docs.forEach((d, i) => { if (!byPage.has(d.pdf_page)) byPage.set(d.pdf_page, i); });
    return { docs, df, N, avgLen, idf, byPage, pages };
  }

  function bm25(index, doc, qterms) {
    const k1 = 1.2, b = 0.75;
    let s = 0;
    qterms.forEach((w, t) => {
      const f = doc.tf.get(t);
      if (!f) return;
      s += w * index.idf(t) * (f * (k1 + 1)) / (f + k1 * (1 - b + b * doc.len / index.avgLen));
    });
    return s;
  }

  // Phrase(s) réellement interrogée(s) : la dernière phrase terminée par "?",
  // ou à défaut la dernière phrase. Le reste de l'énoncé est la vignette.
  function splitStem(stemText) {
    const t = String(stemText || '').replace(/\s+/g, ' ').trim();
    const sentences = t.match(/[^.?!]+[.?!]?/g) || [t];
    let qi = -1;
    sentences.forEach((x, i) => { if (/\?/.test(x)) qi = i; });
    if (qi < 0) qi = sentences.length - 1;
    // une consigne courte ("Parmi les propositions…") s'appuie sur la phrase précédente
    const back = sentences[qi].length < 60 ? 1 : 0;
    const proper = sentences.slice(Math.max(0, qi - back), qi + 1).join(' ');
    const vignette = sentences.filter((_, i) => i < qi - back).join(' ');
    return { proper, vignette };
  }

  // Réponses qui ne disent rien du contenu : "Oui", "Non", "Vrai"…
  const NON_INFORMATIVE = new Set(['oui', 'non', 'vrai', 'faux', 'aucun', 'aucune']);

  function buildQuery(question) {
    const parts = String(question.question_text || '').split('\n\n');
    const hasContext = parts.length > 1 && /^\[Contexte/.test(parts[0]);
    const context = hasContext ? parts[0].replace(/^\[Contexte[^\]]*\]\s*/, '') : '';
    const stemText = hasContext ? parts.slice(1).join(' ') : question.question_text;
    const { proper, vignette } = splitStem(stemText);

    const correctTxt = (question.options || []).filter(o => o.is_correct).map(o => o.text).join(' ');
    const correctWords = normalize(correctTxt).split(' ').filter(Boolean);
    const answerIsInformative = correctWords.some(w => !NON_INFORMATIVE.has(w) && w.length >= 3);

    const w = new Map();
    const add = (text, weight) => tokens(text).forEach(t => w.set(t, (w.get(t) || 0) + weight));
    add(proper, 2.5);               // ce que la question demande vraiment
    add(vignette, 0.5);             // la situation clinique
    add(context, 0.2);              // le contexte du dossier
    if (answerIsInformative) (question.options || []).forEach(o => add(o.text, o.is_correct ? 2.0 : 0.4));
    add(question.explanation, 1.5);
    add(question.official_correction, 1.0);

    const keySrc = new Map();
    const addKey = (text, weight) => tokens(text).forEach(t => keySrc.set(t, (keySrc.get(t) || 0) + weight));
    // la vignette (âge, antécédents, "revue un an plus tard"…) décrit le patient,
    // pas la notion : elle sert à TROUVER les passages, jamais à les VÉRIFIER
    addKey(proper, 2.0);
    if (answerIsInformative) addKey(correctTxt, 1.5);
    addKey(question.explanation, 1.2);
    addKey(question.official_correction, 0.8);

    // ce qui doit figurer dans le passage pour "justifier la réponse" : les bonnes
    // réponses si elles sont informatives ; sinon la question elle-même (pour
    // "s'agit-il d'une infection associée aux soins ? — Oui", on cherche la
    // notion d'infection associée aux soins, pas le mot "oui")
    const answerTokens = answerIsInformative
      ? tokens(correctTxt).filter(t => !NON_INFORMATIVE.has(t))
      : tokens(proper + ' ' + (question.explanation || ''));
    const stemTokens = new Set(tokens(proper));
    // expression exacte : on cherche une suite de mots identique à celle de la
    // question (ou de la réponse informative), sans les abréviations développées
    const phraseSrc = answerIsInformative ? correctTxt : proper;
    const phraseSeq = normalize(phraseSrc).split(' ').filter(w => w.length >= 3 && !STOP.has(w) && !/^\d+$/.test(w)).map(stem);
    // notions du SUJET, pour la cohérence des titres : une abréviation n'y garde
    // que son mot principal ("HTA" -> "hypertension", pas "artériel" seul)
    const subjectTok = (txt) => {
      const words = normalize(txt).split(' ');
      return words.flatMap((w, i) => {
        // mot nié dans la question ("pas de signe d'insuffisance cardiaque") : pas un sujet
        if (words.slice(Math.max(0, i - 4), i).some(b => NEG.has(b))) return [];
        if (ABBR[w]) { tokens(w); return [(ABBR_TOKENS[w] || [])[0]].filter(Boolean); }
        return (w.length >= 3 && !STOP.has(w) && !/^\d+$/.test(w)) ? [stem(w)] : [];
      });
    };
    const firstSentence = (t) => ((String(t || '').replace(/\s+/g, ' ').match(/[^.?!]+[.?!]?/) || [''])[0]);
    // tout le sujet (pour la couverture) et le sujet DÉFINI (pour les titres) :
    // la question posée + le motif, jamais les détails de l'examen clinique
    const topicTokens = [...new Set(subjectTok(context + ' ' + stemText))];
    const subjectTokens = [...new Set(subjectTok(proper + ' ' + firstSentence(context) + ' ' + firstSentence(vignette)))];
    const qualifiers = normalize(proper + ' ' + firstSentence(context) + ' ' + firstSentence(vignette));
    return { terms: w, keySrc, stemTokens, answerTokens, answerIsInformative, proper, phraseSeq, topicTokens, subjectTokens, qualifiers };
  }

  // ------------------------------------------------------------------
  // 4-5. Correspondance, comparaison des candidats, niveaux de confiance
  //   verified        : le PASSAGE lui-même contient l'essentiel de la réponse
  //   high_confidence : réponse présente dans le passage et ses voisins
  //   needs_review    : piste plausible, jamais présentée comme une référence
  //   not_found       : rien de suffisamment établi
  // ------------------------------------------------------------------
  const STATUS_RANK = { verified: 4, high_confidence: 3, needs_review: 2, candidate: 2, not_found: 1 };

  // Un terme de la réponse ne compte pas s'il n'apparaît QUE sous une forme niée
  // dans le passage ("sans carence martiale", "pas de fièvre", "absence de…").
  const NEG = new Set(['sans', 'pas', 'absence', 'aucun', 'aucune', 'non', 'ni', 'jamais', 'exclut', 'elimine']);
  function presentNotNegated(text, term) {
    const words = normalize(text).split(' ');
    let seen = false;
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      if (w.length < 3 || stem(w) !== term && !(ABBR[w] && (ABBR_TOKENS[w] || []).includes(term))) continue;
      seen = true;
      const before = words.slice(Math.max(0, i - 3), i);
      if (!before.some(b => NEG.has(b))) return true;   // au moins une occurrence affirmative
    }
    return !seen;   // jamais vu sous forme de mot : on laisse la décision au comptage habituel
  }

  // Mots présents dans les titres d'au moins 10 des 367 items officiels
  // (enfant, adulte, infection, soins, traitement, maladie…) : trop larges pour
  // désigner un sujet. Calculé une fois depuis la liste officielle.
  let BROAD = null;
  function broadTitleWords() {
    if (BROAD) return BROAD;
    BROAD = new Set();
    if (typeof EDN_ITEMS === 'undefined') return BROAD;
    const df = new Map();
    EDN_ITEMS.items.forEach(it => new Set(tokens(it.t).map(t => t.slice(0, 6))).forEach(t => df.set(t, (df.get(t) || 0) + 1)));
    df.forEach((n, t) => { if (n >= 10) BROAD.add(t); });
    return BROAD;
  }

  // Mots de FORMULATION des questions, mesurés sur la banque de questions :
  // présents dans au moins 5 questions posées mais dans au plus 1 titre d'item
  // officiel (hypothèse, évoquer, mesure, cause, immédiatement…). Ils disent
  // comment on interroge, jamais sur quoi. + mots grammaticaux et lieux de soins.
  const FORMULATION_FIXED = ['contre', 'considerant', 'considerer', 'hopital', 'cabinet', 'service', 'domicile',
                             'suivant', 'suivante', 'ci', 'dessous', 'dessus', 'cette', 'celle', 'celui'];
  function buildFormulationSet(questions) {
    const set = new Set(FORMULATION_FIXED.map(w => stem(w).slice(0, 6)));
    if (!questions || questions.length < 50 || typeof EDN_ITEMS === 'undefined') return set;
    const qdf = new Map();
    questions.forEach(q => {
      const parts = String(q.question_text || '').split('\n\n');
      const pr = splitStem(parts[parts.length - 1]).proper;
      new Set(tokens(pr).map(t => t.slice(0, 6))).forEach(t => qdf.set(t, (qdf.get(t) || 0) + 1));
    });
    const tdf = new Map();
    EDN_ITEMS.items.forEach(it => new Set(tokens(it.t).map(t => t.slice(0, 6))).forEach(t => tdf.set(t, (tdf.get(t) || 0) + 1)));
    qdf.forEach((n, t) => { if (n >= 5 && (tdf.get(t) || 0) <= 1) set.add(t); });
    return set;
  }

  function longestSharedRun(a, b) {
    if (!a.length || !b.length) return 0;
    let best = 0;
    const prev = new Array(b.length + 1).fill(0);
    for (let i = 1; i <= a.length; i++) {
      let diag = 0;
      for (let j = 1; j <= b.length; j++) {
        const keep = prev[j];
        prev[j] = a[i - 1] === b[j - 1] ? diag + 1 : 0;
        if (prev[j] > best) best = prev[j];
        diag = keep;
      }
    }
    return best;
  }

  function matchQuestion(index, question, opts = {}) {
    const q = buildQuery(question);
    if (!q.terms.size || !index.docs.length) return { status: 'not_found', reason: 'question sans termes exploitables', found: [], keyTerms: [] };

    const own = index.docs.map(d => bm25(index, d, q.terms));
    const scored = index.docs.map((d, i) => {
      const ctx = own[i] + 0.3 * ((own[i - 1] || 0) + (own[i + 1] || 0));
      let overlap = 0;
      q.stemTokens.forEach(t => { if (d.head.has(t)) overlap++; });
      return { i, pdf_page: d.pdf_page, own: own[i], score: ctx * (1 + Math.min(0.5, 0.15 * overlap)), headOverlap: overlap };
    }).filter(x => x.own > 0).sort((a, b) => b.score - a.score);
    if (!scored.length) return { status: 'not_found', reason: 'aucun passage ne partage de notion avec la question', found: [], keyTerms: [] };

    const absentIdf = Math.log(1 + (index.N - 1 + 0.5) / 1.5);
    const weightOf = (t) => index.df.has(t) ? index.idf(t) : absentIdf;
    const generic = (t) => { const n = index.df.get(t) || 0; return n > 30 && n / index.N > 0.2; };

    const keyTerms = [...q.keySrc.entries()].filter(([t]) => !generic(t))
      .map(([t, w]) => [t, w * weightOf(t)]).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([t]) => t);
    const answerTerms = [...new Set(q.answerTokens)].filter(t => !generic(t)).slice(0, 14);

    const cov = (terms, docs) => {
      const tot = terms.reduce((s, t) => s + weightOf(t), 0);
      if (!tot) return { v: 0, found: [] };
      const found = terms.filter(t => docs.some(d => d.tf.has(t)));
      return { v: found.reduce((s, t) => s + weightOf(t), 0) / tot, found };
    };

    // comparaison des 12 meilleurs passages, jamais le premier par défaut
    const pool = scored.slice(0, opts.pool || 12).map((c, rank) => {
      const d = index.docs[c.i];
      const around = [index.docs[c.i - 1], d, index.docs[c.i + 1]].filter(x => x && x.pdf_page >= d.pdf_page - 1 && x.pdf_page <= d.pdf_page + 1);
      const k = cov(keyTerms, around);
      // termes de la réponse présents SEULEMENT sous forme niée : retirés du passage
      const negated = answerTerms.filter(t => d.tf.has(t) && !presentNotNegated(d.text, t));
      const dEff = negated.length ? { tf: new Map([...d.tf].filter(([t]) => !negated.includes(t))) } : d;
      const aStrict = cov(answerTerms, [dEff]);
      const aLoose = cov(answerTerms, around);
      return { ...c, rank, found: k.found, coverage: k.v, ansStrict: aStrict.v, ansLoose: aLoose.v,
               ansOnPassage: aStrict.found.length, ansFound: aLoose.found, negated,
               phrase: longestSharedRun(q.phraseSeq, d.seq) };
    });
    const top = pool[0].score || 1;
    pool.forEach(c => { c.final = (c.score / top) * 0.3 + c.coverage * 0.3 + c.ansStrict * 0.25 + c.ansLoose * 0.15; });
    pool.sort((a, b) => b.final - a.final);
    const best = pool[0];

    const needOnPassage = Math.min(2, answerTerms.length);
    // assez de preuves ? soit au moins 3 notions distinctes, soit 2 notions ET
    // l'expression exacte de la question (3 mots ou plus, d'un seul tenant) :
    // "infection associée aux soins" écrit tel quel vaut mieux que 3 mots épars
    const enoughEvidence = keyTerms.length >= 3 || (keyTerms.length >= 2 && best.phrase >= 3);
    let status = 'not_found';
    if (answerTerms.length && enoughEvidence) {
      if (best.ansStrict >= 0.7 && best.ansOnPassage >= needOnPassage && best.coverage >= 0.4 && best.rank < 3) status = 'verified';
      else if (best.ansLoose >= 0.6 && best.ansOnPassage >= 1 && best.coverage >= 0.3 && best.rank < 5) status = 'high_confidence';
      else if (best.ansLoose >= 0.4 && best.ansOnPassage >= 1 && best.coverage >= 0.2) status = 'needs_review';
    }

    // COHÉRENCE DU SUJET — mesurée sur des références réelles relues une à une :
    // une page peut contenir les mots de la réponse sans parler du même sujet
    // ("début insidieux" d'une schizophrénie retrouvé dans une page sur la SEP).
    // Pour être AFFIRMÉE, la page doit porter le sujet de la question dans ses
    // titres (item, chapitre, intitulé, sous-partie) : 2 concordances, ou 1 si la
    // page couvre au moins 20 % du sujet. Sinon : "à vérifier", jamais perdue.
    // Mots qui décrivent le TYPE d'information (examens, conséquences, traitement…)
    // ou la population, jamais le SUJET : ils ne comptent pas comme concordance.
    const TITLE_WEAK = new Set(tokens(
      'adulte enfant nourrisson sujet personne femme homme chez principal principaux general generaux ' +
      'aigue aigu chronique prise charge conduite tenir examen examens complementaire complementaires ' +
      'diagnostic diagnostique traitement traitements complication complications consequence consequences ' +
      'long terme risque risques facteur facteurs signe signes clinique cliniques biologie biologique ' +
      'imagerie bilan evolution pronostic definition epidemiologie physiopathologie etiologie etiologies ' +
      'surveillance prevention depistage urgence urgences principe principes generalite introduction ' +
      'point points important importants cle cles base bases comprendre objectif objectifs rang rubrique ' +
      'intitule descriptif recommandation recommandations indication indications therapeutique ' +
      'medicament medicaments prescription forme formes cas situation situations ' +
      'insuffisance syndrome syndromes trouble troubles atteinte atteintes deficit maladie ' +
      'antecedent antecedents hospitalise hospitalisee severe severes grave graves arrive arrivee victime ' +
      'medecin consulte consultation accompagne accompagnee').concat([]));
    const pre = (t) => t.slice(0, 6);
    const broad = broadTitleWords();
    const dBest = index.docs[best.i];
    const m = dBest.meta || {};
    const titleSet = new Set(tokens([m.item_title, m.chapter, m.heading, dBest.sub].filter(Boolean).join(' '))
      .filter(t => !TITLE_WEAK.has(t)).map(pre));
    const topic = q.topicTokens.filter(t => !generic(t) && !TITLE_WEAK.has(t) && !broad.has(pre(t)));
    // notions distinctives : la moitié la plus rare (idf) des notions du sujet.
    // "gravidique" ou "ORL" définissent un sujet ; "artériel" ou "infection" non.
    const formulation = opts.formulation || new Set(FORMULATION_FIXED.map(w => stem(w).slice(0, 6)));
    const subject = q.subjectTokens.filter(t => !generic(t) && !TITLE_WEAK.has(t) && !broad.has(pre(t)) && !formulation.has(pre(t)));
    const titleHits = subject.filter(t => titleSet.has(pre(t)));
    const titleHit = titleHits.length;
    const near = new Set();
    for (let j = Math.max(0, best.i - 40); j < Math.min(index.docs.length, best.i + 40); j++) {
      const x = index.docs[j];
      if (Math.abs(x.pdf_page - dBest.pdf_page) <= 1) x.tf.forEach((_, t) => near.add(t));
    }
    const topicTot = topic.reduce((s2, t) => s2 + weightOf(t), 0) || 1;
    const topicCov = topic.filter(t => near.has(t)).reduce((s2, t) => s2 + weightOf(t), 0) / topicTot;
    // une expression exacte d'au moins 3 mots reprise de la question est, à elle
    // seule, une preuve de sujet ("infection associée aux soins" mot pour mot)
    const coherent = titleHit >= 2 || (titleHit >= 1 && (topicCov >= 0.2 || best.phrase >= 3));
    const titleText = normalize([m.item_title, m.chapter, m.heading, dBest.sub].filter(Boolean).join(' '));
    const qChronic = /\bchroniques?\b/.test(q.qualifiers), qAcute = /\baigue?s?\b/.test(q.qualifiers);
    const pChronic = /\bchroniques?\b/.test(titleText), pAcute = /\baigue?s?\b/.test(titleText);
    const acuteChronicConflict = (qChronic && !qAcute && pAcute && !pChronic) || (qAcute && !qChronic && pChronic && !pAcute);
    // page d'exercices (QCM d'entraînement, cas cliniques) : ses mots coïncident
    // avec la question mais elle n'explique rien — jamais affirmée
    const pageText = String((m && m.content) || dBest.text || '');
    const QUIZ = /Question\s*\d+\s*[–-]\s*(QRM|QRU|QROC|QRP|QI|KFP|TCS)|(^|\s)\d{1,2}\.\s*(QRM|QRU|QROC|QRP|KFP)\b/i;
    const exercise = QUIZ.test(dBest.text) || /Vignette clinique|Cas clinique/i.test(dBest.text) || QUIZ.test(pageText);
    // sommaire (lignes de points suivies d'un numéro de page) ou index des situations de départ
    const tocLines = (pageText.match(/\.{5,}\s*\d{1,4}/g) || []).length;
    const sddIndex = /situations? de d[ée]part/i.test([m.heading, dBest.sub, dBest.text].join(' ')) &&
      ((dBest.text.match(/\b\d{1,3}\.\s+[A-ZÀ-Ý]/g) || []).length >= 3);
    const nonExplanatory = tocLines >= 3 || sddIndex;
    let demoted = false, demoteWhy = '';
    if ((status === 'verified' || status === 'high_confidence')) {
      if (!coherent) { demoted = true; demoteWhy = 'le sujet de la question n\'apparaît pas assez dans les titres de cette page'; }
      else if (acuteChronicConflict) { demoted = true; demoteWhy = 'la question et la page s\'opposent (aigu / chronique)'; }
      else if (exercise) { demoted = true; demoteWhy = 'page d\'exercices (QCM ou cas clinique du livre)'; }
      else if (nonExplanatory) { demoted = true; demoteWhy = 'sommaire ou index, sans contenu explicatif'; }
      if (demoted) status = 'needs_review';
    }

    const d = index.docs[best.i];
    // autres pages du même Collège, plus loin dans le document, qui justifient aussi la réponse
    const secondary = [];
    if (status !== 'not_found') {
      pool.slice(1).forEach(c => {
        if (secondary.length >= 2 || c.pdf_page === best.pdf_page || secondary.includes(c.pdf_page)) return;
        if (c.ansStrict >= 0.6 && c.ansOnPassage >= needOnPassage && c.coverage >= 0.3) secondary.push(c.pdf_page);
      });
    }
    const pct = (x) => Math.round(x * 100) + ' %';
    const why = [];
    if (!answerTerms.length) why.push('aucune notion distinctive dans la réponse');
    if (!enoughEvidence) why.push(`trop peu de notions distinctives (${keyTerms.length})`);
    if (best.ansLoose < 0.4) why.push(`réponse retrouvée à ${pct(best.ansLoose)}`);
    if (best.coverage < 0.2) why.push(`sujet couvert à ${pct(best.coverage)}`);
    const reason = status === 'not_found'
      ? 'insuffisant : ' + (why.join(', ') || 'critères non réunis')
      : `passage contenant ${best.ansFound.length}/${answerTerms.length} notions de la réponse (${pct(best.ansStrict)} dans le passage même)` +
        `, sujet couvert à ${pct(best.coverage)}` + (best.phrase >= 3 ? `, expression exacte de ${best.phrase} mots` : '') +
        (titleHit ? `, sujet présent dans les titres de la page (${titleHit})` : '') +
        (demoted ? ' — rétrogradée : ' + demoteWhy : '') +
        (best.negated && best.negated.length ? ' — termes présents seulement sous forme niée : ' + best.negated.join(', ') : '');

    return {
      status, pdf_page: best.pdf_page,
      score: Math.round(best.score * 100) / 100,
      coverage: Math.round(best.coverage * 100) / 100,
      answerCoverage: Math.round(best.ansLoose * 100) / 100,
      answerStrict: Math.round(best.ansStrict * 100) / 100,
      secondary, keyTerms, found: best.found, answerTerms, answerFound: best.ansFound, reason,
      passage: d.text.slice(0, 480), subheading: d.sub || null, meta: d.meta,
      titleHit, titleHits, topicCoverage: Math.round(topicCov * 100) / 100, demoted,
      questionAsked: q.proper
    };
  }

  // Faut-il remplacer la meilleure référence connue par une nouvelle ?
  // La couverture (0 à 1) est comparable d'un Collège à l'autre ; le score BM25 ne l'est pas.
  function isBetter(next, prev) {
    if (!prev) return true;
    const a = STATUS_RANK[next.status] || 0, b = STATUS_RANK[prev.status] || 0;
    if (a !== b) return a > b;
    return (next.coverage || 0) > (prev.coverage || 0) + 0.1;
  }

  // Extrait autour du terme recherché, pour les résultats de recherche
  function snippet(content, query, len = 160) {
    const text = String(content || '').replace(/\s+/g, ' ');
    const words = normalize(query).split(' ').filter(w => w.length >= 3);
    const norm = normalize(text);
    let pos = -1;
    for (const w of words) { pos = norm.indexOf(w); if (pos >= 0) break; }
    if (pos < 0) return text.slice(0, len);
    const start = Math.max(0, pos - Math.floor(len / 3));
    return (start > 0 ? '…' : '') + text.slice(start, start + len) + (start + len < text.length ? '…' : '');
  }

  return { normalize, stem, tokens, detectPrintedPage, detectStructure, splitStem, buildFormulationSet,
           buildIndex, buildQuery, matchQuestion, isBetter, snippet, STATUS_RANK, presentNotNegated };
})();


// =====================================================================
// PIPELINE D'IMPORT — s'exécute dans le navigateur, par lots reprenables.
// Chaque lot de pages est enregistré avant de passer au suivant : une
// interruption (fermeture, perte de réseau) reprend à la page suivante.
// =====================================================================
const EDNCollegePipeline = (() => {
  const BATCH = 20;
  const STORAGE_LIMIT = 50 * 1024 * 1024;       // limite par fichier du plan gratuit
  const OCR_MIN_CHARS = 40;                      // en dessous : page candidate à l'OCR

  // ---------- stockage local (IndexedDB) des PDF ----------
  const DB = 'edn-colleges', STORE = 'pdfs';
  const idb = () => new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  async function localPut(id, blob) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(blob, id);
      tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error);
    });
  }
  async function localGet(id) {
    try {
      const db = await idb();
      return await new Promise((res, rej) => {
        const r = db.transaction(STORE).objectStore(STORE).get(id);
        r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error);
      });
    } catch (e) { return null; }
  }
  async function localDel(id) {
    try {
      const db = await idb();
      await new Promise(res => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).delete(id); tx.oncomplete = res; });
    } catch (e) { /* rien à supprimer */ }
  }

  async function sha256(buf) {
    const h = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  const must = ({ data, error }) => { if (error) throw error; return data; };

  // Référentiel d'un Collège d'après son nom : "Neurologie 6ème édition" -> NEU.
  // On retient le nom de référentiel le plus long entièrement contenu dans le titre.
  // noms courts usuels des Collèges ("RHUMATO 8e", "Hemato 5e", "Collège ORL"…)
  const SHORT = { orl: 'ORL', hge: 'HGE', ortho: 'ORT', ophta: 'OPH', hemato: 'HEM', rhumato: 'RHU',
                  pilly: 'MIT', dermato: 'DER', cardio: 'MCV', endoc: 'END', endocrino: 'END', pneumo: 'PNE',
                  gyneco: 'GO', neuro: 'NEU', uro: 'URO', nephro: 'NEP', psy: 'PSY', pedia: 'PED' };
  function detectReferentiel(name) {
    if (typeof EDN_ITEMS === 'undefined') return null;
    const stems = new Set(EDNColleges.tokens(name));
    let best = null, bestLen = 0;
    Object.entries(EDN_ITEMS.refs).forEach(([code, label]) => {
      const words = EDNColleges.tokens(label);
      if (words.length && words.every(w => stems.has(w)) && label.length > bestLen) { best = code; bestLen = label.length; }
    });
    if (best) return best;
    const raw = EDNColleges.normalize(name).split(' ');
    for (const w of raw) if (SHORT[w]) return SHORT[w];
    return null;
  }

  // Si le titre ne suffit pas : le référentiel qui traite la plus grande part des
  // items réellement détectés dans le Collège (au moins 70 %, liste officielle).
  function detectReferentielFromItems(itemNumbers) {
    if (typeof EDN_ITEMS === 'undefined') return null;
    const items = [...new Set(itemNumbers.filter(n => n >= 1 && n <= 367))];
    if (items.length < 5) return null;
    const score = {};
    items.forEach(n => EDN_ITEMS.items[n - 1].r.forEach(r => { score[r] = (score[r] || 0) + 1; }));
    const [code, n] = Object.entries(score).sort((a, b) => b[1] - a[1])[0] || [];
    return code && n / items.length >= 0.7 ? code : null;
  }

  // ---------- création (ou détection d'un doublon) ----------
  async function createCollege({ sb, userId, file, onStep }) {
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') throw new Error('le fichier n\'est pas un PDF');
    onStep && onStep('Vérification du fichier');
    const buf = await file.arrayBuffer();
    const head = new Uint8Array(buf.slice(0, 5));
    if (String.fromCharCode(...head) !== '%PDF-') throw new Error('fichier PDF corrompu ou invalide');
    const hash = await sha256(buf);

    const existing = must(await sb.from('colleges').select('*').eq('user_id', userId).eq('file_hash', hash));
    if (existing && existing.length) return { college: existing[0], duplicate: true };

    onStep && onStep('Lecture des métadonnées');
    const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
    let title = '';
    try { const meta = await pdf.getMetadata(); title = (meta && meta.info && meta.info.Title) || ''; } catch (e) {}
    const name = (title && title.length > 5 && !/untitled|microsoft/i.test(title))
      ? title : file.name.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ');

    const college = must(await sb.from('colleges').insert({
      user_id: userId, name: name.slice(0, 140), file_name: file.name, file_hash: hash,
      file_size: file.size, page_count: pdf.numPages, status: 'imported',
      referentiel: detectReferentiel(name) || detectReferentiel(file.name)
    }).select().single());

    // PDF conservé sur l'appareil (reprise sans resélection + lecture hors ligne)
    let storedLocally = false;
    try { await localPut(college.id, new Blob([buf], { type: 'application/pdf' })); storedLocally = true; } catch (e) {}

    // PDF envoyé dans le stockage privé s'il respecte la limite du plan gratuit
    let storagePath = null;
    if (file.size <= STORAGE_LIMIT) {
      onStep && onStep('Envoi du PDF dans votre espace privé');
      const path = `${userId}/${college.id}.pdf`;
      const up = await sb.storage.from('colleges').upload(path, file, { upsert: true, contentType: 'application/pdf' });
      if (!up.error) storagePath = path;
    }
    const updated = must(await sb.from('colleges').update({ storage_path: storagePath, stored_locally: storedLocally })
      .eq('id', college.id).select().single());
    return { college: updated, duplicate: false };
  }

  // ---------- ouverture du PDF (appareil, sinon stockage privé) ----------
  async function openPdf(sb, college, fallbackFile) {
    if (fallbackFile) return pdfjsLib.getDocument({ data: await fallbackFile.arrayBuffer() }).promise;
    const blob = await localGet(college.id);
    if (blob) return pdfjsLib.getDocument({ data: await blob.arrayBuffer() }).promise;
    if (college.storage_path) {
      const { data, error } = await sb.storage.from('colleges').createSignedUrl(college.storage_path, 3600);
      if (error) throw error;
      // chargement par plages : seules les pages consultées sont téléchargées
      return pdfjsLib.getDocument({ url: data.signedUrl, disableAutoFetch: true, disableStream: false }).promise;
    }
    const e = new Error('PDF_INDISPONIBLE'); e.code = 'PDF_INDISPONIBLE'; throw e;
  }

  // ---------- OCR (Tesseract.js, gratuit et local) chargé seulement si besoin ----------
  let ocrWorker = null;
  async function getOcr() {
    if (ocrWorker) return ocrWorker;
    if (!window.Tesseract) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';
        s.onload = res; s.onerror = () => rej(new Error('OCR indisponible (chargement impossible)'));
        document.head.appendChild(s);
      });
    }
    ocrWorker = await window.Tesseract.createWorker('fra');
    return ocrWorker;
  }
  async function releaseOcr() { if (ocrWorker) { try { await ocrWorker.terminate(); } catch (e) {} ocrWorker = null; } }

  async function renderToCanvas(page, scale) {
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width); canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    return canvas;
  }

  async function pageHasImages(page) {
    try {
      const ops = await page.getOperatorList();
      const OPS = pdfjsLib.OPS;
      const img = new Set([OPS.paintImageXObject, OPS.paintJpegXObject, OPS.paintInlineImageXObject].filter(Boolean));
      return ops.fnArray.some(f => img.has(f));
    } catch (e) { return false; }
  }

  // ---------- ÉTAPE 1 : extraction page par page, reprenable ----------
  async function stageExtract(ctx) {
    const { sb, userId, college, pdf, progress } = ctx;
    let done = college.pages_done || 0;
    const counters = { text: college.pages_text || 0, ocr: college.pages_ocr || 0,
                       empty: college.pages_empty || 0, error: college.pages_error || 0 };

    while (done < college.page_count) {
      if (ctx.stopped()) return false;
      const from = done + 1, to = Math.min(college.page_count, done + BATCH);
      const rows = [];
      for (let n = from; n <= to; n++) {
        const row = { user_id: userId, college_id: college.id, pdf_page: n,
                      content: '', text_source: 'native', char_count: 0, has_images: false };
        try {
          const page = await pdf.getPage(n);
          const tc = await page.getTextContent();
          const lines = EDNParsers.itemsToLines(tc.items).map(l => l.text);
          row.content = EDNParsers.sanitize(lines.join('\n'));
          row.char_count = row.content.replace(/\s/g, '').length;
          if (row.char_count < OCR_MIN_CHARS) {
            row.has_images = await pageHasImages(page);
            // page scannée ou presque vide : OCR, jamais ignorée
            progress({ stage: 'ocr', done: n - 1, total: college.page_count });
            try {
              const worker = await getOcr();
              const canvas = await renderToCanvas(page, 2);
              const r = await worker.recognize(canvas);
              canvas.width = canvas.height = 0;
              const txt = EDNParsers.sanitize((r && r.data && r.data.text) || '').trim();
              if (txt.replace(/\s/g, '').length > row.char_count) {
                row.content = txt; row.char_count = txt.replace(/\s/g, '').length; row.text_source = 'ocr';
              } else row.text_source = row.char_count ? 'native' : 'empty';
            } catch (e) {
              row.text_source = row.char_count ? 'native' : 'error';
            }
          }
          page.cleanup && page.cleanup();
        } catch (e) {
          row.text_source = 'error';
        }
        if (row.text_source === 'ocr') counters.ocr++;
        else if (row.text_source === 'error') counters.error++;
        else if (row.char_count >= OCR_MIN_CHARS) counters.text++;
        else counters.empty++;
        rows.push(row);
        progress({ stage: 'extract', done: n, total: college.page_count });
      }
      // enregistrement du lot : idempotent (clé college_id + pdf_page)
      must(await sb.from('college_pages').upsert(rows, { onConflict: 'college_id,pdf_page' }));
      done = to;
      Object.assign(college, { pages_done: done, pages_text: counters.text, pages_ocr: counters.ocr,
                               pages_empty: counters.empty, pages_error: counters.error });
      must(await sb.from('colleges').update({
        pages_done: done, pages_text: counters.text, pages_ocr: counters.ocr,
        pages_empty: counters.empty, pages_error: counters.error,
        status: 'extracting', updated_at: new Date().toISOString()
      }).eq('id', college.id));
    }
    await releaseOcr();
    return true;
  }

  async function loadPages(sb, collegeId, cols) {
    const out = [];
    for (let from = 0; ; from += 250) {
      const data = must(await sb.from('college_pages').select(cols)
        .eq('college_id', collegeId).order('pdf_page').range(from, from + 249));
      out.push(...data);
      if (data.length < 250) break;
    }
    return out;
  }

  // ---------- ÉTAPE 2 : structure (items, chapitres, pages imprimées) ----------
  async function stageStructure(ctx) {
    const { sb, userId, college, progress } = ctx;
    progress({ stage: 'indexing', done: 0, total: 1 });
    const pages = await loadPages(sb, college.id, 'pdf_page, content');
    const st = EDNColleges.detectStructure(pages);
    for (let i = 0; i < st.pages.length; i += 200) {
      if (ctx.stopped()) return false;
      const rows = st.pages.slice(i, i + 200).map(s => ({ user_id: userId, college_id: college.id, ...s }));
      must(await sb.from('college_pages').upsert(rows, { onConflict: 'college_id,pdf_page' }));
      progress({ stage: 'indexing', done: Math.min(i + 200, st.pages.length), total: st.pages.length });
    }
    college.items_detected = st.itemsDetected; college.chapters_detected = st.chaptersDetected;
    must(await sb.from('colleges').update({
      items_detected: st.itemsDetected, chapters_detected: st.chaptersDetected,
      status: 'matching', updated_at: new Date().toISOString()
    }).eq('id', college.id));
    return true;
  }

  async function loadQuestions(sb, userId) {
    const out = [];
    for (let from = 0; ; from += 300) {
      const data = must(await sb.from('questions')
        .select('id, question_text, explanation, official_correction, question_type, question_options(option_text, is_correct)')
        .eq('user_id', userId).order('id').range(from, from + 299));
      out.push(...data);
      if (data.length < 300) break;
    }
    return out.map(q => ({ ...q, options: (q.question_options || []).map(o => ({ text: o.option_text, is_correct: o.is_correct })) }));
  }

  // ---------- ÉTAPE 3 : correspondances QCM -> pages de CE Collège ----------
  // Utilise uniquement le texte en base : peut être relancée à tout moment
  // (nouveaux QCM importés) sans le PDF.
  async function stageMatch(ctx) {
    const { sb, userId, college, progress } = ctx;
    const pages = await loadPages(sb, college.id, 'pdf_page, content, printed_page, item_number, item_title, chapter, heading');
    if (ctx.onPages) ctx.onPages(pages);
    const index = EDNColleges.buildIndex(pages);
    const questions = await loadQuestions(sb, userId);

    const refs = [];
    let affirmed = 0, review = 0;
