  const STATUS_LABEL = { maitrisee: 'Maîtrisée', en_cours: 'En cours', fragile: 'Fragile', a_apprendre: 'À apprendre' };

  // filter = 'mastered' | 'review'
  async function renderQuestionList(filter) {
    const mastered = filter === 'mastered';
    const title = mastered ? 'Questions maîtrisées' : 'Questions à revoir';
    shell(skeleton(3), title);

    const { data: rows } = await sb.from('mastery').select('*').eq('user_id', CURRENT_USER.id);
    const kept = (rows || []).filter(m => mastered ? EDNEngine.isMastered(m) : EDNEngine.isToReview(m));

    if (!kept.length) {
      shell(`<h1>${title}</h1>${emptyState(
        mastered ? 'Aucune question maîtrisée pour l\'instant' : 'Aucune question à revoir',
        mastered ? 'Une question devient maîtrisée quand votre dernière réponse est exacte à 100 %.'
                 : 'Toutes les questions déjà répondues sont justes. Continuez l\'entraînement.',
        '#/exams', 'Mes EDN', mastered ? 'target' : 'inbox')}`, title);
      return;
    }

    // chargement des énoncés par paquets (liste potentiellement longue)
    const ids = kept.map(m => m.question_id);
    const byId = new Map();
    for (let i = 0; i < ids.length; i += 200) {
      const { data } = await sb.from('questions')
        .select('id, question_number, question_text, exam_id, topic_id').in('id', ids.slice(i, i + 200));
      (data || []).forEach(q => byId.set(q.id, q));
    }
    const { data: topics } = await sb.from('topics').select('id, name').eq('user_id', CURRENT_USER.id);
    const topicName = new Map((topics || []).map(t => [t.id, t.name]));

    const items = kept
      .map(m => ({ m, q: byId.get(m.question_id) }))
      .filter(x => x.q)
      .sort((a, b) => (a.q.question_number || 0) - (b.q.question_number || 0));

    const MAX = 150;
    const shown = items.slice(0, MAX);

    shell(`
      <h1>${title}</h1>
      <p class="subtitle">${items.length} question${items.length > 1 ? 's' : ''}</p>
      ${shown.map(({ m, q }) => {
        const st = EDNEngine.computeStatus(m);
        const txt = String(q.question_text || '').split('\n\n').pop().trim();
        return `<a class="card card-tight" href="#/question/${q.id}" style="display:block;">
          <div class="flex-between" style="align-items:flex-start;">
            <span class="small" style="font-family:var(--font-mono);">Q${q.question_number ?? '?'}${
              q.topic_id && topicName.get(q.topic_id) ? ' · ' + esc(topicName.get(q.topic_id)) : ''}</span>
            <span class="badge badge-${st}">${STATUS_LABEL[st]}</span>
          </div>
          <p style="margin:8px 0 6px;font-size:.94rem;color:var(--ink);">${esc(txt.slice(0, 140))}${txt.length > 140 ? '…' : ''}</p>
          <div class="small">${m.total_correct || 0} juste(s) · ${m.total_incorrect || 0} erreur(s)</div>
        </a>`;
      }).join('')}
      ${items.length > MAX ? `<p class="small center mt">${items.length - MAX} questions supplémentaires non affichées</p>` : ''}
    `, title);
  }

  // Détail d'une question : ma réponse, les bonnes réponses, l'explication
  // JUSTIFICATION DANS VOS COLLÈGES — une citation exacte par bonne réponse.
  // Proposée par le moteur (« à confirmer »), confirmée ou rejetée par vous.
  // Seule une confirmation affiche « ✓ Relu ». Rien n'est rédigé par une IA.
  async function fillEvidence(q, opts, host) {
    if (!host || !q) return;
    const isOpen = (q.question_type || '') === 'qroc';
    let good = (opts || []).filter(o => o.is_correct);
    if (isOpen) good = good.slice(0, 1);
    if (!good.length) return;
    const uid = CURRENT_USER.id;
    const [ev, an] = await Promise.all([
      sb.from('answer_evidence').select('id, option_key, college_id, pdf_page, printed_page, passage, rank, status, colleges(name)')
        .eq('user_id', uid).eq('question_id', q.id),
      sb.from('question_analysis').select('question_id').eq('user_id', uid).eq('question_id', q.id)
    ]);
    if (ev.error) return;   // migration 006 pas encore exécutée : rien à afficher
    let rows = ev.data || [];
    const analysed = !!((an.data || []).length);
    const render = () => {
      const blocks = good.map(o => {
        const mine = rows.filter(r => r.option_key === o.option_key);
        const conf = mine.filter(r => r.status === 'confirmed').sort((a, b) => a.rank - b.rank)[0];
        const prop = mine.filter(r => r.status === 'proposed').sort((a, b) => a.rank - b.rank)[0];
        const r = conf || prop;
        const label = isOpen ? esc(o.option_text) : `<b>${esc(o.option_key)}</b> — ${esc(o.option_text)}`;
        if (!r) return `<div class="ev-row"><div class="ev-head">${label}</div>
          <p class="ev-none">${analysed ? 'Source insuffisante dans vos Collèges : aucun passage ne la justifie de façon fiable.' : 'Pas encore analysée.'}</p></div>`;
        const page = `p. ${r.pdf_page}${r.printed_page ? ' (imprimée ' + esc(r.printed_page) + ')' : ''}`;
        return `<div class="ev-row" data-id="${r.id}">
          <div class="ev-head">${label}</div>
          <blockquote class="ev-quote">${esc(r.passage)}</blockquote>
          <div class="ev-src"><span>${esc((r.colleges && r.colleges.name) || 'Collège')} · ${page}</span>
            <a class="ev-link" href="#/college/${r.college_id}/page/${r.pdf_page}">Voir la page</a></div>
          ${conf ? `<div class="ev-state ok"><span>✓ Relu par vous</span><button class="btn btn-ghost btn-sm" data-ev="proposed">Retirer</button></div>`
                 : `<div class="ev-state"><span>Passage proposé · à confirmer</span>
                    <div class="ev-actions"><button class="btn btn-sm" data-ev="rejected">Ne justifie pas</button>
                    <button class="btn btn-good btn-sm" data-ev="confirmed">Justifie la réponse</button></div></div>`}
        </div>`;
      }).join('');
      host.innerHTML = `<section class="explain ev-zone"><h4>Justification dans vos Collèges</h4>${blocks}
        <p class="ev-foot">Citations exactes des Collèges, rapprochées automatiquement. Seul « ✓ Relu » a été confirmé par vous.</p></section>`;
      host.querySelectorAll('[data-ev]').forEach(b => b.onclick = async () => {
        const row = b.closest('.ev-row'), id = row && row.dataset.id, status = b.dataset.ev;
        if (!id) return;
        b.disabled = true;
        const { error } = await sb.from('answer_evidence').update({ status, reviewed_at: status === 'proposed' ? null : new Date().toISOString() })
          .eq('id', id).eq('user_id', uid);
        if (error) { b.disabled = false; alert('Non enregistré : ' + error.message); return; }
        rows = rows.map(x => x.id === id ? Object.assign({}, x, { status }) : x);
        render();
      });
    };
    render();
  }

  async function renderQuestionDetail(questionId) {
    shell(skeleton(2), 'Question');
    const { data: q } = await sb.from('questions')
      .select('*, question_options(*), topics(name)').eq('id', questionId).single();
    if (q) q.theme = (q.topics && q.topics.name) || '';
    if (!q) { shell(emptyState('Question introuvable', '', '#/dashboard', 'Accueil'), 'Question'); return; }

    const { data: attempts } = await sb.from('attempts')
      .select('selected_answers, is_correct, answered_at, cycle_number')
      .eq('question_id', questionId).eq('user_id', CURRENT_USER.id)
      .order('answered_at', { ascending: true });

    const { data: mastery } = await sb.from('mastery')
      .select('*').eq('user_id', CURRENT_USER.id).eq('question_id', questionId).maybeSingle();

    const last = (attempts || []).length ? attempts[attempts.length - 1] : null;
    const mine = last ? (last.selected_answers || []) : [];
    const opts = (q.question_options || []).sort((a, b) => a.position - b.position);
    const correctKeys = opts.filter(o => o.is_correct).map(o => o.option_key);
    const isOpen = (q.question_type || '') === 'qroc';
    const st = EDNEngine.computeStatus(mastery);

    const images = Array.isArray(q.images) ? q.images : [];
    const mainImages = images.filter(im => !im.label)
      .map(im => `<img src="${im.src}" class="q-image" alt="Illustration" loading="lazy"/>`).join('');

    const parts = String(q.question_text || '').split('\n\n');
    const hasContext = parts.length > 1 && /^\[Contexte/.test(parts[0]);
    const contextHtml = hasContext
      ? `<div class="q-context">${esc(readable(parts[0].replace(/^\[Contexte\s*[^\]]*\]\s*/, '')))}</div>` : '';
    const statement = esc(readable(hasContext ? parts.slice(1).join('\n\n') : q.question_text));

    // propositions : vert = bonne réponse officielle, rouge = cochée à tort
    const optionsHtml = isOpen
      ? `<div class="explain"><h4>Réponses acceptées</h4><p>${opts.map(o => esc(o.option_text)).join(' · ')}</p></div>`
      : opts.map(o => {
          const good = o.is_correct, picked = mine.includes(o.option_key);
          const cls = good ? 'correct' : (picked ? 'incorrect' : '');
          const tag = good && picked ? ' · cochée, juste' : good ? ' · attendue' : picked ? ' · cochée à tort' : '';
          return `<div class="option disabled ${cls}">
            <span class="key" aria-hidden="true">${o.option_key}</span>
            <span class="body">${esc(o.option_text)}
              ${tag ? `<span class="small" style="display:block;margin-top:4px;">${tag}</span>` : ''}
              ${images.filter(im => im.label === o.option_key).map(im => `<img src="${im.src}" class="q-image" alt="Illustration" loading="lazy"/>`).join('')}
            </span></div>`;
        }).join('');

    const mineLabel = isOpen
      ? (mine.length ? esc(mine.join(', ')) : '—')
      : (mine.length ? mine.join(', ') : '—');

    const historyHtml = (attempts || []).length ? `
      <div class="card">
        <h2>Historique</h2>
        <p class="small">${attempts.length} tentative${attempts.length > 1 ? 's' : ''} · conservées intégralement</p>
        <div style="margin-top:12px;">
          ${attempts.map((a, i) => `<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--line);">
            <span class="small">Tentative ${i + 1} · cycle ${a.cycle_number} · ${new Date(a.answered_at).toLocaleDateString('fr-FR')}</span>
            <span class="badge ${a.is_correct ? 'badge-maitrisee' : 'badge-a_apprendre'}">${a.is_correct ? 'Juste' : 'Faux'}</span>
          </div>`).join('')}
        </div>
      </div>` : '';

    shell(`
      <div class="question-shell" data-return-hash="#/question/${questionId}" data-return-label="Question ${q.question_number ?? ''}">
        <div class="flex-between mb">
          <h1>Question ${q.question_number ?? ''}${questionFormat(q.theme, q.question_text) ? ' <span class="badge badge-accent" style="font-size:.7rem;vertical-align:middle;">' + questionFormat(q.theme, q.question_text) + '</span>' : ''}</h1>
          <span class="badge badge-${st}">${STATUS_LABEL[st]}</span>
        </div>
        ${contextHtml}
        <div class="q-text">${statement}</div>
        ${mainImages}
        <div style="margin-bottom:20px;">${optionsHtml}</div>

        <div class="explain">
          <h4>Ma réponse</h4>
          <p style="color:${last && last.is_correct ? 'var(--good)' : 'var(--bad)'};font-weight:700;">
            ${mineLabel}${last ? (last.is_correct ? ' — juste' : ' — fausse') : ' — jamais répondue'}</p>
        </div>
        ${!isOpen && correctKeys.length ? `<div class="explain">
          <h4>Bonne(s) réponse(s)</h4>
          <p style="color:var(--good);font-weight:700;">${correctKeys.join(', ')}</p></div>` : ''}
        ${q.official_correction ? `<div class="explain"><h4>Correction officielle</h4><p>${esc(q.official_correction)}</p></div>` : ''}
        ${q.explanation ? `<div class="explain"><h4>Explication</h4><p>${esc(q.explanation)}</p></div>` : ''}

        <div id="detail-evidence"></div>
        <div id="detail-college-ref"></div>
        ${historyHtml}

        <div class="btn-row mt">
          <button class="btn btn-block" id="back-btn">Retour</button>
        </div>
      </div>
    `, 'Question');
    document.getElementById('back-btn').onclick = () => history.back();
    wireCollapsibleContexts(document, false);
    fillCollegeReference(q.id, document.getElementById('detail-college-ref'));
    fillEvidence(q, opts, document.getElementById('detail-evidence'));
  }

  // ---------------------------------------------------------------
  // LISTE DES ITEMS EDN
  // ---------------------------------------------------------------
  const refColor = (code) => (EDN_ITEMS.colors[code] || '#888');
  const refChip = (code) => `<span class="ref-chip" style="--c:${refColor(code)}">${esc(EDN_ITEMS.refs[code] || code)}</span>`;
  let ITEMS_FILTER = { q: '', ref: '' };

  function itemMatches(it, q, ref) {
    if (ref && !it.r.includes(ref)) return false;
    if (!q) return true;
    const nq = EDNColleges.normalize(q);
    if (/^\d{1,3}$/.test(nq)) return String(it.n) === nq || String(it.n).startsWith(nq);
    const hay = EDNColleges.normalize(it.t + ' ' + it.r.map(c => EDN_ITEMS.refs[c]).join(' '));
    // insensible aux traits d'union et espaces : "prééclampsie" trouve "pré-éclampsie"
    const compact = hay.replace(/ /g, '');
    return nq.split(' ').filter(Boolean).every(w => hay.includes(w) || compact.includes(w));
  }

  function renderItems() {
    const refs = Object.keys(EDN_ITEMS.refs).sort((a, b) => EDN_ITEMS.refs[a].localeCompare(EDN_ITEMS.refs[b], 'fr'));
    shell(`
      <h1>Liste des items</h1>
      <p class="subtitle">367 items EDN · 37 référentiels</p>
      <div class="search-panel">
        <div class="row2">
          <input type="search" id="it-q" placeholder="Numéro, titre ou mot-clé" autocomplete="off" enterkeyhint="search" aria-label="Rechercher un item" value="${esc(ITEMS_FILTER.q)}" />
          <select id="it-ref" aria-label="Filtrer par référentiel">
            <option value="">Tous les référentiels</option>
            ${refs.map(c => `<option value="${c}" ${ITEMS_FILTER.ref === c ? 'selected' : ''}>${esc(EDN_ITEMS.refs[c])}</option>`).join('')}
          </select>
        </div>
        <div id="it-count" class="small" style="margin-top:8px;font-weight:600;"></div>
      </div>
      <div id="it-list" class="item-list-grid"></div>`, 'Items');

    const list = document.getElementById('it-list');
    const count = document.getElementById('it-count');
    const draw = () => {
      const res = EDN_ITEMS.items.filter(it => itemMatches(it, ITEMS_FILTER.q, ITEMS_FILTER.ref));
      count.textContent = `${res.length} item${res.length > 1 ? 's' : ''}`;
      list.innerHTML = res.map(it => `
        <a class="card card-tight item-row" href="#/item/${it.n}">
          <div class="item-num">Item ${it.n}</div>
          <div class="item-title">${esc(it.t)}</div>

        </a>`).join('') || '<p class="small center mt">Aucun item ne correspond.</p>';
    };
    document.getElementById('it-q').oninput = (e) => { ITEMS_FILTER.q = e.target.value; draw(); };
    document.getElementById('it-ref').onchange = (e) => { ITEMS_FILTER.ref = e.target.value; draw(); };
    draw();
  }

  async function renderItem(n) {
    const it = EDN_ITEMS.items.find(x => x.n === n);
    if (!it) { shell(emptyState('Item introuvable', 'Les items vont de 1 à 367.', '#/items', 'Liste des items'), 'Item'); return; }
    shell(`<h1>Item ${n}</h1><p class="subtitle">${esc(it.t)}</p>${skeleton(2)}`, 'Item ' + n);

    // 1. pages de Collèges où cet item est détecté
    let collegeHtml = '';
    const { data: pages, error: pErr } = await sb.from('college_pages')
      .select('college_id, pdf_page, printed_page, chapter, heading, colleges(name)')
      .eq('user_id', CURRENT_USER.id).eq('item_number', n).order('pdf_page').limit(2000);
    if (!pErr && (pages || []).length) {
      const byCol = new Map();
      pages.forEach(p => { if (!byCol.has(p.college_id)) byCol.set(p.college_id, []); byCol.get(p.college_id).push(p); });
      collegeHtml = [...byCol.entries()].map(([cid, ps]) => {
        const first = ps[0], last = ps[ps.length - 1];
        const lab = (p) => p.printed_page ? p.printed_page : 'PDF ' + p.pdf_page;
        return `<a class="list-row" href="#/college/${cid}/page/${first.pdf_page}">
          <span class="ico">${icon('bookopen')}</span>
          <span class="txt"><b>${esc(String(first.colleges ? first.colleges.name : 'Collège').replace(/^\d{6,}\s+/, ''))}</b>
            ${first.chapter ? `<span>${esc(first.chapter)}</span>` : ''}
            <span class="label-mono" style="margin-top:3px;">p. ${esc(String(lab(first)))}${ps.length > 1 ? '–' + esc(String(lab(last))) : ''} · ${ps.length} page${ps.length > 1 ? 's' : ''}</span></span>
          <span class="end">${icon('chevron').replace('<svg', '<svg class="chev"')}</span></a>`;
      }).join('');
    }

    // 2. QCM liés : par la référence Collège OU par la mention "Item N" du corrigé
    const qIds = new Set();
    const { data: linked } = await sb.from('question_reference_status').select('question_id')
      .eq('user_id', CURRENT_USER.id).eq('item_number', n);
    (linked || []).forEach(r => qIds.add(r.question_id));
    const pat = `%Item ${n} %`;
    for (const col of ['explanation', 'question_text', 'official_correction']) {
      const { data } = await sb.from('questions').select('id, ' + col).eq('user_id', CURRENT_USER.id).ilike(col, `%item ${n}%`).limit(300);
      (data || []).forEach(q => { if (new RegExp('\\bitem\\s*' + n + '\\b', 'i').test(q[col] || '')) qIds.add(q.id); });
    }
    const ids = [...qIds];
    let qs = [], mastery = new Map();
    if (ids.length) {
      for (let i = 0; i < ids.length; i += 150) {
        const { data } = await sb.from('questions').select('id, question_number, question_text').in('id', ids.slice(i, i + 150));
        qs.push(...(data || []));
        const { data: m } = await sb.from('mastery').select('*').eq('user_id', CURRENT_USER.id).in('question_id', ids.slice(i, i + 150));
        (m || []).forEach(x => mastery.set(x.question_id, x));
      }
    }
    const mastered = qs.filter(q => EDNEngine.isMastered(mastery.get(q.id))).length;
    const review = qs.filter(q => EDNEngine.isToReview(mastery.get(q.id))).length;
    const pct = qs.length ? Math.round(mastered / qs.length * 100) : 0;

    const unseenQ = qs.length - mastered - review;
    shell(`
      <a class="btn btn-sm btn-ghost" href="#/items" style="margin:-6px 0 8px -8px;">← Liste des items</a>
      <div class="page-head" style="margin-top:0;">
        <span class="label-mono">Item ${n} · ${it.r.length} référentiel${it.r.length > 1 ? 's' : ''}</span>
        <h1 style="font-size:clamp(1.3rem, 1.15rem + .9vw, 1.75rem);line-height:1.25;">${esc(it.t)}</h1>
      </div>
      <div class="ref-chips" style="margin:-4px 0 4px;">${it.r.length ? it.r.map(refChip).join('') : '<span class="small">Aucun référentiel associé</span>'}</div>

      <section class="section">
        <div class="section-head"><h2>Dans vos Collèges</h2>${collegeHtml ? '' : ''}</div>
        ${collegeHtml ? `<nav class="list-group">${collegeHtml}</nav>`
          : `<p class="small">${pErr ? 'Collèges non disponibles.' : 'Cet item n\'a été détecté dans aucun de vos Collèges importés.'}</p>`}
      </section>

      <section class="section">
        <div class="section-head"><h2>Questions liées</h2><span class="label-mono">${qs.length}</span></div>
        ${qs.length ? `<div class="panel" style="padding:var(--space-4);margin-bottom:10px;">
          <div class="dist"><i class="m" style="flex-grow:${mastered}"></i><i class="r" style="flex-grow:${review}"></i><i class="u" style="flex-grow:${unseenQ}"></i></div>
          <div class="dist-legend" style="margin-top:10px;">
            <div><span class="num" style="font-size:1.25rem;">${mastered}</span><span class="k" style="--dot:var(--color-primary)">Maîtrisées</span></div>
            <div><span class="num" style="font-size:1.25rem;">${review}</span><span class="k" style="--dot:var(--color-accent)">À revoir</span></div>
            <div><span class="num" style="font-size:1.25rem;">${unseenQ}</span><span class="k" style="--dot:#D9D6CD">Non travaillées</span></div>
          </div></div>
          <nav class="list-group">
          ${qs.sort((a, b) => (a.question_number || 0) - (b.question_number || 0)).map(q => {
            const st = EDNEngine.computeStatus(mastery.get(q.id)); const t = String(q.question_text || '').split('\n\n').pop();
            return `<a class="list-row" href="#/question/${q.id}" style="align-items:flex-start;">
              <span class="txt"><span class="label-mono" style="white-space:normal;">Q${q.question_number ?? '?'}</span>
              <b style="font-weight:600;font-size:.875rem;line-height:1.45;margin-top:3px;white-space:normal;">${esc(readable(t.slice(0, 140)))}${t.length > 140 ? '…' : ''}</b></span>
              <span class="end" style="padding-top:2px;"><span class="badge badge-${st}">${STATUS_LABEL[st]}</span></span></a>`; }).join('')}
          </nav>`
        : `<p class="small">Aucune question reliée à cet item pour l'instant. Les liens viennent des références Collège vérifiées et des mentions « Item ${n} » dans vos corrigés.</p>`}
      </section>
    `, 'Item ' + n);
  }

  // ---------------------------------------------------------------
  // COLLÈGES — interface (la logique est dans js/colleges.js)
  // ---------------------------------------------------------------
  const COLLEGE_STATUS = {
    imported: ['Importé', 'badge-accent'], extracting: ['Analyse en cours', 'badge-accent'],
    ocr: ['OCR en cours', 'badge-accent'], indexing: ['Indexation en cours', 'badge-accent'],
    matching: ['Correspondances en cours', 'badge-accent'], verifying: ['Vérification en cours', 'badge-accent'],
    done: ['Analyse terminée', 'badge-maitrisee'], error: ['Erreur', 'badge-a_apprendre'],
    incomplete: ['Analyse incomplète', 'badge-fragile']
  };
  const STAGE_LABEL = {
    extract: ['Extraction du texte', 1], ocr: ['OCR d\'une page scannée', 1], indexing: ['Détection de la structure', 2],
    matching: ['Recherche des correspondances', 3], verifying: ['Enregistrement des références', 4],
    previews: ['Création des aperçus de pages', 5]
  };
  let COLLEGE_JOB = null;         // analyse en cours dans cet onglet
  const PDF_CACHE = new Map();    // PDF ouverts dans le lecteur

  async function renderColleges(fromImport) {
    shell(skeleton(2), 'Collèges');
    const { data: colleges, error } = await sb.from('colleges').select('*')
      .eq('user_id', CURRENT_USER.id).order('name');
    if (error) {
      shell(`<h1>Collèges</h1><div class="card" style="border-color:var(--bad);">
        Les tables des Collèges n'existent pas encore dans votre base.<br/>
        <span class="small">Exécutez <code>migration_002_colleges.sql</code> dans Supabase &gt; SQL Editor. (${esc(error.message)})</span></div>`, 'Collèges');
      return;
    }
    const { count: sansRef } = await sb.from('question_reference_status')
      .select('question_id', { count: 'exact', head: true }).eq('user_id', CURRENT_USER.id).eq('best_status', 'not_found');

    const importCard = `
      <section class="card mb">
        <h2>Ajouter un Collège</h2>
        <p class="small">Un seul fichier PDF : tout le reste est automatique (texte, OCR si besoin, structure, correspondances avec vos QCM). Gardez l'écran allumé pendant l'analyse.</p>
        <input type="file" id="college-file" accept=".pdf,application/pdf" style="display:none" />
        <button class="btn btn-accent btn-lg btn-block" id="college-pick">+ Choisir un Collège (PDF)</button>
        <div id="college-job"></div>
      </section>`;

    const refOptions = (cur) => Object.keys(EDN_ITEMS.refs).sort((a, b) => EDN_ITEMS.refs[a].localeCompare(EDN_ITEMS.refs[b], 'fr'))
      .map(k => `<option value="${k}" ${cur === k ? 'selected' : ''}>${esc(EDN_ITEMS.refs[k])}</option>`).join('');
    const list = (colleges || []).map(c => {
      const [lab, cls] = COLLEGE_STATUS[c.status] || [c.status, 'badge-idle'];
      const pct = c.page_count ? Math.round((c.pages_done / c.page_count) * 100) : 0;
      const busy = COLLEGE_JOB && COLLEGE_JOB.id === c.id;
      const spine = c.referentiel ? refColor(c.referentiel) : '#C9C5BA';
      const refName = c.referentiel ? EDN_ITEMS.refs[c.referentiel] : 'Référentiel non défini';
      return `<article class="book" data-book="${esc((c.name + ' ' + refName).toLowerCase())}" style="--spine:${spine}">
        <a class="book-main" href="#/college/${c.id}">
          <span class="book-spine" aria-hidden="true"></span>
          <span class="book-txt"><b>${esc(String(c.name).replace(/^\d{6,}\s+/, ''))}</b>
            <span class="label-mono">${c.page_count} p. · ${esc(refName)}</span></span>
          ${c.status !== 'done' || busy ? `<span class="badge ${busy ? 'badge-en_cours' : cls}">${busy ? 'Analyse…' : lab}</span>` : ''}
        </a>
        ${c.status !== 'done' ? `<div class="book-progress"><div class="bar accent"><i style="width:${pct}%"></i></div>
          <span class="small">Pages analysées : ${c.pages_done} / ${c.page_count}${c.last_error ? ' · ' + esc(c.last_error) : ''}</span></div>` : ''}
        <details class="book-manage">
          <summary aria-label="Gérer ${esc(c.name)}">Gérer</summary>
          <div class="book-panel">
            <label style="margin-top:0;">Référentiel</label>
            <select data-ref-college="${c.id}"><option value="">— non défini —</option>${refOptions(c.referentiel)}</select>
            <div class="btn-row" style="margin-top:10px;">
              <a class="btn btn-sm" href="#/college/${c.id}">Lire</a>
              <a class="btn btn-sm" href="#/college/${c.id}/report">Rapport</a>
              ${c.status !== 'done' && !busy ? `<button class="btn btn-sm" data-resume-college="${c.id}">Reprendre l'analyse</button>` : ''}
              <button class="btn btn-sm btn-danger" data-del-college="${c.id}">Supprimer</button>
            </div>
          </div>
        </details>
      </article>`;
    }).join('');
    const nDone = (colleges || []).filter(c => c.status === 'done').length;
    const totalPages = (colleges || []).reduce((n, c) => n + (c.page_count || 0), 0);
    const chevR = icon('chevron').replace('<svg', '<svg class="chev"');

    shell(`
      <div class="page-head flex-between" style="align-items:flex-end;">
        <div><span class="label-mono">Bibliothèque · ${(colleges || []).length} ouvrage${(colleges || []).length > 1 ? 's' : ''} · ${totalPages.toLocaleString('fr-FR')} pages</span><h1>Collèges</h1></div>
        ${!fromImport ? `<a class="btn btn-sm" href="#/colleges/import">${icon('plus')}Importer</a>` : ''}
      </div>
      ${fromImport ? importCard : ''}
      ${(colleges || []).length > 5 ? `<input type="search" id="book-q" placeholder="Rechercher un Collège ou un référentiel" aria-label="Rechercher un Collège" autocomplete="off" style="margin-bottom:12px;" />` : ''}
      ${list ? `<div class="library" id="library">${list}</div><p class="small" id="book-empty" style="display:none;text-align:center;margin-top:16px;">Aucun Collège ne correspond.</p>`
             : (fromImport ? '' : emptyState('Aucun Collège', 'Importez vos Collèges au format PDF depuis Importer.', '#/colleges/import', 'Importer un Collège', 'books'))}

      ${sansRef || nDone ? `<section class="section">
        <div class="section-head"><h2>Outils</h2></div>
        ${sansRef ? `<nav class="list-group mb"><a class="list-row" href="#/colleges/unreferenced"><span class="ico" style="background:var(--color-warning-soft);color:var(--color-warning);">${icon('list')}</span>
          <span class="txt"><b>Questions sans référence</b><span>${sansRef} question${sansRef > 1 ? 's' : ''} sans passage identifié</span></span><span class="end">${chevR}</span></a></nav>` : ''}
        ${nDone ? `<div class="panel">
          <h3>Réévaluer toutes les références</h3>
          <p class="small" style="margin:6px 0 12px;">Relance l'analyse de chaque question dans tous vos Collèges et détermine l'item de chaque question. À faire après une mise à jour, ou si un référentiel a été corrigé. Les références relues sont conservées.</p>
          <button class="btn btn-block" id="rematch-all">Réévaluer</button><div id="rematch-out" class="small mt"></div></div>` : ''}
      </section>` : ''}
    `, 'Collèges');
    document.querySelectorAll('[data-ref-college]').forEach(sel => sel.onchange = async () => {
      const { error: e } = await sb.from('colleges').update({ referentiel: sel.value || null })
        .eq('id', sel.dataset.refCollege).eq('user_id', CURRENT_USER.id);
      if (e) alert('Enregistrement impossible : ' + e.message + '\n\nAvez-vous exécuté migration_003 ?');
    });
    const bq = document.getElementById('book-q');
    if (bq) bq.oninput = () => {
      const q = EDNColleges.normalize(bq.value);
      let shown = 0;
      document.querySelectorAll('#library .book').forEach(el => {
        const ok = !q || EDNColleges.normalize(el.dataset.book).includes(q);
        el.style.display = ok ? '' : 'none'; if (ok) shown++;
      });
      document.getElementById('book-empty').style.display = shown ? 'none' : '';
    };
    const rm = document.getElementById('rematch-all');
    if (rm) rm.onclick = async () => {
      rm.disabled = true; const out = document.getElementById('rematch-out');
      try {
        const n = await EDNCollegePipeline.rematchAll({ sb, userId: CURRENT_USER.id, onProgress: (p) => {
          out.textContent = (p.college ? `${p.college} (${p.index}/${p.count}) — ` : '') + `${p.stage} ${p.done}/${p.total}`; } });
        out.innerHTML = `<span style="color:var(--good);">✓ ${n} Collège(s) réévalué(s).</span>`;
      } catch (e) { out.innerHTML = `<span style="color:var(--bad);">${esc(e.message || String(e))}</span>`; }
      rm.disabled = false;
    };

    const pick = document.getElementById('college-pick');
    const input = document.getElementById('college-file');
    if (pick) pick.onclick = () => input.click();
    if (input) input.onchange = () => { if (input.files[0]) startCollegeImport(input.files[0]); };

    document.querySelectorAll('[data-resume-college]').forEach(b => b.onclick = async () => {
      const c = colleges.find(x => x.id === b.dataset.resumeCollege);
      location.hash = '#/colleges/import';
      setTimeout(() => runCollegeJob(c, null), 50);
    });
    document.querySelectorAll('[data-del-college]').forEach(b => b.onclick = async () => {
      const c = colleges.find(x => x.id === b.dataset.delCollege);
      if (!confirm(`Supprimer « ${c.name} » ?\n\nSes pages, son index et ses références seront supprimés. Vos QCM, réponses et statistiques ne sont pas touchés.`)) return;
      b.disabled = true;
      try {
        if (c.storage_path) await sb.storage.from('colleges').remove([c.storage_path]);
        await EDNCollegePipeline.localDel(c.id);
        const { error: e } = await sb.from('colleges').delete().eq('id', c.id).eq('user_id', CURRENT_USER.id);
        if (e) throw e;
        // les meilleures références sont recalculées sans ce Collège
        await sb.from('question_reference_status').delete().eq('user_id', CURRENT_USER.id);
        await EDNCollegePipeline.rematchAll({ sb, userId: CURRENT_USER.id });
      } catch (e) { alert('Suppression impossible : ' + (e.message || e)); }
      renderColleges(fromImport);
    });
  }

  async function startCollegeImport(file) {
    const box = document.getElementById('college-job');
    const say = (t) => { if (box) box.innerHTML = `<p class="small mt">${esc(t)}</p>`; };
    try {
      const { college, duplicate } = await EDNCollegePipeline.createCollege({
        sb, userId: CURRENT_USER.id, file, onStep: say });
      if (duplicate) {
        say('');
        if (college.status === 'done') { alert(`Ce Collège semble déjà présent : « ${college.name} ». Aucune copie n'a été créée.`); return; }
        if (!confirm(`Ce Collège est déjà présent (« ${college.name} ») mais son analyse n'est pas terminée. Reprendre l'analyse ?`)) return;
      }
      await runCollegeJob(college, file);
    } catch (e) {
      console.error(e);
      say('');
      alert('Import impossible : ' + (e.message || e));
    }
  }

  async function runCollegeJob(college, file) {
    if (COLLEGE_JOB) { alert('Une analyse est déjà en cours.'); return; }
    COLLEGE_JOB = { id: college.id, stop: false };
    let wake = null;
    try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}

    const draw = (p) => {
      const box = document.getElementById('college-job');
      if (!box) return;
      const [label, step] = STAGE_LABEL[p.stage] || [p.stage, 0];
      const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
      box.innerHTML = `
        <div class="mt">
          <div class="flex-between"><strong>Analyse de « ${esc(college.name)} »</strong><span class="small">Étape ${step}/5</span></div>
          <div class="small" style="margin:6px 0;">${esc(label)} — ${p.done} / ${p.total} (${pct} %)</div>
          <div class="bar accent"><i style="width:${pct}%"></i></div>
          <div class="small" style="margin-top:6px;">Pages analysées : ${college.pages_done || 0} / ${college.page_count}
            · texte ${college.pages_text || 0} · OCR ${college.pages_ocr || 0}</div>
          <button class="btn btn-sm mt" id="college-stop">Mettre en pause</button>
        </div>`;
      const stop = document.getElementById('college-stop');
      if (stop) stop.onclick = () => { COLLEGE_JOB.stop = true; stop.disabled = true; stop.textContent = 'Pause après ce lot…'; };
    };

    try {
      draw({ stage: 'extract', done: college.pages_done || 0, total: college.page_count });
      const result = await EDNCollegePipeline.run({
        sb, userId: CURRENT_USER.id, college, file,
        onProgress: draw, shouldStop: () => COLLEGE_JOB && COLLEGE_JOB.stop
      });
      COLLEGE_JOB = null;
      if (result === 'done') location.hash = `#/college/${college.id}/report`;
      else renderColleges(true);
    } catch (e) {
      COLLEGE_JOB = null;
      console.error(e);
      if (e.code === 'PDF_INDISPONIBLE') {
        alert('Le PDF de ce Collège n\'est pas sur cet appareil. Resélectionnez le même fichier pour reprendre là où l\'analyse s\'était arrêtée.');
        const input = document.getElementById('college-file');
        if (input) {
          input.onchange = () => { if (input.files[0]) runCollegeJob(college, input.files[0]); };
          input.click();
        }
      } else {
        alert('Analyse interrompue : ' + (e.message || e) + '\n\nLe travail déjà effectué est enregistré ; « Reprendre l\'analyse » repartira de là.');
        renderColleges(true);
      }
    } finally {
      try { if (wake) await wake.release(); } catch (e) {}
    }
  }

      <p class="small mt">Toutes ces valeurs sont lues dans votre base au moment de l'affichage.</p>

  // ---------------- lecteur ----------------
  async function renderCollegeReader(id, startPage) {
    shell(skeleton(1), 'Lecteur');
    const { data: c } = await sb.from('colleges').select('*').eq('id', id).single();
    if (!c) { shell(emptyState('Collège introuvable', '', '#/colleges', 'Mes Collèges'), 'Lecteur'); return; }
    let page = Math.min(Math.max(1, startPage || 1), c.page_count || 1);
    let zoom = 1;
    let pdf = PDF_CACHE.get(id) || null;
    let textMode = false;
    if (!pdf) {
      try { pdf = await EDNCollegePipeline.openPdf(sb, c); PDF_CACHE.clear(); PDF_CACHE.set(id, pdf); }
      catch (e) { textMode = true; }
    }

    shell(`
      <div class="flex-between" style="gap:8px;margin-bottom:10px;">
        <a class="btn btn-sm" href="#/colleges">← Collèges</a>
        <div class="small" style="text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.name)}</div>
      </div>
      <div class="card card-tight" style="margin-bottom:10px;">
        <form id="rd-search" style="display:flex;gap:8px;">
          <input type="text" id="rd-q" placeholder="Rechercher dans ce Collège" autocomplete="off" />
          <button class="btn btn-sm" type="submit">OK</button>
        </form>
        <div id="rd-results"></div>
      </div>
      ${textMode ? `<div class="card card-tight small" style="border-color:var(--warn);margin-bottom:10px;">
        PDF non disponible sur cet appareil : affichage du texte extrait. Resélectionnez le fichier pour voir les pages.
        <input type="file" id="rd-file" accept=".pdf" style="display:none"/>
        <button class="btn btn-sm mt" id="rd-pick">Resélectionner le PDF</button></div>` : ''}
      <div id="rd-meta" class="small" style="margin-bottom:6px;"></div>
      <div id="rd-view" style="overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;min-height:240px;"></div>
      <div class="actionbar">
        <button class="btn" id="rd-prev" aria-label="Page précédente">‹</button>
        <input type="number" id="rd-page" inputmode="numeric" min="1" max="${c.page_count}"
          style="max-width:86px;text-align:center;" aria-label="Aller à la page PDF" />
        <span class="small" style="align-self:center;">/ ${c.page_count}</span>
        ${textMode ? '' : `<button class="btn" id="rd-zoom-out" aria-label="Zoom arrière">−</button>
        <button class="btn" id="rd-zoom-in" aria-label="Zoom avant">+</button>`}
        <button class="btn" id="rd-next" aria-label="Page suivante">›</button>
      </div>`, 'Lecteur');

    const view = document.getElementById('rd-view');
    const meta = document.getElementById('rd-meta');
    const input = document.getElementById('rd-page');
    let rendering = null;

    async function show() {
      input.value = page;
      const { data: info } = await sb.from('college_pages')
        .select('printed_page, item_number, item_title, chapter, heading, content')
        .eq('college_id', id).eq('pdf_page', page).maybeSingle();
      meta.innerHTML = `Page PDF <strong>${page}</strong>${info && info.printed_page ? ` · page imprimée <strong>${esc(info.printed_page)}</strong>` : ''}
        ${info && info.item_number ? ` · Item ${info.item_number}${info.item_title ? ' — ' + esc(info.item_title) : ''}` : ''}`;
      if (textMode || !pdf) {
        view.innerHTML = `<div style="padding:16px;white-space:pre-wrap;font-size:.95rem;line-height:1.6;">${esc(info ? info.content : 'Page non encore analysée.')}</div>`;
        return;
      }
      const token = {}; rendering = token;
      try {
        const p = await pdf.getPage(page);
        if (rendering !== token) return;
        const base = p.getViewport({ scale: 1 });
        const width = Math.max(280, view.clientWidth || 340);
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const scale = (width / base.width) * zoom;
        const vp = p.getViewport({ scale: scale * dpr });
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
        canvas.style.width = Math.ceil(vp.width / dpr) + 'px';
        canvas.style.display = 'block';
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        await p.render({ canvasContext: ctx, viewport: vp }).promise;
        if (rendering !== token) return;
        view.innerHTML = ''; view.appendChild(canvas);
        view.scrollTop = 0;
      } catch (e) {
        view.innerHTML = `<div style="padding:16px;" class="small">Page impossible à afficher : ${esc(e.message || e)}</div>`;
      }
      history.replaceState(null, '', `#/college/${id}/page/${page}`);
    }
    const go = (n) => { page = Math.min(Math.max(1, n), c.page_count); show(); };
    document.getElementById('rd-prev').onclick = () => go(page - 1);
    document.getElementById('rd-next').onclick = () => go(page + 1);
    input.onchange = () => go(Number(input.value) || 1);
    const zin = document.getElementById('rd-zoom-in'), zout = document.getElementById('rd-zoom-out');
    if (zin) zin.onclick = () => { zoom = Math.min(3, zoom + 0.25); show(); };
    if (zout) zout.onclick = () => { zoom = Math.max(0.75, zoom - 0.25); show(); };

    const pickBtn = document.getElementById('rd-pick');
    if (pickBtn) {
      const f = document.getElementById('rd-file');
      pickBtn.onclick = () => f.click();
      f.onchange = async () => {
        if (!f.files[0]) return;
        try {
          const buf = await f.files[0].arrayBuffer();
          const h = await crypto.subtle.digest('SHA-256', buf);
          const hex = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
          if (hex !== c.file_hash) { alert('Ce fichier n\'est pas le même Collège.'); return; }
          PDF_CACHE.set(id, await pdfjsLib.getDocument({ data: buf }).promise);
          renderCollegeReader(id, page);
        } catch (e) { alert('Lecture impossible : ' + (e.message || e)); }
      };
    }

    document.getElementById('rd-search').onsubmit = async (e) => {
      e.preventDefault();
      const q = document.getElementById('rd-q').value.trim();
      const box = document.getElementById('rd-results');
      if (q.length < 2) { box.innerHTML = ''; return; }
      box.innerHTML = '<p class="small mt">Recherche…</p>';
      const { data, error } = await sb.from('college_pages')
        .select('pdf_page, printed_page, heading, content')
        .eq('college_id', id).textSearch('tsv', q, { config: 'french', type: 'websearch' })
        .order('pdf_page').limit(60);
      if (error) { box.innerHTML = `<p class="small mt" style="color:var(--bad);">${esc(error.message)}</p>`; return; }
      box.innerHTML = (data || []).length
        ? `<p class="small mt">${data.length} page(s)${data.length === 60 ? ' (60 premières)' : ''}</p>` + data.map(r => `
          <button class="option" style="width:100%;text-align:left;" data-go="${r.pdf_page}">
            <span class="key" style="width:auto;padding:0 8px;border-radius:8px;">${r.printed_page ? 'p.' + esc(r.printed_page) : 'PDF ' + r.pdf_page}</span>
            <span class="body"><strong>${esc(r.heading || '')}</strong><br/><span class="small">${esc(EDNColleges.snippet(r.content, q))}</span></span>
          </button>`).join('')
        : '<p class="small mt">Aucune page trouvée.</p>';
      box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(Number(b.dataset.go)));
    };
    show();
  }

  // ---------------- référence sous la correction ----------------
  // Niveaux de confiance : seuls VERIFIED et HIGH_CONFIDENCE sont présentés
  // comme des références ; NEEDS_REVIEW est toujours affiché "à vérifier".
  const TIER = {
    verified: ['Vérifiée', 'badge-maitrisee'], high_confidence: ['Haute confiance', 'badge-en_cours'],
    needs_review: ['À vérifier', 'badge-fragile'], candidate: ['À vérifier', 'badge-fragile']
  };
  const tierRank = (st) => EDNColleges.STATUS_RANK[st] || 0;
  const pageLabel = (r) => r.printed_page ? `p. ${esc(r.printed_page)} <span class="small">(PDF ${r.pdf_page})</span>` : `PDF p. ${r.pdf_page}`;

  // Items de la question — source unique :
  // • principal = item ÉTABLI (question_reference_status : corrigé ou références vérifiées) ;
  // • également lié = items des pages de références AFFIRMÉES (vérifiées / relues), jamais d'une piste.
  function itemsBlockHtml(st, affirmed) {
    if (typeof EDN_ITEMS === 'undefined') return '';
    const valid = (n) => Number.isInteger(n) && n >= 1 && n <= EDN_ITEMS.items.length;
    const main = st && valid(st.item_number) ? st.item_number : null;
    const counts = new Map();
    (affirmed || []).forEach(r => { if (valid(r.item_number) && r.item_number !== main) counts.set(r.item_number, (counts.get(r.item_number) || 0) + 1); });
    const others = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n]) => n);
    if (!main && !others.length) return '';
    const link = (n, strong) => `<a class="item-link ${strong ? 'primary' : ''}" href="#/item/${n}">
        <span class="item-n">Item ${n}</span><span class="item-t">${esc(EDN_ITEMS.items[n - 1].t)}</span><span class="arr" aria-hidden="true">→</span></a>`;
    const src = !main ? '' : st.item_source === 'corrige' ? 'Indiqué dans le corrigé'
      : st.item_confidence === 'high_confidence' ? 'Établi à partir des références vérifiées' : 'Déduit des références — à confirmer';
    return `<div class="explain items-block">
      <h4>${main ? 'Item principal' : 'Items des références vérifiées'}</h4>
      ${main ? link(main, true) + `<p class="small" style="margin:6px 0 0;">${src}</p>` : ''}
      ${others.length ? `${main ? '<h4 style="margin-top:14px;">Également lié</h4>' : ''}${others.map(n => link(n, false)).join('')}` : ''}
    </div>`;
  }

  async function fillCollegeReference(questionId, box, opts) {
    if (!box) return;
    opts = opts || {};
    try {
      const { data: refs, error } = await sb.from('question_references')
        .select('*, colleges(id, name, referentiel)').eq('question_id', questionId).eq('user_id', CURRENT_USER.id);
      if (error) { box.innerHTML = ''; return; }
      const { data: st } = await sb.from('question_reference_status').select('*')
        .eq('user_id', CURRENT_USER.id).eq('question_id', questionId).maybeSingle();
      const { data: cols } = await sb.from('colleges').select('id, name, referentiel, status').eq('user_id', CURRENT_USER.id);
      if (!(cols || []).length) { box.innerHTML = ''; return; }

      const usable = EDNCollegePipeline.usableRefs(refs || []);
      const rk = (r) => tierRank(r.status) + (r.reference_type === 'reviewed' ? 0.5 : 0);
      // à fiabilité égale, la référence qui traite l'ITEM PRINCIPAL passe en tête :
      // référence principale et item principal restent cohérents
      const mainItem = st && st.item_number;
      const onMain = (r) => (mainItem && r.item_number === mainItem ? 1 : 0);
      const prim = usable.filter(r => r.reference_type === 'primary' || r.reference_type === 'reviewed')
        .sort((a, b) => (rk(b) - rk(a)) || (onMain(b) - onMain(a)) || (Number(b.coverage) - Number(a.coverage)));
      const affirmed = prim.filter(r => tierRank(r.status) >= 3);
      const best = affirmed[0] || null;
      const lead = best || prim.find(r => tierRank(r.status) === 2) || null;   // piste si rien d'affirmé
      const byCollege = new Map(prim.map(r => [r.college_id, r]));

      let html = itemsBlockHtml(st, affirmed);
      if (opts.itemsOnly) { box.innerHTML = html; return; }
      if (lead) {
        const isRef = !!best;
        const item = lead.item_number || null;   // item de la PAGE citée (métadonnée du passage)
        const itemTitle = item && typeof EDN_ITEMS !== 'undefined' && EDN_ITEMS.items[item - 1] ? EDN_ITEMS.items[item - 1].t : '';
        const row = (k, v) => v ? `<div><span class="k">${k}</span><span class="v">${v}</span></div>` : '';
        html += `<div class="explain cref ${isRef ? '' : 'review'}">
          <div class="flex-between" style="align-items:flex-start;margin-bottom:2px;">
            <h4 style="margin:0;">${isRef ? 'Référence principale' : 'Piste à vérifier'}</h4>
            <span class="badge ${lead.reference_type === 'reviewed' ? 'badge-maitrisee' : (TIER[lead.status] ? TIER[lead.status][1] : '')}">${lead.reference_type === 'reviewed' ? 'Relue' : (TIER[lead.status] ? TIER[lead.status][0] : lead.status)}</span>
          </div>
          <div class="cref-title">${esc(lead.colleges ? lead.colleges.name : '')}</div>
          <div class="cref-meta">
            ${row('Item', item ? `<a href="#/item/${item}">Item ${item}</a>` + (itemTitle ? ' — ' + esc(itemTitle.length > 90 ? itemTitle.slice(0, 88) + '…' : itemTitle) : '') : '')}
            ${row('Chapitre', lead.chapter ? esc(lead.chapter) : '')}
            ${row('Section', lead.subheading ? esc(lead.subheading) : '')}
            ${row('Page', pageLabel(lead))}
          </div>
          ${lead.match_reason ? `<div class="cref-why"><strong style="color:var(--color-text-secondary);">Pourquoi cette référence :</strong> ${esc(lead.match_reason)}</div>` : ''}
          ${!isRef ? `<p class="small" style="color:var(--color-warning);margin-top:8px;">La réponse n'a pas été retrouvée avec une certitude suffisante dans ce passage.</p>` : ''}
          ${lead.passage ? `<details style="margin-top:10px;"><summary>Voir le passage correspondant</summary>
            <div class="quote">« ${esc(lead.passage)} »</div></details>` : ''}
          <div class="cref-img small" style="margin-top:10px;">Chargement de l'aperçu…</div>
          <a class="btn btn-primary btn-block" style="margin-top:12px;" href="#/college/${lead.college_id}/page/${lead.pdf_page}">Ouvrir le passage</a>
        </div>`;

        const others = affirmed.filter(r => r !== lead && r.college_id !== lead.college_id);
        if (others.length) {
          html += `<div class="explain"><h4>Autres références pertinentes</h4>
            ${others.map(r => `<a class="ref-link" href="#/college/${r.college_id}/page/${r.pdf_page}">
              <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.colleges ? r.colleges.name : '')}</span><span class="pg">${pageLabel(r)} →</span></a>`).join('')}</div>`;
        }
      } else {
        html += `<div class="explain"><h4>Référence Collège</h4>
          <p class="small">Correspondance non suffisamment établie dans vos ${cols.length} Collège(s).</p></div>`;
      }

      // Collèges dans lesquels l'item est traité — chaque bouton ouvre la page
      // trouvée POUR CETTE QUESTION, jamais le début du chapitre
      const item = st && st.item_number;
      if (item && typeof EDN_ITEMS !== 'undefined' && EDN_ITEMS.items[item - 1]) {
        const it = EDN_ITEMS.items[item - 1];
        const src = st.item_source === 'corrige' ? 'indiqué dans le corrigé' :
          st.item_confidence === 'high_confidence' ? 'déduit des références vérifiées' : 'déduit des références, à vérifier';
        html += `<div class="explain"><h4>Référentiels de l'item ${item}</h4>
          <p class="small" style="margin-bottom:6px;">Item ${src}.</p>
          ${it.r.map(code => {
            const mine = (cols || []).filter(c => c.referentiel === code);
            if (!mine.length) return `<div class="ref-link" style="opacity:.55;"><span class="ref-chip" style="--c:${refColor(code)}">${esc(EDN_ITEMS.refs[code])}</span><span class="pg">non importé</span></div>`;
            return mine.map(c => {
              const r = byCollege.get(c.id);
              if (r && tierRank(r.status) >= 2) return `<a class="ref-link" href="#/college/${c.id}/page/${r.pdf_page}">
                <span class="ref-chip" style="--c:${refColor(code)}">${esc(EDN_ITEMS.refs[code])}</span><span class="pg">${pageLabel(r)}${tierRank(r.status) === 2 ? ' · à vérifier' : ''} →</span></a>`;
              return `<div class="ref-link" style="align-items:flex-start;flex-direction:column;gap:4px;"><span class="ref-chip" style="--c:${refColor(code)}">${esc(EDN_ITEMS.refs[code])}</span>
                <span class="small">Item présent dans ce référentiel, mais aucun passage suffisamment précis n'a été identifié pour cette question.</span></div>`;
            }).join('');
          }).join('')}</div>`;
      } else if (lead) {
        html += `<p class="small">Item de cette question non établi avec certitude.</p>`;
      }

      box.innerHTML = html;
      if (!lead) return;
      const slot = box.querySelector('.cref-img');
      const { data: img } = await sb.from('college_page_images').select('image')
        .eq('college_id', lead.college_id).eq('pdf_page', lead.pdf_page).maybeSingle();
      if (img && img.image) { slot.innerHTML = `<img src="${img.image}" class="q-image" alt="Page ${lead.pdf_page} du Collège" loading="lazy"/>`; return; }
      try {
        const { data: c } = await sb.from('colleges').select('*').eq('id', lead.college_id).single();
        const pdf = PDF_CACHE.get(c.id) || await EDNCollegePipeline.openPdf(sb, c);
        PDF_CACHE.set(c.id, pdf);
        const url = await EDNCollegePipeline.renderPreview(pdf, lead.pdf_page);
        slot.innerHTML = `<img src="${url}" class="q-image" alt="Page ${lead.pdf_page} du Collège"/>`;
        await sb.from('college_page_images').upsert({ user_id: CURRENT_USER.id, college_id: c.id, pdf_page: lead.pdf_page, image: url },
          { onConflict: 'college_id,pdf_page' });
      } catch (e) { slot.innerHTML = ''; }
    } catch (e) { console.error(e); box.innerHTML = ''; }
  }

  // ---------------------------------------------------------------
  // DIAGNOSTIC LCA — lecture seule, sur les données réelles de Supabase.
  // N'écrit rien, ne modifie rien, n'affiche aucune clé ni token.
  // Accès via #/diagnostic, avec la session de l'utilisateur (RLS inchangée).
  // ---------------------------------------------------------------
  // Export en lecture seule, sans identifiant de compte (user_id, e-mail).
  async function buildExport({ collegeIds, withQuestions, onProgress }) {
    const say = onProgress || (() => {});
    const must = ({ data, error }) => { if (error) throw error; return data; };
    const out = { format: 'edn-export', version: 1, app_version: APP_VERSION,
                  exported_at: new Date().toISOString(), colleges: [], questions: [], references: [], status: [] };

    const cols = must(await sb.from('colleges').select('*').eq('user_id', CURRENT_USER.id).in('id', collegeIds));
    for (const c of cols) {
      say(`Collège « ${c.name} » : lecture des pages…`);
      const pages = [];
      for (let from = 0; ; from += 500) {
        const data = must(await sb.from('college_pages')
          .select('pdf_page, printed_page, text_source, char_count, has_images, item_number, item_title, chapter, heading, content')
          .eq('college_id', c.id).order('pdf_page').range(from, from + 499));
        pages.push(...data);
        say(`Collège « ${c.name} » : ${pages.length} / ${c.page_count} pages`);
        if (data.length < 500) break;
      }
      out.colleges.push({
        id: c.id, name: c.name, file_name: c.file_name, referentiel: c.referentiel || null, status: c.status,
        page_count: c.page_count, pages_done: c.pages_done, pages_text: c.pages_text, pages_ocr: c.pages_ocr,
        pages_empty: c.pages_empty, pages_error: c.pages_error, items_detected: c.items_detected,
        chapters_detected: c.chapters_detected, last_error: c.last_error || null,
        pages: pages.map(p => ({ p: p.pdf_page, pp: p.printed_page, src: p.text_source, n: p.char_count,
          img: p.has_images, it: p.item_number, itt: p.item_title, ch: p.chapter, h: p.heading, c: p.content }))
      });
    }

    if (withQuestions) {
      say('Lecture des questions…');
      const topics = new Map((must(await sb.from('topics').select('id, name').eq('user_id', CURRENT_USER.id)) || []).map(t => [t.id, t.name]));
      const exams = new Map((must(await sb.from('exams').select('id, name').eq('user_id', CURRENT_USER.id)) || []).map(e => [e.id, e.name]));
      for (let from = 0; ; from += 300) {
        const data = must(await sb.from('questions')
          .select('id, exam_id, topic_id, position, question_number, question_type, question_text, explanation, official_correction, question_options(option_key, option_text, is_correct, position)')
          .eq('user_id', CURRENT_USER.id).order('id').range(from, from + 299));
        data.forEach(q => out.questions.push({
          id: q.id, exam: exams.get(q.exam_id) || null, theme: topics.get(q.topic_id) || null,
          format: questionFormat(topics.get(q.topic_id), q.question_text),
          position: q.position, n: q.question_number, type: q.question_type,
          text: q.question_text, expl: q.explanation, corr: q.official_correction,
          options: (q.question_options || []).sort((a, b) => a.position - b.position)
            .map(o => ({ k: o.option_key, t: o.option_text, ok: o.is_correct }))
        }));
        say(`${out.questions.length} questions lues`);
        if (data.length < 300) break;
      }
      say('Lecture des références…');
      for (let from = 0; ; from += 1000) {
        const data = must(await sb.from('question_references')
          .select('question_id, college_id, pdf_page, printed_page, item_number, chapter, heading, subheading, reference_type, status, score, coverage, match_reason, passage')
          .eq('user_id', CURRENT_USER.id).in('college_id', collegeIds).range(from, from + 999));
        out.references.push(...data);
        if (data.length < 1000) break;
      }
      for (let from = 0; ; from += 1000) {
        const data = must(await sb.from('question_reference_status')
          .select('question_id, best_status, best_coverage, item_number, item_source, item_confidence')
          .eq('user_id', CURRENT_USER.id).range(from, from + 999));
        out.status.push(...data);
        if (data.length < 1000) break;
      }
    }
    // confidentialité : aucun identifiant de compte, quelle que soit la requête
    const strip = (o) => { const x = { ...o }; delete x.user_id; return x; };
    out.references = out.references.map(strip);
    out.status = out.status.map(strip);
    out.summary = {
      colleges: out.colleges.length,
      pages: out.colleges.reduce((n, c) => n + c.pages.length, 0),
      questions: out.questions.length, references: out.references.length
    };
    return out;
  }

  async function wireExportTool() {
    const list = document.getElementById('ex-list'), go = document.getElementById('ex-go'), res = document.getElementById('ex-out');
    if (!list) return;
    const { data: cols, error } = await sb.from('colleges').select('id, name, page_count, status').eq('user_id', CURRENT_USER.id).order('name');
    // la page a changé pendant le chargement (navigation, actualisation) : ne rien écrire
    if (!list.isConnected) return;
    if (error || !(cols || []).length) {
      list.textContent = error ? 'Collèges indisponibles.' : 'Aucun Collège importé.';
      return;
    }
    list.innerHTML = cols.map(c => `<label style="display:flex;align-items:center;gap:8px;margin:4px 0;font-weight:500;">
      <input type="checkbox" data-ex="${c.id}" data-pages="${c.page_count}" style="width:auto;min-height:0;" />
      ${esc(c.name)} <span class="small">· ${c.page_count} p.</span></label>`).join('') +
      '<div class="small" id="ex-size" style="margin-top:6px;"></div>';
    const sizeHint = () => {
      const pages = [...list.querySelectorAll('[data-ex]:checked')].reduce((n, x) => n + Number(x.dataset.pages || 0), 0);
      const sizeEl = list.querySelector('#ex-size');
      if (!sizeEl) return;
      sizeEl.textContent = pages
        ? `≈ ${Math.max(1, Math.round(pages * 3.2 / 1024))} Mo pour ${pages} pages` + (pages > 2500 ? ' — envoyez-le en plusieurs fois si l\'envoi échoue' : '')
        : 'Cochez un ou plusieurs Collèges.';
    };
    list.querySelectorAll('[data-ex]').forEach(x => x.onchange = sizeHint);
    sizeHint();

    go.onclick = async () => {
      const ids = [...list.querySelectorAll('[data-ex]:checked')].map(x => x.dataset.ex);
      if (!ids.length) { alert('Cochez au moins un Collège.'); return; }
      go.disabled = true;
      try {
        const data = await buildExport({ collegeIds: ids, withQuestions: document.getElementById('ex-questions').checked,
          onProgress: (t) => { res.textContent = t; } });
        const json = JSON.stringify(data);
        // nom UNIQUE : date + heure + premier Collège + nombre de Collèges.
        // Plusieurs exports envoyés ensemble ne peuvent plus s'écraser.
        const now = new Date();
        const stamp = now.toISOString().slice(0, 10) + '_' + now.toTimeString().slice(0, 8).replace(/:/g, '');
        const slug = EDNColleges.normalize(data.colleges[0] ? data.colleges[0].name : 'colleges')
          .split(' ').filter(Boolean).slice(0, 3).join('-').slice(0, 30) || 'colleges';
        const name = `edn-export_${stamp}_${slug}${data.colleges.length > 1 ? '_+' + (data.colleges.length - 1) : ''}.json`;
        const file = new File([json], name, { type: 'application/json' });
        // iPhone : feuille de partage (Enregistrer dans Fichiers) ; sinon téléchargement classique
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: name }); }
          catch (e) { if (e && e.name !== 'AbortError') throw e; }
        } else {
          const url = URL.createObjectURL(file);
          const a = document.createElement('a'); a.href = url; a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 30000);
        }
        res.innerHTML = `<span style="color:var(--good);">✓ ${name} — ${data.summary.colleges} Collège(s), ${data.summary.pages} pages,
          ${data.summary.questions} questions, ${data.summary.references} références · ${(json.length / 1048576).toFixed(1)} Mo</span>`;
      } catch (e) {
        res.innerHTML = `<span style="color:var(--bad);">Export impossible : ${esc(e.message || String(e))}</span>`;
      } finally { go.disabled = false; }
    };
  }

  // Import de l'index relu : chaque verdict devient une référence 'reviewed'.
  async function importReviewedIndex(data, onProgress) {
    const say = onProgress || (() => {});
    if (!data || data.format !== 'edn-index-relu' || !Array.isArray(data.entries)) throw new Error('ce fichier n\'est pas un index relu');
    const must = ({ data: d, error }) => { if (error) throw error; return d; };
    const myCols = new Set((must(await sb.from('colleges').select('id').eq('user_id', CURRENT_USER.id)) || []).map(c => c.id));
    const myQs = new Set();
    for (let from = 0; ; from += 1000) {
      const d = must(await sb.from('questions').select('id').eq('user_id', CURRENT_USER.id).range(from, from + 999));
      d.forEach(q => myQs.add(q.id)); if (d.length < 1000) break;
    }
    const STATUS = { juste: 'verified', faible: 'high_confidence', fausse: 'invalid' };
    const REASON = { juste: 'Relue et validée : le passage justifie la réponse',
                     faible: 'Relue : bon chapitre, passage peu explicatif',
                     fausse: 'Relue : cette page ne justifie pas la réponse' };
    const rows = [], skipped = [];
    data.entries.forEach(e => {
      if (!myQs.has(e.question_id) || !myCols.has(e.college_id) || !STATUS[e.verdict]) { skipped.push(e); return; }
      rows.push({ user_id: CURRENT_USER.id, question_id: e.question_id, college_id: e.college_id, pdf_page: e.pdf_page,
        printed_page: e.printed_page || null, item_number: e.item_number || null, item_title: e.item_title || null,
        chapter: e.chapter || null, heading: e.heading || null, subheading: e.subheading || null,
        passage: e.passage || null, reference_type: 'reviewed', status: STATUS[e.verdict],
        coverage: e.verdict === 'juste' ? 1 : e.verdict === 'faible' ? 0.6 : 0,
        match_reason: REASON[e.verdict] + (e.note ? ' — ' + e.note : ''), updated_at: new Date().toISOString() });
    });
    for (let i = 0; i < rows.length; i += 200) {
      must(await sb.from('question_references').upsert(rows.slice(i, i + 200), { onConflict: 'user_id,question_id,college_id,pdf_page' }));
      say(`Enregistrement : ${Math.min(i + 200, rows.length)} / ${rows.length}`);
    }
    say('Mise à jour des références et des items…');
    await EDNCollegePipeline.consolidate({ sb, userId: CURRENT_USER.id });
    const c = { juste: 0, faible: 0, fausse: 0 };
    rows.forEach(r => { c[r.status === 'verified' ? 'juste' : r.status === 'invalid' ? 'fausse' : 'faible']++; });
    return { ...c, skipped: skipped.length };
  }

  async function wireRepairTool() {
    const sel = document.getElementById('rp-exam'), out = document.getElementById('rp-out');
    const pick = document.getElementById('rp-pick'), files = document.getElementById('rp-files');
    if (!sel) return;
    const { data: exams } = await sb.from('exams').select('id, name, total_questions').eq('user_id', CURRENT_USER.id).order('created_at');
    sel.innerHTML = (exams || []).map(e => `<option value="${e.id}">${esc(e.name)} (${e.total_questions} questions)</option>`).join('');
    pick.onclick = () => files.click();
    files.onchange = async () => {
      const list = [...files.files];
      if (!list.length) return;
      const examId = sel.value;
      pick.disabled = true;
      try {
        out.textContent = 'Lecture des PDF…';
        const parsed = [];
        for (let i = 0; i < list.length; i++) {
          out.textContent = `Analyse de ${list[i].name} (${i + 1}/${list.length})…`;
          parsed.push(...await EDNParsers.parseFile(list[i], null, { textOnly: true }));
        }
        out.textContent = 'Lecture de la base…';
        const dbq = [];
        for (let from = 0; ; from += 300) {
          const { data, error } = await sb.from('questions')
            .select('id, position, question_number, question_text, explanation, question_options(id, option_key, option_text, is_correct)')
            .eq('exam_id', examId).eq('user_id', CURRENT_USER.id).order('position').range(from, from + 299);
          if (error) throw error;
          dbq.push(...data);
          if (data.length < 300) break;
        }
        const rep = EDNRepair.plan(dbq, parsed);
        if (rep.blocking) { out.innerHTML = `<span style="color:var(--bad);">Réparation impossible : ${esc(rep.blocking)}. Vérifiez que ce sont les bons PDF, dans le même ordre qu'à l'import.</span>`; return; }
        const n = rep.optionFixes.length + rep.explanationFixes.length;
        out.innerHTML = `
          <div>Questions alignées base ↔ PDF : <strong>${rep.aligned} / ${rep.countDb}</strong>${rep.misaligned.length ? ` · <span style="color:var(--bad);">${rep.misaligned.length} non alignée(s), ignorée(s)</span>` : ''}</div>
          <div>Propositions à corriger : <strong>${rep.optionFixes.length}</strong> · explications à nettoyer : <strong>${rep.explanationFixes.length}</strong></div>
          <div>Écarts signalés, non modifiés : <strong>${rep.toReview.length}</strong></div>
          ${rep.optionFixes.map(f => `<div style="margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:10px;">
            Q${f.n ?? '?'} ${f.key} : …${esc(f.before.slice(-50))}<br/><span style="color:var(--good);">→ …${esc(f.after.slice(-70))}</span></div>`).join('')}
          ${rep.toReview.slice(0, 20).map(r => `<div style="color:var(--warn);margin-top:4px;">À vérifier · Q${r.n ?? '?'} : ${esc(r.why)}</div>`).join('')}
          ${n ? `<button class="btn btn-primary btn-block mt" id="rp-apply">Appliquer les ${n} correction(s)</button>` : '<div class="mt" style="color:var(--good);">Aucune correction nécessaire : la base correspond à la source.</div>'}`;
        const ap = document.getElementById('rp-apply');
        if (ap) ap.onclick = async () => {
          ap.disabled = true; ap.textContent = 'Application…';
          try {
            const r = await EDNRepair.apply(sb, CURRENT_USER.id, rep);
            ap.outerHTML = `<div class="mt" style="color:var(--good);">✓ ${r.opt} proposition(s) et ${r.expl} explication(s) corrigées. Identifiants conservés.</div>`;
          } catch (e) { ap.disabled = false; ap.textContent = 'Réessayer'; alert('Échec : ' + (e.message || e)); }
        };
      } catch (e) {
        out.innerHTML = `<span style="color:var(--bad);">Erreur : ${esc(e.message || String(e))}</span>`;
      } finally { pick.disabled = false; files.value = ''; }
    };
  }

  // ---------- RAYON X + MISE À JOUR COMPLÈTE ----------
  // Tous les chiffres sont des comptages de la base ; la progression vient du job en cours
  // (étape, compteurs réels, signal de vie). Quitter la page n'arrête pas le job : en
  // revenant, l'écran s'y rattache.
  const RUN_LABEL = { done: 'terminée', running: 'en cours', error: 'en erreur', interrupted: 'interrompue', stalled: 'bloquée (aucun signal depuis plus de 90 s)' };
  function xrayHtml(x) {
    const n = (v) => Number(v || 0).toLocaleString('fr-FR');
    const tile = (label, value, sub) => `<div class="xr-tile"><div class="xr-v">${value}</div><div class="xr-l">${label}</div>${sub ? `<div class="xr-s">${sub}</div>` : ''}</div>`;
    const qLinks = (list) => list.slice(0, 40).map(q => `<a href="#/question/${q.id}">Q${esc(String(q.n ?? '?'))}</a>`).join(' ') +
      (list.length > 40 ? ` <span class="small">+ ${list.length - 40} autres</span>` : '');
    const cLinks = (list, fmt) => list.map(c => `<a href="#/college/${c.id}">${esc(c.name)}</a>${fmt ? ' ' + fmt(c) : ''}`).join('<br/>');
    const anomaly = (count, title, body) => count ? `<details class="xr-an"><summary><b>${n(count)}</b> ${title}</summary><div class="xr-an-body">${body}</div></details>` : '';
    const a = x.answers, pages = x.pages;
    const anomalies = [
      anomaly(x.lastErrors.length, 'erreur(s) isolée(s) lors de la dernière mise à jour — la prochaine les retente',
        x.lastErrors.map(e => `${esc(e.step)} : ${esc(e.message)}`).join('<br/>')),
      anomaly(x.documents.incomplete.length, 'document(s) à terminer', cLinks(x.documents.incomplete, c => `(${n(c.done)} / ${n(c.total)} pages · ${esc(c.why)})`)),
      anomaly(pages.problems.length, 'Collège(s) avec pages vides ou en erreur', cLinks(pages.problems, c => `(${n(c.empty)} vide(s), ${n(c.error)} erreur(s))`)),
      anomaly(x.documents.withoutReferentiel.length, 'Collège(s) sans référentiel', cLinks(x.documents.withoutReferentiel)),
      anomaly(x.questions.noItem.length, 'question(s) sans item établi', qLinks(x.questions.noItem)),
      anomaly(x.questions.noCollege.length, 'question(s) sans référence de Collège', qLinks(x.questions.noCollege)),
      anomaly(a.noPassage.length, 'question(s) dont aucune bonne réponse n\'a de passage', qLinks(a.noPassage)),
      anomaly(x.questions.duplicates.length, 'doublon(s) dans un même examen', qLinks(x.questions.duplicates)),
      anomaly(x.interrupted.length, 'mise(s) à jour non terminée(s) — relancer reprend au dernier point enregistré',
        x.interrupted.map(r => `${new Date(r.started_at).toLocaleString('fr-FR')} · ${esc(RUN_LABEL[r.status] || r.status)}${r.stage ? ' · ' + esc(r.stage) : ''}`).join('<br/>'))
    ].join('');
    const last = (x.runs || [])[0];
    return `
      <section class="xr card">
        <div class="xr-cmd">
          <div><div class="xr-kicker">Mise à jour complète</div>
            <p>Références, justifications des bonnes réponses, rapport. Seul ce qui a changé est réanalysé ; une interruption reprend au dernier point enregistré.</p>
            ${last ? `<p class="xr-last">Dernière : ${esc(RUN_LABEL[last.status] || last.status)} · ${new Date(last.started_at).toLocaleString('fr-FR')}</p>` : ''}</div>
          ${x.migration ? `<button class="btn btn-mint btn-lg" id="xr-run">↻ Lancer la mise à jour complète</button>`
                        : `<p class="xr-warn">Exécutez d'abord <b>migration_006_justifications.sql</b> dans Supabase.</p>`}
        </div>
        <div id="xr-progress" hidden>
          <div class="xr-step" id="xr-step"></div>
          <div class="xr-pl"><span id="xr-label">Préparation</span><span id="xr-count"></span></div>
          <div class="xr-bar"><span id="xr-fill"></span></div>
          <div class="xr-sub-line" id="xr-subline"></div>
          <div class="xr-alive" id="xr-alive" role="status"></div>
          <button class="btn btn-sm" id="xr-stop">Arrêter (reprise possible)</button>
          <pre id="xr-log"></pre>
        </div>
        <h2 class="xr-title">Rayon X <span class="small">· ${new Date(x.at).toLocaleTimeString('fr-FR')}</span></h2>
        <div class="xr-grid">
          ${tile('Documents prêts', `${n(x.documents.ready)} / ${n(x.documents.total)}`)}
          ${tile('Pages enregistrées', `${n(pages.saved)} / ${n(pages.total)}`, `${n(pages.native)} texte · ${n(pages.ocr)} OCR · ${n(pages.empty)} vides · ${n(pages.error)} erreurs`)}
          ${tile('Pages avec images', n(pages.withImages))}
          ${tile('Items · chapitres détectés', `${n(x.structure.items)} · ${n(x.structure.chapters)}`)}
          ${tile('Questions', n(x.questions.total), `${n(x.questions.analysed)} analysées · ${n(x.questions.withExplanation)} avec correction rédigée`)}
          ${tile('Questions avec référence vérifiée', n(x.references.verified), `${n(x.references.high)} probables · ${n(x.references.candidate)} à vérifier · ${n(x.references.none)} sans référence`)}
          ${tile('Bonnes réponses avec passage', `${n(a.withPassage)} / ${n(a.total)}`, `${n(a.confirmed)} relues par vous · ${n(a.rejectedRows)} passages rejetés`)}
        </div>
        ${anomalies ? `<h3 class="xr-sub">Anomalies</h3>${anomalies}` : '<p class="small">Aucune anomalie détectée.</p>'}
        <p class="xr-note">Images des questions : non reliées automatiquement aux Collèges. Une image n'est jamais attribuée par simple proximité dans un PDF.</p>
      </section>`;
  }
  // affichage du job : alimenté par ses événements + un minuteur « dernière activité »
  function attachJobView(host, job) {
    const box = document.getElementById('xr-progress'), btn = document.getElementById('xr-run');
    if (!box) return;
    box.hidden = false; if (btn) btn.disabled = true;
    const $ = (id) => document.getElementById(id);
    const logEl = $('xr-log');
    logEl.textContent = job.log.join('\n') + (job.log.length ? '\n' : '');
    $('xr-stop').onclick = (ev) => { EDNAnalysis.stop(); ev.target.disabled = true; ev.target.textContent = 'Arrêt demandé : fin de l\'élément en cours…'; };
    const draw = (st) => {
      if (!document.body.contains(box)) return;
      $('xr-step').textContent = st.step ? `Étape ${st.step} / ${st.steps} · ${EDNAnalysis.STEPS[st.step - 1]}` : '';
      $('xr-label').textContent = st.label || 'En cours';
      const real = Number.isFinite(st.total) && st.total > 0;
      $('xr-count').textContent = real ? `${st.done} / ${st.total}` : '';
      $('xr-fill').style.width = real ? Math.round(100 * st.done / st.total) + '%' : '0%';
      $('xr-fill').parentElement.classList.toggle('xr-indet', !real);
      $('xr-subline').textContent = st.sub || '';
    };
    const onEvent = (st, p) => {
      if (!document.body.contains(box)) { job.listeners.delete(onEvent); return; }
      if (p && p.note) logEl.textContent += new Date().toTimeString().slice(0, 8) + ' ' + p.note + '\n';
      if (p && p.ended) return;
      draw(st);
    };
    job.listeners.add(onEvent);
    draw(job.state);
    const tick = setInterval(() => {
      if (!document.body.contains(box) || EDNAnalysis.current() !== job) { clearInterval(tick); return; }
      const s = Math.round((Date.now() - job.lastActivity) / 1000), el = $('xr-alive');
      el.className = 'xr-alive' + (s > 90 ? ' bad' : s > 30 ? ' slow' : '');
      el.textContent = s <= 30 ? `Actif · dernière activité il y a ${s} s`
        : s <= 90 ? `Étape longue : dernière activité il y a ${s} s. Le traitement attend une réponse du serveur (délai maximal 45 s, puis nouvel essai automatique).`
        : `Aucune activité depuis ${s} s : connexion interrompue ou appareil en veille. Vous pouvez arrêter ; relancer reprendra au dernier point enregistré.`;
    }, 1000);
  }
  async function mountXray(host) {
    if (!host) return;
    host.innerHTML = `<section class="xr card"><h2 class="xr-title">Rayon X <span class="small">· calcul en cours</span></h2></section>`;
    let x;
    try { x = await EDNAnalysis.computeXray({ sb, userId: CURRENT_USER.id }); }
    catch (e) { host.innerHTML = `<section class="card"><h2>Rayon X</h2><p class="xr-warn">Calcul impossible : ${esc(e.message || String(e))}</p></section>`; return; }
    if (!document.body.contains(host)) return;
    host.innerHTML = xrayHtml(x);
    const running = EDNAnalysis.current();
    if (running) attachJobView(host, running);          // retour sur la page pendant un job
    const btn = document.getElementById('xr-run');
    if (!btn) return;
    btn.onclick = async () => {
      if (EDNAnalysis.current()) return;
      if (!confirm('Lancer la mise à jour complète ?\n\nDe préférence sur ordinateur, branché, onglet ouvert. Vous pouvez changer de page dans l\'application. En cas d\'interruption, la relancer reprend au dernier point enregistré. Vos réponses et statistiques ne sont pas touchées.')) return;
      let wake = null;
      try { wake = navigator.wakeLock && await navigator.wakeLock.request('screen'); } catch (e) {}
      const onVis = () => { const j = EDNAnalysis.current(); if (j && document.hidden) j.log.push(new Date().toTimeString().slice(0, 8) + ' Écran masqué : le navigateur peut suspendre le traitement'); };
      document.addEventListener('visibilitychange', onVis);
      const p = EDNAnalysis.runFull({ sb, userId: CURRENT_USER.id });
      attachJobView(host, EDNAnalysis.current());
      let res = null, err = null;
      try { res = await p; } catch (e) { err = e; }
      finally { document.removeEventListener('visibilitychange', onVis); try { wake && wake.release(); } catch (e) {} }
      if (!document.body.contains(host)) return;           // l'utilisatrice a quitté la page : rien à afficher
      await mountXray(host);
      const msg = err ? `La mise à jour s'est arrêtée : ${esc(err.message || String(err))}. Relancer reprendra au dernier point enregistré.`
        : res.status === 'done' ? (res.errors.length ? `Mise à jour terminée, avec ${res.errors.length} erreur(s) isolée(s) (voir Anomalies).` : 'Mise à jour terminée.')
        : 'Mise à jour arrêtée : la relancer reprendra au dernier point enregistré.';
      host.insertAdjacentHTML('afterbegin', `<div class="alert ${err ? 'alert-error' : res.status === 'done' && !res.errors.length ? 'alert-success' : 'alert-info'}" role="status">${msg}</div>`);
    };
  }

  async function renderDiagnostic() {
    shell(skeleton(3), 'Diagnostic');
    const log = [];
    const push = (l) => log.push(l);
    let html = '';

    try {
      const { data: exams, error: exErr } = await sb.from('exams')
        .select('id, name, total_questions, current_cycle')
        .eq('user_id', CURRENT_USER.id).order('created_at');
      if (exErr) throw exErr;
      push('Examens trouvés : ' + (exams || []).length);

      for (const ex of (exams || [])) {
        push('');
        push('════ ' + ex.name + ' ════');

        // --- A. ce qui est RÉELLEMENT en base ---
        const { data: qs, error: qErr } = await sb.from('questions')
          .select('id, topic_id, question_number, question_type, position, question_text')
          .eq('exam_id', ex.id).order('position');
        if (qErr) throw qErr;
        const { data: topics } = await sb.from('topics').select('id, name').eq('exam_id', ex.id);
        const topicName = new Map((topics || []).map(t => [t.id, t.name || '']));

        const enBase = (qs || []).filter(q => isLcaQuestion(q.question_text, topicName.get(q.topic_id)));
        const classiques = (qs || []).length - enBase.length;
        push('Questions en base : ' + (qs || []).length + ' (annoncé sur l\'examen : ' + ex.total_questions + ')');
        push('Classiques : ' + classiques + ' · LCA détectées : ' + enBase.length);
        const types = { DP: 0, QI: 0, KFP: 0, TCS: 0, LCA: 0, 'non indiqué': 0 };
        (qs || []).forEach(q => { const f = questionFormat(topicName.get(q.topic_id), q.question_text); types[f || 'non indiqué']++; });
        push('Types (lus dans la source) : ' + Object.entries(types).map(([k, v]) => k + ' ' + v).join(' · '));
        html += `<div class="card card-tight small"><strong>${esc(ex.name)} — types de questions</strong><br/>
          ${Object.entries(types).map(([k, v]) => `${k} : <strong>${v}</strong>`).join(' · ')}</div>`;

        // détail du signal qui a permis la détection (pour identifier une donnée mal enregistrée)
