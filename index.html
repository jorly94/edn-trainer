<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDN Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TOKENS
   Palette clinique : bleu-nuit profond + vert sauge (validation) +
   rouge brique sourd (erreur). Fond quasi-blanc légèrement bleuté.
   Typo : IBM Plex Sans (lisibilité clinique) + IBM Plex Mono pour les
   identifiants/numéros de question (registre "dossier médical").
===================================================================== */
:root {
  --ink: #16232B;
  --ink-soft: #4A5A63;
  --line: #DCE3E6;
  --bg: #F6F8F9;
  --surface: #FFFFFF;
  --brand: #0B4F6C;
  --brand-soft: #E3EEF2;
  --good: #1B7A5A;
  --good-bg: #E7F5EF;
  --bad: #B23A3A;
  --bad-bg: #FBEAEA;
  --warn: #B8792B;
  --warn-bg: #FBF1E3;
  --radius: 10px;
  --font: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Layout */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 240px; background: var(--surface); border-right: 1px solid var(--line);
  padding: 24px 16px; flex-shrink: 0;
}
.sidebar .brand { font-weight: 600; font-size: 1.05rem; padding: 0 8px 20px; letter-spacing: -0.01em; }
.sidebar .brand .dot { color: var(--good); }
.nav-link {
  display: block; padding: 10px 12px; border-radius: 8px; color: var(--ink-soft);
  text-decoration: none; font-size: 0.92rem; margin-bottom: 2px;
}
.nav-link:hover { background: var(--bg); color: var(--ink); }
.nav-link.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.main { flex: 1; padding: 32px 40px; max-width: 1100px; }

@media (max-width: 780px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; display: flex; overflow-x: auto; gap: 4px; padding: 12px; border-right: none; border-bottom: 1px solid var(--line); }
  .sidebar .brand { display: none; }
  .nav-link { white-space: nowrap; }
  .main { padding: 20px 16px; }
}

h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; margin: 0 0 12px; }
.subtitle { color: var(--ink-soft); margin: 0 0 28px; font-size: 0.95rem; }

/* Cards */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px;
}
.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 780px) { .grid-4, .grid-2 { grid-template-columns: 1fr 1fr; } }

.stat-card .value { font-size: 2rem; font-weight: 600; font-family: var(--mono); }
.stat-card .label { color: var(--ink-soft); font-size: 0.85rem; margin-top: 4px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font-size: 0.92rem; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--brand); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: #093f57; }
.btn-good { background: var(--good); border-color: var(--good); color: #fff; }
.btn-block { width: 100%; justify-content: center; }
.btn-lg { padding: 14px 20px; font-size: 1rem; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* Exam cards */
.exam-card { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.exam-card .meta { color: var(--ink-soft); font-size: 0.85rem; }
.progress-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0; width: 220px; }
.progress-bar > div { height: 100%; background: var(--good); }

/* Question player */
.question-shell { max-width: 720px; }
.question-meta { display: flex; justify-content: space-between; color: var(--ink-soft); font-family: var(--mono); font-size: 0.85rem; margin-bottom: 14px; }
.question-text { font-size: 1.15rem; margin-bottom: 24px; white-space: pre-wrap; }
.option {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line);
  border-radius: var(--radius); margin-bottom: 10px; cursor: pointer; background: var(--surface);
}
.option:hover { border-color: var(--brand); }
.option input { margin-top: 3px; }
.option.correct { border-color: var(--good); background: var(--good-bg); }
.option.incorrect { border-color: var(--bad); background: var(--bad-bg); }
.option.disabled { cursor: default; }

.feedback-banner {
  padding: 14px 18px; border-radius: var(--radius); margin: 20px 0; font-weight: 600;
}
.feedback-banner.good { background: var(--good-bg); color: var(--good); }
.feedback-banner.bad { background: var(--bad-bg); color: var(--bad); }
.explain-block { background: var(--bg); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; }
.explain-block h4 { margin: 0 0 6px; font-size: 0.85rem; text-transform: none; color: var(--ink-soft); }

/* Status badges */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
.badge-a_apprendre { background: var(--bad-bg); color: var(--bad); }
.badge-fragile { background: var(--warn-bg); color: var(--warn); }
.badge-en_cours { background: #FFF7DA; color: #8A6D00; }
.badge-maitrisee { background: var(--good-bg); color: var(--good); }

/* Forms */
input[type=text], input[type=email], input[type=password], input[type=number], textarea, select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  font-family: inherit; font-size: 0.92rem; background: var(--surface); color: var(--ink);
}
label { display: block; font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 4px; margin-top: 12px; }
.field { margin-bottom: 8px; }

/* Import / verify table */
.review-row { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.review-row.needs-review { border-color: var(--warn); background: var(--warn-bg); }
.review-row .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.dropzone {
  border: 2px dashed var(--line); border-radius: var(--radius); padding: 48px 24px;
  text-align: center; color: var(--ink-soft); cursor: pointer;
}
.dropzone:hover { border-color: var(--brand); color: var(--brand); }

.center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-card { width: 100%; max-width: 380px; }
.config-error { max-width: 600px; margin: 60px auto; padding: 24px; }
.mt { margin-top: 20px; }
.mb { margin-bottom: 20px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.small { font-size: 0.82rem; color: var(--ink-soft); }
.timer { font-family: var(--mono); font-size: 1.1rem; }

</style>
</head>
<body>
<div id="app"><p style="padding:40px;font-family:sans-serif;">Chargement…</p></div>

<!-- Librairies gratuites et open-source, chargées depuis un CDN public -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
</script>

<script>
// =====================================================================
// BOOTSTRAP — configuration Supabase saisie une fois dans l'interface,
// conservée dans le navigateur (localStorage). Aucun fichier à éditer,
// aucune clé secrète : la clé "anon" est publique par conception et
// c'est la RLS (schema.sql) qui protège les données.
// =====================================================================
window.EDN_BOOT = function () {
  const saved = JSON.parse(localStorage.getItem('edn_supabase_config') || 'null');
  if (saved && saved.url && saved.key) {
    window.sb = window.supabase.createClient(saved.url, saved.key);
    return true;
  }
  document.getElementById('app').innerHTML = `
    <div class="center-screen">
      <div class="card auth-card">
        <h1>Connexion à votre base</h1>
        <p class="subtitle">Une seule fois : collez les deux valeurs de votre projet Supabase
        (Project Settings &gt; API).</p>
        <div class="field"><label>Project URL</label>
          <input type="text" id="cfg-url" placeholder="https://xxxx.supabase.co" /></div>
        <div class="field"><label>Clé anon public</label>
          <input type="text" id="cfg-key" placeholder="eyJhbGciOi..." /></div>
        <div id="cfg-error" class="small" style="color:var(--bad);margin-top:8px;"></div>
        <button class="btn btn-primary btn-block mt" id="cfg-save">Enregistrer</button>
      </div>
    </div>`;
  document.getElementById('cfg-save').onclick = () => {
    const url = document.getElementById('cfg-url').value.trim();
    const key = document.getElementById('cfg-key').value.trim();
    if (!url.startsWith('https://') || key.length < 20) {
      document.getElementById('cfg-error').textContent = 'URL ou clé invalide. Vérifiez les deux valeurs dans Supabase.';
      return;
    }
    localStorage.setItem('edn_supabase_config', JSON.stringify({ url, key }));
    location.reload();
  };
  return false;
};

</script>

<script>
// =====================================================================
// PARSERS — extraction locale, sans aucune IA ni API payante.
// Chaque parseur retourne un tableau d'objets "ParsedQuestion" :
// {
//   question_number, question_text, question_type,
//   options: [{key:'A', text:'...', is_correct:bool}, ...],
//   student_initial_answer, official_correction, explanation,
//   theme, needs_review: bool, review_reason: string
// }
// La règle d'or : ne jamais inventer. Si une donnée est incertaine,
// needs_review = true et on ne complète PAS le champ manquant.
// =====================================================================

const EDNParsers = (() => {

  const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

  function emptyQuestion(num) {
    return {
      question_number: num ?? null,
      question_text: '',
      question_type: 'qcm',
      options: [],
      student_initial_answer: '',
      official_correction: '',
      explanation: '',
      theme: '',
      needs_review: false,
      review_reason: ''
    };
  }

  function flagReview(q, reason) {
    q.needs_review = true;
    q.review_reason = q.review_reason ? q.review_reason + '; ' + reason : reason;
    return q;
  }

  // -------------------------------------------------------------
  // CSV / XLSX : on attend un gabarit de colonnes connu.
  // Colonnes reconnues (insensible à la casse, variantes FR admises) :
  // numero | question | type | option_a..option_f | theme
  // reponse_correcte (ex: "A" ou "A,C") | reponse_etudiant
  // correction | explication
  // -------------------------------------------------------------
  const COLUMN_ALIASES = {
    numero: ['numero', 'numéro', 'num', 'n', 'question_number'],
    question: ['question', 'enonce', 'énoncé', 'question_text'],
    type: ['type', 'question_type'],
    theme: ['theme', 'thème', 'item'],
    reponse_correcte: ['reponse_correcte', 'réponse correcte', 'reponses_correctes',
      'bonne_reponse', 'bonnes_reponses', 'correct_answer', 'correct_answers'],
    reponse_etudiant: ['reponse_etudiant', 'réponse étudiant', 'ma_reponse', 'student_answer'],
    correction: ['correction', 'official_correction'],
    explication: ['explication', 'explanation']
  };

  function normalizeHeader(h) {
    return String(h || '').trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // enlève accents
  }

  function matchColumn(headers, aliases) {
    const normalized = headers.map(normalizeHeader);
    for (const alias of aliases) {
      const na = normalizeHeader(alias);
      const idx = normalized.indexOf(na);
      if (idx !== -1) return headers[idx];
    }
    return null;
  }

  function rowsToQuestions(rows) {
    if (!rows.length) return [];
    const headers = Object.keys(rows[0]);
    const col = {};
    for (const key in COLUMN_ALIASES) col[key] = matchColumn(headers, COLUMN_ALIASES[key]);

    const optionCols = {};
    LETTERS.forEach(L => {
      optionCols[L] = matchColumn(headers, [`option_${L.toLowerCase()}`, `proposition_${L.toLowerCase()}`, `option ${L.toLowerCase()}`]);
    });

    return rows.map((row, i) => {
      const q = emptyQuestion(col.numero ? row[col.numero] : i + 1);
      q.question_text = col.question ? String(row[col.question] ?? '').trim() : '';
      if (!q.question_text) flagReview(q, 'énoncé manquant');

      if (col.type) q.question_type = String(row[col.type] || 'qcm').trim().toLowerCase();
      if (col.theme) q.theme = String(row[col.theme] || '').trim();
      if (col.reponse_etudiant) q.student_initial_answer = String(row[col.reponse_etudiant] || '').trim();
      if (col.correction) q.official_correction = String(row[col.correction] || '').trim();
      if (col.explication) q.explanation = String(row[col.explication] || '').trim();

      const correctRaw = col.reponse_correcte ? String(row[col.reponse_correcte] || '').toUpperCase() : '';
      const correctLetters = correctRaw.split(/[,;\/\s]+/).filter(Boolean);
      if (!correctLetters.length) flagReview(q, 'bonne réponse non identifiée');

      let hasAnyOption = false;
      LETTERS.forEach(L => {
        const c = optionCols[L];
        if (c && row[c] !== undefined && String(row[c]).trim() !== '') {
          hasAnyOption = true;
          q.options.push({ key: L, text: String(row[c]).trim(), is_correct: correctLetters.includes(L) });
        }
      });
      if (!hasAnyOption) flagReview(q, 'aucune proposition détectée (question probablement à réponse libre)');
      if (q.options.length > 1) q.question_type = correctLetters.length > 1 ? 'qcm_multiple' : 'qcm';

      return q;
    });
  }

  async function parseCSV(file) {
    return new Promise((resolve, reject) => {
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: (res) => resolve(rowsToQuestions(res.data)),
        error: reject
      });
    });
  }

  async function parseXLSX(file) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    return rowsToQuestions(rows);
  }

  // -------------------------------------------------------------
  // DOCX / PDF : pas de gabarit fiable → extraction heuristique du
  // texte brut. Beaucoup de questions seront marquées "à vérifier" :
  // c'est volontaire (mieux vaut peu de données fiables que des
  // données inventées).
  // -------------------------------------------------------------
  function heuristicParseText(rawText) {
    // Découpe le texte en blocs sur les motifs "Question 12", "12.", "12)"
    const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const blocks = [];
    let current = null;
    const qStart = /^(?:Question\s*)?(\d{1,4})[.)]\s*(.*)$/i;

    for (const line of lines) {
      const m = line.match(qStart);
      if (m && (!current || Number(m[1]) !== current.question_number)) {
        if (current) blocks.push(current);
        current = { question_number: Number(m[1]), lines: [m[2]] };
      } else if (current) {
        current.lines.push(line);
      }
    }
    if (current) blocks.push(current);

    const optionLine = /^([A-F])[.)]\s*(.*)$/;
    const correctionLine = /^(réponses?\s*correctes?|corrig[ée]|correction|bonnes?\(?s?\)?\s*réponses?)\s*[:\-]?\s*(.*)$/i;
    const explanationLine = /^(explication|commentaire|rappel)\s*[:\-]?\s*(.*)$/i;

    return blocks.map(b => {
      const q = emptyQuestion(b.question_number);
      const bodyLines = [];
      let mode = 'body';
      let correctLettersFound = [];

      for (const line of b.lines) {
        const optM = line.match(optionLine);
        const corrM = line.match(correctionLine);
        const explM = line.match(explanationLine);

        if (optM) {
          q.options.push({ key: optM[1].toUpperCase(), text: optM[2].trim(), is_correct: false });
          mode = 'options';
        } else if (corrM) {
          q.official_correction = (q.official_correction + ' ' + corrM[2]).trim();
          const letters = corrM[2].toUpperCase().match(/[A-F]/g);
          if (letters) correctLettersFound.push(...letters);
          mode = 'correction';
        } else if (explM) {
          q.explanation = (q.explanation + ' ' + explM[2]).trim();
          mode = 'explanation';
        } else if (mode === 'body') {
          bodyLines.push(line);
        } else if (mode === 'options' && q.options.length) {
          // suite d'une proposition sur plusieurs lignes
          q.options[q.options.length - 1].text += ' ' + line;
        } else if (mode === 'correction') {
          q.official_correction += ' ' + line;
          const letters = line.toUpperCase().match(/[A-F]/g);
          if (letters) correctLettersFound.push(...letters);
        } else if (mode === 'explanation') {
          q.explanation += ' ' + line;
        }
      }

      q.question_text = bodyLines.join(' ').trim();
      correctLettersFound = [...new Set(correctLettersFound)];
      q.options.forEach(o => { if (correctLettersFound.includes(o.key)) o.is_correct = true; });
      q.question_type = correctLettersFound.length > 1 ? 'qcm_multiple' : 'qcm';

      if (!q.question_text) flagReview(q, 'énoncé non identifié avec certitude');
      if (!q.options.length) flagReview(q, 'aucune proposition détectée — probablement une question à format non-QCM');
      if (!correctLettersFound.length) flagReview(q, 'bonne réponse non identifiée dans le texte');

      return q;
    });
  }

  async function parseDOCX(file) {
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    const questions = heuristicParseText(result.value);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }
    return questions;
  }

  async function parsePDF(file) {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(it => it.str).join(' ');
      fullText += '\n' + pageText;
    }
    if (!fullText.replace(/\s/g, '').length) {
      // PDF probablement scanné (image) — pas d'OCR local disponible sans IA/service payant
      return [flagReview(emptyQuestion(1),
        'PDF scanné ou sans texte extractible : aucune extraction automatique fiable possible. ' +
        'Saisie manuelle requise, ou convertissez le fichier en PDF texte/DOCX/CSV avant import.')];
    }
    const questions = heuristicParseText(fullText);
    if (!questions.length) {
      return [flagReview(emptyQuestion(1), 'aucune structure de question détectée — saisie manuelle nécessaire')];
    }
    return questions;
  }

  async function parseFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'csv') return parseCSV(file);
    if (ext === 'xlsx' || ext === 'xls') return parseXLSX(file);
    if (ext === 'docx') return parseDOCX(file);
    if (ext === 'pdf') return parsePDF(file);
    throw new Error('Format non supporté : .' + ext);
  }

  return { parseFile, heuristicParseText };
})();

</script>

<script>
// =====================================================================
// ENGINE — moteur de révision par erreurs, cycles, et statut de maîtrise.
// Algorithme (voir README section "Moteur de révision") :
//
//  Nouveau cycle N          -> toutes les questions sont éligibles
//  Réponse correcte         -> retirée de la liste d'erreurs du cycle N
//  Réponse incorrecte       -> ajoutée à la liste d'erreurs du cycle N
//  Fin de session, erreurs>0 -> prochaine session = uniquement ces erreurs
//  Fin de session, erreurs=0 -> cycle N terminé, cycle N+1 disponible
//
// Une question redevenue incorrecte après avoir été correcte réintègre
// IMMÉDIATEMENT la liste d'erreurs du cycle en cours.
// =====================================================================

const EDNEngine = (() => {

  // Récupère, pour un examen et un cycle donnés, la dernière tentative
  // de chaque question au sein de CE cycle.
  async function getLatestAttemptsForCycle(userId, examId, cycleNumber) {
    const { data, error } = await sb
      .from('attempts')
      .select('question_id, is_correct, answered_at')
      .eq('user_id', userId)
      .eq('exam_id', examId)
      .eq('cycle_number', cycleNumber)
      .order('answered_at', { ascending: true });
    if (error) throw error;

    const latest = new Map();
    for (const row of data) latest.set(row.question_id, row.is_correct); // le dernier écrase les précédents (ordre asc)
    return latest;
  }

  // Liste des questions éligibles à la PROCHAINE session pour un cycle :
  // jamais répondues dans ce cycle, ou dont la dernière réponse est fausse.
  async function getEligibleQuestions(userId, examId, cycleNumber) {
    const { data: allQuestions, error } = await sb
      .from('questions')
      .select('id')
      .eq('exam_id', examId)
      .eq('user_id', userId);
    if (error) throw error;

    const latest = await getLatestAttemptsForCycle(userId, examId, cycleNumber);
    return allQuestions
      .filter(q => !latest.has(q.id) || latest.get(q.id) === false)
      .map(q => q.id);
  }

  // Nombre d'erreurs actuelles du cycle en cours (pour affichage dashboard / "Mes erreurs")
  async function countCurrentErrors(userId, examId, cycleNumber) {
    const ids = await getEligibleQuestions(userId, examId, cycleNumber);
    // "Mes erreurs" doit refléter les questions déjà tentées au moins une fois
    // et actuellement fausses (pas les questions jamais vues du tout).
    const latest = await getLatestAttemptsForCycle(userId, examId, cycleNumber);
    return ids.filter(id => latest.has(id)).length;
  }

  function buildQuestionSet(allIds, scope, latestMap, masteryMap, count) {
    let pool = allIds;
    if (scope === 'errors') {
      pool = allIds.filter(id => latestMap.has(id) && latestMap.get(id) === false);
    } else if (scope === 'fragile') {
      pool = allIds.filter(id => (masteryMap.get(id) || {}).status === 'fragile');
    } else if (scope === 'nonmastered') {
      pool = allIds.filter(id => (masteryMap.get(id) || {}).status !== 'maitrisee');
    }
    if (count && count !== 'all' && Number(count) < pool.length) {
      pool = pool.slice(0, Number(count));
    }
    return pool;
  }

  // Calcule le statut de maîtrise à partir des compteurs mastery.
  // Règle (documentée en README) :
  //   a_apprendre : jamais réussie
  //   fragile     : déjà réussie au moins une fois, mais la dernière tentative est un échec
  //   en_cours    : 1 ou 2 bonnes réponses consécutives
  //   maitrisee   : 3 bonnes réponses consécutives ou plus
  function computeStatus(m) {
    if (!m || m.total_attempts === 0) return 'a_apprendre';
    if (m.consecutive_correct >= 3) return 'maitrisee';
    if (m.consecutive_correct === 0) return m.total_correct > 0 ? 'fragile' : 'a_apprendre';
    return 'en_cours';
  }

  // Enregistre une tentative + met à jour mastery. Retourne le nouveau statut.
  async function recordAttempt({ userId, examId, questionId, sessionId, cycleNumber, selectedAnswers, isCorrect, responseTime }) {
    const { error: attErr } = await sb.from('attempts').insert({
      user_id: userId, exam_id: examId, question_id: questionId, session_id: sessionId,
      cycle_number: cycleNumber, selected_answers: selectedAnswers, is_correct: isCorrect,
      response_time: responseTime || null
    });
    if (attErr) throw attErr;

    const { data: existing } = await sb.from('mastery')
      .select('*').eq('user_id', userId).eq('question_id', questionId).maybeSingle();

    const base = existing || {
      user_id: userId, question_id: questionId, exam_id: examId,
      consecutive_correct: 0, total_attempts: 0, total_correct: 0, total_incorrect: 0,
      cycles_correct_count: 0
    };
    base.total_attempts += 1;
    if (isCorrect) { base.total_correct += 1; base.consecutive_correct += 1; }
    else { base.total_incorrect += 1; base.consecutive_correct = 0; }
    base.last_attempt_at = new Date().toISOString();
    base.status = computeStatus(base);
    if (base.status === 'maitrisee' && !base.mastered_at) base.mastered_at = new Date().toISOString();
    if (base.status !== 'maitrisee') base.mastered_at = null;

    const { error: mErr } = await sb.from('mastery').upsert(base, { onConflict: 'user_id,question_id' });
    if (mErr) throw mErr;
    return base.status;
  }

  async function getMasteryMap(userId, examId) {
    const { data, error } = await sb.from('mastery').select('*').eq('user_id', userId).eq('exam_id', examId);
    if (error) throw error;
    const map = new Map();
    data.forEach(m => map.set(m.question_id, m));
    return map;
  }

  return {
    getLatestAttemptsForCycle, getEligibleQuestions, countCurrentErrors,
    buildQuestionSet, computeStatus, recordAttempt, getMasteryMap
  };
})();

</script>

<script>
// =====================================================================
// APP — routeur hash + vues. Aucun framework, aucun build.
// =====================================================================
const App = (() => {
  let CURRENT_USER = null;
  const $app = () => document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function nav(links) {
    return `<div class="sidebar">
      <div class="brand">EDN<span class="dot">•</span>Trainer</div>
      ${links.map(l => `<a class="nav-link ${location.hash.startsWith(l.href) ? 'active' : ''}" href="${l.href}">${l.label}</a>`).join('')}
      <a class="nav-link" href="#" id="logout-link" style="margin-top:16px;color:var(--bad)">Se déconnecter</a>
    </div>`;
  }

  function shell(innerHtml) {
    const links = [
      { href: '#/dashboard', label: 'Dashboard' },
      { href: '#/exams', label: 'Mes EDN' },
      { href: '#/import', label: '+ Importer un EDN' },
    ];
    $app().innerHTML = `<div class="shell">${nav(links)}<div class="main">${innerHtml}</div></div>`;
    const lo = document.getElementById('logout-link');
    if (lo) lo.onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); route(); };
  }

  // ---------------------------------------------------------------
  // AUTH
  // ---------------------------------------------------------------
  function renderLogin() {
    $app().innerHTML = `
      <div class="center-screen">
        <div class="card auth-card">
          <h1>EDN Trainer</h1>
          <p class="subtitle">Entraînement personnel aux EDN — révision par erreurs</p>
          <div class="field"><label>Email</label><input type="email" id="email" /></div>
          <div class="field"><label>Mot de passe</label><input type="password" id="password" /></div>
          <div id="auth-error" class="small" style="color:var(--bad);margin-top:8px;"></div>
          <button class="btn btn-primary btn-block mt" id="btn-login">Se connecter</button>
          <button class="btn btn-block" id="btn-signup" style="margin-top:8px;">Créer un compte</button>
        </div>
      </div>`;
    const errEl = document.getElementById('auth-error');
    document.getElementById('btn-login').onclick = async () => {
      const email = document.getElementById('email').value, password = document.getElementById('password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) errEl.textContent = error.message; else route();
    };
    document.getElementById('btn-signup').onclick = async () => {
      const email = document.getElementById('email').value, password = document.getElementById('password').value;
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) { errEl.textContent = error.message; return; }
      if (data.user) {
        await sb.from('profiles').upsert({ id: data.user.id, user_id: data.user.id });
      }
      errEl.style.color = 'var(--good)';
      errEl.textContent = 'Compte créé. Vérifiez vos emails si la confirmation est activée, puis connectez-vous.';
    };
  }

  // ---------------------------------------------------------------
  // DASHBOARD
  // ---------------------------------------------------------------
  async function renderDashboard() {
    shell('<p>Chargement…</p>');
    const { data: exams } = await sb.from('exams').select('*').eq('user_id', CURRENT_USER.id).order('created_at');
    let totalQ = 0, totalMastered = 0, totalErrors = 0, todayCount = 0;
    const today = new Date(); today.setHours(0, 0, 0, 0);

    for (const ex of (exams || [])) {
      const masteryMap = await EDNEngine.getMasteryMap(CURRENT_USER.id, ex.id);
      totalQ += ex.total_questions;
      masteryMap.forEach(m => { if (m.status === 'maitrisee') totalMastered++; });
      totalErrors += await EDNEngine.countCurrentErrors(CURRENT_USER.id, ex.id, ex.current_cycle);
    }
    const { data: todayAttempts } = await sb.from('attempts').select('id').eq('user_id', CURRENT_USER.id).gte('answered_at', today.toISOString());
    todayCount = (todayAttempts || []).length;
    const rate = totalQ ? Math.round((totalMastered / totalQ) * 100) : 0;

    shell(`
      <h1>Dashboard</h1>
      <p class="subtitle">Vue d'ensemble de votre préparation</p>
      <div class="grid grid-4 mb">
        <div class="card stat-card"><div class="value">${rate}%</div><div class="label">Progression globale</div></div>
        <div class="card stat-card"><div class="value">${totalMastered} / ${totalQ}</div><div class="label">Questions maîtrisées</div></div>
        <div class="card stat-card"><div class="value">${totalErrors}</div><div class="label">Questions à revoir</div></div>
        <div class="card stat-card"><div class="value">${todayCount}</div><div class="label">Travaillées aujourd'hui</div></div>
      </div>
      <h2>Vos examens</h2>
      ${(exams || []).length === 0 ? `<p class="small">Aucun examen importé pour l'instant. <a href="#/import">Importer un EDN</a></p>` :
        (exams || []).map(ex => `
          <div class="card exam-card">
            <div>
              <strong>${esc(ex.name)}</strong>
              <div class="meta">${ex.total_questions} questions · Cycle ${ex.current_cycle}</div>
            </div>
            <div><a class="btn btn-primary" href="#/exam/${ex.id}/train">Continuer</a></div>
          </div>`).join('')}
    `);
  }

  // ---------------------------------------------------------------
  // MES EDN
  // ---------------------------------------------------------------
  async function renderExams() {
    shell('<p>Chargement…</p>');
    const { data: exams } = await sb.from('exams').select('*').eq('user_id', CURRENT_USER.id).order('created_at', { ascending: false });
    const cards = [];
    for (const ex of (exams || [])) {
      const masteryMap = await EDNEngine.getMasteryMap(CURRENT_USER.id, ex.id);
      let mastered = 0; masteryMap.forEach(m => { if (m.status === 'maitrisee') mastered++; });
      const errors = await EDNEngine.countCurrentErrors(CURRENT_USER.id, ex.id, ex.current_cycle);
      const pct = ex.total_questions ? Math.round((mastered / ex.total_questions) * 100) : 0;
      cards.push(`
        <div class="card">
          <div class="flex-between">
            <strong>${esc(ex.name)}</strong>
            <button class="btn small" data-del="${ex.id}" style="color:var(--bad)">Supprimer</button>
          </div>
          <div class="meta small">${ex.total_questions} questions · Cycle ${ex.current_cycle} · Dernière activité : ${ex.updated_at ? new Date(ex.updated_at).toLocaleDateString('fr-FR') : '—'}</div>
          <div class="progress-bar"><div style="width:${pct}%"></div></div>
          <div class="small mb">${pct}% maîtrisé · ${errors} question(s) à revoir</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <a class="btn btn-primary" href="#/exam/${ex.id}/train">Continuer</a>
            <a class="btn" href="#/exam/${ex.id}/mistakes">Mes erreurs</a>
            <a class="btn" href="#/exam/${ex.id}/exam-mode">Mode examen</a>
            <a class="btn" href="#/exam/${ex.id}/stats">Statistiques</a>
          </div>
        </div>`);
    }
    shell(`<h1>Mes EDN</h1><p class="subtitle">Tous vos examens importés</p>
      <a class="btn btn-primary mb" href="#/import">+ Importer un EDN</a>
      ${cards.join('') || '<p class="small">Aucun examen pour l\'instant.</p>'}`);
    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Supprimer définitivement cet examen et toutes ses données ?')) return;
        await sb.from('exams').delete().eq('id', btn.dataset.del).eq('user_id', CURRENT_USER.id);
        renderExams();
      };
    });
  }

  // ---------------------------------------------------------------
  // IMPORT
  // ---------------------------------------------------------------
  let PENDING_IMPORT = null; // { examName, questions: [...] }

  function renderImport() {
    shell(`
      <h1>Importer un EDN</h1>
      <p class="subtitle">Formats supportés : CSV, XLSX, DOCX, PDF (texte). Rien n'est inventé : les données incertaines seront à vérifier manuellement.</p>
      <div class="card">
        <label>Nom de l'examen</label>
        <input type="text" id="exam-name" placeholder="Ex : EDN Blanc 1 — Septembre 2026" />
        <div class="dropzone mt" id="dropzone">
          <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.docx,.pdf" style="display:none" />
          <p><strong>Cliquez pour choisir un fichier</strong><br/>ou glissez-le ici</p>
        </div>
        <div id="import-status" class="small mt"></div>
      </div>
      <div class="card small">
        <strong>Format CSV/XLSX recommandé</strong> (le plus fiable, aucune vérification manuelle nécessaire) :
        colonnes <code>numero, question, type, option_a, option_b, option_c, option_d, option_e,
        reponse_correcte, reponse_etudiant, correction, explication, theme</code>.
        <code>reponse_correcte</code> accepte plusieurs lettres séparées par une virgule (ex : "A,C").
      </div>
    `);
    const dz = document.getElementById('dropzone'), input = document.getElementById('file-input');
    dz.onclick = () => input.click();
    dz.ondragover = (e) => e.preventDefault();
    dz.ondrop = (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
    input.onchange = () => { if (input.files[0]) handleFile(input.files[0]); };
  }

  async function handleFile(file) {
    const statusEl = document.getElementById('import-status');
    const examName = document.getElementById('exam-name').value.trim();
    if (!examName) { statusEl.style.color = 'var(--bad)'; statusEl.textContent = 'Donnez un nom à l\'examen avant d\'importer.'; return; }
    statusEl.style.color = 'var(--ink-soft)';
    statusEl.textContent = 'Analyse du fichier en cours…';
    try {
      const questions = await EDNParsers.parseFile(file);
      PENDING_IMPORT = { examName, fileName: file.name, fileType: file.name.split('.').pop().toLowerCase(), questions };
      location.hash = '#/import/verify';
    } catch (e) {
      statusEl.style.color = 'var(--bad)';
      statusEl.textContent = 'Erreur d\'analyse : ' + e.message;
    }
  }

  function renderImportVerify() {
    if (!PENDING_IMPORT) { location.hash = '#/import'; return; }
    const { questions, examName } = PENDING_IMPORT;
    const okCount = questions.filter(q => !q.needs_review).length;
    const reviewCount = questions.length - okCount;

    shell(`
      <h1>Vérification de l'import</h1>
      <p class="subtitle">${esc(examName)} — <strong>${questions.length}</strong> question(s) détectée(s) :
        <span style="color:var(--good)">${okCount} correctement structurées</span> ·
        <span style="color:var(--warn)">${reviewCount} à vérifier</span></p>
      <div id="review-list">${questions.map((q, i) => renderReviewRow(q, i)).join('')}</div>
      <div style="display:flex;gap:12px;margin-top:20px;">
        <button class="btn" id="cancel-import">Annuler</button>
        <button class="btn btn-good btn-lg" id="validate-import">Valider l'import (${questions.length} questions)</button>
      </div>
    `);
    document.getElementById('cancel-import').onclick = () => { PENDING_IMPORT = null; location.hash = '#/import'; };
    document.getElementById('validate-import').onclick = commitImport;
    questions.forEach((q, i) => attachReviewRowHandlers(i));
  }

  function renderReviewRow(q, i) {
    return `
      <div class="review-row ${q.needs_review ? 'needs-review' : ''}" data-idx="${i}">
        <div class="row-head">
          <strong>Question ${q.question_number ?? i + 1}</strong>
          ${q.needs_review ? `<span class="badge badge-fragile">À vérifier — ${esc(q.review_reason)}</span>` : `<span class="badge badge-maitrisee">OK</span>`}
        </div>
        <label>Énoncé</label>
        <textarea rows="2" data-field="question_text" data-i="${i}">${esc(q.question_text)}</textarea>
        <label>Thème / item</label>
        <input type="text" data-field="theme" data-i="${i}" value="${esc(q.theme)}" />
        <label>Propositions (cochez la ou les bonnes réponses)</label>
        ${(q.options.length ? q.options : [{ key: 'A', text: '', is_correct: false }]).map((o, oi) => `
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
            <input type="checkbox" data-opt-correct="${i}:${oi}" ${o.is_correct ? 'checked' : ''} />
            <span class="small" style="width:16px;">${o.key}</span>
            <input type="text" data-opt-text="${i}:${oi}" value="${esc(o.text)}" />
          </div>`).join('')}
        <label>Correction officielle</label>
        <textarea rows="2" data-field="official_correction" data-i="${i}">${esc(q.official_correction)}</textarea>
        <label>Explication</label>
        <textarea rows="2" data-field="explanation" data-i="${i}">${esc(q.explanation)}</textarea>
      </div>`;
  }

  function attachReviewRowHandlers(i) {
    const row = document.querySelector(`.review-row[data-idx="${i}"]`);
    row.querySelectorAll('[data-field]').forEach(el => {
      el.onchange = () => { PENDING_IMPORT.questions[i][el.dataset.field] = el.value; };
    });
    row.querySelectorAll('[data-opt-text]').forEach(el => {
      el.onchange = () => {
        const [qi, oi] = el.dataset.optText.split(':').map(Number);
        if (!PENDING_IMPORT.questions[qi].options[oi]) PENDING_IMPORT.questions[qi].options[oi] = { key: String.fromCharCode(65 + oi), is_correct: false };
        PENDING_IMPORT.questions[qi].options[oi].text = el.value;
      };
    });
    row.querySelectorAll('[data-opt-correct]').forEach(el => {
      el.onchange = () => {
        const [qi, oi] = el.dataset.optCorrect.split(':').map(Number);
        PENDING_IMPORT.questions[qi].options[oi].is_correct = el.checked;
      };
    });
  }

  async function commitImport() {
    const btn = document.getElementById('validate-import');
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    const { examName, fileName, fileType, questions } = PENDING_IMPORT;

    const { data: exam, error: exErr } = await sb.from('exams').insert({
      user_id: CURRENT_USER.id, name: examName, source_file: fileName, total_questions: questions.length
    }).select().single();
    if (exErr) { alert('Erreur : ' + exErr.message); btn.disabled = false; return; }

    await sb.from('imported_files').insert({
      user_id: CURRENT_USER.id, exam_id: exam.id, file_name: fileName, file_type: fileType, import_status: 'verified'
    });

    const topicCache = new Map();
    async function getTopicId(name) {
      if (!name) return null;
      if (topicCache.has(name)) return topicCache.get(name);
      const { data: existing } = await sb.from('topics').select('id').eq('exam_id', exam.id).eq('name', name).maybeSingle();
      if (existing) { topicCache.set(name, existing.id); return existing.id; }
      const { data: created } = await sb.from('topics').insert({ user_id: CURRENT_USER.id, exam_id: exam.id, name }).select().single();
      topicCache.set(name, created.id);
      return created.id;
    }

    let position = 0;
    for (const q of questions) {
      const topicId = await getTopicId(q.theme);
      const { data: qRow, error: qErr } = await sb.from('questions').insert({
        user_id: CURRENT_USER.id, exam_id: exam.id, topic_id: topicId,
        question_number: q.question_number, question_text: q.question_text || '(énoncé à compléter)',
        question_type: q.question_type, position: position++,
        student_initial_answer: q.student_initial_answer, official_correction: q.official_correction,
        explanation: q.explanation, needs_review: q.needs_review
      }).select().single();
      if (qErr) { console.error(qErr); continue; }
      const opts = (q.options || []).filter(o => o.text && o.text.trim());
      if (opts.length) {
        await sb.from('question_options').insert(opts.map((o, oi) => ({
          user_id: CURRENT_USER.id, question_id: qRow.id, option_key: o.key || String.fromCharCode(65 + oi),
          option_text: o.text, is_correct: !!o.is_correct, position: oi
        })));
      }
    }
    PENDING_IMPORT = null;
    location.hash = `#/exam/${exam.id}/train`;
  }

  // ---------------------------------------------------------------
  // ENTRAÎNEMENT (moteur principal)
  // ---------------------------------------------------------------
  const RESUME_KEY = (examId) => `edn_resume_${examId}`;

  async function renderTrain(examId) {
    shell('<p>Chargement…</p>');
    const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
    if (!exam) { shell('Examen introuvable.'); return; }

    const saved = JSON.parse(localStorage.getItem(RESUME_KEY(examId)) || 'null');
    if (saved && saved.cycleNumber === exam.current_cycle) {
      startSession(exam, saved.scope, saved.count, saved.queue, saved.index, saved.sessionId, saved.correct, saved.incorrect);
      return;
    }
    renderTrainSetup(exam);
  }

  function renderTrainSetup(exam) {
    shell(`
      <h1>${esc(exam.name)}</h1>
      <p class="subtitle">Cycle actuel : ${exam.current_cycle}</p>
      <div class="card">
        <h2>Commencer l'entraînement</h2>
        <label>Portée</label>
        <select id="scope">
          <option value="all">Toutes les questions</option>
          <option value="errors">Uniquement mes erreurs du cycle en cours</option>
          <option value="fragile">Questions fragiles</option>
          <option value="nonmastered">Questions non maîtrisées</option>
        </select>
        <label>Nombre de questions</label>
        <select id="count">
          <option value="10">10</option><option value="20">20</option><option value="50">50</option>
          <option value="100">100</option><option value="200">200</option><option value="all" selected>Toutes</option>
        </select>
        <button class="btn btn-primary btn-lg mt" id="start-btn">Commencer l'entraînement</button>
      </div>
      <a class="btn mt" href="#/exams">← Retour à mes EDN</a>
    `);
    document.getElementById('start-btn').onclick = async () => {
      const scope = document.getElementById('scope').value, count = document.getElementById('count').value;
      const allIds = (await sb.from('questions').select('id').eq('exam_id', exam.id)).data.map(q => q.id);
      const latest = await EDNEngine.getLatestAttemptsForCycle(CURRENT_USER.id, exam.id, exam.current_cycle);
      const masteryMap = await EDNEngine.getMasteryMap(CURRENT_USER.id, exam.id);
      const queue = EDNEngine.buildQuestionSet(allIds, scope, latest, masteryMap, count);
      if (!queue.length) { alert('Aucune question ne correspond à cette sélection.'); return; }
      const { data: session } = await sb.from('study_sessions').insert({
        user_id: CURRENT_USER.id, exam_id: exam.id, cycle_number: exam.current_cycle,
        mode: 'entrainement', total_questions: queue.length
      }).select().single();
      startSession(exam, scope, count, queue, 0, session.id, 0, 0);
    };
  }

  async function startSession(exam, scope, count, queue, index, sessionId, correct, incorrect) {
    if (index >= queue.length) { await finishSession(exam, sessionId, correct, incorrect); return; }
    localStorage.setItem(RESUME_KEY(exam.id), JSON.stringify({ cycleNumber: exam.current_cycle, scope, count, queue, index, sessionId, correct, incorrect }));

    const qId = queue[index];
    const { data: q } = await sb.from('questions').select('*, question_options(*)').eq('id', qId).single();
    const isMultiple = q.question_type === 'qcm_multiple';
    const startTime = Date.now();

    shell(`
      <div class="question-shell">
        <div class="question-meta"><span>Question ${index + 1} / ${queue.length}</span><span>Cycle ${exam.current_cycle}</span></div>
        <div class="question-text">${esc(q.question_text)}</div>
        <div id="options">
          ${q.question_options.sort((a, b) => a.position - b.position).map(o => `
            <label class="option" data-key="${o.option_key}">
              <input type="${isMultiple ? 'checkbox' : 'radio'}" name="opt" value="${o.option_key}" />
              <span><strong>${o.option_key}.</strong> ${esc(o.option_text)}</span>
            </label>`).join('')}
        </div>
        <div id="feedback-zone"></div>
        <div style="display:flex;gap:12px;margin-top:20px;">
          <button class="btn" id="quit-btn">Quitter la session</button>
          <button class="btn btn-primary btn-lg" id="validate-btn" ${!q.question_options.length ? 'disabled' : ''}>Valider</button>
        </div>
      </div>
    `);
    document.getElementById('quit-btn').onclick = () => { location.hash = `#/exam/${exam.id}/train`; renderTrainSetup(exam); };

    document.getElementById('validate-btn').onclick = async () => {
      const selected = Array.from(document.querySelectorAll('input[name="opt"]:checked')).map(i => i.value);
      if (!selected.length) { alert('Sélectionnez au moins une réponse.'); return; }
      const correctKeys = q.question_options.filter(o => o.is_correct).map(o => o.option_key).sort();
      const isCorrect = JSON.stringify(selected.sort()) === JSON.stringify(correctKeys);
      const responseTime = Math.round((Date.now() - startTime) / 1000);

      document.querySelectorAll('.option').forEach(el => {
        el.classList.add('disabled');
        el.querySelector('input').disabled = true;
        const key = el.dataset.key;
        if (correctKeys.includes(key)) el.classList.add('correct');
        else if (selected.includes(key)) el.classList.add('incorrect');
      });

      await EDNEngine.recordAttempt({
        userId: CURRENT_USER.id, examId: exam.id, questionId: q.id, sessionId, cycleNumber: exam.current_cycle,
        selectedAnswers: selected, isCorrect, responseTime
      });

      document.getElementById('feedback-zone').innerHTML = `
        <div class="feedback-banner ${isCorrect ? 'good' : 'bad'}">${isCorrect ? '✓ CORRECT' : '✗ INCORRECT'}</div>
        ${q.official_correction ? `<div class="explain-block"><h4>Correction officielle</h4>${esc(q.official_correction)}</div>` : ''}
        ${q.explanation ? `<div class="explain-block"><h4>Explication</h4>${esc(q.explanation)}</div>` : ''}
      `;
      document.getElementById('validate-btn').style.display = 'none';
      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn btn-primary btn-lg mt';
      nextBtn.textContent = index + 1 < queue.length ? 'Question suivante' : 'Terminer la session';
      nextBtn.onclick = () => startSession(exam, scope, count, queue, index + 1, sessionId,
        correct + (isCorrect ? 1 : 0), incorrect + (isCorrect ? 0 : 1));
      document.getElementById('feedback-zone').appendChild(nextBtn);
    };
  }

  async function finishSession(exam, sessionId, correct, incorrect) {
    localStorage.removeItem(RESUME_KEY(exam.id));
    await sb.from('study_sessions').update({
      correct_answers: correct, incorrect_answers: incorrect, completed_at: new Date().toISOString()
    }).eq('id', sessionId);

    const remainingErrors = await EDNEngine.countCurrentErrors(CURRENT_USER.id, exam.id, exam.current_cycle);

    if (remainingErrors === 0) {
      await sb.from('exams').update({ current_cycle: exam.current_cycle + 1, updated_at: new Date().toISOString() }).eq('id', exam.id);
      shell(`
        <div class="card" style="text-align:center;padding:48px;">
          <h1 style="color:var(--good)">CYCLE ${exam.current_cycle} TERMINÉ</h1>
          <p class="subtitle">100% de réussite sur ce cycle.</p>
          <a class="btn btn-primary btn-lg" href="#/exam/${exam.id}/train">Commencer le cycle ${exam.current_cycle + 1}</a>
        </div>`);
    } else {
      shell(`
        <div class="card" style="text-align:center;padding:48px;">
          <h1>Session terminée</h1>
          <p class="subtitle">${correct} bonne(s) réponse(s), ${incorrect} erreur(s).</p>
          <p><strong>${remainingErrors}</strong> question(s) restent à revoir sur ce cycle.</p>
          <a class="btn btn-primary btn-lg" href="#/exam/${exam.id}/mistakes">Réviser mes erreurs</a>
        </div>`);
    }
  }

  // ---------------------------------------------------------------
  // MES ERREURS
  // ---------------------------------------------------------------
  async function renderMistakes(examId) {
    shell('<p>Chargement…</p>');
    const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
    const errorCount = await EDNEngine.countCurrentErrors(CURRENT_USER.id, examId, exam.current_cycle);
    shell(`
      <h1>Mes erreurs — ${esc(exam.name)}</h1>
      <div class="card stat-card"><div class="value">${errorCount}</div><div class="label">Questions à revoir (cycle ${exam.current_cycle})</div></div>
      <a class="btn btn-primary btn-lg" href="#" id="review-btn">Réviser mes erreurs</a>
      <a class="btn mt" href="#/exam/${examId}/train">← Retour à l'entraînement</a>
    `);
    document.getElementById('review-btn').onclick = async (e) => {
      e.preventDefault();
      const allIds = (await sb.from('questions').select('id').eq('exam_id', examId)).data.map(q => q.id);
      const latest = await EDNEngine.getLatestAttemptsForCycle(CURRENT_USER.id, examId, exam.current_cycle);
      const queue = EDNEngine.buildQuestionSet(allIds, 'errors', latest, new Map(), 'all');
      if (!queue.length) { alert('Aucune erreur à réviser actuellement.'); return; }
      const { data: session } = await sb.from('study_sessions').insert({
        user_id: CURRENT_USER.id, exam_id: examId, cycle_number: exam.current_cycle, mode: 'erreurs', total_questions: queue.length
      }).select().single();
      startSession(exam, 'errors', 'all', queue, 0, session.id, 0, 0);
    };
  }

  // ---------------------------------------------------------------
  // STATISTIQUES (par thème)
  // ---------------------------------------------------------------
  async function renderStats(examId) {
    shell('<p>Chargement…</p>');
    const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
    const { data: topics } = await sb.from('topics').select('id, name').eq('exam_id', examId);
    const rows = [];
    for (const t of (topics || [])) {
      const { data: qs } = await sb.from('questions').select('id').eq('topic_id', t.id);
      const qIds = qs.map(q => q.id);
      if (!qIds.length) continue;
      const { data: att } = await sb.from('attempts').select('is_correct, question_id').eq('exam_id', examId).in('question_id', qIds);
      if (!att.length) { rows.push({ name: t.name, rate: null }); continue; }
      const rate = Math.round((att.filter(a => a.is_correct).length / att.length) * 100);
      rows.push({ name: t.name, rate });
    }
    shell(`
      <h1>Statistiques — ${esc(exam.name)}</h1>
      <p class="subtitle">Taux de réussite par thème, calculé à partir de vos réponses (aucune IA).</p>
      ${rows.length === 0 ? '<p class="small">Aucun thème identifié dans cet import.</p>' :
        rows.map(r => `
          <div class="card">
            <div class="flex-between"><strong>${esc(r.name)}</strong><span>${r.rate === null ? 'non commencé' : r.rate + '%'}</span></div>
            <div class="progress-bar"><div style="width:${r.rate || 0}%;background:${r.rate === null ? 'var(--line)' : r.rate >= 70 ? 'var(--good)' : 'var(--warn)'}"></div></div>
          </div>`).join('')}
      <a class="btn mt" href="#/exam/${examId}/train">← Retour à l'entraînement</a>
    `);
  }

  // ---------------------------------------------------------------
  // MODE EXAMEN (chronométré, sans correction immédiate)
  // ---------------------------------------------------------------
  async function renderExamModeSetup(examId) {
    shell('<p>Chargement…</p>');
    const { data: exam } = await sb.from('exams').select('*').eq('id', examId).single();
    shell(`
      <h1>Mode examen — ${esc(exam.name)}</h1>
      <div class="card">
        <label>Nombre de questions</label>
        <select id="ex-count"><option>10</option><option>20</option><option>50</option><option selected>100</option><option value="all">Toutes</option></select>
        <label>Durée (minutes, 0 = illimité)</label>
        <input type="number" id="ex-duration" value="0" />
        <button class="btn btn-primary btn-lg mt" id="ex-start">Démarrer le mode examen</button>
      </div>
    `);
    document.getElementById('ex-start').onclick = async () => {
      const count = document.getElementById('ex-count').value;
      const duration = Number(document.getElementById('ex-duration').value) || 0;
      let q = sb.from('questions').select('id').eq('exam_id', examId).order('position');
      const { data: all } = await q;
      let ids = all.map(x => x.id);
      if (count !== 'all') ids = ids.slice(0, Number(count));
      const { data: session } = await sb.from('study_sessions').insert({
        user_id: CURRENT_USER.id, exam_id: examId, cycle_number: exam.current_cycle, mode: 'examen', total_questions: ids.length
      }).select().single();
      runExamMode(exam, ids, 0, {}, session.id, duration, Date.now());
    };
  }

  async function runExamMode(exam, ids, index, answers, sessionId, durationMin, startedAt) {
    if (index >= ids.length) { finishExamMode(exam, ids, answers, sessionId); return; }
    const { data: q } = await sb.from('questions').select('*, question_options(*)').eq('id', ids[index]).single();
    const isMultiple = q.question_type === 'qcm_multiple';
    const remainingMs = durationMin ? durationMin * 60000 - (Date.now() - startedAt) : null;

    shell(`
      <div class="question-shell">
        <div class="question-meta">
          <span>Question ${index + 1} / ${ids.length}</span>
          ${durationMin ? `<span class="timer" id="timer">--:--</span>` : ''}
        </div>
        <div class="question-text">${esc(q.question_text)}</div>
        <div id="options">
          ${q.question_options.sort((a, b) => a.position - b.position).map(o => `
            <label class="option" data-key="${o.option_key}">
              <input type="${isMultiple ? 'checkbox' : 'radio'}" name="opt" value="${o.option_key}" ${(answers[q.id] || []).includes(o.option_key) ? 'checked' : ''} />
              <span><strong>${o.option_key}.</strong> ${esc(o.option_text)}</span>
            </label>`).join('')}
        </div>
        <div style="display:flex;gap:12px;margin-top:20px;">
          <button class="btn" id="prev-btn" ${index === 0 ? 'disabled' : ''}>← Précédent</button>
          <button class="btn btn-primary" id="next-btn">${index + 1 < ids.length ? 'Suivant →' : 'Terminer l\'examen'}</button>
        </div>
      </div>
    `);
    function collect() {
      answers[q.id] = Array.from(document.querySelectorAll('input[name="opt"]:checked')).map(i => i.value);
    }
    document.getElementById('prev-btn').onclick = () => { collect(); runExamMode(exam, ids, index - 1, answers, sessionId, durationMin, startedAt); };
    document.getElementById('next-btn').onclick = () => { collect(); runExamMode(exam, ids, index + 1, answers, sessionId, durationMin, startedAt); };

    if (durationMin) {
      const timerEl = document.getElementById('timer');
      const tick = () => {
        const left = durationMin * 60000 - (Date.now() - startedAt);
        if (left <= 0) { collect(); finishExamMode(exam, ids, answers, sessionId); return; }
        const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
        timerEl.textContent = `${m}:${String(s).padStart(2, '0')}`;
        window._examTimer = setTimeout(tick, 1000);
      };
      clearTimeout(window._examTimer);
      tick();
    }
  }

  async function finishExamMode(exam, ids, answers, sessionId) {
    clearTimeout(window._examTimer);
    let correct = 0;
    const results = [];
    for (const qId of ids) {
      const { data: q } = await sb.from('questions').select('*, question_options(*)').eq('id', qId).single();
      const correctKeys = q.question_options.filter(o => o.is_correct).map(o => o.option_key).sort();
      const selected = (answers[qId] || []).sort();
      const isCorrect = JSON.stringify(selected) === JSON.stringify(correctKeys);
      if (isCorrect) correct++;
      await EDNEngine.recordAttempt({
        userId: CURRENT_USER.id, examId: exam.id, questionId: qId, sessionId, cycleNumber: exam.current_cycle,
        selectedAnswers: selected, isCorrect
      });
      results.push({ q, isCorrect, selected, correctKeys });
    }
    await sb.from('study_sessions').update({ correct_answers: correct, incorrect_answers: ids.length - correct, completed_at: new Date().toISOString() }).eq('id', sessionId);
    const score = Math.round((correct / ids.length) * 100);
    shell(`
      <div class="card" style="text-align:center;padding:40px;">
        <h1>Score : ${score}%</h1>
        <p class="subtitle">${correct} bonnes réponses, ${ids.length - correct} mauvaises réponses</p>
        <a class="btn btn-primary" href="#/exam/${exam.id}/mistakes">Voir mes erreurs</a>
      </div>
    `);
  }

  // ---------------------------------------------------------------
  // ROUTER
  // ---------------------------------------------------------------
  async function route() {
    const { data: { session } } = await sb.auth.getSession();
    CURRENT_USER = session ? session.user : null;
    const hash = location.hash || '#/dashboard';

    if (!CURRENT_USER) { renderLogin(); return; }
    if (hash === '#/' || hash === '') { location.hash = '#/dashboard'; return; }

    let m;
    if (hash.startsWith('#/dashboard')) return renderDashboard();
    if (hash.startsWith('#/exams')) return renderExams();
    if (hash === '#/import') return renderImport();
    if (hash === '#/import/verify') return renderImportVerify();
    if ((m = hash.match(/^#\/exam\/([^/]+)\/train/))) return renderTrain(m[1]);
    if ((m = hash.match(/^#\/exam\/([^/]+)\/mistakes/))) return renderMistakes(m[1]);
    if ((m = hash.match(/^#\/exam\/([^/]+)\/stats/))) return renderStats(m[1]);
    if ((m = hash.match(/^#\/exam\/([^/]+)\/exam-mode/))) return renderExamModeSetup(m[1]);
    renderDashboard();
  }

  function init() {
    window.addEventListener('hashchange', route);
    sb.auth.onAuthStateChange(() => route());
    route();
  }

  return { init };
})();

document.addEventListener('DOMContentLoaded', function () { if (window.EDN_BOOT()) App.init(); });

</script>
</body>
